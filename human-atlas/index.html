<script>/* All starter entries are editorial demonstrations, not documented testimony. */
window.ATLAS_CATEGORIES = [
  {id:'knowledge', name:'Ancient Knowledge', kicker:'WHAT WE INHERIT', description:'Ideas, practices and questions passed between generations.', color:'#b9a67b', art:'knowledge'},
  {id:'voices', name:'Human Voices', kicker:'WHAT WE TELL', description:'The ordinary conversations that make a life memorable.', color:'#c48e79', art:'voices'},
  {id:'places', name:'Places & Cultures', kicker:'WHERE WE BELONG', description:'Landscapes, journeys, languages and the feeling of home.', color:'#86aaa6', art:'places'},
  {id:'foods', name:'Forgotten Foods', kicker:'WHAT WE SHARE', description:'Recipes, ingredients and the memories held in a meal.', color:'#c3aa78', art:'foods'},
  {id:'sounds', name:'Natural Sounds', kicker:'WHAT WE HEAR', description:'Listening closely to the living world around us.', color:'#7fada9', art:'sounds'},
  {id:'thoughts', name:'Human Thoughts', kicker:'WHAT WE WONDER', description:'The questions that travel quietly through every age.', color:'#aaa0c5', art:'thoughts'}
];
window.ATLAS_STORIES = [
  {id:'questions-we-carry', category:'knowledge', title:'The questions we carry', subtitle:'An invitation to look at inherited wisdom with curiosity.', place:'Across generations', era:'Timeless', minutes:3, tags:['memory','knowledge','questions'], art:'knowledge', intro:'Knowledge begins long before it becomes a written record. Sometimes it arrives as a question asked at the dinner table.', body:[
    'A familiar saying, a way of noticing the weather, a small ritual before starting work: we often inherit these without knowing who first taught them. Such practices deserve attention, but not every remembered explanation is a verified historical fact.',
    'A careful archive makes room for more than one kind of truth. It can preserve what someone remembers, record what researchers have established, and leave unanswered questions visible rather than filling them with guesses.',
    'This starter story is an editorial example. A future version could connect an oral memory with a recording, date, location, translation, and source notes.'
  ]},
  {id:'edge-of-a-manuscript', category:'knowledge', title:'At the edge of a manuscript', subtitle:'Why the notes beside the main story matter.', place:'An imagined archive room', era:'Editorial vignette', minutes:2, tags:['writing','heritage','archives'], art:'knowledge', intro:'The smallest note in the margin can change how a document is understood.', body:[
    'Imagine a handwritten page with an extra sentence squeezed into the corner. The main text tells us what someone intended to preserve; the note hints at the life around the page.',
    'An archive should not only collect polished accounts. It should also explain who made a record, when they made it, and what remains uncertain.',
    'This is an illustrative scene, not a description of a particular historical document.'
  ]},
  {id:'voice-in-the-kitchen', category:'voices', title:'A voice in the kitchen', subtitle:'The music of an ordinary conversation.', place:'An imagined family home', era:'Editorial vignette', minutes:3, tags:['family','oral history','everyday'], art:'voices', intro:'Some of our most important stories were never written down.', body:[
    'Picture a kitchen just before a meal. One person gives directions without measuring anything. Another repeats a question that has been asked for years. Someone laughs from the next room.',
    'The sounds are ordinary, but a recording could preserve a way of speaking, the rhythm of a dialect, and the small details that photographs leave out.',
    'When collecting a voice, permission matters. The speaker should understand where the recording will be stored and whether it might ever become public. This scene is invented as a demonstration.'
  ]},
  {id:'story-before-sleep', category:'voices', title:'One more story before sleep', subtitle:'What happens when a story is retold.', place:'An imagined childhood room', era:'Editorial vignette', minutes:2, tags:['storytelling','childhood','voice'], art:'voices', intro:'A story changes slightly each time a person tells it.', body:[
    'Perhaps the opening remains the same, while the ending takes a new turn. Perhaps a child remembers the voice more clearly than the plot.',
    'An oral-history collection can preserve both the telling and its circumstances: who spoke, who listened, the language used, and what the storyteller wanted remembered.',
    'This is a sample entry. It is not presented as a quotation from a real person.'
  ]},
  {id:'shore-becomes-home', category:'places', title:'Where the shore becomes home', subtitle:'Belonging is more than a point on a map.', place:'An imagined coastal town', era:'Editorial vignette', minutes:3, tags:['sea','home','migration'], art:'places', intro:'A place can be known through its roads, but also through its sounds and everyday routines.', body:[
    'Imagine a shoreline known first by the walk to school, the smell of rain on stone, and the light reflected from a window. Those details form a different map from the one printed on paper.',
    'When people move, they carry small maps like this with them. Capturing these personal geographies can help future generations understand how a place felt, not merely where it stood.',
    'This imagined account is here to demonstrate a place-based story. Real entries should include consent and as much location context as contributors wish to share.'
  ]},
  {id:'path-remembered', category:'places', title:'The path remembered', subtitle:'A street that exists in memory.', place:'An imagined village', era:'Editorial vignette', minutes:2, tags:['landscape','walking','change'], art:'places', intro:'Even when a street changes, the path someone took across it can remain remarkably vivid.', body:[
    'A corner shop becomes a new building. A familiar tree disappears. Yet the person who walked there every morning may still describe each turn without hesitation.',
    'Human Atlas could eventually let people layer remembered places over modern maps, while keeping private locations protected.',
    'This scene is illustrative rather than a historical or geographical claim.'
  ]},
  {id:'recipe-without-measurements', category:'foods', title:'The recipe without measurements', subtitle:'An ordinary meal. An extraordinary memory.', place:'An imagined family kitchen', era:'Editorial vignette', minutes:4, tags:['food','family','cooking','recipe'], art:'foods', featured:true, intro:'“A little more water.” “Wait until it smells right.” Some recipes live in the hands long before they reach a page.', body:[
    'Imagine learning a family dish without a written recipe. The cook knows the amount by looking, the temperature by listening, and the moment to stop by the fragrance. A younger person watches carefully, trying to remember.',
    'Writing the ingredients is a beginning, not the complete record. An excellent food archive would include pronunciation of the name, regional variations, who taught the method, the occasion on which it was served, and photographs of each stage.',
    'Sometimes people disagree about the traditional name or the plant used. That disagreement is worth preserving with care. Human Atlas will distinguish a personal recollection from an independently verified identification.',
    'This is an invented editorial sample, ready to be replaced by a real, permission-based contribution.'
  ]},
  {id:'ingredient-many-names', category:'foods', title:'An ingredient with many names', subtitle:'The value of leaving a question open.', place:'Between languages', era:'Editorial example', minutes:3, tags:['language','ingredients','traditions'], art:'foods', intro:'One ingredient may be remembered through several pronunciations, spellings, and regional names.', body:[
    'A family may use a name that is unfamiliar to a person from the next town. Transliteration can add another layer of variation. It is tempting to choose a single spelling and call it final.',
    'A careful collection does the opposite. It records each version, where it was heard, and who supplied it. A botanical or historical identification should be marked as unverified until trustworthy evidence supports it.',
    'This sample describes an archival method; it does not identify a particular ingredient.'
  ]},
  {id:'before-city-wakes', category:'sounds', title:'Before the city wakes', subtitle:'A listening exercise for the earliest hours.', place:'An imagined morning', era:'Editorial vignette', minutes:2, tags:['listening','morning','field recording'], art:'sounds', intro:'Listen before giving what you hear a name.', body:[
    'At first there may be one distant sound. Then others emerge: movement, voices, wind, or birds. The experience changes as attention changes.',
    'Our future Natural Sounds collection should use authentic recordings with clear locations, recording dates, creator credits, and licenses. We will not label synthetic sound as field audio.',
    'No original recording is attached to this sample story. The Listen button uses your device’s text-to-speech voice to read the words, not a nature recording.'
  ]},
  {id:'after-rainfall', category:'sounds', title:'The room after rainfall', subtitle:'How a change in sound can change a place.', place:'An imagined hillside house', era:'Editorial vignette', minutes:2, tags:['rain','nature','attention'], art:'sounds', intro:'Rain can become part of how someone remembers a room.', body:[
    'The rain stops. There is a brief quiet, followed by dripping water and the faraway return of movement. For a moment the familiar room seems different.',
    'An honest sound archive should capture that transition rather than adding invented effects to make the moment more dramatic.',
    'This is a written example only; a genuine licensed recording can be added in a later version.'
  ]},
  {id:'between-question-and-answer', category:'thoughts', title:'Between a question and an answer', subtitle:'Curiosity does not have to rush.', place:'Inner landscapes', era:'Reflection', minutes:3, tags:['reflection','questions','philosophy'], art:'thoughts', intro:'There is a kind of attention that begins when we do not immediately know what to say.', body:[
    'A question can be practical, philosophical, or personal. Sometimes answering it requires research. At other times, it requires hearing someone else describe the same experience differently.',
    'Human Atlas is designed to hold multiple perspectives without pretending that all claims have equal evidence. Curiosity and careful verification can belong in the same room.',
    'This editorial reflection is a starting point for future thoughtful, credited contributions.'
  ]},
  {id:'when-we-listen', category:'thoughts', title:'What remains when we listen', subtitle:'Notes on attention, difference and human experience.', place:'Inner landscapes', era:'Reflection', minutes:2, tags:['presence','listening','humanity'], art:'thoughts', intro:'To listen is to allow another person’s experience to remain their own.', body:[
    'Two people may describe one event in entirely different ways. An archive can record those differences, explain the sources, and avoid deciding more than the evidence permits.',
    'The person who shares a memory should retain meaningful control over how it is represented. A private thought should not become public merely because it was entered into a form.',
    'This sample articulates a principle for the archive: dignity, context, and clarity before scale.'
  ]}
];

<script>/* Human Atlas Prototype 01 — vanilla JS, dependency-free, and entirely independent. */
(() => {
  'use strict';
  const categories = window.ATLAS_CATEGORIES;
  const demoStories = [...(window.ATLAS_CURATED_STORIES || []),...window.ATLAS_STORIES];
  const root = document.getElementById('app');
  const dialog = document.getElementById('story-dialog');
  const dialogBody = document.getElementById('dialog-body');
  const toastElement = document.getElementById('toast');
  const SAVED_KEY = 'human-atlas-p01:saved';
  const NOTES_KEY = 'human-atlas-p01:private-notes';
  const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const categoryName = id => categories.find(c => c.id === id)?.name || 'Human Story';
  const isCategory = id => categories.some(c => c.id === id);
  const provenanceTypes = Object.freeze({unspecified:'Not specified',firsthand:'Firsthand memory',family:'Passed down by someone',interview:'Consented interview',research:'Written or published source',uncertain:'Not yet confirmed'});
  function provenanceOf(raw) {
    const p = raw && typeof raw === 'object' ? raw : {};
    const clip = (value,max) => typeof value === 'string' ? value.trim().slice(0,max) : '';
    return {
      origin: Object.prototype.hasOwnProperty.call(provenanceTypes,p.origin)?p.origin:'unspecified',
      language:clip(p.language,70),
      period:clip(p.period,100),
      relation:clip(p.relation,100),
      reference:clip(p.reference,280),
      permission:['not-recorded','confirmed','not-applicable'].includes(p.permission)?p.permission:'not-recorded'
    };
  }
  function provenanceHTML(note) {
    const p = provenanceOf(note.provenance);
    const label = p.origin === 'unspecified' ? 'Origin not recorded' : provenanceTypes[p.origin];
    const lines = [['Story origin',label],['Language / dialect',p.language],['When or period',p.period],['Learned from',p.relation],['Source / reference',p.reference],['Permission status',p.permission==='confirmed'?'Recorded as confirmed by you':p.permission==='not-applicable'?'Not applicable (your own account)':'Not recorded']];
    return '<section class="provenance-card" aria-label="Story background"><div class="section-eyebrow">STORY BACKGROUND · PRIVATE</div><h3>How this memory reached you</h3><dl>'+lines.filter(item=>item[1] && (item[0]==='Story origin' || item[0]==='Permission status' || item[1])).map(item=>'<div><dt>'+escapeHTML(item[0])+'</dt><dd>'+escapeHTML(item[1])+'</dd></div>').join('')+'</dl><p>These details were supplied by the writer, not independently verified. Nothing is shared automatically.</p></section>';
  }
  const safePhoto = s => (typeof s === 'string' && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s) && s.length < 1600000) ? s : '';
  const getStorage = (key, fallback) => { try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; } catch (_) {return fallback;} };
  const savedOriginal = getStorage(SAVED_KEY, []);
  const noteOriginal = getStorage(NOTES_KEY, []);
  const state = {
    view:'explore', category:'all', query:'',
    saved: new Set(Array.isArray(savedOriginal) ? savedOriginal.filter(x=>typeof x==='string') : []),
    notes: Array.isArray(noteOriginal) ? noteOriginal.filter(n => n && typeof n.id==='string' && typeof n.title==='string' && typeof n.body==='string').slice(0,100).map(n=>({id:n.id.slice(0,65),title:n.title.slice(0,130),body:n.body.slice(0,8000),category:isCategory(n.category)?n.category:'thoughts',place:String(n.place||'').slice(0,100),createdAt:n.createdAt||'',photo:safePhoto(n.photo),provenance:provenanceOf(n.provenance)})) : [],
    photo:'', voiceUtterance:null
  };
  const img = (art) => window.__art[art] || window.__art.thoughts;
  const lookup = id => demoStories.find(s => s.id === id) || state.notes.find(s => s.id === id);
  const isPersonal = s => Boolean(s && s.id.startsWith('note-'));
  let toastTimer;
  function toast(message){ toastElement.textContent=message; toastElement.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastElement.classList.remove('show'),2800); }
  function persistSaved(){try{localStorage.setItem(SAVED_KEY,JSON.stringify([...state.saved]));return true;}catch(e){toast('Bookmarks cannot be stored in this browser.');return false;}}
  function persistNotes(){try{localStorage.setItem(NOTES_KEY,JSON.stringify(state.notes));return true;}catch(e){toast('Storage is full. Export a backup and remove some notes.');return false;}}
  const meta = (s) => `<div class="meta-line">${escapeHTML(s.place || 'Personal collection')} <i>·</i> ${escapeHTML(isPersonal(s) ? 'Private note' : `${s.minutes} min read`)}</div>`;
  function card(s){
    const personal = isPersonal(s);
    const researched = s.status === "researched";
    const art = personal ? (safePhoto(s.photo) || img(s.category)) : img(s.art);
    const desc = s.subtitle || s.body?.[0] || s.body || '';

  function notesBanner(){return `<section class="note-banner" aria-label="Create your first memory"><div><div class="section-eyebrow">THE ARCHIVE BEGINS WITH YOU</div><h2>What would you preserve?</h2><p>Keep a personal memory privately on your device. You choose what belongs in the record, and when to export it.</p></div><a class="primary-btn" href="#/notes">Make a private note ↗</a></section>`;}
  function filtered(){const q=state.query.trim().toLowerCase();return demoStories.filter(s => (state.category==='all' || s.category===state.category) && (!q || [s.title,s.subtitle,s.category,categoryName(s.category),s.place,s.intro,...s.body,...s.tags].join(' ').toLowerCase().includes(q)));}
  function archiveCards(){let results=filtered();return `<p class="results-count" role="status">${results.length} ${results.length===1?'STORY':'STORIES'} IN THIS VIEW</p>${results.length?`<div class="story-grid">${results.map(card).join('')}</div>`:empty('No stories found','Try another word or select a different collection.','#/archive','Reset search')}`;}
  function archive(){return `<section class="archive-hero"><div class="section-eyebrow">THE HUMAN ATLAS ARCHIVE</div><h1>Follow your <em>curiosity.</em></h1><p>Explore three researched cultural notes with traceable sources, alongside twelve clearly labelled editorial demonstrations. Personal memories are stored separately on your device.</p></section>

  function savedPage(){const found=demoStories.filter(s=>state.saved.has(s.id));return `<section class="archive-hero"><div class="section-eyebrow">PERSONAL READING SHELF</div><h1>Stories you <em>saved.</em></h1><p>Bookmarks are kept privately in this browser. No account is needed.</p></section>${found.length?`<div class="results-count">${found.length} SAVED STORIES</div><div class="story-grid">${found.map(card).join('')}</div>`:empty('Your shelf is waiting','Tap the heart on any story to keep it here.')}`;}
  function myNotes(){
    return `<section class="archive-hero"><div class="section-eyebrow">YOUR PRIVATE COLLECTION</div><h1>Start with <em>a memory.</em></h1><p>Record something in your own words. It stays on this device until you choose to export a copy. Nothing here is uploaded or published.</p><span class="privacy-tag">◌ PRIVATE · THIS BROWSER ONLY</span></section>
      <div class="note-columns"><section class="note-panel" aria-labelledby="add-note-heading"><h2 id="add-note-heading">Write your entry.</h2><form id="memory-form">
        <div class="field"><label for="note-title">TITLE *</label><input id="note-title" name="title" maxlength="130" required placeholder="A story, a name, a memory..." /></div>
        <div class="form-grid"><div class="field"><label for="note-category">COLLECTION *</label><select id="note-category" name="category" required>${categories.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}</select></div><div class="field"><label for="note-place">PLACE (OPTIONAL)</label><input id="note-place" name="place" maxlength="100" placeholder="Town, region or simply home" /></div></div>
        <div class="field"><label for="note-body">YOUR MEMORY *</label><textarea id="note-body" name="body" minlength="10" maxlength="8000" required placeholder="What do you remember? How did it feel, sound or smell? Who taught you? What is uncertain?"></textarea><small>Write freely. You can always add another entry later.</small></div>
        <details class="capture-guide"><summary>Need help remembering the details? <span>Open the story guide ▾</span></summary>
<div><p>Use whichever questions are useful. There is no need to invent answers.</p><ol><li>Who taught you this practice or story?</li><li>Where and roughly when do you remember it?</li><li>What did you see, hear, smell or taste?</li><li>Which parts are firsthand memories, and which were told to you?</li><li>What is still uncertain or needs checking?</li></ol><p>If another person's voice or photograph is involved, ask permission before recording or preserving it.</p></div></details>

<div class="provenance-fields">
  <div class="field"><label for="note-origin">HOW DO YOU KNOW THIS STORY?</label><select name="origin" id="note-origin"><option value="unspecified">Not specified</option><option value="firsthand">I remember it myself</option><option value="family">Someone told or taught me</option><option value="interview">I interviewed someone with permission</option><option value="research">I read or researched it</option><option value="uncertain">Still uncertain</option></select></div>
  <div class="form-grid"><div class="field"><label for="note-language">LANGUAGE OR DIALECT</label><input id="note-language" name="language" maxlength="70" placeholder="e.g. Tamil, English" /></div>

  <div class="field"><label for="note-relation">WHO TAUGHT OR SHARED IT? (OPTIONAL)</label><input id="note-relation" name="relation" maxlength="100" placeholder="e.g. Grandmother; no full name needed" /></div>
  <div class="field"><label for="note-reference">REFERENCE OR SOURCE NOTE</label><input id="note-reference" name="reference" maxlength="280" placeholder="Book, document, link or interview context" /></div>
  <div class="field"><label for="note-permission">PERMISSION TO PRESERVE ANOTHER PERSON'S WORDS OR VOICE</label><select id="note-permission" name="permission"><option value="not-recorded">Not recorded yet</option><option value="not-applicable">Not applicable — my own account</option><option value="confirmed">Permission confirmed by me</option></select><small>This records what you report; it does not verify consent or make anything public.</small></div>
</div></details>

        <div class="action-row"><button type="submit" class="primary-btn">Save privately ↗</button><button type="reset" class="outline-btn" data-action="reset-note">Clear form</button></div></form></section>
        <aside class="privacy-panel"><div class="section-eyebrow">OWN YOUR STORIES</div><h2>Memory deserves care.</h2><p>Your personal notes are not public and are not used to train any AI. They are saved only in this browser's local storage.</p><ul><li>No login or paid account.</li><li>No automatic publishing or syncing.</li><li>Export a JSON backup before clearing browser data or changing phones.</li><li>Ask permission before recording someone else's words or photos.</li></ul><p class="note-photo-disclaimer">The demo stories elsewhere in this app are illustrations, not verified testimony.</p></aside></div>

        <div class="utility-bar"><button class="outline-btn" data-action="export-notes">↓ Export backup</button><button class="outline-btn" data-action="import-notes">↑ Import backup</button><input class="sr-only" id="notes-import" type="file" accept="application/json,.json" /></div>
        <div id="personal-notes">${personalNotesList()}</div></section>`;
  }
  function personalNotesList(){return state.notes.length?`<div class="my-notes-list">${state.notes.map(n=>`<article class="personal-note">${safePhoto(n.photo)?`<img src="${safePhoto(n.photo)}" alt="Photo attached to ${escapeHTML(n.title)}"/>`:`<div class="placeholder-art" aria-hidden="true">◎</div>`}<div><div class="story-category">${escapeHTML(categoryName(n.category))} · PRIVATE${n.provenance && n.provenance.origin !== 'unspecified' ? ' · '+escapeHTML(provenanceTypes[n.provenance.origin]||'Source not specified'):''}</div><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.place||'Saved on this device')}</p><div class="action-row"><a href="#/story/${encodeURIComponent(n.id)}" class="small-btn">Read note</a><button class="small-btn delete" data-action="delete-note" data-id="${escapeHTML(n.id)}">Delete</button></div></div></article>`).join('')}</div>`:empty('No memories yet','Your first private note will appear here after you save it.','#/notes','Create your first note');}
  function about(){return `<section class="archive-hero"><div class="section-eyebrow">OUR IDEA</div><h1>An archive for <em>the human story.</em></h1><p>Human Atlas begins with one belief: everyday experience deserves to be remembered carefully, generously, and with context.</p></section><section class="about-grid" aria-label="Our principles"><article class="about-item"><div class="about-number">01</div><h3>Preserve with permission.</h3><p>Ask before sharing other people's stories or recordings. People should understand how their contributions may be used.</p></article><article class="about-item"><div class="about-number">02</div><h3>Show what we know.</h3><p>Separate memory, speculation, editorial examples, and independently documented facts. Cite sources where possible.</p></article><article class="about-item"><div class="about-number">03</div><h3>Start open and simple.</h3><p>The first prototype works without paid AI or accounts. Local notes are private. A future public archive would need contributor controls and moderation.</p></article></section><section class="note-banner"><div><div class="section-eyebrow">THE FIRST EDITION</div><h2>A small beginning.</h2><p>Six collections, a quiet reading experience, local bookmarking, private notes, and a path toward a community archive.</p></div><a href="#/archive" class="primary-btn">Discover stories ↗</a></section>`;}
  function render(){
    root.innerHTML = state.view === 'archive' ? archive() : state.view === 'saved' ? savedPage() : state.view === 'notes' ? myNotes() : state.view === 'about' ? about() : home();
    document.querySelectorAll('[data-nav]').forEach(link=>{const active=link.dataset.nav===state.view;link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
  }

  function sourceStatusHTML(s, personal) {
    if (personal) return provenanceHTML(s)+'<div class="source-note">PRIVATE NOTE — Your written memory and story background stay in this browser. Audio recordings are stored separately; export each recording if you want a backup.</div>';
    if (s.status !== 'researched') return '<div class="source-note">SOURCE STATUS — Editorial demonstration. This is illustrative text, not verified historical evidence, a real interview or a recorded account. Synthetic text narration is optional. Your own recordings play first.</div>';
    let html='<div class="source-note"><strong>RESEARCH STATUS — Researched cultural note, not an eyewitness account.</strong> Details can vary by family or location. <div class="sources-title">Sources for this article</div>';
    if (Array.isArray(s.sources)) for (const src of s.sources) {
      if (!src || typeof src.url !== 'string' || !src.url.startsWith('https://')) continue;
      html += '<a class="source-link" href="'+escapeHTML(src.url)+'" target="_blank" rel="noopener noreferrer">↗ '+escapeHTML(src.name)+'</a>';
    }
    return html + '<p class="source-note-tts">Your own recording takes priority. You can also choose and preview an available device reading voice.</p></div>';
  }
  function voiceUI(){
    return '<section class="voice-section" aria-labelledby="voice-section-title">'
      + '<div class="voice-section-heading"><div><div class="voice-eyebrow">YOUR OWN VOICE · PRIVATE</div><h3 id="voice-section-title">Record a narration</h3></div><span class="voice-icon" aria-hidden="true">◉</span></div>'
      + '<p>Read this story aloud or record your own version. The microphone activates only when you tap Record. Your audio stays on this device and is not uploaded.</p>'
      + '<div class="voice-buttons"><button class="voice-button" type="button" id="voice-record" data-voice-action="start">● Record</button><button class="voice-button voice-stop" type="button" id="voice-stop" data-voice-action="stop" disabled>■ Stop</button></div>'
      + '<p class="voice-status" id="voice-status" role="status" aria-live="polite">Preparing local audio…</p>'
      + '<audio controls playsinline preload="metadata" id="voice-player" hidden aria-label="Your recorded narration"></audio>'
      + '<div class="voice-buttons"><button class="voice-button" type="button" id="voice-download" data-voice-action="download" disabled>↓ Export audio</button><button class="voice-button voice-delete" type="button" id="voice-delete" data-voice-action="delete" disabled>Delete recording</button></div>'
      + '<small class="voice-privacy">Maximum five minutes. Recordings are not included in the My Notes JSON backup: export each audio separately. Playback may pause when the phone locks or the browser runs in the background.</small>'
      + '</section>';
  }

  function modalContent(s){
    const personal = isPersonal(s);
    const cover = personal?(safePhoto(s.photo)||img(s.category)):img(s.art);
    const paragraphs = personal ? [s.body] : s.body;
    return `<div class="modal-banner"><img src="${cover}" alt="${personal && safePhoto(s.photo)?'Your attached personal photo':'Original illustrative artwork'}"/></div>
      <article class="modal-body-inner"><div class="modal-top-meta"><span>${escapeHTML(categoryName(s.category))}</span><span>·</span><span>${personal?'PRIVATE NOTE':s.status==='researched'?'RESEARCHED CULTURAL NOTE':'EDITORIAL DEMO'}</span></div>
        <h2 id="story-title">${escapeHTML(s.title)}</h2><p class="modal-subtitle">${escapeHTML(s.subtitle||s.place||'A memory kept privately')}</p>
        ${meta(s)}
        <div class="modal-controls">
        ${!personal?`<button class="secondary-btn" type="button" data-action="save" data-id="${escapeHTML(s.id)}">${state.saved.has(s.id)?'♥ Saved story':'♡ Save story'}</button>`:''}${!personal?`<button class="secondary-btn" type="button" data-action="share" data-id="${escapeHTML(s.id)}">↗ Share link</button>`:''}</div>
        ${!personal ? `<p class="modal-intro">${escapeHTML(s.intro)}</p>`:''}
        ${paragraphs.map(p=>`<p class="paragraph">${escapeHTML(p).replace(/\n/g,'<br>')}</p>`).join('')}
        ${!personal ? `<div class="tags">${s.tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}</div>`:''}
        ${sourceStatusHTML(s,personal)}
      ${voiceUI()}</article>`;
  }
  function closeSpeech(){if('speechSynthesis' in window){window.speechSynthesis.cancel();}state.voiceUtterance=null;if(window.HumanAtlasNarration)window.HumanAtlasNarration.stop();}
  function openModal(s){if(!s) {toast('This story is not on this device.');location.hash='#/'+state.view;return;}
    closeSpeech();dialogBody.innerHTML=modalContent(s);
    if(!dialog.open) dialog.showModal();
    dialogBody.scrollTop=0;
    const listenButton=document.getElementById('listen-btn');if(listenButton)listenButton.textContent='▷ Listen';
    if(window.HumanAtlasNarration)window.HumanAtlasNarration.mount();
  }
  function route(){
    const parts=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
    if(parts[0]==='story' && parts[1]){openModal(lookup(parts[1]));return;}
    if(dialog.open){closeSpeech();dialog.close();}
    const valid=['explore','archive','saved','notes','about'];
    state.view=valid.includes(parts[0])?parts[0]:'explore';
    render();window.scrollTo({top:0,behavior:'instant'});
  }
  function downloadFile(filename,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const anchor=document.createElement('a');anchor.href=url;anchor.download=filename;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
  function toggleSave(id){if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);persistSaved();toast(state.saved.has(id)?'Story added to Saved.':'Story removed from Saved.');if(dialog.open){const s=lookup(id);if(s)dialogBody.innerHTML=modalContent(s);}else render();}
  function speakStory(){
    if (window.HumanAtlasNarration && typeof window.HumanAtlasNarration.toggle === 'function') {
      window.HumanAtlasNarration.toggle();
    } else {
      toast('Voice controls are still loading. Please refresh the story.');
    }
  }
  const photoToDataURL = (file) => new Promise((resolve,reject)=>{
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)) return reject(Error('Please choose a JPEG, PNG, or WebP photo.'));
    if(file.size>12*1024*1024) return reject(Error('Photo too large. Choose an image under 12 MB.'));
    const objectURL=URL.createObjectURL(file), image=new Image();
    image.onload=()=>{try{const max=900, scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const result=canvas.toDataURL('image/jpeg',.66);URL.revokeObjectURL(objectURL);if(result.length>1500000) return reject(Error('The resized photo is too large to save locally.'));resolve(result);}catch(e){URL.revokeObjectURL(objectURL);reject(e);}};
    image.onerror=()=>{URL.revokeObjectURL(objectURL);reject(Error('Could not read that photo.'))};image.src=objectURL;
  });
  function exportNotes(){if(!state.notes.length){toast('There are no notes to export yet.');return;}const filename=`human-atlas-private-notes-${new Date().toISOString().slice(0,10)}.json`;downloadFile(filename,JSON.stringify({app:'Human Atlas',version:3,exportedAt:new Date().toISOString(),notes:state.notes},null,2),'application/json');toast('Private notes backup downloaded.');}
  async function importNotes(file){if(!file)return;if(file.size>8*1024*1024){toast('That backup is larger than 8 MB.');return;}
    try{const parsed=JSON.parse(await file.text());if(parsed.app!=='Human Atlas'||!Array.isArray(parsed.notes))throw Error('Not a Human Atlas backup.');
      const incoming=parsed.notes.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&n.title.length<=130&&n.body.length<=8000&&isCategory(n.category)).slice(0,100).map(n=>({id:n.id,title:n.title,category:n.category,body:n.body,place:typeof n.place==='string'?n.place.slice(0,100):'',createdAt:n.createdAt||'',photo:safePhoto(n.photo),provenance:provenanceOf(n.provenance)}));
      if(!incoming.length)throw Error('No valid notes found.');
      const current=state.notes.map(n=>({...n}));const known=new Set(current.map(n=>n.id));for(const entry of incoming){if(!known.has(entry.id)){current.unshift(entry);known.add(entry.id);}}
      state.notes=current.slice(0,100);if(persistNotes()){render();toast(`${incoming.length} valid backup entries checked.`);}
    }catch(e){toast(e.message||'Unable to import backup.');}
  }
  root.addEventListener('input',e=>{
    if(e.target.id==='story-search'){state.query=e.target.value;const result=document.getElementById('archive-results');if(result)result.innerHTML=archiveCards();}
  });
  root.addEventListener('change',async e=>{
    if(e.target.id==='note-photo'){
      const file=e.target.files?.[0];state.photo='';const preview=document.getElementById('photo-preview');if(preview)preview.style.display='none';if(!file)return;
      try{state.photo=await photoToDataURL(file);if(preview){preview.src=state.photo;preview.style.display='block';}toast('Photo ready to save privately.');}catch(error){toast(error.message);e.target.value='';}
    }
    if(e.target.id==='notes-import'){await importNotes(e.target.files?.[0]);e.target.value='';}
  });
  root.addEventListener('submit',e=>{
    if(e.target.id!=='memory-form')return;e.preventDefault();const form=e.target;
    const title=form.elements.title.value.trim(), body=form.elements.body.value.trim(), category=form.elements.category.value, place=form.elements.place.value.trim();
    if(!title||body.length<10||!isCategory(category)){toast('Please enter a title, collection and memory of at least 10 characters.');return;}
    if(state.notes.length>=100){toast('100-note limit reached. Export and remove an older note first.');return;}
    const id='note-'+(crypto.randomUUID?.() || Date.now()+'-'+Math.round(Math.random()*100000));
    const entry={id,title:title.slice(0,130),body:body.slice(0,8000),category,place:place.slice(0,100),createdAt:new Date().toISOString(),photo:state.photo,provenance:provenanceOf({origin:form.elements.origin.value,language:form.elements.language.value,period:form.elements.period.value,relation:form.elements.relation.value,reference:form.elements.reference.value,permission:form.elements.permission.value})};
    state.notes.unshift(entry);if(persistNotes()){state.photo='';render();toast('Your private memory was saved on this device.');document.getElementById('your-notes-heading')?.scrollIntoView({behavior:'smooth'});}else{state.notes.shift();}
  });
  root.addEventListener('reset',e=>{if(e.target.id==='memory-form'){state.photo='';const preview=document.getElementById('photo-preview');if(preview){preview.removeAttribute('src');preview.style.display='none';}}});
  function actionHandler(e){const actionButton=e.target.closest('[data-action]');if(!actionButton)return;const action=actionButton.dataset.action;
    if(action==='save'){e.preventDefault();toggleSave(actionButton.dataset.id);return;}
    if(action==='filter'){state.category=actionButton.dataset.category;state.query='';render();return;}
    if(action==='category'){state.category=actionButton.dataset.category;state.query='';location.hash='#/archive';if(state.view==='archive')render();return;}
    if(action==='close-modal'){dialog.close();return;}
    if(action==='listen'){speakStory();return;}
    if(action==='delete-note'){
      const note=state.notes.find(n=>n.id===actionButton.dataset.id);if(!note)return;
      if(!confirm(`Permanently delete “${note.title}” from this device? Export a backup first if needed.`))return;
      const old=state.notes;state.notes=old.filter(n=>n.id!==note.id);if(!persistNotes())state.notes=old;render();toast('Private note deleted.');return;
    }
    if(action==='export-notes'){exportNotes();return;}
    if(action==='import-notes'){document.getElementById('notes-import')?.click();return;}
    if(action==='share'){
      const url=location.href;
      if(navigator.share){navigator.share({title:'Human Atlas',url}).catch(()=>{});}else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('Story link copied.')).catch(()=>toast('Copy the URL from your address bar.'));}else toast('Copy the URL from your address bar.');
      return;
    }
  }
  root.addEventListener('click',actionHandler);dialog.addEventListener('click',e=>{
    if(e.target===dialog){dialog.close();return;}
    actionHandler(e);
  });
  dialog.addEventListener('close',()=>{closeSpeech();if(location.hash.startsWith('#/story/'))location.hash='#/'+state.view;});
  window.addEventListener('hashchange',route);
  window.addEventListener('beforeunload',closeSpeech);
  route();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
  }
})();
</script>
<script src="./voice-v02.js" defer></script>
<script src="./narration-v021.js" defer></script>
