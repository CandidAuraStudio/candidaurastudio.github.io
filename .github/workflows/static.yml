# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Check HeartClear before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: find human-practice-prototype -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check referenced local app scripts and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('human-practice-prototype')
          html=(page/'index.html').read_text()
          paths=re.findall(r'<(?:script|link)\b[^>]*?(?:src|href)="(\./[^"?#]+)',html)
          missing=[p for p in paths if not (page/p[2:]).is_file()]
          print('Checked local references:',len(paths),'Missing:',missing)
          if missing:
              raise SystemExit(1)
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mobile and desktop cross-screen regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/heartclear-pages-gate.log 2>&1 &
          node human-practice-prototype/tests/heartclear-all-screens.cjs
          node human-practice-prototype/tests/mini-transport.cjs
          node human-practice-prototype/tests/resume-genesis-quran.cjs

  # Deployment is blocked unless the actual mobile/desktop UI passes.
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
