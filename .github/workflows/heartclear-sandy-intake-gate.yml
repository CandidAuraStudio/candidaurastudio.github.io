name: HeartClear Two-Video Intake Safety Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heartclear-sandy-intake-gate.yml'
      - 'human-practice-prototype/media-intake/deep-hold-20261025.json'
      - 'human-practice-prototype/media-intake/resilience-five-rounds-20261025.json'
      - 'human-practice-prototype/tests/hc-deep-hold-media-gate.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-intake-not-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source metadata and non-publication gates
        run: node human-practice-prototype/tests/hc-deep-hold-media-gate.cjs
      - name: Report deliberately blocked public playback
        run: node human-practice-prototype/tests/hc-deep-hold-media-gate.cjs --status
