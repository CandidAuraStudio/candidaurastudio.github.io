name: HeartClear Host User Audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartclear-akmal-allahu-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-allahu-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download user-supplied finished M4A from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'gdown==5.2.0'
          mkdir -p human-practice-prototype/media/voice
          python -m gdown --id '1RNesVJOTxngkZ6qE40htqfRnk4gsTvQg' -O human-practice-prototype/media/voice/Allahu_Hu_Breath_Reflection_Akmal.m4a
          echo 'eceecc45d4faad031e57aec8bd4eb711512de10dba0b9be888ddb13ee206086a  human-practice-prototype/media/voice/Allahu_Hu_Breath_Reflection_Akmal.m4a' | sha256sum -c -
          test "$(stat -c%s human-practice-prototype/media/voice/Allahu_Hu_Breath_Reflection_Akmal.m4a)" -eq 36485763
      - name: Publish same audio bytes to HeartClear static media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HeartClear Audio Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-practice-prototype/media/voice/Allahu_Hu_Breath_Reflection_Akmal.m4a
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Host user-provided Allahu Hu voice reflection for native audio playback"
          git pull --rebase origin main
          git push origin HEAD:main
