name: HeartClear Sourced Mind Game Checks
on:
  push:
    branches: [main, feature/hc-mind-evidence]
    paths:
      - '.github/workflows/heartclear-mind-qa.yml'
      - 'human-practice-prototype/hc-mind-*'
      - 'human-practice-prototype/hc-explore-ui.js'
      - 'human-practice-prototype/index.html'
      - 'human-practice-prototype/sw.js'
      - 'tests/hc-mind-*'
      - 'tests/hc-explore.test.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete game stack and unchanged health core
        run: node --test tests/hc-mind-evidence.test.cjs tests/hc-explore.test.cjs
      - run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Check real mobile UI and offline knowledge
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hc-mind-http.log 2>&1 &
          node tests/hc-mind-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mind-evidence-mobile
          path: tests/mind-evidence-mobile.png
