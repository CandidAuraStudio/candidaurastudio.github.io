name: HeartClear Refresh First Paint

on:
  pull_request:
    branches: [main]
    paths:
      - 'human-practice-prototype/index.html'
      - 'human-practice-prototype/sw.js'
      - 'human-practice-prototype/hc-home-visible-v268.js'
      - 'human-practice-prototype/tests/hc-refresh-first-paint*.cjs'
      - '.github/workflows/hc-refresh-first-paint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate shell and media-cache contract
        run: node human-practice-prototype/tests/hc-refresh-first-paint.cjs
      - name: Check merged Genesis/Gita All Listening routes
        run: node human-practice-prototype/tests/hc-listening-scripture-access.cjs
      - name: Browser test merged Genesis/Gita entry points
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hc-pr43-browser.log 2>&1 &
          node human-practice-prototype/tests/hc-listening-scripture-browser.cjs
      - name: Simulate a slow stylesheet and verify no duplicate refresh
        run: |
          node human-practice-prototype/tests/hc-refresh-first-paint-browser.cjs
