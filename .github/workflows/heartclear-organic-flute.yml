name: HeartClear Organic Bansuri CC0 Masters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartclear-organic-flute.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-organic-bansuri:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate original CC0 bansuri
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p human-practice-prototype/media/sources
          src="human-practice-prototype/media/sources/HeartClear_Nepal_Bansuri_Learnerktm_CC0.ogg"
          primary="https://upload.wikimedia.org/wikipedia/commons/5/50/%E0%A4%AC%E0%A4%BE%E0%A4%81%E0%A4%B8%E0%A5%81%E0%A4%B0%E0%A5%80%E0%A4%95%E0%A5%8B_%E0%A4%A7%E0%A5%81%E0%A4%A8_Basuri.ogg"
          alternate="https://commons.wikimedia.org/wiki/Special:Redirect/file/%E0%A4%AC%E0%A4%BE%E0%A4%81%E0%A4%B8%E0%A5%81%E0%A4%B0%E0%A5%80%E0%A4%95%E0%A5%8B_%E0%A4%A7%E0%A5%81%E0%A4%A8_Basuri.ogg"
          curl --fail --location --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 160 --output "$src" "$primary" || curl --fail --location --retry 3 --connect-timeout 20 --max-time 160 --output "$src" "$alternate"
          test "$(stat -c%s "$src")" -gt 1000000
          ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$src" | awk '{exit !($1>460 && $1<490)}'
          sha256sum "$src" > human-practice-prototype/media/sources/HeartClear_Bansuri_CC0_SHA256.txt

      - name: Engineer natural 7, 10 and 15 minute listening editions
        shell: bash
        run: |
          set -euo pipefail
          src="human-practice-prototype/media/sources/HeartClear_Nepal_Bansuri_Learnerktm_CC0.ogg"
          dest="human-practice-prototype/media"
          for minutes in 7 10 15; do
            total=$((minutes*60))
            fadeout=$((total-3))
            stem="$dest/HeartClear_Organic_Bansuri_${minutes}min"
            if [[ "$minutes" == "7" ]]; then
              ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" \
                -filter_complex "[0:a]aresample=44100,aformat=channel_layouts=stereo,highpass=f=45,lowpass=f=15000,atrim=duration=${total},asetpts=PTS-STARTPTS,afade=t=in:st=0:d=2,afade=t=out:st=${fadeout}:d=3,volume=0.85,asplit=2[hi][lo]" \
                -map "[hi]" -c:a libmp3lame -b:a 192k "${stem}_192k.mp3" \
                -map "[lo]" -c:a aac -b:a 96k -movflags +faststart "${stem}_96k.m4a"
            else
              ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" -i "$src" \
                -filter_complex "[0:a]aresample=44100,aformat=channel_layouts=stereo,highpass=f=45,lowpass=f=15000[a];[1:a]aresample=44100,aformat=channel_layouts=stereo,highpass=f=45,lowpass=f=15000[b];[a][b]acrossfade=d=6:c1=tri:c2=tri,atrim=duration=${total},asetpts=PTS-STARTPTS,afade=t=in:st=0:d=2,afade=t=out:st=${fadeout}:d=3,volume=0.85,asplit=2[hi][lo]" \
                -map "[hi]" -c:a libmp3lame -b:a 192k "${stem}_192k.mp3" \
                -map "[lo]" -c:a aac -b:a 96k -movflags +faststart "${stem}_96k.m4a"
            fi
            ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "${stem}_192k.mp3" | awk -v want="$total" '{exit !(($1-want)<1 && ($1-want)>-1)}'
            ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "${stem}_96k.m4a" | awk -v want="$total" '{exit !(($1-want)<1 && ($1-want)>-1)}'
          done
          sha256sum "$dest"/HeartClear_Organic_Bansuri_*min_* > "$dest/sources/HeartClear_Bansuri_Edition_SHA256.txt"
          cat > "$dest/sources/ORGANIC_BANSURI_LICENSE.md" <<'LICENSE'
          # HeartClear Organic Bansuri audio
          Original: बाँसुरीको धुन Basuri.ogg — Learnerktm, dated 7 July 2014.
          Source: https://commons.wikimedia.org/wiki/File:बाँसुरीको_धुन_Basuri.ogg
          Original license: CC0 1.0; https://creativecommons.org/publicdomain/zero/1.0/
          Source original audio: Ogg Vorbis, approximately 7:54 (lossy).
          Derivatives: 7, 10 and 15 minute listening editions. The 10/15 min editions extend the source with a 6-second crossfade between repetitions. All editions have gentle 2-second beginning and 3-second ending fades, mild filtering and volume adjustment.
          These editions are edited source recordings, not live 10/15-minute performances, not new recordings, and not claimed to be lossless master tapes.
          High bitrate: MP3 192 kbps. Lower bitrate: M4A AAC 96 kbps.
          Original preserved unchanged in the sources directory.
          LICENSE
          cp "$dest/sources/ORGANIC_BANSURI_LICENSE.md" "$dest/HeartClear_Bansuri_License.txt"
          du -h "$dest"/HeartClear_Organic_Bansuri_* "$src"

      - name: Upload downloadable originals and editions
        uses: actions/upload-artifact@v4
        with:
          name: HeartClear-Organic-Bansuri-CC0-7-10-15min
          if-no-files-found: error
          retention-days: 30
          path: |
            human-practice-prototype/media/HeartClear_Organic_Bansuri_*min_*
            human-practice-prototype/media/HeartClear_Bansuri_License.txt
            human-practice-prototype/media/sources/HeartClear_Nepal_Bansuri_Learnerktm_CC0.ogg
            human-practice-prototype/media/sources/*SHA256.txt
            human-practice-prototype/media/sources/ORGANIC_BANSURI_LICENSE.md

      - name: Archive real source and editions into repository for stable hosting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HeartClear Media Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add human-practice-prototype/media/HeartClear_Organic_Bansuri_* human-practice-prototype/media/HeartClear_Bansuri_License.txt human-practice-prototype/media/sources/HeartClear_Nepal_Bansuri_Learnerktm_CC0.ogg human-practice-prototype/media/sources/*SHA256.txt human-practice-prototype/media/sources/ORGANIC_BANSURI_LICENSE.md
          git commit -m "Archive CC0 Nepal bansuri original and produce 7/10/15 minute MP3/AAC editions"
          git pull --rebase origin main
          git push origin HEAD:main
