name: HeartClear Headphone Resume Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hc-listening-resume-contract.yml'
      - 'human-practice-prototype/index.html'
      - 'human-practice-prototype/sw.js'
      - 'human-practice-prototype/hc-listening-resume-v252.js'
      - 'human-practice-prototype/tests/hc-listening-resume-contract.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headphone-resume-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test saved headphone return, no autoplay, and coordinated offline shell
        run: node human-practice-prototype/tests/hc-listening-resume-contract.cjs
