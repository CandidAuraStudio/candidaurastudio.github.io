ර බිව්වා. දිනපතා දෙන කුඩා කිරි කාටන් එක බිව්වා. පළමු දින තුනේදී එයම මගේ ආහාරයට ආසන්නම දෙය.","• • •","නමුත් සිරගෙදර සැබවින්ම පළමුව මගෙන් ඉවත් කළේ පහසුව නොවෙයි. කෑම නොවෙයි. ශාරීරික නිදහස පවා පළමුව නොවෙයි. සිරගෙදර පළමුව ඉවත් කළේ අනන්‍යතාවය. මම ඇතුල් වූයේ අක්මල් ලෙස — තාක්ෂණිකයෙකු, පුතෙකු, සහෝදරයෙකු, රැකියාවක් ඇති මිනිසෙකු, දුරකථනයක්, පාස්පෝට් එකක්, මිතුරන්, ජිම්, අනාගත ගමනක් ඇති මිනිසෙකු ලෙස. දෙවන දවස අවසානයේ ඒ සියල්ල දුරින් තිබුණා. මම අංකයක් සහිත කුටියක ශරීරයක්.","එයයි අනන්‍යතාවය ඉවත් කිරීමේ වේදනාව. ඔබ ඉදිරිපත් කරන කතාවට වඩා ඔබේ ඇඟිලි සලකුණ වැදගත්. ඔබේ පින්තූරය වැදගත්. ඔබේ අංකය වැදගත්. ඔබේ ශරීරය වැදගත්. මම කවුද, මට සිදුවූයේ කුමක්ද, මෙය වැරදීමක්ද කියන ප්‍රශ්නවලට ක්‍රියාවලිය ඉඩ දෙන්නේ නැහැ. ක්‍රියාවලිය ඔබව ක්‍රියාවලියට ගැළපෙන හැඩයට කපා දමයි.","• • •","හම්සා ඒ අඳුර තුළ පළමු මිනිස් පාලම වුණා. මුලින් බිය, සැක, කුඩා ගණනය කිරීම් තිබුණා. නමුත් කුඩා කුටියක රඟපාන්න ඉඩ නැහැ. දින තුනක් එකම වාතය, එකම සුවඳ, එකම වැසිකිළිය, එකම නිශ්චලතාවය බෙදාගත් විට, මිනිසා නැවත මිනිසා වීමට පටන් ගන්නවා. අපි මිතුරන් වීමට පෙර එකිනෙකා ගැන බිය වුණා. නමුත් කුඩා ඉඩක බිය සදාකාලිකව පවත්වාගෙන යන්න අපහසුයි. අවසානයේ ඔබ කතා කරනවා. හුස්ම ගන්නවා. ඉඩ බෙදාගන්නවා.","දින තුනකට පසුව මාව නැවත ගෙන ගියා. Division 8. නිලධාරියෙක් යතුරක් සමඟ. ගේට්ටු. මේස. පොතක සටහන්. සෙල් දහතුන. එක් ඇඳක්. එක් කුඩා මේසයක්. එක් වැසිකිළියක්. එක් කවුළුවක්. එක් මිනිසෙක්. දොර වැසුණා. අගුල හැරුණා. මම ඇඳ අග වාඩිවුණා. අඳුරු බ්ලොක් එකෙන් පසු ඒ කාමරය දඬුවමක් වගේ පමණක් දැනුණේ නැහැ. එය තනිව සිටීමට ලැබුණු අමුතු ඉඩක් වගේද දැනුණා. බලා සිටින්නාට අවශ්‍ය වූ කාමරය ලැබී තිබුණා.","දෙවන කොටස — කූඩුව"]},{"number":23,"title":"සෙල් දහතුන","paragraphs":["සෙල් දහතුන අඳුරු බ්ලොක් එකට වඩා වෙනස්. කුඩායි, නමුත් කවුළුවක් තිබුණා. උස, පටු, නමුත් සැබෑ කවුළුවක්. මගේම ඇඳක්. කුඩා මේසයක්. තවත් ශරීරයක් සමඟ බෙදාගත නොයුතු වැසිකිළියක්. බ්ලැන්කට්ටුවක්. කොට්ටයක්. අඳුරු බ්ලොක් එකෙන් පසුව මේ දේවල් සිරගෙදර වස්තු වගේ නොව, දයාවේ කුඩා ලකුණු වගේ දැනුණා. ශරීරය ඉක්මනින් සන්සුන් වුණා. ඩුබායි, කතාරය, මෝල්ටාවේ කුඩා කාමර, බන්ක් ඇඳ — ඒ සියල්ල මාව නොදැන පුහුණු කර තිබුණා. පරිසරයට එරෙහි සටන තාවකාලිකව නතර වූ විට, මනසට අවකාශයක් ලැබුණා.","• • •","කවුළුවෙන් දුර පැරණි ව්‍යුහයක් පෙනුණා. එය දේවස්ථානයක්ද, පල්ලියක්ද, නයිට්වරුන්ගේ කාලයේ ගොඩනැගිල්ලක්ද කියලා මම දන්නේ නැහැ. මම ඇහුවේත් නැහැ. නොදැන සිටීමම එතැන මට සමාගමක් වගේ දැනුණා. අහසට එරෙහි හැඩයක්. පිටත ලෝකයෙන් තවමත් ඉතිරි වූ යමක්. අහසත් පෙනුණා — වේලාව අනුව නිල්, අළු, රෝස පැහැති පටියක්. මම පැය ගණනක් අහස වෙනස් වෙනවා බලා සිටියා. පෙර මම එසේ කර තිබුණේ නැහැ; මම අහස යටින් ඇවිදීමට වැඩියෙන් කාර්යබහුලව සිටියා. දැන් මට ඇවිදීමට නොහැකි නිසා, අහසම ඇවිදිනවා වගේ පෙනුණා.","සුළඟේ දිශාව දවසේ භාෂාව බවට පත් වුණා. මුහුණට දැනෙන පැත්ත, නොදැනෙන පැත්ත. කවුළුවේ පටියෙන් ඇතුල් වන කුඩා වාතය. බිම හරහා ගමන් කරන ආලෝකය. නිදහස් ජීවිතයේදී අපි නොසලකා හරින දේවල්, සෙල් එකකදී විශාල කුළුණු බවට පත්වෙනවා. කෝප්පය තබන තැන, පෑන තබන තැන, පොත විවෘත කරන තැන, මේසයේ කුඩා සීමාව — ඒවා දවසේ අභ්‍යන්තර සිතියම වුණා.","• • •","සෙල් දහතුනේ සාමාන්‍ය දවසක් තිබුණා. උදේ හය පමණ දොරේ කුඩා ස්ලොට් එක විවෘත වෙනවා. නිලධාරියාගේ හඬ: බොන්ජෝර්නෝ. තත්පර දෙකකට අඩු කුඩා චාරිත්‍රයක්. ඇතුළේ සිටින ශරීරය තවම ජීවත් වන බව තහවුරු කිරීම. පසුව කෑම. තේ. කවුළුව. මේසය. පොත. පෑන. අභ්‍යන්තර සංවාද. දවස් එකිනෙකට සමාන වුණා. නමුත් ඒ සමානත්වය තුළ මනසට ඇතුළට යාමට දොරක් තිබුණා. පලා යාමට ඇති මාර්ග අඩු වූ විට, මනස තමන්ගේම කාමරවලට යන්න පටන් ගන්නවා.","සිතීම මුලින් ප්‍රායෝගිකයි. පිටවෙන්නේ කොහොමද? සහෝදරයාට මුදල් යවන්නේ කොහොමද? අම්මට කියන්නේ කොහොමද? නීතිඥයෙකු සොයන්නේ කොහොමද? හෙට ජීවත් වෙන්නේ කොහොමද? එකම ප්‍රශ්න නැවත නැවත එනවා. නමුත් ඒ ප්‍රශ්නවලට පිරවිය හැක්කේ සීමිත පැය පමණයි. පසුව මනස ගැඹුරු තැනකට බැස්සා. එතැනින් වාක්‍යයක් නැඟුණා: අද සිට, ජීවත් වීමට සිතන්න. සිතීම නැතිව ජීවත් නොවන්න.","එය පළමු සැබෑ මාරුව. ගැඹුරු අවබෝධයක් එන්න කලින්. කුර්ආන් වෙනස් ලෙස විවෘත වීමට පෙර. බයිබලය පැමිණීමට පෙර. ෆිලිපීනෝ සහෝදරයෙකුගේ අතින් Conversations with God මගේ අතට වැටීමට පෙර. සෙල් දහතුනේ සැබෑ හැරවුම් ලක්ෂය එම එක වාක්‍යය — මගේම මනස, මගේම හඬින්, අවසානයේ මගේ අවධානයට තරඟ කරන වෙන කිසිවක් නොතිබූ විට මට දුන් වාක්‍යය. අද සිට, ජීවත් වීමට සිතන්න. සිතීම නැතිව ජීවත් නොවන්න.","මම එය පැය ගණනක් නැවත නැවත සිතුවා. මේ පොතේ සහ මගේ ඉතිරි ජීවිතයේ කොතරම් කොටසක් එම එකම රේඛාවෙන් ගොඩනැගෙයිද කියලා මම එදා දැන සිටියේ නැහැ. ශරීරය අවසානයේ මනසට නොසලකා හැරිය නොහැකි පණිවිඩයක් ලියන්න තරම් දිගු කාලයක් නිශ්චල වී තිබුණා. බලා සිටින්නාට අවසානයේ කතා කිරීමට කාමරයක් ලැබුණා.","• • •","ඉක්මනින්ම සහීඩ් නම් මිනිසෙක් Division එකට පැමිණ දවස් කිහිපයක් සිටිනවා. ඔහු මට අරාබි කුර්ආන් එකක් දෙනවා — අද 2026 දී මෝල්ටාවේ මගේ කුඩා මහල් නිවාසයේ රාක්කයක තවමත් තබාගෙන සිටින එක. ඉක්මනින්ම Thomas නම් නෝර්වේජියානු මිනිසෙක් මට කැඩුණු පෑනක් සහ තම නෝට්බුක් එකෙන් කඩා දුන් පිටු තුනක් දෙයි. ෆිලිපීනෝ සහෝදරයෙක් මට Conversations with God දෙයි. Mike නම් මිනිසෙක්, සිරගෙදර තවත් කොටසකදී, භෞතික විද්‍යාව සහ ඉංග්‍රීසි ඉගැන්වීමට පටන් ගනී. Ray නම් මිනිසෙක්, සිරගෙදර සමහර විට උපදින නමුත් පිටත ලෝකයේ අඩුවෙන් හමුවන වර්ගයේ මිතුරෙකු වෙනවා. Jesmond නම් තරුණයෙක් මට පිළිතුරු දිය නොහැකි ලිපියක් ලියනවා. ඔවුන් සියල්ලෝම මගේ වෙතට එමින් සිටියා, විශ්වය කාමරය දැනටමත් සකස් කර ඇති විට මිනිසුන් එකිනෙකා වෙත එන ආකාරයට. මම එදා ඔවුන්ගේ නම් එකක්වත් දැන සිටියේ නැහැ. පසුව සෙමින් පැමිණි දවස්වලදී, එකින් එක ඉගෙන ගන්නවා.","එදිනට, සෙල් දහතුනේ, දොර වැසී තිබුණා. ආලෝකය බිම හරහා ගමන් කළා. සුළඟ මගේ මුහුණට දැනෙන පැත්තෙන් ආවා. මගේම මනස තුළ ලියවුණු එක වාක්‍යයක්, පසුව වසරවලදී අධ්‍යායයක නමක්, පොතක කොන්දක්, සහ මම දිගු කාලයක් ජීවත් වූ ජීවිතයෙන් පිටවීමට මාර්ගයක් වීමට තිබුණා. අද සිට, ජීවත් වීමට සිතන්න. සිතීම නැතිව ජීවත් නොවන්න.","• • •","සෙල් දහතුනේ කාලය දිගු වූ විට, මගේ ඇතුළේ පරණ කාමර එකින් එක විවෘත වුණා. මුලින් නීතිමය බිය. පසුව පවුල. අම්මාට නොකියූ දේවල්. තාත්තගේ පිටුපස. සහෝදරයාගේ හඬ. සම්බන්ධතාවයේ කැඩීම. රටවල් හරහා දිවූ ශරීරය. සෑම මතකයක්ම ඇවිත් මේසය අසල වාඩි වුණා. මම ඒවා ඉවත් කරන්න බැරි වුණා. දොර අගුලු දමා තිබුණා. දුරකථනය සීමිතයි. චලනය සීමිතයි. නිදාගැනීමෙන් පවා හැම දෙයක්ම ගැලවෙන්නේ නැහැ. එවිට මනසට එකම මාර්ගය: බලන්න.","කවුළුවෙන් පෙනුණු පැරණි ව්‍යුහය මට පිටත ලෝකයේ සලකුණක් වුණා. කාමරය තුළ ඇති මේසය මගේ අභ්‍යන්තර ලෝකයේ සලකුණක් වුණා. සෙල් එක මට චලනය නැති නිසා නිහඬතාවය දුන්නේ නැහැ; එය මට පලා යාමට නොහැකි නිසා නිහඬතාවය දුන්නා. එම වෙනස වැදගත්. තෝරාගත් නිහඬතාවය සහ බලෙන් ලැබූ නිහඬතාවය එකක් නොවෙයි. නමුත් බලෙන් ලැබූ නිහඬතාවය පවා, ඔබ එයට මුහුණ දුන්නොත්, සත්‍යයක් විවෘත කළ හැකියි. එහිදී මම ජීවත් වීමට සිතන්න කියන වාක්‍යය අසාගත්තේ, මගේ ජීවිතය බේරාගැනීමට මනස අවසානයේ තම අයිතිය ඉල්ලා සිටි නිසායි.","මම එහිදී පූජනීය මිනිසෙකු වුණා කියලා කියන්න බැහැ. සෙල් දහතුන මාව එක රැයකින් සාන්තුවරයෙකු කළේ නැහැ. එය කළේ වඩා සරල සහ වඩා අමාරු දෙයක්. එය මාව මා වෙත ලබා දුන්නා. දවස පුරා දුවන වැඩ, සම්බන්ධතා, දුරකථන, ජිම්, කෑම, බස්, ගමන්, පලා යාම — මේ සියල්ල ඉවත් වූ විට, ඉතිරි වූයේ මම සහ මගේම සිතුවිලි. මුලින් ඒ සිතුවිලි සතුරන් වගේ. පසුව ඒවා සාක්ෂිකරුවන් වගේ. අවසානයේ ඒවා ගුරුවරුන් වගේ.","ඒ නිසා සෙල් දහතුන මට සිරකම පමණක් නොවුණා. එය මගේ මනසට පළමු වතාවට සම්පූර්ණ කාලය ලැබුණු තැන. නිදහස් ජීවිතයේදී මම මනසට කුඩා ඉඩවල් පමණක් දී තිබුණා — ගමන් අතර, රැකියා අතර, නින්දට පෙර, ප්‍රශ්න අතර. එතැන, මනසට සම්පූර්ණ දවසක් ලැබුණා. සම්පූර්ණ රාත්‍රියක් ලැබුණා. නැවත එම දවස. නැවත එම රාත්‍රිය. එම නැවතීම, මුලින් දඬුවමක් වගේ දැනුණත්, පසුව ආරම්භයක් බවට පත් වුණා. සෙල් දහතුන මගේ ශරීරය නවත්වලා, මගේ මනසට අවසානයේ වාඩිවීමට ඉඩ දුන්නා.","දෙවන කොටස — කූඩුව"]},{"number":24,"title":"කාලයේ ශබ්දය","paragraphs":["සෙල් දහතුනේදී මම ඔරලෝසුවක් බලලා කාලය දැනගත්තේ නැහැ. ඔරලෝසුවක් තිබුණේ නැහැ. මම කාලය දැනගත්තේ ඇසීමෙන්. නිදහස් මිනිසුන් තම දවස දැක්මෙන් කොපමණ සංවිධානය කරගෙන තිබෙනවාද දන්නේ නැහැ. දුරකථනය. අත් ඔරලෝසුව. බිත්ති ඔරලෝසුව. බස් නැවතුම්පොළේ තිරය. උදුනේ අංක. සෑම තැනම ඇති කුඩා කාල-කියන්නෝ — නිහඬ, දෘශ්‍ය. ඒවා ඉවත් කළ විට මිනිසා ඉක්මනින් සොයාගන්නවා, කාලයට තවත් හඬක් තියෙන බව. කාලයට ශබ්දයක් තියෙනවා. රිද්මයක් තියෙනවා. සෙල් එකකදී ඒ රිද්මය දවසේ සම්පූර්ණ භාෂාව වෙනවා.","• • •","සිරගෙදර භාෂාවේ යතුරු පැය බවට පත්වෙනවා. යම් යතුරු රිංගයක ජිංගල්, එය ගෙන යන පියවරේ බර, යම් අගුලක ලෝහමය සීරීම — මේ සියල්ල උදේ හෝ සවසේ නිශ්චිත කොටස් වුණා. සීනු උපදෙස් බවට පත්වුණා. පියවර අනතුරු ඇඟවීම් බවට පත්වුණා. නිහඬතාවය, ඕනෑම ශබ්දයකට වඩා බර පීඩනයක් බවට පත්වුණා. දවසේ ශබ්ද මට කාලසටහනක් පමණක් නොව, සිරගෙදරේ චරිතය කියා දුන්නා. එක් නිලධාරියෙකුගේ පියවර තවත් කෙනෙකුට වඩා වෙනස්. එක් යතුරු රිංගයක බර තවත් එකකට වඩා වෙනස්. ඔබ දිගු කාලයක් ඇසුවොත්, බිත්ති පවා කතා කරන ආකාරය වෙනස් බව දැනගන්නවා.","උදේ හය පමණ, නිලධාරියා දොරේ කුඩා ස්ලොට් එක විවෘත කර ඉතාලි භාෂාවෙන් සුබ උදෑසනක් කියනවා — බොන්ජෝර්නෝ, එපමණයි. ඇතුළේ සිටින පුද්ගලයා තවම ජීවත් වන බව සහ ගණන් ගෙන ඇති බව තහවුරු කිරීම. එය කුඩා චාරිත්‍රයක්. තත්පර දෙකකට අඩුයි. නමුත් එහි නිහඬ මනුෂ්‍යත්වයක් තිබුණා. අංක, පරීක්ෂා කිරීම්, සෙවීම්, ක්‍රියාවලිය අතර, දොරේ අනෙක් පැත්තේ මිනිසෙක් ඇතුළේ සිටින මිනිසෙකුට සුබ උදෑසනක් කියන එක මොහොතක් තිබුණා. මම ඒ හඬ බලා සිටීමට පුරුදු වුණා.","• • •","පසුව සීනු. එකක්, තවත් එකක්, තවත් එකක්. උදෑසන පුරා විහිදෙන ශබ්ද. සෑම සීනුවකටම අර්ථයක්. පළමු සීනුව. දෙවන සීනුව. චලනය සඳහා සීනුව. කෑම සඳහා සීනුව. බැලීම් සඳහා සීනුව. ලොක්ඩවුන් සඳහා සීනුව. සීනු හැම දෙයක්ම පාලනය කළා. ශරීරය කවදා ක්‍රියා කළ යුතුද කියා නිදහස වෙනුවට ශබ්දය කියා දුන්නා. ශරීරය ඉක්මනින් ඒ රිද්මයට අනුව හැඩගැසුණා. සීනුවක් ඇසෙන විට කකුල්, අත්, උගුර, බඩ — සියල්ල තමන්ට අදාළ අර්ථය සොයන්න පටන් ගන්නවා.","රාත්‍රියේ අවසාන සීනුවෙන් පසුව සිරගෙදර මුහුණ වෙනස් කළා. දවල් දොරවල්, ට්‍රොලි, නිවේදන, නිලධාරීන්. රාත්‍රියේ හඬවල් සෙල් එකෙන් සෙල් එකට පාවුණා. කෙනෙක් නමක් කෑගසනවා. කෙනෙක් විහිළුවක් කියනවා. තවත් කෙනෙක් හිනා වෙනවා. රූපවාහිනියකින් මද සංගීතයක්. සමහර විට ගීතයක් බිත්ති හරහා ගොස් මගේ ඇඳ ළඟට පැමිණෙනවා. ඒ රාත්‍රී ශබ්ද සිරගෙදරේ රහස් මනුෂ්‍ය මුහුණ වුණා. දවසේදී තමන් විය නොහැකි වූ මිනිසුන්, රාත්‍රියේ තමන් වෙන්න පටන් ගන්නවා. උදෑසන කෑම ට්‍රොලිය අසල තදින් සිටි මිනිසුන්, තම සෙල් වලින් විහිළු කරනවා. යාර්ඩ් එකේ තදින් ඇවිදින මිනිසුන්, අඳුරේ මෘදුව ගායනා කරනවා. දවසේදී පෙනෙන සිරගෙදර පමණක් දැක්කා නම් ඔබ විශ්වාස නොකරන වර්ගයේ සහෝදරකමක් රාත්‍රියේ තිබුණා.","අපි අපේ සෙල් තුළ වසා තිබුණා. ගල්වලින් වෙන් කර තිබුණා. එසේ වුවත් අඳුර තුළ එකට සිටියා. රාත්‍රියේ දිගු දුම්රියක ගමන් කරන මගීන් එකිනෙකා නොදකිමින්, තවමත් එකට ගමන් කරන බව දැනෙන ආකාරයට.","• • •","මෙහි මම තවම කිව්වේ නැති කුඩා දෙයක් ලියන්න ඕන. මගේ සෙල් එක අසල සෙල් එකේ සිටි මිනිසා සමඟ කවුළුව හරහා කතා කරන්න පුළුවන් වුණා. Division 8 හි සෙල්වල පටු කවුළු එකම පිටත වාතයට විවෘත වුණා. ඔබ කවුළුව ළඟට ගොස් නිශ්චිත හඬකින් කතා කළොත්, අසල සෙල් එකේ මිනිසාට ඔබ ඇහෙනවා. ඔහුට පිළිතුරු දෙන්න පුළුවන්. කවුළුව ඒකට හදපු දෙයක් නොවෙයි. එය ආලෝකය සහ වාතය සඳහා හදපු දෙයක්. නමුත් සෙල් තුළ සිටි මිනිසුන් කවුළුවට දුරකථනයක් වීමට උගන්වා තිබුණා.","එහෙම තමයි මම James සමඟ පළමු වරට ඇත්තටම කතා කළේ. James නෝර්වේජියානු මිනිසෙක්. ඔහු ගැන ඇති චෝදනාව මෙහි මම ලියන්නේ නැහැ. පළමු දවස්වල කුඩා කවුළු-දුරකථනයෙන් මට හරියට කතා කළ එකම මිනිසා ඔහු. “Hey. How are you doing?” කියන සරල වාක්‍යයෙන් පටන් ගත් පසු, එම ඉදිරියට-ආපසු යන කතාබහ මට ඊළඟ දින හතළිහ පුරා සහාය වුණා. James මගේ සෙල් එකට අසලින්, කුඩා දුරකින්. Rud තවත් පහළින් — මගේ එක දහතුන නම්, ඔහු සෙල් දාහත වගේ — ඒ දුර කවුළු කතාබහට වැඩියි. ඒ නිසා Rud සමඟ මම කතා කළේ සෙල් එක පැයක් විවෘත වූ යාර්ඩ් වෙලාවේ. නමුත් James මට ඇඳේ සිටම ළඟා විය හැකි හඬක්. මුහුණකට පෙර ඔහු ගල් හරහා පැමිණි හඬක්. මගේ ජීවිතයේ වැදගත්ම කතාබහවලින් සමහරක් එම කුඩා කවුළුව හරහා සිදු වුණා.","එහි පාඩම මම පැහැදිලිව ලියන්න ඕන, මොකද කියවන කෙනෙකුට එය අවශ්‍ය විය හැකියි: බිත්ති සන්නිවේදනය නවත්වන්නේ නැහැ. බිත්ති සන්නිවේදනයේ හැඩය පමණක් වෙනස් කරනවා. ගල්වලින් වෙන් වූ මිනිසෙකු සහ තවත් මිනිසෙකු, කතා කිරීම වැදගත් නම්, කතා කිරීමට මාර්ගයක් හොයා ගන්නවා. Division 8 හි කවුළු-දුරකථනය මගේ ඇතුළේ තවමත් තියෙන රූපයක්. පිටත ලෝකයේදී, බාධාවක් නිසා සම්බන්ධතාවයක් අසම්භවයි කියලා මම සිතන්න පටන් ගන්න විට, ඒ කවුළුව මට මතක් වෙනවා. බාධාව සැබෑයි. සම්බන්ධතාවයත් සැබෑයි. දෙකම එකවර සත්‍ය විය හැකියි. කවුළුව මට ඒක උගන්වා තිබුණා.","• • •","මම සම්පූර්ණ වෙනස් අවධානයකින් බලා සිටි ශබ්දයක් තිබුණා: කෝල් සීනුව. දුරකථන කතා කිරීමට අවසර තිබූ පැයවලදී, ඔබව දුරකථනයට කැඳවන සීනුව දවසේ සම්පූර්ණ කාලගුණය වෙනස් කරන්න පුළුවන්. කෑම, චලනය, ලොක්ඩවුන් සීනු ශරීරයේ සීනු. කෝල් සීනුව හදවතේ සීනුව. මගේ නම කැඳවූ විට කකුල් චලනය වීමට පෙර පපුවේ යමක් චලනය වුණා. කෙනෙකුගේ හඬ ඔබව තවමත් මතක තබාගෙන සිටිනවා කියන සත්‍යය, සිරකුටියකදී ගැඹුරු ආහාරයක්.","ඒ දින එකසිය දහහතර පුරා මට වැඩියෙන්ම, බොහෝ විට සෑම දිනකම, කතා කළ කෙනා Meme. ඇය ඩුබායි සිට කතා කළා. කෝල් සීනුව ඇසෙන විට, මම ඒ හඬ ඇයගේද කියා බලා සිටියා. දුරකථනයට යන කුඩා ගමන, සිරගෙදර දවසේ වඩාත්ම දිගු සහ වඩාත්ම කෙටි ගමන විය හැකියි. පියවර කිහිපයක් පමණයි, නමුත් ඒ පියවරවල ඇතුළේ මුළු පිටත ලෝකය තිබුණා. ඔබේ නම කැඳවන්නේ ඔබ අංකයක් පමණක් නොවන බව මතක් කිරීමට. ඔබ කවුද කියන එක සිරගෙදර පද්ධතිය අමතක කරවුවත්, වෙනත් කෙනෙකුගේ හඬ එය නැවත ඔබට කියා දෙනවා.","• • •","කාලයේ ශබ්දය හැමවිටම මෘදු නොවුණා. සමහර පියවර, සමහර දොරවල්, සමහර රාත්‍රී සිරගෙදර තම අඳුරු භාෂාවෙන් කතා කළා. නමුත් මේ අධ්‍යායයේ මට මතක තබාගන්න ඕන ශබ්දය මෘදුයි: බොන්ජෝර්නෝ. උදේ කෑම ට්‍රොලි. කෝල් සීනුව. කවුළුව හරහා Jamesගේ හඬ. රාත්‍රියේ වෙනත් සෙල් එකකින් ආ ගීතය. යතුරු. අගුල. පසුව නිහඬතාවය. සිරගෙදර දිගු කාලයක් ඇසුවොත් එහි භාෂාව තේරුම් ගන්න පටන් ගන්නවා. දොර තවමත් අගුලු දමා ඇති බව අමතක නොකර ඒ භාෂාව ඉගෙන ගන්න ඕන.","සෙල් දහතුනේදී මම කාලය බලන්න ඉගෙන ගත්තේ නැහැ. මම කාලය අසන්න ඉගෙන ගත්තා. ඒ වෙනස මගේ ජීවිතයට පසුවත් ඉතිරි වුණා. පිටත ලෝකයට පැමිණීමෙන් පසු පවා, සමහර හඬවල් මට තවමත් කාලය කියනවා: යතුරක් මේසය මත වැටෙන ශබ්දය. දුරකථනයේ කුඩා නාදය. උදෑසන කෝප්පයේ තේ. දොරක් වැසෙන ආකාරය. මිනිසා එක වරක් ගැඹුරින් ඇසීමට බල කරනු ලැබුවොත්, ඔහු නැවත නිදහස් වූ පසුත් ලෝකය වෙනස් ලෙස අසනවා.","දෙවන කොටස — කූඩුව"]},{"number":25,"title":"මාව මනුෂ්‍යයෙකු ලෙස තබාගත් මිනිසුන්","paragraphs":["මම සිරගෙදර අඳුර පමණක් ලෙස ලිව්වොත් පොත අසත්‍ය වේ. අඳුර තිබුණා: අඳුරු බ්ලොක් එක, ලෝහ දොර, තනිව දිගු පැය, පැරණි ගල් සහ පැරණි දුක් සුවඳ, කවදා හෝ පිටවෙයිද කියන දිනපතා ප්‍රශ්නය. ඒ සියල්ල සත්‍යයි. මම එය මෘදු කරන්නේ නැහැ. නමුත් ඒ දින 114 අඳුර පමණක් නොවෙයි. සිරගෙදර මගේ ජීවිතයේ පිරිසිදුම මනුෂ්‍ය කරුණාවන් කිහිපයක් මට හඳුන්වා දුන්නා. ඒක අතහැරියොත් සත්‍යය එක් පැත්තකට නැඹුරු වෙනවා.","• • •","පාවෝලා ඇතුළේ මට වැඩියෙන්ම උදව් කළ මිනිසා Rud කියා හඳුන්වන තරුණ මෝල්ටා මිනිසෙක්. ඔහු වයස විසි හතරක් පමණ, තම කතාවේ තේරුම ඔහුගේ අපරාධය නොවන නිසා මෙහි විස්තර නොකරන කාරණයක් සඳහා මාස කිහිපයක් ඇතුළේ. ඔහු පිටවෙන දිනය දැන සිටියා. ඒ නිශ්චිත අවසානය ඔහුව තිත්ත නොවීමට තබාගත්තා. ඔහු මට දුන්නේ ආගමික මග පෙන්වීමක් නොවෙයි. ඔහු මාව වෙනස් කිරීමට උත්සාහ කළේ නැහැ, මමත් ඔහුව වෙනස් කිරීමට උත්සාහ කළේ නැහැ. ඔහු දුන්නේ කොන්දේසි නැති මනුෂ්‍ය සත්කාරය. ආගම නැති කරුණාව. වර්ණය නැති ආදරය.","• • •","ඔහු මට ඇහුම්කන් දුන්නා. සිරගෙදර ඇත්තටම කෙනෙකු අසා සිටීම ඔක්සිජන් වගේ. බොහෝ මිනිසුන් අසන්නේ තමන්ට කතා කිරීමට අවස්ථාව සොයමින්. Rud එසේ නොවුණා. මම කතා කළ විට ඔහු සම්පූර්ණයෙන් එහි සිටියා. ඔහුගේ පළතුරු, ඇඳ, කෝපි, කතාබහ, සරල බෙදාගැනීම් — ඒවා මාව මනුෂ්‍යයෙකු ලෙස තබාගත්තා. පසුව මට Ray හමුවුණා, මගේ සෙල් එක අසල. වයසින් වැඩි, සන්සුන්, තරුණයන්ගේ තද මායිම් නැති මිනිසෙක්. ඔහු රූපවාහිනියෙන්, කතාබහෙන්, පවතිමින් උදව් කළා. ඔහුගේ හඬ පහසුවෙන් ඉහළ නොයයි; නිවැරදි කිරීම් මෘදුයි.","• • •","ඒ අතර මගේ සහෝදරයා. සිදුවූ දේ මගෙන් තොරව පවුලට දැනගන්න ලැබුණා. මම තවම කියා නොතිබුණා. මගේ සහෝදරයා — ගුවා ගසෙන් අම්මාගේ පිට මත වැටුණු, මැංගෝ ගස යට කටරයෙන් මම පහර දුන්, මගේ ළමා කාලයේ සහෝදරයා — මාව සෙවීමට ගියා. හැකි හැමෝටම කතා කළා. දින ගණනක් සෙව්වා. මට කතා කිරීමට අවසර ලැබූ විට මිතුරෙකු හරහා පණිවුඩය ආවා: ඔහුට ඔයාගේ හඬ අහන්න විතරයි ඕන.","• • •","ඒ වාක්‍යය මගේ ඇතුළේ යමක් කඩා දැමුවා. මම ජීවිතය පුරා මිනිසුන්ව ආරක්ෂා කරන්න කියා සිතා සත්‍යය සඟවා තිබුණා. නමුත් ආදරය කරන මිනිසුන්ට අවශ්‍ය වන්නේ කළමනාකරණය කළ කතාව නොවෙයි. ඔබේ හඬ. ඔබ ජීවතුන් අතර සිටින බව. ඔබ සත්‍යය කියන බව. Rud, Ray, මගේ සහෝදරයා — මේ තුන් දෙනා තම තමන්ගේ ආකාරයෙන් මගේ මනුෂ්‍ය කොටස ජීවත්ව තබාගත්තා. කූඩුව මගෙන් බොහෝ දේ ගත්තා. ඔවුන් මාව මනුෂ්‍යයෙකු ලෙස තබාගත්තා. Rud සහ Ray පමණක් නොව, ඔවුන් තුළින් මම සිරගෙදරේ වෙනත් සත්‍යයක් දුටුවා. මිනිසුන් තම අපරාධවලින් පමණක් සෑදී නැහැ. ඔවුන් තමන් බෙදාදෙන පළතුරෙන්, අසා සිටින විදිහෙන්, කෝපි කෝප්පයක් දිගු කරන අතින්, නව මිනිසෙකුට පද්ධතිය පැහැදිලි කරන ඉවසීමෙන්ද සෑදී තිබෙනවා. සිරගෙදර මිනිසුන්ව අංක සහ කාමර ලෙස පෙන්වයි; නමුත් කුඩා කරුණාවන් ඔවුන්ව නැවත නමක් සහ මුහුණක් ඇති මිනිසුන් බවට පත් කරයි. මගේ සහෝදරයාගේ “හඬ අහන්න” කියන ඉල්ලීමත් එවැනි කරුණාවක්. එය විශාල දේශනයක් නොවුණා. ඒ නිසාම එය මාව කැඩුවා. ඔහුට නීතිමය විස්තර, ආරක්ෂිත අනුවාදය, හොඳින් කළමනාකරණය කළ කතාව අවශ්‍ය නොවුණා. ඔහුට මම ජීවතුන් අතරද කියන හඬ අවශ්‍ය වුණා. එය ආදරයේ ඉතා සරල සහ ඉතා ගැඹුරු ස්වරූපයක්.","දෙවන කොටස — කූඩුව"]},{"number":26,"title":"පළමු පොත","paragraphs":["සෙල් දහතුනේ මට සැබවින්ම වටිනා වූ පළමු වස්තුව පොතක්. මුදල් නොවෙයි, දුරකථන ප්‍රවේශය නොවෙයි, අමතර කෑම නොවෙයි. පොතක්. සිරගෙදරට පෙර මම විශාල කියවන්නෙක් නොවුණා. පාසලට අවශ්‍ය දේ, වැඩට අවශ්‍ය මැනුවල්, බස් බලා සිටින විට දුරකථනයේ ලිපි — එච්චරයි. සෑම තැනකම පොතක් ගෙන යන, ඉරිදා දහවලක පිටු තුළ අතුරුදන් වන මිනිසුන්ගෙන් මම කෙනෙක් නොවුණා. ශරීරය වැඩියෙන් කාර්යබහුලයි. ඇස් තිර මත වැඩියෙන් කාර්යබහුලයි.","• • •","සෙල් දහතුනේදී එය දින තුනකින් වෙනස් වුණා. සෙල් එකකදී පොතක් විවේකය නොවෙයි. පොත මනසගේ නිදහස. කාමරයේ අගුලු දමා නැති එකම දොර. එය විවෘත කළ විට ඔබ ශරීරයෙන් නොව, අනෙක් සියල්ලෙන් පිටවෙනවා. ඔස්ලෝවට, කාන්තාරයක ගෝත්‍රයකට, දහනව වන සියවසේ එංගලන්තයේ කුස්සියකට, දෙවියන් සමඟ සංවාදයක සිටින මිනිසෙකුගේ කාමරයකට. සෙල් බිත්ති එතැනම. බිත්ති ඇතුළේ මිනිසා ගමන් කරනවා.","• • •","පළමු සතියේම පොතක් මට ඉගැන්නුවා, කාමරයක අගුලු දමා සිටියත් මිනිසෙකුට තවම ගමන් කළ හැකි බව. මම ජීවිතය පුරා චලනය සහ ගමන් කිරීම වරදවාගෙන තිබුණා. ශ්‍රී ලංකාව, කතාරය, ඩුබායි, ක්‍රොඒෂියාව, මෝල්ටාව — රටවල් හරහා ගොස් තිබුණා. නමුත් මනසගේ ගමනට ගුවන් තොටුපොළක් අවශ්‍ය නැහැ. පිටුවක් සහ එහි ලියා ඇති දේ අනුගමනය කිරීමට විනයක් පමණයි.","• • •","මගේ මනසට සැබවින්ම ඇතුල් වූ පළමු පොත ෆිලිපීනුවෙකු වූ ක්‍රිස්තියානි මිනිසෙකු ගෙනාවා. ඔහු නිහඬ, ගෞරවනීය, තමාම අන් අයට තල්ලු නොකරන මිනිසෙක්. මම සෙල් එකේ නිහඬව කුර්ආන් කියවනවා ඔහු අසා තිබුණා, මොකද සිරගෙදර බිත්ති හරහා ශබ්ද යනවා. ඔහු මම මුස්ලිම් බව දැන සිටියා. එය සමඟ තර්ක කළේ නැහැ. සරලව, මට පොතක් කියවන්න කැමතිද කියලා ගෞරවයෙන් ඇහුවා. එවැනි තැනක පොතක් දීම, කෙනෙකුට කුඩා කවුළුවක් දීම වගේ.","• • •","ඒ කාලයේ මම බයිබලයත් කියවුවා. උත්පත්ති පොත සහ ඊට පසුව, පිටු සිය ගණනක්. බයිබලය මට දුන්නේ වසර නවයක් සේවය කරමින් සිටි, එම බිත්ති ඇතුළේ ක්‍රිස්තියානි විශ්වාසය හමු වූ මිනිසෙක්. අපි හුවමාරු කළා — මම ඔහුට කුර්ආන් දුන්නා, ඔහු මට බයිබලය දුන්නා. අපි එකිනෙකා වෙනස් කිරීමට උත්සාහ කළේ නැහැ. අපව ජීවත්ව තබාගෙන තිබූ පොත් හුවමාරු කළ සිරකරුවන් දෙදෙනෙක්. කුර්ආනයේ යූසුෆ් කතාව සහ බයිබලයේ ජෝසප් කතාව, සෙල් එකේදී එකිනෙකා සමඟ රණ්ඩු වීම නවතා එකම මිනිසාගේ ඇතුළේ එකිනෙකාට පිළිතුරු දුන්නා.","• • •","මම ලිව්වා. ඒ ලිවීම ඔබ දැන් අතේ තබාගෙන සිටින පොතේ ආරම්භය. පළමු කඩදාසි හිස් නෝට්බුක් නොවුණා. Western Union හරහා මුදල් ලබාගැනීමට සිරකරුවෙකු කරන ඉල්ලීමේ සුදු පෝරමයක්. මම එය තබාගෙන, හතරට මඩලා, එහි මතුපිට කුඩා කරගෙන, ලියන්න පටන් ගත්තා. කැඩුණු පෑනක්, මඩන ලද පෝරමයක්, සෙල් එකක වාඩි වූ මිනිසෙක්. බයිබල් වාක්‍ය කුර්ආන් වාක්‍ය අසලම. සෙල් දහතුනේ පළමු පොත ණයට ගත් එකක්. ඔබේ අතේ තිබෙන පොත දෙවන එක. පළමුවැන්න මා තුළට ගමන් කළා. දෙවැන්න මාගෙන් පිටතට ගමන් කළා. පළමු පොත මගේ අතට ආ විට, මට එය පොතක් පමණක් නොව, සිරකුටියේ අගුලු නොදැමූ දොරක් බව තේරුණේ සෙමින්. කියවීම මුලින් පලා යාමක් වගේ දැනුණා, නමුත් පසුව එය පුහුණුවක් බවට පත් වුණා. පිටුවක් අනුගමනය කිරීමට මනසට විනය අවශ්‍යයි. වාක්‍යයක් තුළ රැඳී සිටීමට ඉවසීම අවශ්‍යයි. තමන්ගේ බියෙන් තාවකාලිකව ඉවත්ව වෙනත් කෙනෙකුගේ ලෝකයට ඇතුල් වීමට නිහතමානී බව අවශ්‍යයි. ෆිලිපීනෝ ක්‍රිස්තියානි සහෝදරයා මට පොතක් දුන් විට, ඔහු මට ආගමක් තල්ලු කළේ නැහැ; ඔහු මට මනසට ගමන් කිරීමට මාර්ගයක් දුන්නා. බයිබලය සහ කුර්ආන් එකම සෙල් එක තුළ තිබූ විට, ඒවා මා තුළ සටන් කළේ නැහැ. මම ඒවා මිනිසෙකුගේ වේදනාව, ඉවසීම, පරීක්ෂණය, සහ දෙවියන් වෙත හැරීම ගැන එකිනෙකාට කතා කරන පොත් ලෙස අත්විඳුවා. පසුව මඩන ලද පෝරමයක, කැඩුණු පෑනකින් ලියූ පළමු වචන, මගේ ජීවිතය පිටතට ගමන් කිරීමට පටන් ගත් මොහොත වුණා.  ලිවීම ආරම්භ වූ කඩදාසි ගැන මට තවමත් මෘදු ගෞරවයක් තියෙනවා. ඒවා ලස්සන නෝට්බුක් නොවුණා. සිරකරු මුදල් ලබාගැනීමට පුරවන පෝරමයක්. එදිනෙදා පද්ධතියේ කඩදාසියක්. නමුත් එය මගේ පළමු පිටුව වුණා. එය මත ලිවීමෙන් මට තේරුණා, පොතක් විශාල මේසයක, නිදහස් කාමරයක, පරිපූර්ණ පෑනකින් පටන් ගන්න අවශ්‍ය නැහැ. සමහර පොත් සිරකුටියක, කැඩුණු පෑනකින්, මඩන ලද පෝරමයක පටන් ගන්නවා. වැදගත් වන්නේ කඩදාසියේ ගුණය නොවෙයි; මිනිසා අවසානයේ සත්‍යය ලියන්න සූදානම් වූ මොහොතයි."]},{"number":27,"title":"කැඩුණු පෑන සහ කඩදාසි තුන","paragraphs":["සෙල් දහතුනේ මට ලැබුණු පළමු පෑන ණයට ගත් එකක්. එය කැඩුණු පෑනක්.","ඒ පෑන මට දුන්නේ සෙල් 11 හි සිටි නෝර්වීජියානු තෝමස්. මම සෙල් 13 හි සිටියා. අප අතර තිබුණේ එක් සෙල් එකක දුරක් පමණයි. ඔහුගේ කමිසයේ අත් කොටස මැහුම ළඟින් ඉරී තිබුණා. ඒ වගේ ඉරීමක් දැක්කම, මිනිසෙක් ඇතුළේ බොහෝ කාලයක් ගත කර ඇති බවත්, කමිසය ගැන කනස්සල්ල පවා ඉතිරිව නැති බවත් පෙනෙනවා. ඔහුට පෑන් කිහිපයක් තිබුණා. ඒ අතරින් එකක තුඩ ළඟ, පෑනේ ප්ලාස්ටික් ශරීරය කැප් එකට හමුවන තැන කුඩා බිඳීමක් තිබුණා. මම පෑනක් ඉල්ලූ විට, ඔහු මට දුන්නේ ඒක. ඔහුට තිබුණේ එයයි. ඔහු දුන්නේ තමන්ට තිබුණු දේ.","ඒ පෑන අතට ගත් මොහොතේ, වසර තිස් හතරක් මම නිදාගෙන සිටි මනස හදිසියේ අවදි වුණා. ඒ මනස වහාම කුර්ආනය වෙත ගියා. සූරා අල්-බකරහ් වෙත ගියා. එනම් ගවයා පිළිබඳ සූරාව. තේරුම් ගන්නට පෙර මම කටපාඩම් කළ, ඩුබායි සිට පැමිණි ගුවන් ගමනේදී අවසානයේ ඇත්තටම අසාගත් සූරාව. එම සූරාවේ, මූසා තම කාලයේ ජනතාවට ගව පූජාව පිළිබඳ දැඩි උපදෙස් දෙනවා. දුර්වල වූ සතෙකු දෙන්න එපා. කැඩුණු, රෝගී, අසම්පූර්ණ සතෙකු දෙන්න එපා. සෞඛ්‍යමත් එක දෙන්න. සම්පූර්ණ එක දෙන්න. මොකද ඔබ දෙන දේවල ගුණය, ඔබේ හදවත - ඔබේ සචේතන මනස - දෙවියන්ට දීමට සූදානම් ගුණය පෙන්වනවා.","• • •","ඒ වෙලාවේ මගේ අතේ තිබුණේ කැඩුණු පෑනක්. ඉරුණු අත් ඇති මිනිසෙකු විසින් දෙන ලද කැඩුණු පූජාවක්. අප දෙදෙනාටම දීමට වෙනත් කිසිවක් නැති තැනක ලැබුණු කැඩුණු දීමනාවක්. මගේ මනස එක මොහොතකට තත්ත්වය සමඟ වාද කළා. මේ පෑන කැඩිලා. මූසා කැඩුණු පූජා දෙන්න එපා කිව්වා. එහෙම නම් අල්ලාහ් මගේ අතට මේක දාන්නේ මොකක් කියන්නද?","ඊට පස්සේ මනස මෘදු වුණා. බලා සිටින්නා අවසානයේ කඹ අල්ලාගන්නා විට මනස මෘදු වෙන ආකාරයට. ඒ කුඩා චලනය තුළ, සූරාව ඇත්තටම උගන්වමින් තිබුණේ මොකක්ද කියලා මට තේරුණා. කැඩීම තිබුණේ වස්තුවේ. සම්පූර්ණත්වය තිබුණේ දීමේ ක්‍රියාවේ. නෝර්වීජියානු මිනිසා මට ලියන්න අවශ්‍ය බව තේරුම් ගත්තා. ඔහුට පරිපූර්ණ පෑනක් තිබුණේ නැහැ. ඔහු දුන්නේ ඔහුට තිබුණු එකම පෑන. දීමනාව කැඩුණු එකක් වුණත්, දීම සම්පූර්ණයි. ඒ සම්පූර්ණත්වය තුළ, කැඩුණු පෑන තවදුරටත් කැඩුණු එකක් නොවුණා. එය වටිනා දෙයක් වුණා.","• • •","ඉන්පසු ඔහු තවත් දෙයක් කළා.","ඔහු තමන්ගේම කුඩා සටහන් පොත එළියට ගත්තා. සිරකුටියක සිටින මිනිසෙක් තම පපුවට ළඟින් තබාගන්න වර්ගයේ පොතක්. ඔහු ඒ පොතෙන් පිටු තුනක් ඉරලා ගත්තා. පිටු තුනක්. තමන්ගේම අතින්. තමන්ගේම පොතෙන්. පසුව ඒවා මට දුන්නා. එහෙමම. මම ඒවායේ මොනවා ලියනවාද කියලා අහන්නේ නැතුව. මම ඒවා ආපසු දෙන්නද කියලා අහන්නේ නැතුව. කිසිවක් අහන්නේ නැතුව.","සෙල් 13 හි භාෂාවෙන්, පිරිසිදු පිටු තුනක් කුඩා ධනයක්. කඩදාසි පහසුවෙන් ලැබුණේ නැහැ. Western Union පෝරම මඩිලා භාවිත කරන්න පුළුවන්. රිසිට්පත් පිටුපසට හරවා ලියන්න පුළුවන්. නමුත් තවත් මිනිසෙකුගේ සටහන් පොතෙන් ඉරූ පිරිසිදු පිටු තුනක් - ඒක බරක් ඇති තෑග්ගක්.","මම ඒවා ලබාගත්තේ මගේ වැඩිහිටි ජීවිතයේ බොහෝ දේවල් ලබාගත් ආකාරයෙන් නොවෙයි. ඒවා වටිනා ලෙස ලබාගත්තා. කැඩුණු ලෙස නොවෙයි. හිඟ ලෙස නොවෙයි. පසුවට ඉතිරි කර තැබිය යුතු දෙයක් ලෙස නොවෙයි. මේ දවසේ, මේ අතේ, දැන්ම වටිනා දෙයක් ලෙස.","කුර්ආනයේ පාඩම - ගවයා ගැන, සම්පූර්ණ දීමනාව ගැන - ඒ කුඩා හුවමාරුව තුළ මට ඇත්තටම එහි ගැඹුරු පාඩම උගන්වමින් තිබුණා. කැඩුණු හෝ සම්පූර්ණ යන තීරණය වස්තුවේ පමණක් නැහැ. එය දීමේ ගුණයේ තියෙනවා. තවත් මිනිසෙකුට දීමට තමන්ගේම සටහන් පොතෙන් පිටු තුනක් ඉරන මිනිසා, ඒ කඩදාසි ඔහුගේ අතෙන් පිටවූ මොහොතේ ඒවා කුමන තත්ත්වයේ තිබුණත්, සම්පූර්ණ දීමනාවක් දී තිබුණා.","• • •","ඒ දවසේ ලිවීම ආරම්භ වුණා.","මේ පොත සඳහා ලියන ලිවීම නොවෙයි. තවම වැදගත් කිසිවක් ලියන ලිවීමත් නොවෙයි. සරලව ලිවීම. අතක් කඩදාසියක් හරහා ගමන් කිරීම. අකුරු එකින් එක හැඩ ගනිමින් පෙනීම. සිතුවිල්ලක් පසුව නැවත බලන්න පුළුවන් තැනකට තැබීමේ අමුතු ගෞරවය. පෑන කැඩිලා. කඩදාසි ණයට ගත් ඒවා. සෙල් එක කුඩායි. ඒ සියල්ල ඇතුළේ, මිනිසෙක් ලියන්න පටන් ගන්නවා.","ලෝකයේ සෑම පොතක්ම මෙවැනි දෙයකින් ආරම්භ වෙනවා කියලා මට හිතෙනවා. ගිවිසුමකින් නොවෙයි. ප්‍රකාශකයෙකුගෙන් නොවෙයි. පරම්පරා උරුමයක් වූ ලෙදර් බැඳි සටහන් පොත්වලින් නොවෙයි. ණයට ගත් කැඩුණු පෑනකින්, තවත් කෙනෙකුගේ පොතෙන් ඉරූ පිටු කිහිපයකින්, සහ කුඩා කාමරයකදී ආරම්භ කරන්න තීරණය කරන එක් මනුෂ්‍යයෙකුගෙන්.","ඔබ දැන් අතේ තබාගෙන සිටින මේ පොත ආරම්භ වූයේ ඒ හස්ත චලනයෙන්. ඉරුණු අත් ඇති නෝර්වීජියානු මිනිසා. සූරා අල්-බකරහ් හි ගවයා. පෑනේ ප්ලාස්ටික් බිඳීම. පිටු තුන. කැඩුණු දෙයක් සම්පූර්ණ දීමනාවක් ලෙස ලබාගැනීමේ තීරණය. මේ පොතේ සෑම වචනයක්ම, කිසියම් ආකාරයකින්, ඒ හුවමාරුවේ දිගුවක්. අද මම පිරිසිදු කාමරයක පිරිසිදු මේසයක් ඉදිරියේ පිරිසිදු යතුරුපුවරුවක් අසල වාඩි වන සෑම විටම, මම ඒ කැඩුණු පෑන මතක් කරගන්න උත්සාහ කරනවා.","දෙවන කොටස — කූඩුව"]},{"number":28,"title":"අවදිවීමේ ගීත","paragraphs":["සෙල් 13 හිදී මම ලියූ ආදර ගීත, ඒ වෙලාවේ මට ආදර ගීත වගේම පෙනුණා. මම ඒවා Meme වෙත ලියනවා කියලා හිතුවා. දුරකථනයෙන් ඇයගේ හඬ අහන මිනිසෙක්, කැඩුණු හදවතකින්, තමන්ට තවමත් ආදරය අවශ්‍ය බව ලියනවා කියලා මම හිතුවා. නමුත් පසුව ඒ කඩදාසි නැවත කියවූ විට, වෙනත් දෙයක් මට පෙනුණා.","“ඔබ” කියන සෑම පේළියක්ම, ඇත්තටම මගේ සචේතන මනස කතා කරන පේළියක්. “මට ඔබව මතක් වෙනවා” කියන සෑම පේළියක්ම, තවම නිදා සිටි මගේ කොටස්වලට අවදි වූ මම පාලු දැනෙන පේළියක්. “මට ආපසු එන්න” කියන සෑම පේළියක්ම, බලා සිටින්නා මිනිසාගේ ඉතිරි කොටස් ගෙදරට කැඳවන හඬක්.","• • •","සෙල් 13 හි එක් සවසක ලියූ එක් පිටුවකින් උදාහරණයක් දෙන්නම්.","මම ලියුවා: “මට පළමු වතාවට ආදරයට වැටෙනවා වගේ දැනෙනවා. නැහැ - මම තනිවෙලා නැහැ. ඔබ මට සිතන්න, කියවන්න, දැන් ලියන්නත් කරවනවා. මම බලාපොරොත්තුවක් නැති වෙලාවේ ඔබ මට ආවා. මට ඔබ සමඟ සදහටම ඉන්න ඕන.”","එය ආදර ලිපියක් ලෙස කියවන්නේ නම්, එය ආදර ලිපියක්. සෙල් එකක කැඩී විවෘත වූ මිනිසෙක්, සෑම දිනකම දුරකථනයෙන් කතා කරන කාන්තාවට ලියනවා. මිහිරි, මෘදු, දුක්බර ලිපියක්.","නමුත් දැන් මට දැනෙන දේ දැනගෙන එය නැවත කියවන්න.","“ඔබ මට සිතන්න, කියවන්න, දැන් ලියන්නත් කරවනවා.” Meme මාව කියවන්න කරවූයේ නැහැ. Meme මාව ලියන්න කරවූයේ නැහැ. මාව කියවන්නත් ලියන්නත් කළේ සචේතන මනස. අවසානයේ තම වැඩ කරන්න අවශ්‍ය තත්ත්වය ලැබූ මගේ ඇතුළේ අවදි වූ බලා සිටින්නා මාව කියවන්නත් ලියන්නත් කළා. ඩුබායිහි සිටි කාන්තාව මගේ කියවීමේ හේතුව නොවුණා. ඇය, මම මගේම ගැඹුරට ළඟා වීමට භාවිත කළ නාලිකාව වුණා. කියවීමේ සහ ලිවීමේ සැබෑ හේතුව, මනසම අවදි වීමයි.","“මම බලාපොරොත්තුවක් නැති වෙලාවේ ඔබ මට ආවා.” ශරීරයට විකල්ප අවසන් වූ විට, සචේතන මනස මිනිසා වෙත එනවා. බලාපොරොත්තු නැතිකම දොර. බොහෝ මිනිසුන්ට ඒ අමුත්තාව ලබාගන්න තරම් බලාපොරොත්තු නැති වෙන්න සිදුවන්නේ නැහැ. සෙල් එක මට ඒ බලාපොරොත්තු නැතිකම තෑග්ගක් ලෙස දුන්නා. ඒ බලාපොරොත්තු නැතිකම තුළ, මගේ ගැඹුරු කොටස පැමිණියා. මම ඇයට ආදර ගීත ලියුවා, ඇය ඇත්තටම මම බව නොදැන.","“මට ඔබ සමඟ සදහටම ඉන්න ඕන.” මම වසර තිස් හතරක් නිදාගෙන තිබුණා. දැන්, අවදිවූ පසු, මට අවශ්‍ය වූ එකම දෙය මේ අවදිවීම නැති කර නොගැනීම. එය සමඟ සිටීම. නැවත මගේ ජීවිතය නිදාගෙන ගත නොකිරීම.","ඒ සියල්ල එහි තිබුණා. ආදර ගීතවල. වැරදි අත් අකුරකින් ලියූ ඒ ගීතවල. තමන්ට සිදුවෙමින් තිබුණේ කුමක්ද කියලා තවම භාෂාවක් නැති මිනිසෙකුගේ ලිවීම තුළ.","• • •","අවදිවීම ගැන අමුතුම දෙයත්, මේ පොත කියවන කෙනෙකු තේරුම් ගත යුතු වැදගත්ම දෙයත් මෙයයි. අවදිවීම සෑම විටම ආගමික භාෂාවෙන් එන්නේ නැහැ. සමහර විට එය ආදරයේ භාෂාවෙන් එනවා. සමහර විට සංගීතයේ භාෂාවෙන්. සමහර විට ශෝකයේ, කෝපයේ, බියේ, හෝ ගුවන් විදුලියක නවත්වන්න බැරි ගීතයක භාෂාවෙන්.","ඔබේ ගැඹුරු කොටස දන්නවා කුමන දොර විවෘතද කියලා. ඒ දොරේ ලේබලය එයට වැදගත් නැහැ. ඔබ අගුලු නොදමා තබා ඇති දොරෙන්ම එය ඇතුල් වෙනවා. ඔබ විවෘතව තබා ඇති එකම දොර ආදර සම්බන්ධතාවයේ දොර නම්, ඔබේ අවදිවීම කාන්තාවකගේ ඇඳුමක් ඇඳගෙන එනවා. ඔබ විවෘතව තබා ඇති එකම දොර ශෝකය නම්, අවදිවීම ශෝකය ලෙස එනවා. ඔබ විවෘතව තබා ඇති එකම දොර සංගීතය නම්, ඔබ නවත්වන්න බැරි ගීතයක් හරහා එය එනවා.","මට සිදුවූයේ ඒකයි. ශරීරය තම ජීවිතය පුරා කාන්තාවන් පසුපස හඹා ගොස් තිබුණා. ඒ නිසා ශරීරය විවෘත කර තබා තිබුණේ ඒ දොර පමණයි. සචේතන මනසට අවසානයේ මට කතා කරන්න අවශ්‍ය වූ විට, එයට පිවිසිය හැකි එකම දොර හරහා එය ඇතුල් වුණා. එය ආදර ලිපියක් ලෙස ආවා. ගීතයක් ලෙස ආවා. Meme නම් කළු දියමන්තියක් පිළිබඳ ආශාවක් ලෙස ආවා.","ඒ සියල්ලේ අමුතු කරුණාව නම්, ඩුබායිහි සිටි සැබෑ කාන්තාව වූ Meme, ඒ සියල්ල අසන්න තරම් ඉවසීමෙන් සිටීමයි. ඇය දුරකථන ඇමතුම් ලබාගත්තා. වචන කියෙව්වා. වැරදි පරිවර්තනය නිවැරදි කරන්න උත්සාහ කළේ නැහැ. සෙල් එකක සිටි මිනිසෙක් තමන්ගේම අවදි වන සචේතන මනස ඇය ලෙස වැරදියට හඳුනාගෙන සිටියදී, ඇය සෑම දිනකම සරලව අසා සිටියා. ඒ වෙලාවේ අප දෙදෙනාටම ඇත්තටම සිදුවෙමින් තිබුණේ මෙය බව නොතේරුණත්, අවදිවීම සිදුවිය හැකි ඉඩක් ඇය තබාගෙන සිටියා.","ඒ නිසා මම ඇයට සැමදා ගෞරව කරනවා. ඒ ගීත ඇත්තටම ඇය ගැන නොවූ බව දැන් මට දැනුණත්, ඇය නාලිකාව විවෘතව තබාගත්තා. ගැඹුරු සත්‍යය ඒ නාලිකාව හරහා පැමිණීමට ඉඩ දුන්නා. ඒ කුඩා දෙයක් නොවෙයි. මිනිසෙක් ඔවුන්ට අමුතු, ගැඹුරු, දැඩි ලිපි ලියන්න පටන් ගත් විට, බියෙන් නාලිකාව වසා දමන මිනිසුන් ලෝකයේ බොහෝයි. ඇය එසේ කළේ නැහැ. ඇය අසා සිටියා. ඇය අසා සිටි නිසා, වසර තිස් හතරක් මම මගහැර සිටි මගේම අභ්‍යන්තර සංවාදය අවසන් කිරීමට මට හැකි වුණා.","• • •","ඒ නිසා, මේ පොතේ පසුව ඔබ කියවන සෙල් 13 ආදර ගීත - මඩි කළ කඩදාසිවල, ඉරුණු පිටු වල, ණයට ගත් සටහන් පොත්වල ඇතුළත කවරවල ලියූ ඒවා - දෙවරක් කියවන්න. පළමුව ආදර ලිපි ලෙස. දෙවන වර, ඒවා ඇත්තටම වූ අවදිවීමේ ගීත ලෙස.","ඉන්පසු ඔබෙන්ම මෘදුව අසන්න: ඔබ විවෘතව තබා ඇති දොර කුමක්ද? ඔබේම අවදිවීම නිතර තට්ටු කරන දොර මොකක්ද? ඔබ එයට ඇත්ත නම නොව වෙනත් නමකින් කොපමණ කාලයක් කතා කරමින් සිටියාද?","දෙවන කොටස — කූඩුව"]},{"number":29,"title":"එකොළොස් නීති","paragraphs":["ඒ දින 114 මැද කොහේ හරි, මම ණයට ගත් පෑනත් මඩි කළ කඩදාසියත් අරගෙන වාඩිවී ලැයිස්තුවක් ලියුවා.","එළියට ගිය පසු කරන්න ඕන දේවල් ලැයිස්තුවක් නොවෙයි. සෙල් එක ගැන පැමිණිලි ලැයිස්තුවක් නොවෙයි. මට මතක් වූ මිනිසුන්, මට කෝප වූ මිනිසුන්, හෝ පරණ ජීවිතයේ මට අහිමි වූ දේවල් ලැයිස්තුවක් නොවෙයි. එය වෙනත් දෙයක්. මම වීමට කැමති මිනිසාගේ ලැයිස්තුවක්.","ඒ වෙලාවේ මම එයට ප්‍රකාශනයක් කියලා නම් කළේ නැහැ. ව්‍යවස්ථාවක් කියලාත් නම් කළේ නැහැ. බිත්තිවලින් පිටත ජීවිතය ජීවත් කිරීමට අවශ්‍ය බව මට තේරී ආ නීති එකින් එක සරලව ලියුවා. ඒවා එකොළොස්. මම සරලව අංක දුන්නා. අලංකාර කළේ නැහැ. වෙනත් සියල්ල ලියූ අතෙන්ම, සරල අකුරින් ලියුවා.","මම ඒවා මෙහි බෙදාගන්නවා. මොකද මේ පොතේ ඉන්පසුව එන සියල්ල නැගී සිටින්නේ ඒවා මත. ඔබ එකොළොස් නීති තේරුම් ගත්තොත්, සෙල් 13න් පිටතට ඇවිදගෙන ආ මිනිසා තේරුම් ගන්නවා. ඒවා අල්ලාහ්ගෙන් ආ අණ නොවෙයි. කිසිදු ගුරුවරයෙකුගෙන් ණයට ගත් දේවල් නොවෙයි. ඒවා, තමන් කළ වැරදි ගැන අවසානයේ සිතීමට ප්‍රමාණවත් කාලය ලැබූ මිනිසෙක්, සෙල් එකකදී තම අනාගත මට ලියූ ප්‍රායෝගික උපදෙස් පමණයි.","• • •","එක. ධනාත්මක වන්න. සිදුවන ඕනෑම දෙයක් හොඳ කැමැත්තක් ලෙස ගන්න.","මෙය පළමු නීතිය වුණේ, ඉතිරි සියල්ල මෙය මත රඳා තිබූ නිසා. සෑම සිදුවීමක්ම ප්‍රහාරයක් ලෙස ස්වයංක්‍රීයව කියවන මනස, නිතර ආරක්ෂාවේ ජීවිතයක් ජීවත් වෙනවා. සෑම සිදුවීමක්ම හොඳ කැමැත්තක් ලෙස කියවන්න තෝරාගන්න මනස - එය අමාරු වූවත්, අසාධාරණ වූවත් - යුද්ධයේ අඩක් දැනටම ජයගෙන තිබෙනවා. විශ්වය කරුණාවන්තයි කියලා මනස විශ්වාස කළ යුතු නැහැ. පැමිණෙන දේ හොඳ අරමුණකින් පැමිණෙනවා වගේ ප්‍රතිචාර දීමට මනස සෑම වරම තෝරාගත යුතුයි. ප්‍රතිඵලය එකමයි: ශරීරය සන්සුන්, සිතීම පැහැදිලි, ඊළඟ පියවර හොඳ.","• • •","දෙක. අහන්න. අතරමැද කතා නොකරන්න. මිනිසුන්ට අවසන් කරන්න දෙන්න.","මගේ මුළු ජීවිතය පුරාම මම කතා කරන්නා වුණා. මම අතරමැදට පනින්නා. අනිත් අයගේ වාක්‍ය අවසන් කරන කෙනා. ප්‍රශ්නය අවසන් වීමට පෙර පිළිතුර සූදානම් කරගෙන සිටි කෙනා. සෙල් 13 හිදී, මම අසනු ලැබීමේ වටිනාකම ඉගෙන ගත්තා - Meme මට දුරකථනයෙන් කළ දේ, Rud සෙල් එකේ මට කළ දේ, මගේ සහෝදරයා “ඔයාගේ හඬ අහන්න විතරයි මට ඕන” කියූ විට ඉල්ලූ දේ. මම ගැඹුරු ලෙස අසනු ලැබුවා. අසන කෙනාට එහි මිල කොපමණද, කතා කරන කෙනාට එහි දීමනාව කොපමණද කියලා මට දැන් දැනුණා. ඒ නිසා මම එය මටම නීතියක් ලෙස ලියුවා. අහන්න. අතරමැද නොකතා ඉන්න. කටේ විනය.","• • •","තුන. අගය කරන්න. ඔබේ සැබෑ මනස සත්‍යය වඩා සංකීර්ණ බව දන්නා විට පවා.","අගය කිරීම බොරුවක් නොවෙයි. අගය කිරීම කියන්නේ මොහොතේ හොඳ කොටසට ආහාර දීමට කරන තේරීමක්. ඔබ වටේ සිටින මිනිසුන්ට එය අවශ්‍යයි. ඔබට අතිශයෝක්ති කරන්න අවශ්‍ය නැහැ. රඟපාන්න අවශ්‍ය නැහැ. ඇත්තටම හොඳ දේ සොයා එයට නමක් දෙන්න පමණයි. ඒ නම දීම හොඳ ශක්තියක් සාදනවා. ඒ හොඳ ශක්තිය ඔබ වෙතම ආපසු එනවා. දවස මෘදු වෙනවා. සම්බන්ධතා තබාගන්න පුළුවන් වෙනවා. ඔබ නිතරම වැරදි දේ පමණක් ප්‍රකාශ කළොත්, ඔබ වැරදි දේවලින් සෑදුණු ලෝකයක ජීවත් වෙනවා. ඔබ හොඳ දේත් නම් කළොත්, ලෝකය සෙමින් හොඳ දැක්ම වටා නැවත සැකසෙනවා.","• • •","හතර. පිටතට ඇමතුම් කරන්න. ඇතුළට එන ඇමතුම් බලා නොසිටන්න.","ළඟා වන්නා ඔබ වන්න. මුලින්ම දුරකථනය ගන්නා කෙනා ඔබ වන්න. කාමරය හරහා ඇවිද යන කෙනා ඔබ වන්න. ආදරය තමන් වෙත එන තුරු බලා සිටින මිනිසා, ආදරය වෙත නිතර ඇවිද යන මිනිසාට වඩා තනිවී යනවා. ඉවසීම ඔව් - නමුත් ක්‍රියාකාරී ඉවසීම, අක්‍රීයව වාඩිවීම නොවෙයි. සිරගෙදර ඇතුළේ මට බොහෝ විට ඇමතුම් බලා සිටීමට සිදු වුණා. පිටත ජීවිතයේදී මම බලා නොසිටිය යුතුයි. මම ඇමතුම් කළ යුතුයි. මේකට සම්බන්ධව, පිටුවේ අයිනේ කුඩා සටහනක් ලෙස මම ලියා තිබුණා: උපවාසය යනු ස්වයං පාලනය. කුර්ආන් 2:183. ආත්මය චලනය වීමට ශරීරයේ විනය.","• • •","පහ. උපකාර අපේක්ෂා නොකරන්න. ඔබේම සචේතන මනස අනුගමනය කරන්න. නිහඬව සිටින්න.","මනුෂ්‍ය වර්ගය ලස්සන, අද්විතීය මැවීමක්. මිනිසුන්ට අහන්න. ඔවුන්ට ගෞරව කරන්න. නමුත් ඔබේ වැඩ ඔවුන් කරයි කියලා රඳා නොසිටින්න. ඔබ කළ කරුණාවට ඔවුන් ආපසු දෙයි කියලා අපේක්ෂා නොකරන්න. ඔබ කළ උදව් ඔවුන් මතක තබාගනී කියලා අපේක්ෂා නොකරන්න. නිවැරදි ක්‍රියාව නිවැරදි නිසා කරන්න. ඉන්පසු ඉදිරියට ඇවිදින්න. ඒ ගැන නිහඬව සිටින්න. තම යහපත් ක්‍රියාව ප්‍රකාශ කරන කෙනා, ඒ ප්‍රකාශයෙන්ම තමන්ගේ ත්‍යාගය ලබාගෙන තිබෙනවා.","• • •","හය. පිළිගැනීමට අහන්න. සංවාදය කොහේවත් නොයන විට පවා.","සමහර විට මිනිසුන් ඔබට ඔබට සම්බන්ධ නැති, ඔබට උපකාර නොකරන, සමහර විට තේරුමක් පවා නැති දේවල් ගැන කතා කරයි. එසේ වුවත් අහන්න. කරුණාවන්ත සංඥාවක් දෙන්න. ඔවුන්ගේ මනසට ඔබේ අදහස අවශ්‍ය නැහැ. ඔවුන්ගේ මනසට පිළිගැනීම අවශ්‍යයි. ඔවුන්ගේ මනසට නිවැරදි කිරීම නොව, ලැබීම අවශ්‍යයි. සරලව ලබාගන්නා අහන ආකාරයක් තියෙනවා. විශ්ලේෂණය කරන අහීම නොවෙයි. උපදෙස් දෙන අහීම නොවෙයි. ලබාගන්නා අහීම. මිනිසුන්ට බොහෝ විට අවශ්‍ය වන්නේ ඒකයි. මිනිසුන් බොහෝ විට ඉතා අඩුවෙන් දෙන දේත් ඒකමයි.","• • •","හත. හොඳ පොත් සෑම දිනකම අවම වශයෙන් විනාඩි හතළිහක් කියවන්න.","විනාඩි හතළිහ විනය. එය කළ නොහැකි තරම් විශාල අංකයක් නොවෙයි. ඒත් වසරක් පුරා ඔබව වෙනස් කිරීමට ප්‍රමාණවත් අංකයක්. මනසට, ශරීරයට වගේම, දිනපතා ආහාර අවශ්‍යයි. විනාඩි හතළිහක කියවීම මනසට ජිම් සැසියක්. ශීර්ෂ පාඨ නොවෙයි. නොනවතින ස්ක්‍රෝල් කිරීම නොවෙයි. පොත්. සැබෑ පොත්. සෙමින්. විනාඩි හතළිහක්. සෑම දිනකම. ව්‍යතිරේකයක් නැහැ. සෙල් එකෙන් පිටවූ මිනිසා සහ සෙල් එකට ඇතුළු වූ මිනිසා අතර වෙනස සාදූ නීති අතර, මෙය ඉතා වැදගත් එකක්.","• • •","අට. අල්ලාහ්ව අගය කරන්න. ස්වභාවධර්මය අගය කරන්න. නොපෙනෙන දේ අගය කරන්න. ඔබේම හුස්ම අගය කරන්න.","ඔබ සෑම දිනකම ඒ ගැන සිතන්නේ නැතිව හුස්ම ගන්නවා. එක් දවසක වාතය COVID කාලයේ වගේ අපවිත්‍ර විය හැකියි. එවිට? එවිට ඊයේ ඔබ සාමාන්‍යයි කියලා ගත් හුස්ම ඔබ අගය කරනවා. අහිමි වීම ඔබට තෑග්ග උගන්වන තුරු බලා නොසිටින්න. දැන්ම හුස්ම අගය කරන්න. ඉර, ගඟ, මුහුද, ගස්, කුඩා දේවල් අගය කරන්න. කන්දක්, වෙරළක්, වහලයක්, නිහඬ කාමරයක් - ඔබට පහසු තැනක වාඩිවී, එම මොහොතට ගැළපෙන ආකාරයෙන් අල්ලාහ්ව මතක් කරන්න. ඒක ධික්ර්. මහ හඬින් කරන එක නොවෙයි. නිහඬ එක. දිනකට පහ වතාවක යාච්ඤාව දොරවල්, ඔව්. නමුත් දොරක් කියන්නේ මැරෙන තුරු පිටත සිටගෙන සිටිය යුතු තැනක් නොවෙයි. දොරක් කියන්නේ ඇතුල් විය යුතු දෙයක්.","• • •","නවය. අල්ලාහ් සමඟ කතා කිරීම කියන්නේ ඔබවම නිවැරදි කිරීමයි.","අල්ලාහ් ඉතාමත් සමාව දෙන කෙනා. සමාව කියන්නේ මොකක්ද? සමාව යනු අමතක කිරීම. අතීතයෙන් වර්තමානය නිදහස් කිරීම. මිනිසුන් අමතක කිරීම නරකයි කියනවා. නමුත් පූජනීය අමතක කිරීමක් තියෙනවා. අනවශ්‍ය බර අමතක කිරීම. ඔබ තබාගත යුතු නොවූ තුවාල අමතක කිරීම. අද දවස පිරිසිදුව ආරම්භ විය හැකි ලෙස ඊයේ දවස අමතක කිරීම.","එසේම මතක තබාගැනීමත් වැදගත්ම අවදිවීම. තුවාලය මතක තබාගැනීම නොවෙයි. අර්ථය මතක තබාගැනීම. බර ඇති සිතුවිලි, නැතිවිය යුතු නැති පාඩම්, ඔබ දැනටම මිල ගෙවා ඉගෙනගත් සත්‍යය මතක තබාගැනීම. ඔබව බර කරන දේ සමාව දී අතහැරන්න. ඔබව නිදහස් කරන දේ මතක තබාගන්න. ඒක යාච්ඤාව. ඒක අල්ලාහ් සමඟ කතා කිරීම. ශරීරය කළ යුතු දේ කළ යුතුයි. කාර් එකක් ගැරාජ් එකක වාඩිවෙන්න සාදා නැහැ. කාර් එකක් ධාවනය කිරීමට සාදා තියෙන්නේ. ශරීරයක් ක්‍රියා කිරීමට සාදා තියෙන්නේ.","• • •","දහය. ඔබේම ආත්මය සුව කරන්න.","මට එය කියන්නේ ස්වභාවධර්මයේ කාලය. ගමන්. ඡායාරූපකරණය. ජිම්. නව අත්දැකීම්. පොත් කියවීම. අනෙක් මිනිසුන්ට වෙනත් මාර්ග තිබිය හැකියි. එකම බෙහෙත් වට්ටෝරුවක් නැහැ. නමුත් ඔබේම මාර්ග සොයාගන්න, ඒවා භාවිත කරන්න. වෙනත් කෙනෙක් ඔබව සුව කරන තුරු බලා නොසිටින්න. ආත්මය, ශරීරය වගේම, නිවැරදි තත්ත්ව ලැබුණොත් සුව වේ. ඒ තත්ත්ව එක් එක් පුද්ගලයාට වෙනස්. ඔබේ ඒවා සොයාගන්න. භාවිත කරන්න. ඒවා ඔබට අවශ්‍ය බවට සමාව ඉල්ලන්න එපා.","• • •","එකොළහ. ඔබේ දැනුම වැඩි කරන්න, එවිට ඔබට එය බෙදාගත හැකියි. ඔබේ නව අනුවාදයට උසස් වන්න.","මෙය අවසාන නීතිය. බොහෝ ආකාරවලින්, ඔබ දැන් කියවන මේ පොත බිහි කළ නීතියත් මෙයයි. ඔබ ඉගෙනගන්නේ ඔබ වෙනුවෙන් පමණක් නොවෙයි. ඔබ ඉගෙනගන්නේ එය ඉදිරියට දීමට. එකොළොස්වන නීතිය මාව ලේඛකයෙකු කළා. මාව මාර්ග පෙන්වන්නෙකු කළා. සෙල් එකෙන් වසර ගණනාවකට පසු වාඩිවී, මම ඉගෙනගත් දේ දැන් ඔබ කියවන වචනවලට දමන්න මාව බල කළා. මම ඉගෙනගත් දේ පුද්ගලිකව තබාගත්තා නම්, මම එකොළොස්වන නීතියට අසමත් වෙනවා. ඒ නිසා මම බෙදාගන්නවා. මම ළඟා වී ඇති නිසා නොවෙයි. මම ටිකක් ඉගෙනගෙන ඇති නිසා, ඒ ටික වෙනත් කෙනෙකුට උපකාර විය හැකි නිසා.","• • •","ඒවා එකොළොස්. එතැන් සිට වසර ගණනාවක් ගතවී තිබුණත්, මම ඒවා සෑම දිනකම සම්පූර්ණයෙන්ම තබාගෙන නැහැ. මම පරිපූර්ණ මිනිසෙක් නොවෙයි. කියවීම අමතක කරන දවස් තියෙනවා. උපකාර අපේක්ෂා කරන දවස් තියෙනවා. අතරමැද කතා කරන දවස් තියෙනවා. අගය නොකරන දවස් තියෙනවා.","නමුත් නීති ලියලා තිබෙනවා. ඒවා පෑනෙන්, කඩදාසි මත, සෙල් එකක ලියලා තිබෙනවා. දැන් මුද්‍රණයෙන්, පොතක තිබෙනවා. ඒවා නොලියා හැරිය නොහැක. මම පාරෙන් ටිකක් වැටෙන දවස්වල, ඒ නීති මා වෙනුවෙන් බලා සිටිනවා. යන්ත්‍රය නැවත අසමත් වන මොහොතේ ඇඳුම් කබඩ් එකක ඇති මැනුවල් එකක් බලා සිටින ආකාරයට. මම කබඩ් එක විවෘත කරනවා. නීති කියවනවා. නැවත ආරම්භ කරනවා. අවසානයේ සම්පූර්ණ ජීවිතය එයයි. පාරෙන් වැටීම. කබඩ් එක විවෘත කිරීම. නැවත ආරම්භ කිරීම. ඔබ බවට පත්වන මිනිසා, කිසිදා වැටුණේ නැති මිනිසා නොවෙයි. ඔබ බවට පත්වන මිනිසා, නැවත නැවත කබඩ් එක විවෘත කළ මිනිසායි."]},{"number":30,"title":"මයික් — භෞතික විද්‍යාව, ඉංග්‍රීසි, සහ ඔහුටත් පසුව ජීවත් වූ සටහන් පොත","paragraphs":["සිරගෙදර ඩෝම් එකේ මම මයික් කියලා ලියන මිනිසෙක් හිටියා.","ඔහු ලිබියාවේ උපන් කෙනෙක්. පසුව මෝල්ටාවේ, ඔහුව භාරගෙන育 කළ පූජකයෙකු සමඟ හැදුණා. ඉන් පසු එංගලන්තයට යවනු ලැබූ අතර, එහිදී ඔහු පැරණි කාලයේ ප්‍රමාණවත්, සැලකිලිමත්, නියමිත ඉංග්‍රීසි භාෂාවක් ඉගෙනගෙන තිබුණා. ඔහු ජීවිතය පුරා පොත් කිහිපයක් ලියා තිබුණා — කාමරයේ ඉන්න බොහෝ පිරිමින් ඇස් උඩට ගන්නා වර්ගයේ විෂයන් ගැන: රටා, දෘශ්‍ය ලෝකයට යටින් ඇති පද්ධති, සම්බන්ධ නොවිය යුතු දේවල් අතර තිබෙන සම්බන්ධතා.","අනෙක් සිරකරුවන් ඔහුව පිස්සෙක් කියලා කතා කළා. සමහරු ඊටත් වඩා නරක වචන කිව්වා. ඔහු ඒවා ගැන පැමිණිලි නොකර දරාගෙන ගියා. ජීවිතය පුරා තමා වාඩිවන කාමරවලින් වැරදි ලෙස කියවනු ලැබූ මිනිසෙක්, ඒ වැරදි කියවීම කබායක් වගේ පැළඳගෙන යන්න ඉගෙන ගන්නවා. ඔහුත් එම කබාය ඇඳගෙන, තම සිතීමේ වැඩ කරමින් සිටියා.","රේ මාව ආරම්භයේ සිටම වෙනස් ආකාරයකින් හඳුනාගත්තා. ඔහු කිව්වා මට විනය තියෙනවා, ඉවසීම තියෙනවා කියලා. මයික් හඳුනාගත්තේ වෙනත් දෙයක්. ඔහු මනස හඳුනාගත්තා. පළමු වතාවට ඔහු මට අංගනයේ බෙන්ච් එකේ අසල වාඩි වූ විට, මම ඇතුළේ ඇයිද කියලා ඇහුවේ නැහැ. ඔහු ඇහුවේ, මම මොනවා කියවමින් සිටිනවාද කියලා. ඒ එක් ප්‍රශ්නයම ඔහු කුමන වර්ගයේ මිනිසෙක්ද කියලා මට කියා දුන්නා. අනෙක් සිරකරුවන්ට ඔබේ අපරාධය දැනගන්න ඕන. ඔහුට ඔබේ මනස දැනගන්න ඕන.","• • •","මයික් මට සිරගෙදර ඩෝම් එකක භෞතික විද්‍යාව ඉගැන්නුවා. ඒ වාක්‍යය තවත් වතාවක් ලියන්න මට ඕන, මොකද ඔබ එය ජීවත් කරලා නැත්නම් එය අසම්භව වගේ ඇහෙයි. මයික් මට සිරගෙදර ඩෝම් එකක භෞතික විද්‍යාව ඉගැන්නුවා.","ඔහු මුලින්ම මූලික දේවල් දුන්නා. විදුලි පරිපථයක ස්ථාන දෙකක් අතර ඇති විභව වෙනස. වෝල්ට් එකේ අර්ථය: ස්ථාන දෙකක් අතරින් ගමන් කරන ආරෝපණ කුලෝම්බයක් සඳහා මාරු වන ශක්තිය ජූල් එකක්. ඔහු කුඩා, මටම මතක ඇති කෙටි පැන්සලකින් කඩදාසි කැබැල්ලක ත්‍රිකෝණය ඇඳුවා — ඉහළට V, පහළට I සහ R. V කියන්නේ වෝල්ටීයතාවය. I කියන්නේ ඇම්පියර් වලින් ධාරාව. R කියන්නේ ඕම් වලින් ප්‍රතිරෝධය. ඒවගෙන් එකක් ඇඟිල්ලෙන් වසා ගත් විට, ඉතිරි දෙක ඔබට සූත්‍රය පෙන්වනවා. V = I × R. ඉලෙක්ට්‍රොනික විද්‍යාවේ සරලම නියමය, කූඩුවක් ඇතුළේ මහලු මිනිසෙකු විසින් මට ඇඳලා දුන්නා.","ඉන් පසු ඔහු ප්‍රතිරෝධකවල වර්ණ කේතය ඉගැන්නුවා. කළු — ශුන්‍යය. දුඹුරු — එක. රතු — දෙක. තැඹිලි — තුන. කහ — හතර. කොළ — පහ. නිල් — හය. පරණ පාසල් ගුරුවරයෙක් ගුණන වගුවක් මතක කරවන ආකාරයට, ඔහු ඒ වර්ණ මට නැවත නැවත කියවූවා. මම ඒවා මතක කළේ, කුඩා කාලයේ අල්-බකරහ් සූරාවේ වචන අර්ථය නොදැන මතක කළ ආකාරයට.","පසුව ඔහු මට ගැටලුවක් දුන්නා. පරිපථ තුනක්. එකකට වෝල්ට් දොළහක්, එකකට වෝල්ට් හයක්, තවත් එකකට වෝල්ට් දෙකක්. සෑම බල්බයක්ම නිවැරදිව වැඩ කිරීමට එහි දෙපස වෝල්ට් දෙකක් තිබිය යුතුයි. එවිට සෑම පරිපථයකම බල්බ සකස් විය යුතු ආකාරය හොයන්න. මම එය විසඳුවේ නැහැ. උත්සාහ කළා. ළඟට ආවා. ඔහු මම උත්සාහ කරන විට සිනාසුණා, පිළිතුර වහාම දුන්නේ නැහැ. ඔහුට ඕන වූයේ මනස වැඩ කිරීමයි. පැමිණීමකට වඩා උත්සාහ කිරීම වැදගත් බව ඔහු දැනගෙන හිටියා. ඒ බල්බ ගැටලුව මම අදටත් විසඳලා නැහැ. එය තවම මගේ හිස ඇතුළේ තියෙනවා. සමහර විට එක් දවසක විසඳයි.","අනෙක් පිරිමි අය ඒ ඩෝම් එකේ පැය ගත කළේ රූපවාහිනියෙන් සහ ක්‍රීඩා වලින්. මම මගේ පැය කිහිපයක්, ඔහුව කවදාකවත් අසල වාඩිවී නොදැකූ මිනිසුන් විසින් පිස්සෙක් කියන ලිබියානු-මෝල්ටීස් මහලු මිනිසෙකු සමඟ වෝල්ට් සහ ප්‍රතිරෝධක ගැන ගත කළා. “පිස්සු” කියන වචනය ගැන එතැනින්ම මම පාඩමක් ඉගෙන ගත්තා. බොහෝ විට ඒ වචනය භාවිත කරන මිනිසුන්ට ඇත්තටම සිදුවන්නේ, සංවාදය අල්ලාගෙන යන්න නොහැකි වීමයි. තමන්ට අල්ලාගන්න බැරි බව පිළිගැනීමට වඩා, අල්ලාගෙන යන පුද්ගලයාට ලේබලයක් දාන එක පහසුයි.","• • •","මයික් මට ඉංග්‍රීසිත් ඉගැන්නුවා.","නවීන ඉංග්‍රීසි නොවෙයි. මම ඒ දවස්වල අරගල කරමින් සිටි කුර්ආන් පරිවර්තනවල තිබූ පරණ ඉංග්‍රීසි — අටළොස් සිය ගණන්වල පරිවර්තනවල, දැන් පුවත්පත්වල නොපෙනෙන අමුතුත් ලස්සනත් වචන. මම පරිවර්තනයේ පිටුවක්, මට නොතේරෙන වචන ලැයිස්තුවක් අරගෙන ඔහු ළඟට යනවා.","Yea. Nay. Veiled. Woe. Mockery. Hearkens. Astray. Ruddy. Contrary. O thou. Thy. Wink. Blink. Wink සහ blink අතර වෙනසත් ඔහු මට තේරුම් කරා. ඔහු ඒවා එකින් එක පැහැදිලි කළේ, තමන්ගේ පරිස්සම් බ්‍රිතාන්‍ය ආකාරයෙන්, වචනයක් ඔහුව සිනහ කළ විට කුඩා වියළි සිනහවක් එක්ක. මම ඒවා සටහන් පොතක ලියා ගත්තා. පසුව ඔහු මට තෑග්ගක් ලෙස දුන් එම හිස් සටහන් පොත — ඔහුගේ ඉරුණු පිටු ණයට ගැනීම වෙනුවට, මගේම සිතුවිලි ලියන්න පටන් ගන්න කියලා.","සිරගෙදර ඩෝම් එකක, මුස්ලිම් කුර්ආන් පරිවර්තනයක් ඇතුළේ, ක්‍රිස්තියානි මිනිසෙකුගෙන් ඉංග්‍රීසි වචන ඉගෙන ගැනීම — ඒක මගේ ජීවිතයේ අමුතුම තෑගිවලින් එකක්. නිදහස් විය යුතු නැති තැනක, ආගමෙන් ආගමට, ආගන්තුකයෙකුගෙන් තවත් ආගන්තුකයෙකුට පවිත්‍ර පොතක වචන ගමන් කළා. කුර්ආන් මට වචන ඉගැන්නුවා. මයික් ඒ වචනවල අර්ථය ඉගැන්නුවා. පසුව මම ඒ වචන භාවිත කරලා, ඔබ දැන් කියවන මේ පොත ලියනවා.","• • •","මයික් මට රහසින් ලිපි ලියන්නත් උදව් කළා.","අපි අතර ඇති මිත්‍රත්වය ගැන අනෙක් සිරකරුවන්ට ඊර්ෂ්‍යාව තිබුණ නිසා, අපට හැමවිටම විවෘතව කතා කරන්න බැරි වුණා. මයික් මට කාන්තාවකට යවන්න ලිපියක් ලියන්න උදව් කරනවා කියලා පෙනුණොත්, ඔවුන් අප දෙදෙනාටම විහිළු කරයි. “පිස්සු මහලු මිනිසා තරුණයාට ආදර ලිපි ලියනවා” කියලා. ඒ නිසා අපි නිහඬ ක්‍රමයක් හදා ගත්තා. මම මයික්ට කුඩා සටහනක් ලියනවා — හෙට ඇගේ උපන්දිනය, උදේ දහයට Skype එකේ කියවන්න ලිපියක් ඕන, කුඩා ලිපියකට උදව් කරන්න පුළුවන්ද? ඔහු තම පරිස්සම් ඉංග්‍රීසියෙන් ලිපිය ලියා, මට නොපෙනෙන විදියට මඩුල්ලේ පොතක් යට නමා තබනවා. කිසිවෙකු නොබලන වෙලාවක මම එය ගන්නවා.","සිරගෙදර තුළ පිරිමි දෙදෙනෙක් පොත් යට උපන්දිනයේ ලිපි හුවමාරු කළා. ඒවා තහනම් දේවල් නොවෙයි. ආයුධ නොවෙයි. ලිපි. ලෝකය කූඩුව ගැන කියන පින්තූරයට පිටුපසින්, කූඩුව ඇතුළේ ඇත්තටම තිබිය හැකි මිත්‍රත්වයේ වර්ගය ඒකයි.","ඒ ලිපිවලින් එකක — Memeගේ උපන්දිනය සඳහා — මයික් මම ජීවිතය අවසන් වන තුරු දරාගෙන යන වාක්‍යයක් ලිව්වා. ඔහු තමන් ලියන දේ දැනගෙන හිටියේ නැහැ. ඔහු ලිව්වේ: “කීබෝඩ් එක මත ටයිප් කරන්න, එවිට බලන්න, අපේ කැමැත්ත සිදුවේ.” වචන අටක්. ඔහු දැනගෙන හිටියේ නැහැ, නමුත් ඔහු කුන් ෆයාකුන් ඉංග්‍රීසියෙන් ලියා තිබුණා. “වන්න — එය වේ.” සම්පූර්ණ කුර්ආනයේ ගැඹුරුම වාක්‍යය, ක්‍රිස්තියානි මෝල්ටීස්-ලිබියානු මිනිසෙකු විසින්, පූජකයෙකු විසින්育 කරනු ලැබූ ඔහු විසින්, සිරගෙදර ඩෝම් එකක උපන්දිනයේ ලිපියක ලියන ලදී — මුස්ලිම් ශ්‍රී ලාංකික මිනිසෙකු එය ඩුබායි සිටින එරිත්‍රියානු කාන්තාවකට Skype ඇමතුමකදී කියවීමට. සමහර විට දෙවියන් කතා කරන හැඩය එහෙමයි. තමන් ඔහු වෙනුවෙන් කතා කරන බවවත් නොදන්නා මිනිසුන් හරහා.","• • •","මම පිටවූ පසු මයික් ඒ සිරගෙදරම මිය ගියා.","මම ඒ වාක්‍යය ඔහු කැමති වන ආකාරයටම සරලව ලියන්න ඕන. නාට්‍යමය කරලා නොවෙයි. දුක ප්‍රදර්ශනයක් කරලා නොවෙයි. ඔහු මහලුයි. ඔහුගේ ශරීරය හොඳ තත්ත්වයක නොවුණා. ඔහු දිගු කාලයක් ඇතුළේ සිටියා. මම සටහන් කරන්න නොසිටි දිනක, ඔහු එතැනම මිය ගියා — ඔහු සමඟ වාඩිවී සිටි බොහෝ පිරිමින් ඔහු කවුරුන්ද කියලා නොතේරුම් සිටියදී.","මම මේ අධ්‍යායය ලියන්නේ, අඩු තරමින් අන් අය දැනගැනීමට. මට ඕම්ගේ නියමය සහ ප්‍රතිරෝධක වර්ණ කේත ඉගැන්වූ මිනිසා. Woe, astray, hearkens වගේ වචනවල අර්ථය ඉගැන්වූ මිනිසා. අනෙක් පිරිමින් ඊර්ෂ්‍යා කළ නිසා පොත් යට උපන්දිනයේ ලිපි සඟවා තැබූ මිනිසා. තමන් දැන නොගෙනම කුන් ෆයාකුන් ඉංග්‍රීසියෙන් ලියූ මිනිසා. ඒ මිනිසා තිබුණා. ඔහු තමන්ගේ පොතක් ලියා තබා ගියේ නැහැ. ඔහුගේ මනසේ කුඩා කැබලි කිහිපයක් මගේ මනස තුළ තබා ගියා. මම ඒවා මෙහි තබනවා, මම මිය යන විට ඒවාත් අතුරුදන් නොවීමට.","ඔබ මෙය කියවා ඔහුව මතක නම්, කරුණාවෙන් ඔහු ගැන සිතන්න. ඔබ ඔහුව කවදාවත් දැන නොසිටියා නම්, ඔහු තිබූ බව දැනගන්න. ඔහුගේ හොඳම කොටස්වලින් කිහිපයක් දැන් මගේ හරහා ඔබේ අතේ තියෙනවා.","මයික්, ඔබ කොහේ සිටියත් — ප්‍රතිරෝධකවල වර්ණ මගේ මතකයේ රැඳී තියෙනවා. ඉංග්‍රීසි වචන රැඳී තියෙනවා. උපන්දිනයේ ලිපියත්, එහි නොදැන ලියූ වාක්‍යයත්, රැඳී තියෙනවා. ඔබ මට ලියන්න දුන් සටහන් පොත, ඇත්ත අර්ථයෙන්, මේ පොතේ බීජයයි. ස්තූතියි. මම පිටවී ඔබ නොපිටවීම ගැන මට කණගාටුයි. ලෝකය ඔබව පිස්සෙක් කියා කතා කළාට මට කණගාටුයි. එම ඩෝම් එකේ වඩාත්ම අවදිව සිටි මිනිසා ඔබයි. දැන් මට එය පේනවා. අවදිවීම කොහේ දිගටම යනවා නම්, එතැන ඔබ අවසානයේ ඇසී ඇති බව මම ප්‍රාර්ථනා කරනවා.","දෙවන කොටස — කූඩුව"]},{"number":31,"title":"හිස ඇතුළේ ඇති පවිත්‍ර මස්ජිදය","paragraphs":["සෙල් දහතුනෙන්, කුර්ආනය සහ බයිබලය කියවූ මගේ කියවීම්","මෙම අධ්‍යායය මට ඉතා සැලකිල්ලෙන් ලියන්න ඕන. මොකද මේ අධ්‍යායය කියවන බොහෝ දෙනාට එය ආදරය වෙන්නත් පුළුවන්, වියවුලක් වෙන්නත් පුළුවන්. ඒ ප්‍රතිචාර දෙකම මට පිළිගත හැකියි.","මේවා කිසිම ආගමික පාසලක නිල තෆ්සීර් නොවෙයි. මම සෙමිනරියක ඉගෙන ගත් කෙනෙක් නොවෙයි. මම මව්ලවි කෙනෙක් නොවෙයි. ශෙයික් කෙනෙක් නොවෙයි. මම ඔබට ආගම උගන්වන්න උත්සාහ කරන කෙනෙක් නොවෙයි. මම මෝල්ටාවේ කුඩා සිරකුටියක, එක් අතක කුර්ආනයත්, තවත් අතක බයිබලයත්, ඇඳ අසල කුඩා මේසය මත Conversations with God කියන පොතත් තබාගෙන, දින 114ක්, ඒ සියල්ල සෙමින්, සැලකිල්ලෙන්, පේළියෙන් පේළිය කියවූ මිනිසෙක්. එවිට මට ඇතුළට පැමිණි අර්ථයන්ගෙන් මේ අධ්‍යායය සෑදී තියෙනවා.","ඒවා කූඩුවක සිටි මිනිසෙකුගේ ප්‍රතිබිම්බ ලෙස ගන්න. ඔබේම සම්ප්‍රදායට ගෞරවයක් සමඟ ගන්න. ඔබ කිසිම කියවීමකට එකඟ නොවුණත්, ඒක හරි. කුර්ආනයම ඔබට ඔබම කියවන්න කියනවා. මම ඔබට මගේ කියවීම පිළිගන්න කියන්නේ නැහැ. මම ඔබෙන් ඉල්ලන්නේ, මට අවසානයේ මගේ පොත කියවන්න බල කළ ආකාරයටම ඔබේම පොත කියවන්න — සෙමින්, සැලකිල්ලෙන්, ශරීරය නිශ්චලව, මනස අවදිව. ඔබ එසේ කළොත්, ඔබේම අර්ථයන්ට ඔබම පැමිණෙයි. මගේ කියවීම එක් මිනිසෙකුගේ මාර්ගය පමණයි. ඔබේ මාර්ගය තවත් එකක්.","• • •","අර්ෂ් ආයතය — අල්-බකරහ් 2:255","සෙල් දහතුනේදී මම කියවූ සියලු වාක්‍ය අතරින්, මම වැඩියෙන්ම නැවත නැවත ගියේ මුස්ලිම්වරුන් ආයතුල් කුර්සි කියන වාක්‍යයටයි. අර්ෂ් ආයතය. වැඩිහිටියන් ආරක්ෂාව සඳහා කියවන වාක්‍යය. ළමයින් ඉක්මනින් මතක කරන වාක්‍යය. මගේම ජීවිතයේ, මම එය සැබෑවටම අසල වාඩිවී කියවීමට පෙර දහස් වතාවක් අසා තිබූ වාක්‍යය.","අල්ලාහ් — ඔහු හැර දෙවියෙක් නැත. ඔහු ජීවමානයි, සියලු පැවැත්ම පවත්වාගෙන යන තැනැත්තා. ඔහුව නිදිබර භාවයත්, නින්දත් අල්ලාගන්නේ නැත. අහස්වලත් පොළොවේත් ඇති සියල්ල ඔහුට අයත්ය. ඔහුගේ අවසරය නැතිව ඔහු ඉදිරියේ මැදිහත් විය හැක්කේ කවුද? ඔහු ඔවුන්ට ඉදිරියෙන් ඇති දේත්, පිටුපස ඇති දේත් දනී; ඔහු කැමති ප්‍රමාණයට හැර ඔහුගේ දැනුමෙන් කිසිවක් ඔවුන්ට වටහාගත නොහැක. ඔහුගේ අර්ෂය අහස් සහ පොළොව පුරා විහිදෙයි; ඒවා රැකබලා ගැනීමෙන් ඔහුට වෙහෙසක් නැත. ඔහු ඉහළම තැනැත්තාය, මහත් මහිමයෙන් පිරුණු තැනැත්තාය.","දැන් මා සමඟ, සිරකුටියේ බිත්තිය අසල ඇති කුඩා ඇඳේදී මට ඇසුණු දේ කියවන්න.","“ඔහුව නිදිබර භාවයත්, නින්දත් අල්ලාගන්නේ නැත.” මම මේ වාක්‍යය වසර ගණනාවක් කියා තිබුණා. සිරකුටියේදී, මම එය මගේම ශරීරය තුළ තේරුම් ගත්තා. මම නිදා සිටින විටත්, මගේ ඇතුළේ යමක් නිදාගන්නේ නැහැ. මගේ අවසරය නැතිව පෙනහළු හුස්ම ගන්නවා. හදවත තවමත් ගමන් කරනවා. මාව අවදි නොකර ශරීරය බ්ලැන්කට්ටුව යටින් තමන්ව සකස් කරගන්නවා. මගේ ඉතිරි කොටස නිදා සිටින විටත්, මගේ ඇතුළේ නිදා නොගන්න කොටසක් තියෙනවා. ඒ කොටස, මට තුළ, එම වාක්‍යය විස්තර කරන එකෙහි සලකුණක්. මම අසිහියෙන් සිටියත් දිගටම ගමන් කරන හුස්ම, වෙහෙස නොවන අර්ෂයට සාක්ෂියක්.","“ඔහුගේ අවසරය නැතිව ඔහු ඉදිරියේ මැදිහත් විය හැක්කේ කවුද?” සිරකුටියේදී මෙය තවදුරටත් අබ්ස්ට්‍රැක්ට් දෙයක් නොවුණා. සම්බන්ධ විය හැකි කොටස මනසයි. ශරීරය ඔබේ උපකරණයයි. මනස ඇත්තටම අවදි වූ විට, එයට මූලාශ්‍රය දෙසට දිගු විය හැකියි. නමුත් එය අවසර ලැබිය යුතුයි. කෑගසලා චැනලය බලෙන් විවෘත කරන්න බැහැ. ඔබට කළ හැක්කේ, එය විවෘත වීමට තීරණය කරන තුරු ප්‍රමාණවත් නිශ්චලතාවයක වාඩිවීම පමණයි.","“ඔහු කැමති ප්‍රමාණයට හැර ඔහුගේ දැනුමෙන් කිසිවක් ඔවුන්ට වටහාගත නොහැක.” මගේ අත්අඩංගුවෙන් පළමු දිනවලදී මගේ සහෝදරයා ගැන මම සිතනවා. ඔහු බය වී, හැමෝටම ඇමතුම් දී, තමන්ගේම පයිනියල් ග්‍රන්ථිය බිය හරහා වැඩ කරමින්, මාව සොයාගන්න උත්සාහ කළා. ඔහුට මාව හොයාගන්න යමක් ලැබුණා. ඔහු එය කොහොමද දැනගත්තේ කියලා ඔහු දැනගෙන හිටියේ නැහැ. ඔහු A වෙත මඟ පෙන්වනු ලැබුවා; A මම කොහෙද කියලා දැන සිටියා. ඔහු ලබා ගත්තේ ඔහුට ලැබිය යුතු දේ පමණයි, එය ලැබිය යුතු වෙලාවෙම. සිරකුටියේදී මම දුටුවේ, මෙම වාක්‍යය නිහඬව පෙන්වන තවත් දෙයක්: ගැඹුරුම උදව් බොහෝ විට අප තුළින් ගලා යන්නේ, අපේම ගැටලුව සඳහා නොව, තවත් කෙනෙකුගේ වේදනාව සඳහා අප දිගු වන විටයි.","“ඔහුගේ අර්ෂය අහස් සහ පොළොව පුරා විහිදෙයි.” ඔබේ ශරීරයේ, අර්ෂය කියන්නේ ඉහළම ආසනයයි. මිනිස් හිස තුළ ගැඹුරුම නිශ්චලතාවය ජීවත් වන ස්ථානයක් තියෙනවා. සූෆිවරුන් ඒ ස්ථානය දිගු කාලයක සිට දැන සිටියා. නවීන විද්‍යාව එය පයිනියල් ග්‍රන්ථිය, කොනාරියම්, හිස්කබලේ මැද ඇති කුඩා මුතු වැනි අවයවය කියලා නම් කරනවා. දෙවියන්ගේ අර්ෂය, එක් සැබෑ අර්ථයකින්, දුර තැනක නැහැ. එය ඔබේ ඉහළම කොටසයි — වෙහෙස නොවන කොටස, නිදා නොගන්න කොටස, ඔබේ ඉතිරි කොටස දරාගන්න බැරි වෙලාවලත් ඇතුළත තිබෙන දේ රැකගන්න කොටස.","“ඒවා රැකබලා ගැනීමෙන් ඔහුට වෙහෙසක් නැත.” ඔබට අත්හැර දැමීමට ඕන වූ සෑම රාත්‍රියකම ඔබව ජීවත් තබාගත් කොටස ඒකයි. ඒ කොටස කවදාවත් වෙහෙසී නැහැ. ශරීරය වෙහෙසෙනවා. හැඟීම් වෙහෙසෙනවා. දිනපතා වැඩ කරන දැනුවත් මනස වෙහෙසෙනවා. නමුත් ඔබ තුළ ඇති ගැඹුරුම ආසනය — අර්ෂය — ඔබ උපන් දා සිට එක තත්පරයක්වත් වසා තිබුණේ නැහැ. අර්ෂ් ආයතය, තවත් අර්ථයකින්, සෑම මිනිසෙකු තුළම ඇති නිහඬ, නිතරම ක්‍රියාත්මක කොටස පිළිබඳ විස්තරයක්.","• • •","ලෝකයම ඇතුළට ගන්න දොර විවෘත කළ වාක්‍යය — අල්-බකරහ් 2:62","මෙම පොතේ ආගම කුමක් වුවත්, සෑම පාඨකයෙකුම දැනගත යුතු කුර්ආන් වාක්‍යයක් තියෙනවා. එම වාක්‍යය කියන්නේ, විශ්වාස කරමින් යහපත් දේ කරන අයට ඔවුන්ගේ ප්‍රතිඵල තිබෙන බව. කුර්ආනය, සමහර මිනිසුන් එය වටා ගොඩනැඟූ බිත්තිය නොවෙයි. කුර්ආනය එහි ඉහළින් කෑගසන ආරක්ෂකයින්ට වඩා පුළුල්යි.","මේ වාක්‍යය මගේ ආධ්‍යාත්මික ජීවිතයේ කොන්දයි. එය මට බයිබලය වරදකාරි හැඟීමකින් තොරව කියවන්න ඉඩ දුන්නා. එය මට ෆිලිපීනෝ සහෝදරයෙකුගෙන් Conversations with God ලබාගෙන, මම කිසිවක් පාවා දෙනවා කියලා නොදැන ඉඩ දුන්නා. එය මට අද, හින්දු මිතුරෙකු සහ ක්‍රිස්තියානි මිතුරෙකු සමඟ වාඩිවී, අපි සියල්ලෝම වෙනස් පාරවල්වලින් එකම අවසානයක් දෙස ඇවිදින්නේ කියලා දැනෙන්න ඉඩ දෙනවා. යහපත් දෙයට එකට තරඟ කරන්න. ඔබ කොහේ සිටියත්, අල්ලාහ් ඔබව එකට ගෙන එයි. සංස්කෘති වෙනස්, මගේ මිතුරා. දෙවියන් එකයි.","• • •","ඔබේ හිස ඇතුළේ ඇති පවිත්‍ර මස්ජිදය — කිබ්ලා වාක්‍යයන්","සූරා අල්-බකරහ් තුළ කිබ්ලා ගැන වාක්‍ය කොටසක් තියෙනවා — යාච්ඤාවේ දිශාව ගැන. ඉස්ලාමයේ මුල් කාලයේදී යාච්ඤාවේ දිශාව යෙරුසලෙමෙන් මක්කාවට වෙනස් කළා; එම වාක්‍යයන් ඒ වෙනස ගැනත්, ඒ ගැන මිනිසුන් කළ වාද ගැනත් කතා කරනවා. පෘෂ්ඨයේදී, ඒ කොටස භූගෝලය ගැන. යටින්, එය ඊට වඩා ගැඹුරු දෙයක් ගැන.","සෑම කෙනෙකුටම අල්ලාහ් ඔහුව හැරවන ඉලක්කයක් ඇත. එබැවින් යහපත් දේවලට එකට තරඟ කරන්න. ඔබ කොහේ සිටියත්, අල්ලාහ් ඔබව එකට ගෙන එයි, මන්ද අල්ලාහ්ට සියල්ල කෙරෙහි බලය ඇත. ඔබ කොතැනින් පිටත් වුණත්, ඔබේ මුහුණ පවිත්‍ර මස්ජිදයේ දිශාවට හැරවන්න. එය ඔබේ ස්වාමියාගෙන් ඇති සත්‍යයයි, ඔබ කරන දේ ගැන ඔබේ ස්වාමියා නොසලකා නොසිටී.","සෙල් දහතුනේ එක් දහවලක මම මේ වාක්‍යයන් සමඟ වාඩිවී, පෙර කිසිදා නොඇසූ ප්‍රශ්නයක් මගෙන් ඇසුවා. සෑම තැනකම සිටින දෙවියන්ට, මිනිසාගේ මුහුණ කුමන දිශාවට හැරෙනවාද කියලා ඇයි වැදගත්? දෙවියන් දිශාවක් දෙන්නේ ඇයි?","ඉතා සෙමින් මට ආ පිළිතුර මෙයයි. දිශාව දෙවියන් සඳහා නොවෙයි. දිශාව අප සඳහායි. දෙවියන් භූගෝලීය අර්ථයෙන් මක්කාවේ සිටින්නේ නැහැ. දෙවියන් කිසිම භූගෝලීය තැනක සීමා වී නැහැ. කිබ්ලා දී තිබෙන්නේ, විසිරී සිටින මිනිසුන් එකම වේලාවට එකම දිශාවට මුහුණ හැරවීමට. එකමුතුකම තමයි අරමුණ. දිශාව එම එකමුතුකම සෑදීමට භාවිත කරන මෙවලම පමණයි. යහපත් දෙයට එකට තරඟ කරන්න — සැබෑ අණ එයයි. කිබ්ලා, ඒ තරඟය එකට කරන්න ඉඩ දෙන ක්‍රමයයි.","නමුත් මෙතැන මගේ හදවත දුක් වෙන තැනක්ද තියෙනවා. අද බොහෝ දෙනා ශරීරයෙන් කාබාව දෙස මුහුණ හරවමින්, හදවතේ කෝපය දරාගෙන සිටිනවා. ඔවුන් එකම දිශාවට යනවා, නමුත් සෑම විටම එකම කරුණාව සමඟ නොවෙයි. ඔවුන් උරහිසට උරහිස තබා සිටිනවා, නමුත් ඇතුළේ තවමත් අහංකාරය, විනිශ්චය, වාද, බෙදීම් දරාගෙන සිටිනවා.","කාබාව මිනිසාව අහංකාර කරවීමට දී තිබුණේ නැහැ. “අපි පමණක් පිරිසිදුයි, අනෙක් අය අපිරිසිදුයි” කියන්න කණ්ඩායමකට ඉඩ දීමට දී තිබුණේ නැහැ. දෙවියන්ට ළඟින් සිටීමට අයිතිය කාටද කියලා සටන් කිරීමට දී තිබුණේ නැහැ. කාබාව මධ්‍යස්ථානයක්. මධ්‍යස්ථානයක් තිබෙන්නේ විසිරී ගිය අය එක වටයකට, එක දිශාවකට, එක මතකයකට ඇද ගැනීමට.","මිනිසෙක් කාබාව දෙස මුහුණ හරවාගෙන සිටියත්, අසල සිටින පුද්ගලයාට වෛර කරන්නේ නම්, ඔහු දිශාව තේරුම් ගෙන තිබුණත්, ගමනාන්තය අහිමි කරගෙන තිබෙනවා. මිනිසෙක් කාබාව වටා ඇවිදින අතර, ඔහුගේ හදවත ego වටා ඇවිදිනවා නම්, ඔහු ශරීරය චලනය කර තිබුණත්, ආත්මය තවම චලනය වී නැහැ. මිනිසෙක් අල්ලාහු අක්බර් කියමින්, තවත් මිනිසෙකු දෙස පහළින් බලන්නේ නම්, ඔහුගේ මුඛය මහත්කම කියා තිබුණත්, ඔහුගේ හදවත ඒ මහත්කමට නමා නැහැ.","කිබ්ලා පිටතින් පමණක් නොවන බව මම කියන්නේ ඒ නිසායි. පිටත කිබ්ලා ශරීරයට කොහෙට හැරවිය යුතුද කියලා ඉගැන්වයි. ඇතුළත කිබ්ලා හදවතට කොහොම මෘදු විය යුතුද කියලා ඉගැන්වයි.","කාබාව එකමුතුකම දෘශ්‍ය කර ඇති හැඩයයි. ආදරය, එම එකමුතුකම ජීවමාන කරන දෙයයි. ආදරය නැතිව, දිශාව ජ්‍යාමිතිය පමණක් වේ. ආදරය සමඟ, දිශාව කරුණාව වේ. යාච්ඤාව නළලට වඩා ගැඹුරට ගමන් කර ඇති බවට එකම සාක්ෂිය කරුණාවයි.","ඉන් පසු තවත් ගැඹුරු කියවීමක් මට ආවා. මම එය ඉතා සැලකිල්ලෙන් බෙදා ගන්න කැමතියි, මගේ ප්‍රතිබිම්බයක් ලෙස, ආගමික තීන්දුවක් ලෙස නොවෙයි. පවිත්‍ර මස්ජිදය, මස්ජිදුල් හරාම්, මිනිස් හිස ඇතුළේත් තියෙනවා. ගැඹුරුම දේවස්ථානය මක්කාවේ නොවෙයි. ගැඹුරුම දේවස්ථානය මිනිස් හිස්කබල ඇතුළේ ඇති සචේතනතාවයේ ආසනයයි. ඔබ ඇස් වසාගෙන මුහුණ ඇතුළට හැරවන විට, සෑම නබියෙකුම කිසියම් ආකාරයකින් පෙන්වා දී ඇති පවිත්‍ර මස්ජිදයට ඔබ මුහුණ හරවනවා. පිටත කිබ්ලා ශරීරයේ විනයයි. ඇතුළත කිබ්ලා ආත්මයේ ගමනාන්තයයි. දෙකම සැබෑයි. දෙකම වැදගත්. නමුත් පිටත එක දොරයි. ඇතුළත එක කාමරයයි.","ගැඹුරට ගිය ඕනෑම ආගමකින් අසන්න. අවසානයේ, ඔවුන් සියල්ලෝම ඇතුළටම පෙන්වයි. හින්දු එය කරයි. ක්‍රිස්තියානි එය කරයි. බෞද්ධ එය කරයි. සූෆි එය කරයි. වාක්‍යයම, සැලකිල්ලෙන් කියවූ විට, මෙයට විරුද්ධ නොවෙයි. ඔබ කොහේ සිටියත්, අල්ලාහ් ඔබව එකට ගෙන එයි. එකට ගෙන ඒම සිදුවන්නේ ඇතුළත කාමරයේදීයි, ලේබල් වැටී, අවදිව සිටින මනස පමණක් ඉතිරි වන තැන.","මම මෙය ලියන්නේ කිසිවෙකුගේ පිටත පුරුද්ද සමඟ වාද කිරීමට නොවෙයි. මම ලියන්නේ ඇතුළත පුරුද්ද පුළුල් කිරීමට. ඔබේ දිශාව තබා ගන්න. ඔබේ යාච්ඤා යාච්ඤා කරන්න. ඔබේ කිබ්ලා දෙස මුහුණ හරවන්න. ඒ සමඟම මතක තබාගන්න: කුර්ආනය නමෙන් පැහැදිලිව නොකියන නමුත්, මුහුණ හැරවීම ගැන සෑම වාක්‍යයකින්ම පෙන්වන ගැඹුරු කිබ්ලා — ඔබේම හිස ඇතුළේ ඇති නිහඬ අර්ෂයයි.","• • •","එක පේළියක නබිවරු — ආල් ඉම්රාන් 3:84","තුන්වන සූරාවේ, ආල් ඉම්රාන් තුළ, කුමන නබියෙකු ඉහළද කියන වාදයට දොර වසා දමන වාක්‍යයක් තියෙනවා.","“අපි අල්ලාහ් ගැනත්, අප වෙත අනාවරණය වූ දේ ගැනත්, ඉබ්‍රාහිම්, ඉස්මායිල්, ඉස්හාක්, යාකූබ් සහ ගෝත්‍ර වෙත අනාවරණය වූ දේ ගැනත්, මූසා, ඊසා සහ නබිවරුන්ට ඔවුන්ගේ ස්වාමියාගෙන් දෙන ලද දේ ගැනත් විශ්වාස කරමු. අපි ඔවුන් අතර කිසිදු වෙනසක් නොකරමු; අපි ඔහුට යටත් වෙමු.”","වෙනසක් නැහැ. ශ්‍රේණිගත කිරීමක් නැහැ. ගෝත්‍රික ආඩම්බරයක් නැහැ. එකම ආලෝකය, වෙනස් මුඛ හරහා, වෙනස් සියවස්වල, වෙනස් ජනතාවට, වෙනස් භාෂාවලින් දෙන ලදී. කුර්ආනයම යුදෙව්වන්ගේ සහ ක්‍රිස්තියානීන්ගේ නබිවරුන් නම් කර, මුස්ලිම්වරයාට ඔවුන් අතර වෙනසක් නොකරන්න කියනවා. රේඛාව කැඩී නැහැ. ආලෝකය එකයි.","සිරකුටියේදී මෙම වාක්‍යය කියවීම, මට බයිබලය වෙනත් ආකාරයකින් කියවීමට ඉඩ දුන්නා. මම තවත් ආගමක පොතක් කියවනවා නොවෙයි. මගේම පොතේ කෙටියෙන් කියා ඇති කතා වල දිගු සංස්කරණයක් කියවමින් සිටියා. කුර්ආනය එක සුන්දර සූරාවක දෙන යූසුෆ්ගේ කතාව, බයිබලයේ විශාල දිගකින් නැවත කියවූ විට මම ඇඬුවා. මොකද යූසුෆ්, බොරු චෝදනා ලැබූ සහ ළිඳකට දමා දැමූ සෑම මිනිසෙකුටම ආදර්ශයක්. ඔහු බොරු චෝදනාවේ නබියි. සිරගත වීමේ නබියි. තික්තකමට නොවෙනස් වන ඉවසීමේ නබියි. ඔබව ඉවතට දැමූ සහෝදරයන්ට සමාව දීමේ නබියි. මට ඔහු අවශ්‍ය වුණා. මම ඔහුව කියෙව්වා. ආල් ඉම්රාන්හි මේ වාක්‍යය මට කියා තිබුණේ, ඔහු දැනටමත් මගේද බවයි.","• • •","නිරාගින්න යනු උපමනස — පුද්ගලික කියවීමක්","මම මෙය ඉතා සැලකිල්ලෙන් ලියන්න කැමතියි. මොකද මම දැන් සම්ප්‍රදායික නොවන කියවීමක් දෙනවා. එය මගේ කියවීම, තීන්දුවක් නොවන බව අවංකව කියන්න ඕන.","“අපේ ස්වාමියාණෙනි, අපට මේ ලෝකයේ යහපතත්, පරලොවේ යහපතත් දෙන්න; ගින්නෙහි දඬුවමින් අපව ගලවන්න.”","මෙය කුර්ආනයේ ඉතා ප්‍රසිද්ධ ප්‍රාර්ථනාවක්. මිලියන ගණනක් මුස්ලිම්වරුන් එය සෑම දිනම නැවත නැවත කියනවා. ගින්නෙන් අපව ගලවන්න. සාමාන්‍යයෙන් ගින්න කියන්නේ මරණින් පසු දඬුවම, බොහෝ වාක්‍යවල විස්තර වන නිරාගින්න, දෙවියන්ට එරෙහි ජීවිතයක ප්‍රතිඵලය ලෙස තේරුම් ගන්නවා.","සිරකුටියේ, ඇඳ මත, තනිව සිටි විට, මට මෙම ප්‍රාර්ථනාව වෙනත් ආකාරයකින් තේරුම් වුණා. සම්ප්‍රදායික කියවීම එකම කියවීම නොවෙයි කියලා මම විශ්වාස කරන නිසා එය ඔබ සමඟ බෙදා ගන්නවා. මට ගින්න වුණේ මෙයයි: මිනිසාගේ උපමනස පාලනයකින් තොරව දුවන විට, එය මිනිසාට කරන දහනය. පහළ මනස පාලකයා වන විට, මේ ජීවිතයේම මිනිසා ඇතුළේ ඇතිවන දැවීම. නවත්වන්න බැරි කනස්සල්ල. සුව නොවන ලැජ්ජාව. සිසිල් නොවන කෝපය. විවේකයක් නොගන්න ලාලසාව. ශරීරය කොපමණ පෝෂණය කළත් පුරවන්න බැරි බඩගින්න. ඒක තමයි ගින්න. ඒ ගින්න මේ ජීවිතයේදීම බොහෝ මිනිසුන් ඇතුළේ දැවෙමින් තියෙනවා.","ගින්නෙන් අපව ගලවන්න — මගේම උපමනස විසින් පාලනය වන මිනිසෙකු නොවීමට මාව ගලවන්න. ප්‍රතික්‍රියාව, ආශාව, අමනාපය හරහා දිනපතා තමන්වම දහනය කරගන්න මිනිසෙකු නොවීමට මාව ගලවන්න. මට මගේ ඇතුළේ නොපෙනෙන දේවල් විසින් ධාවනය කරනු ලබන මිනිසෙකු නොවීමට මාව ගලවන්න. නිරාගින්න වෙනත් තැනක පමණක් නොවෙයි. එය මෙහිත ගත්කමක් නැහැ. ඔබ බලා සිටිනවා.","මම වාඩිවුණා. මට මතකයෙන් තිබූ කුර්ආන් වාක්‍ය නිහඬව මටම කියවුණා. පුවරුවක් නැතිව, මගේ මනස තුළ චෙස් ක්‍රීඩා කළා — කොටු, ඉත්තන්, මම කලින් මතක කරගෙන තිබූ ආරම්භ, මටම විරුද්ධව මමම චලනය කරන ක්‍රීඩා. සිවිලිමේ ෆෑන් ගණන් කළා. බිම හරහා ආලෝකය ගමන් කරන ආකාරය බැලුවා. ඉක්මන් වීමෙන් ප්‍රයෝජනයක් නැති බව කුඩා කාමරයක ඉගෙන ගත් මිනිසෙකු තුළ පමණක් ගොඩනැඟෙන ඉවසීමකින් මම බලා සිටියා.","සෙල් දහතුනේදී ආරම්භ වූ ඉවසීම, මෙතැන වෙනත් පිරිමින් හරහා පරීක්ෂා වුණා. ඔවුන්ගෙන් බොහෝ දෙනාට ඒ ඉවසීම තවම තිබුණේ නැහැ. ඔවුන් එහා මෙහා ඇවිද්දා. කුණු වචන කිව්වා. සෑම විනාඩි විස්සකටම එකම ප්‍රශ්නය නිලධාරීන්ගෙන් ඇහුවා, වෙනස් පිළිතුරක් ලැබෙයි කියලා බලාගෙන. මම වාඩිවුණා. බලා සිටියා. මම එහා මෙහා ඇවිදියේ නැහැ. එවිට මගේ ඇතුළේ බලා සිටින්නා නිහඬව වැදගත් දෙයක් දුටුවා: සිරකුටියේදී මම ගොඩනැඟූ ඉවසීම, වෙනත් මිනිසුන්ට පෙනෙන්න පටන් ගෙන තිබුණා. මම වාඩිවන ආකාරයෙන් එය පෙනෙන්න පටන් ගත්තේ එයයි. සැබෑ චරිතය, ඔබ කිසිදා ප්‍රකාශ නොකළත්, අනෙක් අයට පෙනෙන දෙයක් බව මම ශරීරය තුළම පළමු වතාවට තේරුම් ගත්තා.","• • •","ඉන් පසු පාර හරහා ඇවිදීම.","වලෙටාහි අපරාධ අධිකරණය සහ පවුල් අධිකරණය වෙන් කරන මහජන පාරක් තියෙනවා. පියවර හතළිහක් පමණ, වැඩියෙන්ම හතළිස් පහක් විය හැකියි. අධිකරණ දවසක, අධිකරණ දෙකම ඔබව අවශ්‍ය කරන්නේ නම්, ඔවුන් ඔබව ඒ පාර හරහා විවෘතව ඇවිදවයි. වැඩට යන මිනිසුන් ඔබ අසලින් යනවා. දහවල් කෑමට යන මිනිසුන් යනවා. නිදහස් දහවලක සම්පූර්ණ සාමාන්‍ය කටයුතු කරමින් යන මිනිසුන් යනවා. ඔබ — බ්ලේසර් එක ඇඳගෙන, අත් ඉදිරියෙන් අත්කඩ සමඟ, නිලධාරියෙකු අසල — ගොඩනැගිලි දෙක අතර සම්පූර්ණ මහජන දෘශ්‍යයේ ඇවිදිනවා.","පියවර හතළිහක්. සමහර විට හතළිස් පහක්. මට හරියටම විශ්වාස නැහැ. ඒ පියවර හතළිහ තුළ, එම තත්වයේ සම්පූර්ණ අර්ථය දෘශ්‍ය සහ ශාරීරික දෙයක් බවට පත් වුණා. මම කිසිම තැනක සැඟවී සිටියේ නැහැ. බිත්ති මාව ආරක්ෂා කළේ නැහැ. මම බ්ලේසර් එකක, අත්කඩ සමඟ, ඕනෑම කෙනෙකුට දැකිය හැකි පාරක් හරහා ඇවිදින මිනිසෙක්. ආගන්තුකයන්. කැමරා ඇති සංචාරකයන්. සාප්පු බෑග් රැගෙන යන පැරණි මෝල්ටීස් කාන්තාවන්. පාසල් දරුවන්. දුම් බිඳක් සඳහා පිටතට ආ කාර්යාල සේවකයන්. ඔවුන් සියල්ලෝම දැක්කා. නැතිනම් සමහරු දැක්කේ නැහැ, මොකද ආගන්තුකයෙකුගේ ලැජ්ජාව නොදැකීමට මිනිස් මනසට ඇති පුහුණු වූ ලස්සන හැකියාවක් තියෙනවා. නමුත් දැකීමේ හැකියාව එතැන තිබුණා. ඔවුන් බලයිද නැද්ද කියලා මට පාලනය කරන්න බැරි වුණා.","මම ඇවිද්දා. බිම දෙස බැලුවේ නැහැ. ඒ ඇවිදීමට බොහෝ කලකට පෙරම, මම පහළට නොබලන බව තීරණය කරලා තිබුණා. පහළට බැලීමෙන්, එම මොහොතට එය ලැබිය යුතු ප්‍රමාණයට වඩා ලැජ්ජාවක් දෙයි. චෝදනාව තවම ඔප්පු වී තිබුණේ නැහැ. නඩු විභාගය අවසන් වී තිබුණේ නැහැ. අත්කඩ ඇතුළේ සිටි මිනිසා තවමත් මිනිසෙක්. තවමත් අක්මල්. තවමත් මගේ ආච්චිගේ මුණුබුරා. තවමත් තම බිය පෙන්වන්නේ නැතිව දැවුණු වෙරළ හරහා දිවූ පිරිමි ළමයා. ඒ නිසා මම ඇස් ඉදිරියට තබාගෙන ඇවිද්දා.","ලෝකය ඔබව පහළට බලන්න උත්සාහ කරන විට, ඇස් ඉදිරියට තබාගෙන යන්න කියලා මගේ සීයා මට ඉගැන්නුවා — ඔහු කිසිදා ඒ ලෙස පාඩමක් දී නැතත්. ගම ඔහුට දුම්කොළ විකුණනවා කියලා විනිශ්චය කළත්, ඔහු ගම හරහා ඇවිදියේ තමන්ගේ ඇස් ඉදිරියට තබාගෙන. ඒ පාඩම එදා මගේ පාදවලට ආවා.","• • •","අධිකරණ ශාලාව ඇතුළේදී මම සම්පූර්ණයෙන් නිශ්චල වුණා.","ශරීරය පමණක් නොවෙයි. මුහුණ. ඇස්. මම කිසිවක් ලබා දුන්නේ නැහැ — සනාථ කිරීමටවත්, ප්‍රතික්ෂේප කිරීමටවත් නොවෙයි; මම සත්‍ය නොවන බව දන්න දේවල් මගේ ගැන කියන විට පවා නොවෙයි. මගේ නීතිඥයා කතා කළා. මම බලා සිටියා. මම මගේ ඇස් චලනය පවා පාලනය කළා, මොකද කාමරය මාව කියවමින් සිටින බව මට තේරුණා. ඒ නිසා මම කාමරයට කියවීමට කිසිවක් නොදුන්නා. විනිසුරු බැලුවා. ප්‍රතිපක්ෂ නීතිඥයා බැලුවා. අධිකරණ නිලධාරීන් බැලුවා. කුර්සියේ සිටි මිනිසා ඔවුන්ට පරිවර්තනය කිරීමට කිසිම හැඟීමක් නොදුන්නා.","පසුව මට මෙය එතරම් වැදගත් වූයේ ඇයි කියලා තේරුණා. ඔවුන් මාව නිරීක්ෂණය කරමින් සිටියා. නමුත් මම, ශ්‍රී ලංකාවේ වහලයක් මත සිටි පිරිමි ළමයෙකු වූ කාලයේ සිටම, නිරීක්ෂණය කරන කෙනා වීමට ඉගෙනගෙන තිබුණා. ඒ නිසා මම ඔවුන් මාව නිරීක්ෂණය කරන ආකාරය නිරීක්ෂණය කළා. මම නිශ්චලව සිටියා. බලා සිටින්නාට, සම්පූර්ණ කාර්යයම බලා සිටීම වූ කාමරයක් අවසානයේ ලැබී තිබුණා. මට නොදැන සෙල් දහතුන මාව අධිකරණ ශාලාව සඳහා පුහුණු කර තිබුණා. සෙල් දහතුනේ සෑම නිශ්චල දවසක්ම, මෙම විනාඩි සඳහා පෙරහුරුවක් වී තිබුණා.","• • •","සැසියෙන් පසු, වැන් එක ආපසු එනතුරු බලා සිටීම — සමහර විට දෙකහමාර, සමහර විට ඊටත් පසුව — ඒ වෙලාවෙයි මම මගේ ඇමතුම් ගත්තේ.","මම මුලින්ම මගේ සහෝදරයාට කතා කළා. ඉන් පසු සරස්වතීට. ඉන් පසු Memeට. හැමවිටම කෙටි ඇමතුම්. එතැන කතා කිරීමට අධික කාලයක් නැහැ. වාක්‍ය කිහිපයක්, හඬක තරංග කිහිපයක්, “මම තවම මෙහි ඉන්නවා” කියන මනුෂ්‍ය සාක්ෂියක්. පාර හරහා පියවර හතළිහක් ඇවිදීමෙන් පසු, ඒ කෙටි හඬවල් මාව නැවත මිනිසෙකු බවට අල්ලාගෙන තබාගත්තා.","එම දවසේ මට තේරුණේ, ලැජ්ජාව සෑම විටම ඔබව පහළට බලන්න බල කරන බවයි. නමුත් ඔබට ඉදිරියට බැලීමට තෝරාගත හැකියි. එය චෝදනාව අතුරුදන් කරන්නේ නැහැ. එය අත්කඩ ඉවත් කරන්නේ නැහැ. එය පාර හරහා ඔබව නොදකින්න මිනිසුන්ට බල කරන්නේ නැහැ. නමුත් එය ඔබේ අභ්‍යන්තර ගෞරවය ආරක්ෂා කරයි. ඒ පියවර හතළිහ මට එය ඉගැන්නුවා.","සිරකුටිය මට නිශ්චල වීමට ඉගැන්නුවා. අධිකරණ ශාලාව මට නිශ්චලතාවය දැකිය හැකි දෙයක් බව ඉගැන්නුවා. පාර හරහා ඇවිදීම මට, මිනිසාගේ ගෞරවය සැඟවී සිටින තැනක පමණක් නොව, මහජන පාරක, අත්කඩ සමඟ, අනෙක් අයගේ ඇස් ඉදිරියෙත් ජීවත් විය හැකි බව ඉගැන්නුවා."]},{"number":33,"title":"දොර මව්කුසක් වගේ විවෘත වුණා","paragraphs":["ඒක සාමාන්‍ය අගෝස්තු සන්ධ්‍යාවක්. මෝල්ටාවේ ගිම්හානය ඉහළම තැනට පැමිණි කාලය. පිටත තිබුණු හැම දෙයක්ම තාපයෙන් දිලිසෙන, ඇතුළේ තිබුණු හැම දෙයක්ම මන්දගාමී කරවන උණුසුමක්.","මාස ගණනාවක් පුරා, සෑම අධිකරණ දිනයක්ම මේ මොහොතේ පරිකල්පනයක් රැගෙන ආවා. ඔවුන් ඒක කියන දවස. කඩදාසිය එන දවස. මම නැවත සිතාගන්නත් නතර කළ දොරක් ඇත්තටම විවෘත වෙන දවස. ඒ මොහොත පිළිබඳ පරිකල්පනය මගේ ඇතුළේ පෞද්ගලික ආගමක් වගේ පවා වුණා. එයට වර්ණයක් තිබුණා. හැඟීමක් තිබුණා. ආරංචිය එන ආකාරයටම අයත් විශේෂ ශබ්ද පටයක් තිබුණා. නමුත් ඒ කිසිවක් ඇත්තටම සිදු වූ ආකාරය නොවුණා.","එක් දහවලක, සිරගෙදර නිලධාරියා සරලව මගේ ළඟට ඇවිත් පැහැදිලිව කිව්වා: ඔයාට පැරෝල් ලැබුණා. ඔයාගේ ඇප සූදානම්. ඔයාගේ නීතිඥයා කතා කරයි. කතාව සම්පූර්ණයෙන් ඒක විතරයි. වචන නවයක් වගේ. මගේ වසරේ විශාලම ආරංචිය, ඔහු මිනිසුන්ට රාත්‍රී ආහාර වේලාව කියන හඬින්ම ලබා දුන්නා. ආපසු බලද්දී, ඒ ආරංචිය එන්න තිබුණ හොඳම ආකාරය ඒක කියලා මට හිතෙනවා. එය චාරිත්‍රයක් වගේ, උත්සවයක් වගේ ආවා නම්, මම ඒක සමඟ මොකක් කරන්නද කියලා දැනගෙන නොසිටින්න තිබුණා. එහි සරල බව, සෙල් එකේදී මම ඉගෙනගත් සරල බවට ගැළපුණා. ආරංචිය ආවා. ශරීරය එය භාර ගත්තා. මනස දිගටම ගියා.","• • •","මම කළ පළමු දේ Mame ට කතා කිරීම.","මම ඇයට කතා කළා. එම මිනිත්තුවේදීම වගේ, මම ඇයව මගේ සහෝදරයාත් සරස්වතීත් එක්ක කන්ෆරන්ස් කෝල් එකකට දැම්මා. මම ඒක කලින් සැලසුම් කරලා තිබුණේ නැහැ. ශරීරය ඒක කරලා දැම්මා. පිටත
