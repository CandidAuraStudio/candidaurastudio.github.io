මළ ආකාරයට, මම කුඩා කාලයේ මගේ අම්මා මට උගන්වූ ගෞරවනීය ආකාරයට. ගේට්ටුව දෙසට ඇවිද ගිය මිනිසා, දින 114කට පෙර ඒ ගේට්ටුව හරහා ඇතුළු වූ මිනිසා නොවෙයි. ඇඳුම් බොහෝ දුරට ඒ වගේමයි. ඒ යට තිබුණු ශරීරය සම්පූර්ණයෙන් වෙනස්.","සරස්වතී ටැක්සියකින් ආවා. හීල්ස් දාගෙන, නගරය හරහා දුවගෙන එතැනට පැමිණියා. ඇය සාමාන්‍ය දිනපතා ඇඳුමකින් සිටියා — මගේ මතකයේ කොටසක් ඒ මොහොතට සිතාගෙන තිබූ රෝස ඇඳුමෙන් නොවෙයි. සැබෑ දවසකට සැබෑ ඇඳුම් පමණයි. ඇය මාව වැළඳගත්තා. ටැක්සිය බලා සිටියා. අපි මැනුවෙල් දූපතට ගියා.","එවිට පිටත ලෝකය — එහි වේගය, ශබ්දය, ආලෝකය සමඟ — නැවත ආරම්භ වුණා.","• • •","දින 114කට පසු පිටතට පියවර තැබීම, මම බලාපොරොත්තු වූ හැඟීම නොවුණා.","එය නිදහස වගේ දැනුණේ නැහැ. පිටවීම ගැන කිසිවෙකු ඔබට නොකියන දෙය ඒකයි. පළමු පැය කිහිපය තුළ එය බිය වගේ දැනුණා. ලෝකය ඉතා වේගවත්. කාර් ඉතා ඉක්මනින් ගමන් කරනවා. වර්ණ ඉතා දීප්තිමත්. පොදු තැන්වල අප වටා තිබුණු හඬවල් ඉතා උච්චයි. දුරවල් ඉතා විශාලයි. මම මා ඉදිරියෙන් ඇවිද ගිය මිනිසුන් දෙස බැලුවා, මගේ මොළය මොහොතකට නතර වුණා. මම පාර හරහා යන්නේ කොහොමද? මිනිසුන්ගේ ඇස් දෙස බලන්නේ කොහොමද? හැමෝම එකවර හුස්ම ගන්නා මේ පිටත ලෝකයේ මම හුස්ම පිට කරන්නේ කොහොමද?","දින 114ක් තුළ කුඩා සෙල් එකක ජීවත් වීමට ඉගෙනගත් ශරීරයට, පුළුල් ලෝකයක නැවත ජීවත් වීමට තවම දැනගෙන තිබුණේ නැහැ. නිහඬ වී තිබුණු මනසට, එකවර එතරම් තොරතුරු, එතරම් ආලෝක, එතරම් චලනය හැසිරවීමට තවම දැනගෙන තිබුණේ නැහැ. පළමු පැයවල කිසිවෙකු ඔබට අනතුරු අඟවන්නේ නැති විලාපයක් තියෙනවා. ඔබ මේ දවස එන තුරු බලා සිටියා. එය පැමිණි විට, ඔබේ කොටසකට කාමරය ආපසු ඕන වෙනවා.","එවිට, හෙමින්, මගේ අනුවාද දෙකක් එකට ඇවිදීම ආරම්භ කළා. සෙල් 13 මවූ නව අවදි වූ අක්මල් — බයිබලය සහ කුර්ආන් එකිනෙකට අසල තබා කියවූ, නැමූ කඩදාසිවල තමන්ගේම වචනවලින් යාච්ඤා ලියූ කෙනා — සහ මැයි මාසයේ ගුවන් තොටුපොළට යට ඇඳුම් දෙකක් ඇඳගෙන, මේ කිසිවකට කිසිම සැබෑ සූදානමක් නැතිව ඇවිද ආ පරණ අඳුරු අක්මල්. ඔවුන් එකට ඇවිද්දා, එකිනෙකා මත වැසෙමින්, වෙන වෙන ආකාරවලින් එකිනෙකා ආරක්ෂා කරමින්. පරණ කෙනා නගරය දැන සිටියා. නව කෙනා නිශ්චලතාවය දැන සිටියා. ඒ පළමු දහවලේ, ඔවුන් එකට මගේ ජීවිතයේ ඉතිරි කොටසට හරහා ගියා.","නව කෙනා මගේ පපුව තුළ නිහඬව කිව්වා: ඔයා මේ ලෝකය දන්නවා. ඔයා වසර තිස් හතරක් මෙහි ජීවත් වෙලා තියෙනවා. ඔයාට මේක දරාගන්න පුළුවන්. හෙමින් ඇවිදින්න. බලන්න. හුස්ම ගන්න. ඔයා තවදුරටත් කූඩුවේ නැහැ. නමුත් කූඩුව, මේ පාරේ සිටින මිනිසුන් තවම නොදන්නා දෙයක් ඔයාට ඉගැන්නුවා. ඒක භාවිත කරන්න. ඒක රඟපාන්න එපා. සරලව භාවිත කරන්න.","මම ටැක්සිය දෙසට ඇවිද්දා. දොර විවෘත වුණා. මම ඇතුළට ගියා. එවිට ඒ දින 114ක මව්කුස මගේ පිටුපසින් මෘදු ලෙස වැසුණා — මව්කුසක් වැසෙන ආකාරයට, දැඩිව ගසා වැසීමක් නොව, හෙමින් පසුබසින එකක්. එය ඇතුළේ වැඩී තිබුණු දෙය දැන් ලෝකයට පිටවී තිබුණා. ලෝකය තවම දැනගෙන සිටියේ නැහැ. ලෝකය ඉගෙන ගනීවි.","▢ ඡායාරූපය","සුදු බෑගය, කොළ බ්ලේසර් එක, හෝ නිදහස් වූ දවස","තුන්වන කොටස — වහලය"]},{"number":34,"title":"ඉවසීම සහ නැවත ගොඩනැඟීම","paragraphs":["සිරගෙදර බේරී සිටීමට මම භාවිත කළ පළමු උපකරණය ශක්තිය නොවෙයි. එය ඉවසීම.","ආරම්භයේදී මට ඒක තේරුණේ නැහැ. ආරම්භයේදී මම හිතුවේ මට ශක්තිය ඕන කියලා. ශරීරය දැඩි කරන්න, මුහුණ දැඩි කරන්න, හඬ දැඩි කරන්න ඕන කියලා හිතුවා. කූඩුව මගේ නිදහස ගෙන තිබුණ නිසා, කූඩුව මාව ආක්‍රමණයෙන් පරීක්ෂා කරයි කියලා මම හිතුවා — ඒ ආක්‍රමණයට මටත් මගේම වඩා දැඩි අනුවාදයකින් මුහුණ දෙන්න සිදුවෙයි කියලා. මම කවදා හෝ බලලා තිබුණු සෑම චිත්‍රපටයක්ම, සෑම සිරගෙදර කතාවක්ම මට ඉගැන්වූයේ ඒක.","තවත් දැඩි වෙන්න. උසින් නැගී සිටින්න. අඩුවෙන් කතා කරන්න. පළමුව පහර දෙන්න.","ඒ ඉන්ස්ටින්ක්ට් එක වැරදියි. ඒක, ශරීරය කවදාවත් නොගිය තැනකට මුහුණ දීමට ශරීරය කළ පළමු අනුමානය. ශරීරයේ පළමු අනුමාන බොහෝ වගේ, මම එය අනුගමනය කළා නම්, එය මට නරක සේවයක් කරනු ඇත.","• • •","ඒ පළමු දවස්වල, මගේ කොටසක් තවම පලා යන්න කැමති වුණා.","භෞතිකව නොවෙයි — ඒක කළ නොහැකි බව මම දැන සිටියා. මනස හරහා පලා යාම. පරිකල්පනය තුළට පලා යාම. කෝපය තුළට පලා යාම. මාව එතැනට දැමූ මිනිසුන්ට එරෙහි ද්වේෂය තුළට පලා යාම. තමන් ගැන අනුකම්පාව තුළට පලා යාම; එය මිනිසාට තිබෙන ගැඹුරුම සහ පහසුම පලා යන මාර්ගවලින් එකක්.","දවස් ගතවෙමින්, මගේ සිතීම ගැඹුරු වෙමින් යන විට, යමක් වෙනස් වුණා. ප්‍රශ්නයෙන් පලා යන්න මට තවදුරටත් ඕන වුණේ නැහැ. මට එයට මුහුණ දෙන්න ඕන වුණා. ඒ කුඩා හැරීමේදී — පලා යාමෙන් මුහුණ දීමට හැරීමේදී — ඉවසීම, මම පෙන්වමින් සිටි ගුණයක් පමණක් නොවුණා. එය බේරීමම වුණා.","මම සිරගෙදර විශාල මිනිසෙක් නොවෙයි. ඉතිහාස බරක් සහිත, බර මිනිසුන් අතරින් කෙනෙක් නොවෙයි. මම කුඩා, නිහඬ අය අතරින් කෙනෙක්. හින්සාවෙන් පිරුණු තැන්වල ජීවත් වී, ඒ හින්සාව තමන්ගේ මාංශපේශිවල, සංඥාවල, පෝළිමේ සිටින ආකාරයේ පවා රැගෙන ආ මිනිසුන් වටේ මම සිටියා. ඒ පළමු සතිවල මම තීරණයක් ගත්තා; මම කිසිදා ඒකෙන් ආපසු ගිහින් නැහැ. මම අධිපත්‍යය සඳහා සටන් කරලා බේරෙන්නේ නැහැ. මම සන්සුන්කම ඉගෙනගෙන බේරෙනවා.","ගෞරවයෙන්. අවශ්‍ය වෙලාවට නිහඬව. සිනහවක් හරි උපකරණය වූ විට සිනහවක්. ප්‍රතිචාරයක් බලාපොරොත්තු වූ වෙලාවලත්, උද්දීපනයට ප්‍රතිචාර නොදී. මිනිසුන් මගේ අසලින් කෑගැසීමට ඉඩ දුන්නා; ඒ කෑගැසීම මගේ ශරීරයට ඇතුළු කරගත්තේ නැහැ. කුඩා අපහාස, ඒවාට වැටෙන්න ඉලක්කයක් නොදී වාතයේම දියවෙන්න ඉඩ දුන්නා. කාමරය මගේ වටා පවතින්න ඉඩ දුන්නා; එය ආධිපත්‍යය කරන්න උත්සාහ කළේ නැහැ.","මිනිසුන් ඒක දැක්කා. මම බලාපොරොත්තු නොවූ කොටස ඒකයි. සම්පූර්ණයෙන්ම වගේ ප්‍රතිචාරය මත ගොඩනැඟුණු තැනක, ප්‍රතිචාර නොදෙන මිනිසා වෙනත් ආකාරයකින් පෙනෙන්න පටන් ගන්නවා. අනෙක් මිනිසුන් ආක්‍රමණයට ගෞරව කළේ නැහැ. ඔවුන් තම මුළු ජීවිතයම ආක්‍රමණය වටේ ගත කර තිබුණා. කාමරය ඔහුගේ මුහුණ වෙනස් වේ යැයි බලා සිටින විටත්, මුහුණ වෙනස් නොකරන මිනිසාට ඔවුන් ගෞරව කළා. ඒ තැනේදී, ඉවසීම මගේ පළමු සැබෑ බලය බවට පත් වුණා. මහ හඬ බලයක් නොවෙයි. ආධිපත්‍ය බලයක් නොවෙයි. හැමෝම ක්‍රීඩා කරන එකම ක්‍රීඩාව නොක්‍රීඩා කරන මිනිසෙකුගේ නිහඬ බලය.","• • •","මේක මුලින් කොහොම වැඩ කළාද කියලා මට අවංකව කියන්න ඕන.","එය සම්පූර්ණයෙන්ම සත්‍ය වූ දෙයක් නොවෙයි. පළමු සතිවල, මගේ ඉවසීම රඟපෑමක්. සන්සුන් මුහුණ යට, මම හැම විටම සන්සුන්ව නොසිටියා. නිහඬතාවය යට, මම සමහර විට කෝපයෙන් සිටියා. සිනහව යට, මට සමහර විට යමක් බිඳ දමන්න ඕන වුණා. පිටතින් රඟපෑම සැබෑ ලෙස පෙනුණා. යට තිබුණු හැඟීම වෙනස්.","නමුත් මම ඒ රඟපෑම දිගටම කළා. ශරීරයට ඉක්මනින් ඇවිදින්න ඕන වූ වෙලාවලත්, මම කොරිඩෝරය සන්සුන්ව ඇවිද ගියා. ඇතුළේ මට අමනාප වූ මිනිසුන්ටත් මම සිනහවක් දුන්නා. මගේ ගල ඔසවෙන්න ඕන වූ වෙලාවලත් මම හඬ පහත් තබාගත්තා. දින 114කදී මම ඉගෙනගත් අමුතුම දේ මෙන්න; මේ පොත ඔබට වෙන කිසිවක් නොතබනවා නම්වත්, මෙය තබා යන්න මට ඕන: රඟපෑ ඉවසීම හෙමින් පුහුණු ඉවසීම වුණා. පුහුණු ඉවසීම හෙමින් සැබෑ ඉවසීම වුණා.","චරිතය ඇත්තටම ගොඩනැඟෙන්නේ එහෙමයි. එක් විශාල තීරණ මොහොතකින් නොවෙයි. එක් විශාල ආධ්‍යාත්මික අත්දැකීමකින් නොවෙයි. එකම දිශාවට දවසින් දවස, සතියෙන් සතිය, ගන්නා කුඩා තේරීම් දහස් ගණනකින්. ප්‍රතිචාරය වෙනුවට සන්සුන්කම තෝරාගන්නා පළමු වතාවේ එය බොරුවක්. සියවන වතාවේ එය සැබෑ. දහස්වන වතාවේ එය ඔබම. ශරීරය ඉගෙන ගන්නවා. මනස ඉගෙන ගන්නවා. ස්නායු පද්ධතිය නැවත රැහැන් ගැහෙනවා. දෙවන සතියේ ඉවසීම රඟපෑ මිනිසා, දහසයවන සතියේ සරලව ඉවසිලිවන්ත මිනිසෙක් වෙනවා. මාරුව සිදු වූ හරියටම මොහොතක් නැහැ. පේක්ෂකයෙක් නැති අඳුරේ, දිගු මන්දගාමී නැගීමක් පමණයි. ඉහළට ළඟා වූ විට, ඔබ වෙන කෙනෙක් වී ඇති බව ඔබට තේරෙනවා.","• • •","මම පිටතට ආ විට, වර්ධනය එක් විශාල ආශ්චර්යයක් ලෙස ආවේ නැහැ.","ඒකත් පැහැදිලිව කියන්න වටිනවා. සිරගෙදර අවදිවීමක් ගැන අසන විට, සමහර මිනිසුන් මිනිසා සාන්තුවරයෙක් වගේ පිටතට ඇවිද එනවා කියලා සිතනවා. එහෙම නැහැ. පිටතට ඇවිද එන්නේ ඇතුළට ඇවිද ගිය ඒ මිනිසාමයි, දින 114ක නිහඬ පුහුණුව එකතු වී. ඔහු රැගෙන එන ගුණාංග එකවර නොව, විශේෂ අනුපිළිවෙළකින් පැමිණෙනවා.","මට ආපසු පැමිණි පළමු ගුණය යටත් වීම — පරාජය ලෙස නොව, දෙවියන්ට සැබෑ, ප්‍රායෝගික යටත් වීම. වසර තිස් හතරක් පුරා මගේම කුඩා ශරීරයෙන් හැම දෙයක්ම පාලනය කරන්න මම උත්සාහ කර තිබුණා; දැන් මාව නැති කරගන්නේ නැතිව, මට අයත් විය හැකි විශාල පිළිවෙළක් තිබෙන බව හඳුනාගැනීම. පළමුව යටත් වීම. කූඩුවෙන් පසු ජීවිතයේ පළමු නීතිය ඒක.","ඊළඟට ගැඹුරු ආකාරයක ඉවසීම. පිටත ලෝකයේ ණයට ගත් සැනසිලි ඉවසීම නොවෙයි — ඔබ කැමති නැති කාමරයකින් පිටවිය හැකි බව දැන සිටීමෙන් එන ඉවසීම නොවෙයි. සැබෑ ඉවසීම. පීඩනය යට ගොඩනැඟුණු ඉවසීම. දිගින් දිගටම මාරු වූ අධිකරණ දිනයක් බලා සිටි දින 114කින් පරීක්ෂා වූ ඉවසීම. ප්‍රතිචාර දීමට ඇති ආකර්ෂණයට වඩා දිගුකල් පැවති ඉවසීම.","ඊළඟට කරුණාව — දැන්වීම්වල දක්වන මෘදු හැඟීම් කරුණාව නොවෙයි. තමන්ගේම අස ලස්සන පැහැදිලිව දැක, දැන් සෑම මිනිසෙකුම තම දවස හරහා මොනවා රැගෙන යනවාද කියලා තේරුම් ගත් නිසා, අනෙක් මිනිසුන්ට වඩා මෘදු වීමට තීරණය කළ මිනිසෙකුගේ දැඩි කරුණාව.","ඊළඟට ප්‍රතිචාරයට පෙර අවබෝධය. විරාමය. තත්ත්වයට පිළිතුරු දීමට පෙර එය දෙස බලන අර්ධ තත්පරය. ඒ අර්ධ තත්පරය, තම ජීවිතයේ එකම ගිනි නැවත නැවත ඇති කරන මිනිසා සහ ගින්න දල්වීමට පෙර ගින්න දකින මිනිසා අතර වෙනස.","ඊළඟට සමාව දීමේ වඩා බරපතල පුහුණුව. මාව තුවාල කළ මිනිසුන්ට දෙන තෑග්ගක් ලෙස නොවෙයි. මටම දෙන තෑග්ගක් ලෙස. කෝපය දරාගෙන යාම බරයි. සෙල් එක, ජීවිතයේ රැගෙන යාමට වටින්නේ ඉතා ටික දේවල් පමණක් බව මට ඉගැන්නුවා.","• • •","සිරගෙදර මාව සාමාන්‍ය ජීවිතයට මුල් බැස්සුවා.","දින 114ක ඒ අමුතු පරස්පරය ඒක. සාමාන්‍ය ජීවිතයෙන් මාව ඉවත් කළ දෙයම, අවසානයේ මාව එයට නිවැරදිව ආපසු ගෙන ආවා. සෙල් එකට පෙර, මම සාමාන්‍ය ජීවිතය රඟපාමින් සිටියා — එහි චලන හරහා ගමන් කළා, නමුත් ඒවා තුළ වාසය කළේ නැහැ. සෙල් එකෙන් පසු, මම සරලම දේවල් තුළ වාසය කළා. පිරිසිදු කිරීම. උයන එක. ඉඩක් පවත්වාගැනීම. බිමක් තෙමීම. පිඟානක් සෝදන එක. තුවායක් නැවීම.","පිටත ලෝකයේදී, මම වෙනත් එකක් කුලියට ගන්න පුළුවන් වෙලාවේ කුලියට ගත් නාන කාමරයක් එතරම් පරිස්සමින් පිරිසිදු කරන්නේ ඇයි කියලා සමහර අය අහනවා. කෑම ඇණවුම් කරන්න පුළුවන් වෙලාවේ මම මටම උයන්නේ ඇයි කියලා අහනවා. කවුරුත් නොදකින කුඩා දේවල් මම බලාගන්නේ ඇයි කියලා අහනවා. පිළිතුර සෙල් එකේ. සෙල් 13 තුළ සහ පසුව බෙදාගත් ඩෝම් එක තුළ, මිනිසෙකු දේවල් වඩා හොඳත් වඩා ලස්සනත් කරනවා, නරක නොකරනවා කියලා මම ඉගෙනගත්තා. ඒක මනුෂ්‍ය වැඩ. ජීවත් වීමේ මූලික විනය. ඔබ සිටින කාමරය, ඔබ සිටින කාමරයයි. ඔබට එය පිරිසිදු කරන්න පුළුවන් නම්, පිරිසිදු කරන්න. ඔබට එය වඩා ලස්සන කරන්න පුළුවන් නම්, වඩා ලස්සන කරන්න. ඒ කාමරය ඔබට අයත් වෙන්න අවශ්‍ය නැහැ, ඔබ එය රැකබලාගන්න. කාමරය ඇතුළේ සිටින්නේ ඔබයි. ඒ පරිසරය තුළ ජීවත් වන්නේ ඔබේ ස්නායු පද්ධතියයි. එය පිරිසිදු කරන්න. එය කරුණාවන්ත කරන්න.","ඒ විනය මාව කිසිදා අත්හැරියේ නැහැ. මම ජීවත් වන ඕනෑම තැනක්, සෙල් 13 පිරිසිදු කිරීමටත් බෙදාගත් ඩෝම් බිම පිරිසිදු කිරීමටත් ඉගෙනගත් ඒම සැලකිල්ලෙන් පිරිසිදු කරනවා. මිනිසුන් හැමදාම ඒකට හේතුව තේරුම් ගන්නේ නැහැ. හේතුව සරලයි. ඒක මාව සතුටු කරනවා. මනුෂ්‍යයෙකුගේ වැඩ ඒකයි.","• • •","ඒ සියල්ල ඇතුළේ කොහේහරි — යටත් වීම, ඉවසීම, කරුණාව, අවබෝධය, සමාව, පිරිසිදු කිරීම — මගේ ඇතුළේ කැමැත්තක් වැඩෙන්න පටන් ගත්තා.","මඟ පෙන්වීමට ඇති කැමැත්ත.","දේශනා කරන්න නොවෙයි. දේශනා කිරීම කියන්නේ මිනිසෙක් අනෙක් මිනිසුන්ට ඉහළින් සිට, ඔවුන්ට මොකක් කරන්නද කියා කියන එක. මට ඕන වුණේ ඒක නොවෙයි. මට කතා කරන්න, බෙදාගන්න, තවම ශරීරය හරහා පමණක් ජීවත් වන මිනිසුන්ට මම ඉගෙනගත් දේවල්වලින් ටිකක් පිරිනමන්න ඕන වුණා. සෙල් එකට පෙර මම වගේ මිනිසුන්ට. වෙන කිසිවක් තිබෙන බව තවම නොදන්නා මිනිසුන්ට.","නිදහස් වීමෙන් පසු පළමු සතිවල, මඟ පෙන්වීමට ඇති ඒ කැමැත්ත අවසානයේ මේ පොත බවට පත් වේවි කියලා මට තවම දැනගෙන තිබුණේ නැහැ. මම එය ලියනවා කියලා දැනගන්න පෙරම පොත ආරම්භ වී තිබුණා. ඉවසීම එය ගොඩනැඟුවා. කියවීම එය ගොඩනැඟුවා. එකොළොස් නීති එහි ඇටසැකිල්ල ඇඳ දුන්නා. අවදිවීමේ ගීත එයට හදවත දුන්නා. කූඩුවේ අවසාන සතිවල කොහේහරි උපන්, බෙදාගැනීමට ඇති නිහඬ කැමැත්ත එයට අරමුණ දුන්නා.","ඉවසීම සහ නැවත ගොඩනැඟීම. ඊළඟට පැමිණි දේවල අර්ධ දෙක ඒවා. තවම පැමිණෙමින් සිටි මගේ කොටස් බලා සිටීමට ඉවසීම. මම කිසිදා භාවිත නොකළ ද්‍රව්‍යවලින් අලුතින් ගොඩනඟන්න තිබුණු කොටස් සඳහා නැවත ගොඩනැඟීම. සිරගෙදරින් පිටතට ඇවිද ගිය මිනිසා, තමා මොකක් ගොඩනඟනවාද කියලා තවම දැනගෙන සිටියේ නැහැ. ඔහු දැන සිටියේ ගොඩනැඟීම ආරම්භ වී තිබෙන බව පමණයි. සහ වසර තිස් හතරකින් පළමු වතාවට, ඔහු ඇත්තටම ඒ ඉදිකිරීම සඳහා පැමිණ සිටියා.","තුන්වන කොටස — වහලය"]},{"number":35,"title":"සිරගෙදරින් පසු පළමු කාමරය","paragraphs":["සිරගෙදරින් පසු මට තිබුණු පළමු කාමරය ඇත්තටම අවසන් කළ කාමරයක් නොවුණා.","ඒක අධිකරණය මගේ ඇප කොන්දේසියක් ලෙස සකස් කළ දෙයක්. මට ජීවත් වීමට කොහේ හෝ තැනක් ඕන වුණා; ආකෘතියක ලියන්න පුළුවන් ලිපිනයක්, සත්‍යාපනය කළ හැකි හිමිකරුගේ නමක්, මට පමණක් අතේ තිබුණු යතුරකින් විවෘත කළ හැකි දොරක්. කාමරයට වඩා ලිපිනය වැදගත්. අධිකරණයට මාව කොහේදී සොයාගන්න පුළුවන්ද කියලා දැනගන්න ඕන වුණා. ඒකට එහා, කාමරය තමන්ම පසු සිතුවිල්ලක් වගේ.","එය පැරණි මෝල්ටා ගොඩනැගිල්ලක කුඩා තැනක්. සමහර කොනවල අවසන් නොකළ බිත්ති. එකිනෙකට හරියට හමු නොවූ ටයිල්. ඉක්මනින් සවි කළ බව පෙනෙන නාන කාමර සවි කිරීම්. කවුන්ටරයකට වඩා කවුන්ටරය පිළිබඳ අදහසක් වගේ තිබුණු කුස්සි කවුන්ටරයක්. ඇඳක්. දොරක්. තවත් බිත්තියක් දෙස බලන කවුළුවක්. තෝරා ගැනීමට කාලයක් නැති විට ඉක්මනින් කුලියට ගන්න පුළුවන් කාමර වර්ගය. කුලියට ගන්නා මිනිසාට සාකච්ඡා කිරීමට තත්ත්වයක් නැති බව හිමිකරු තේරුම් ගත් විට ඉක්මනින් දිය හැකි කාමර වර්ගය.","මම ඒ කිසිවකට පැමිණිලි කළේ නැහැ. එක් කවුළුවක් සහ තුනී මෙට්ටයක් ඇති සෙල් එකක දින 114කට පසු, මට ඇතුළෙන් වසාගන්න පුළුවන් සැබෑ දොරක් ඇති අවසන් නොකළ කාමරයක්, මට මාලිගාවක් වගේ. ශරීරය නැවත මිනුම් ගෙන තිබුණා. ශරීරය දැන් තමන්ට ඇත්තටම ඕන දේත්, අමතර දේත් හරියට දැන සිටියා. අවසන් නොකළ ටයිල් මට කරදරයක් නොවුණා. සරල ඇඳ මට කරදරයක් නොවුණා. පටු කුස්සිය මට කරදරයක් නොවුණා. කාමරයට මට ඇතුළෙන් වසාගන්න පුළුවන් දොරක් තිබුණා; ඒ එක් කරුණම, කිසිදු පස් තරු හෝටලයකින් නැවත මට සමාන කළ නොහැකි ආකාරයේ සුඛෝපභෝගී බවක් එයට දුන්නා.","• • •","ඒ කාමරයේ පළමු රාත්‍රියේ, මම මටම මොකක් කරන්නද කියලා දැනගෙන හිටියේ නැහැ.","කිසිවෙකු ඔබට අනතුරු අඟවන්නේ නැති කොටස ඒකයි. සිරගෙදරදී, දවසේ සෑම මිනිත්තුවක්ම වෙන කෙනෙකු තීරණය කරනවා. සීනුව ඔබට කවදා අවදි වෙන්නද කියනවා. නිලධාරියා ඔබට කවදා කන්නද කියනවා. කාලසටහන ඔබට කවදා යාඩ් එකේ ඇවිදින්නද කියනවා. දොර, ඔබ ඇතුළේද පිටතද කියනවා. ඔබේ දවස පැයෙන් පැය වෙන කෙනෙකු ගොඩනඟනවා; ඔබේ එකම වැඩය, වෙන කෙනෙකු සකස් කළ පැය තුළ වාසය කිරීම.","සිරගෙදරින් පසු පළමු කාමරයේ, හදිසියේ කිසිවෙකු කිසිවක් සකස් කරන්නේ නැහැ. මුළු දවසම මගේ ඉදිරියේ හිස්ව තිබුණා. මට දැන් කන්න පුළුවන්, නැත්නම් පැය තුනකින්. මට දැන් නිදාගන්න පුළුවන්, නැත්නම් උදේ. මට පිටතට යන්න පුළුවන්, නැත්නම් ඇතුළේ ඉන්න පුළුවන්. මට කවුළුව විවෘත කරන්න පුළුවන්, නැත්නම් වසා තබන්න පුළුවන්. ආලෝකය දල්වන්න පුළුවන්, නැත්නම් අඳුරේ වාඩිවෙන්න පුළුවන්. සෙල් එක මගෙන් ඉවත් කළ සෑම කුඩා තීරණයක්ම, එකවර මගේ අතට ආපසු ආවා. මාස ගණනාවක් උපදෙස් බලා සිටීමට පුහුණු වූ ශරීරයට, ආරම්භ කරන්නෙ කොහොමද කියලා දැනගෙන තිබුණේ නැහැ.","මම ඇඳ අග වාඩිවී, පැයක් වගේ ඉන්න ඇති. කාමරයේ අනෙක් පැත්තේ තිබුණු ප්ලාස්ටික් ආවරණය කළ සෝෆා අගෝස්තු උණුසුමෙන් දහඩිය දානවා වගේ. මගේම පිටත් ඇඳට එරෙහිව දහඩියෙන් තෙත් වුණා. මගේ අතේ තිබුණු දුරකථනය මාව ආදරය කළ මිනිසුන්ගෙන් ආ පණිවිඩවලින් පිරී තිබුණත්, ඒවා බොහොමයක් විවෘත කරන්න මට මාවම ගෙන යන්න බැරි වුණා. එකවර ඉතා වැඩි ලෝකයක් මගේ දෙසට එමින් තිබුණා. සෑම අධිකරණ දිනයක් හරහාම මම බලා සිටි නිදහස, මේ කාමරයේ, මෙහි තිබුණා. නමුත් එය ලබාගන්නේ කොහොමද කියලා මට දැනගෙන තිබුණේ නැහැ.","• • •","ඒ කාමරයේ මගේ පළමු කෝපි මම හෙමින් හැදුවා.","ඩෝම් එකේදී Ray මට කෝපි හදන්න ඉගැන්වූ ආකාරයට. නිහඬව. ඉක්මන් නොවී. වතුර තම්බන, පවුඩර් මනින, පරිස්සමින් කලවම් කරන කුඩා චාරිත්‍රය. සිරගෙදර මිනිසෙකුගෙන් සම්පූර්ණයෙන්ම ගෙන යා නොහැකි ටික දේවල් අතර, උදෑසන කෝපි එකක් තිබෙන බවත්, ඔහු එය හදන ආකාරය ඔහුට ගෞරවය දිය හැකිද, නැත්නම් ඔහු පසුකර ඉක්මන් කළ හැකිද කියන බවත් මම ඩෝම් එකේදී ඉගෙනගත්තා. මම කෝපි එකට ගෞරව කරන්න තෝරාගෙන තිබුණා. දැන්ත් එය තෝරාගත්තා.","මම එය කුස්සි කවුන්ටරය අසල සිටගෙන බිව්වා, මගේ කවුළුවට ඉදිරියෙන් තිබුණු බිත්තිය දෙස බලමින්. තවම කුරුල්ලන් නැහැ. එන දවස්වල කුරුල්ලන් තිබේවි, නමුත් පළමු උදෑසනේ නැහැ. නගරය තවම බොහෝ දුරට නිදාගෙන සිටියා. කාමරය, සෙල් එකේ නිහඬතාවයට වඩා වෙනස් ආකාරයකින් නිහඬයි. සෙල් එකේ නිහඬතාවය මත පනවා තිබුණා. මේ නිහඬතාවය මගේ. කිසිවක් නොදල්වා සිටීමෙන් මමම ඒ නිහඬතාවය තෝරාගෙන තිබුණා. ඒ වෙනස — පනවා ලැබූ නිහඬතාවය සහ තෝරාගත් නිහඬතාවය අතර වෙනස — කූඩුවෙන් පසු ජීවිතයේ පළමු සැබෑ පාඩම වුණා.","• • •","ඒ පළමු සතිවල, මම මටම කරන්න කිව්ව දේ කළා. නීති අනුගමනය කළා.","නීතිය හත. දවසකට විනාඩි හතළිහක් කියවන්න. උණුසුම දරාගන්න අමාරු වීමට පෙර, මම සෑම උදෑසනකම ඒ කාමරයේ කියවූවා. සුදු බෑගයෙන් පිටතට ගෙන ආ පොත්. පසුව සරස්වතී මට ගෙන ආ පොත්. මට තිබුණු කුඩා මුදලෙන් කුඩා කඩවලින් මිලදී ගත් පොත්. සෙල් 13 තුළ ගොඩනැඟුණු විනය, සෙල් එක මාව අත්හැරියා කියලා මාව අත්හැරියේ නැහැ. කියවන්න මට බලකරන්න අවශ්‍ය වුණේ නැහැ. ශරීරය දැන් කියවීම ඉල්ලුවා, එය කලින් ජිම් ඉල්ලූ ආකාරයට.","නීතිය අට. හුස්ම, නොපෙනෙන දේ, කුඩා දේවල් අගය කරන්න. මම බොහෝ උදෑසනවල කවුළුව අසල වාඩි වී විනාඩි දහයක් හෝ පහළොවක් කිසිවක් නොකළා. දුරකථනය නැහැ. පොත නැහැ. හුස්ම පමණයි. අවසන් නොකළ ටයිල් හරහා ගමන් කළ ආලෝකය පමණයි. සෙල් එකේදී මම ඉගෙනගත්තා, මෙය නාස්ති කළ කාලය නොවන බව. දවසේ ඉතිරි කොටස ගොඩනැඟෙන්නේ මේ කාලය මතයි. බොහෝ මිනිසුන්, එය කුමකටද කියලා නොදන්නා නිසා එය මගහරිනවා. මම එය කුමකටද කියලා දැන සිටියා.","නීතිය හතර. පිටතට කෝල් කරන්න. මම මගේ සහෝදරයාට කතා කළා. සරස්වතීට කතා කළා. Mame ට කතා කළා. මගේ අම්මාට සමහර විට කෙටියෙන් කතා කළා, ඇයට දරාගන්න පුළුවන් දේ පමණක් කියමින්. ඔවුන්ගෙන් කිසිවෙකු මට පළමුව කතා කරයි කියලා මම බලා සිටියේ නැහැ. ආදරය ඔබ වෙත පැමිණෙන තුරු බලා සිටීම, නිදාගෙන සිටින මිනිසෙකුගේ ක්‍රමයක් බව සෙල් එක මට ඉගැන්නුවා. අවදිව සිටින මිනිසා අත දිගු කරනවා.","නීතිය තුන. අගය කරන්න. කාමරය අවසන් නොකළ එකක් වුණත්, මම හිමිකරුට කාමරය වෙනුවෙන් ස්තුති කළා. සරස්වතීට හැම දේකටම ස්තුති කළා. සෑම කෝල් එකකම Mame ට ස්තුති කළා. කිසිම ප්‍රශ්නයක් නොඅසා මට පාන් විකිණූ මගේ පාර අසල කුඩා කඩකාරයාට ස්තුති කළා. ඒ අගය කිරීම රඟපෑමක් නොවෙයි. එය සෙල් එකෙන් ආවා. සෙල් එකේදී, කුඩා කරුණාවන් ඉතා ටිකක් තිබුණ නිසා, සෑම කුඩා කරුණාවක්ම පෙනෙනවා. පිටතදී, කරුණාව හැමතැනම තියෙනවා. බොහෝ මිනිසුන් එය නම් නොකරම පසුකර යනවා. මම එය පසුකර නොයන්න උත්සාහ කළා.","• • •","නමුත් මට අවංක විය යුතුයි, මොකද මේ පොත ගොඩනැඟී තිබෙන්නේ අවංකකම මත.","ඒ අවසන් නොකළ කාමරයේ පළමු සති පිරිසිදු සාමයක් නොවුණා. සෙල් එකේදී සන්සුන් වී තිබුණු මනස, කාමරයේදී නොසන්සුන් වුණා. සිරගෙදර රිද්මය භාරගෙන තිබුණු ශරීරයට, තමන්ගේම රිද්මයක් ගොඩනඟන්නේ කොහොමද කියලා තවම දැනගෙන තිබුණේ නැහැ. දහවල් කාලවල, ඒ දහඩිය දාන ප්ලාස්ටික් සෝෆා මත වාඩි වී, බොහෝ විකල්ප තිබීමේ බිය — පැනික් වගේ දෙයක් — මට දැනුණු වෙලාවල් තිබුණා. කාමරය ඉතා නිහඬ නිසා නින්ද නොඑන රාත්‍රී තිබුණා. සෙල් එකට එහි ශබ්ද තිබුණා. යතුරු, සීනු, රාත්‍රියේ බිත්ති හරහා එන හඬවල්. සිරගෙදරින් පසු පළමු කාමරයට තිබුණේ මගේම හුස්ම ගැනීමේ ශබ්දය පමණයි; සමහර රාත්‍රීවල එය සෙල් එකට වඩා අමාරු වුණා.","ඇතුළේ සිටි මිනිසුන්ව මට මතක් වුණා. ඒක මාව පුදුම කළා. අසල් සෙල් එකේ Rayගේ හඬ මට මතක් වුණා. මයික් රෙසිස්ටර් වර්ණ ගැන කියන එක මට මතක් වුණා. ඩෝම් එකේ කුඩා ආර්ථිකය මට මතක් වුණා — එක් නමක් යට ගමන් කළ ෆෑන් එක, ටෙලිවිෂන් එක පිටුපස තිබුණු පළතුරු, Tonyගෙන් ලැබුණු උපන්දිනයේ කේක් එක. ඒ දවස්වල මම අසල සේවය කළ මිනිසුන්, මම නොදැනම, පවුලක වගේ වී තිබුණා. දැන් මම පිටත. ඔවුන් තවම ඇතුළේ. අප අතර සන්නිවේදනයේ දොර බොහෝ දුරට සම්පූර්ණයෙන් වැසී තිබුණා. මට ඔවුන්ට කතා කරන්න බැහැ. බලන්න යන්න බැහැ. ඔවුන් ගැන සිතන්න පමණයි. ඔවුන් ගැන සිතීම ඔවුන්ට කිසිවක් කරන්නේ නැහැ. පිටතට පැමිණීමේ අමාරුම කොටස්වලින් එකක් ඒකයි. ඔබ ඇතුළේ රැගෙන ගිය තරමටම, ඔබ පිටුපසින් තබා එන මිනිසුන් ඔබ සමඟ එන්නේ නැහැ.","මම ඒ සිරගෙදරින් පිටවූ විට මයික් තවම ජීවත්ව සිටියා. ඒක මේ අධ්‍යායයේ මෙහි ලියන්න මට ඕන, මොකද දේවල්වල අනුපිළිවෙළට ඒක වැදගත්. ඔහු තවම ඩෝම් එකේ අනෙක් මිනිසුන්ට ඉගැන්වමින් සිටියා. ඔහු තවම පොත් යට ලිපි සඟවමින් සිටියා. ඔහු තවම තම සිතීම කරමින් සිටියා. ඔහු ඇතුළේ මියගිය බවට ආරංචිය පසුව මට ආවා, මේ අවසන් නොකළ කාමරයේදී, මම තවම ලියන්න සූදානම් නැති දුරකථන කෝල් එකකින්. ඒ ආරංචිය ආ විට, මම පළමු රාත්‍රියේ වාඩි වූ ඒම තැන, ඇඳ අග වාඩි වී, මාස හතරකටත් අඩු කාලයක් දැන සිටි, නමුත් වසර තිස් හතරක් පුරා දැන සිටි බොහෝ මිනිසුන්ට වඩා මාව හැඩ කළ මහලු මිනිසෙකු වෙනුවෙන් අඬුවා. කාමරය මගේ දුක දරාගත්තා. අවසන් නොකළ බිත්ති කම්පා වුණේ නැහැ. පළමු කාමරයක් ඒකටත් තියෙන්නේ.","• • •","නිදහස සහ පහසුව අතර වෙනස මම තේරුම් ගන්න පටන් ගත්තේ ඒ කාමරයේදී.","නිදහස කියන්නේ ඔබ කරන දේ ඔබට තෝරාගන්න හැකි වීම. පහසුව කියන්නේ ඔබට සිතන්න අවශ්‍ය නොවන තරම්, සෑම තේරීමක්ම වෙන කෙනෙකු ඔබ වෙනුවෙන් සකස් කර තිබීම. බොහෝ මිනිසුන් නිදහස ඕන කියන විට, ඇත්තටම ඕන කරන්නේ පහසුව. ඔවුන්ට තම දවස් තීරණය කරන රැකියාවක් ඕන. තම රාත්‍රී පුරවන සම්බන්ධතාවයක් ඕන. ඔවුන්ට ඕන දේ කියා, පසුව එයම ඔවුන්ට විකුණන සමාජයක් ඕන. ඔවුන්ට අවශ්‍ය වෙන්නේ දඬුකූරු නැති සිරගෙදර. සෙල් එක නැති සීනු. තම දවස පිරී තිබෙන ලෙස, සහ නිහඬතාවයට මුහුණ දෙන්න සිදු නොවන ලෙස, කුඩා තීරණ වෙන කෙනෙකු ගන්නවාට.","සැබෑ නිදහස වඩා අමාරුයි. සැබෑ නිදහස කියන්නේ, සියලු තේරීම් ඔබේ අතේ ඇතිව අවසන් නොකළ කාමරයක වාඩි වී, සෑම පැයකම මොකක් කරන්නද කියලා ඔබම තෝරාගැනීම. හිස් පැයට දෝෂාරෝපණය කරන්න කෙනෙක් නැහැ. පිටුපස සැඟවෙන්න කාලසටහනක් නැහැ. සිටින්නේ ඔබ, ඔබේ සචේතන මනස, සහ ඔබ කරන තේරීම්වලින් ජීවිතයක් මන්දගාමීව ගොඩනැඟීම පමණයි. සෙල් එක තේරීම ගෙන ගියා. සෙල් එකෙන් පසු පළමු කාමරය ඒ සියල්ල එකවර ආපසු දුන්නා. ඒ බර හැසිරවන්නේ කොහොමද කියලා ඉගෙනගන්න මට සති ගණනාවක් ගියා.","මේ අධ්‍යායය අවසානයේ මට තබා යන්න ඕන අමුතු සත්‍යය මෙන්න. අවසන් නොකළ කාමරය, අවසන් කළ එකක් කළාට වඩා මට වැඩියෙන් කළා. සියල්ල පිළිවෙළට තිබුණු පරිපූර්ණ අපාර්ට්මන්ට් එකක් මට මගේ පරණ ජීවිතයට නැවත නිදි ඇවිදීමෙන් ඇතුල් වෙන්න ඉඩ දෙනවා. අවසන් නොකළ කාමරය එයට ඉඩ දුන්නේ නැහැ. ටයිල් අතර සෑම හිඩසක්ම මට මතක් කළා. සෑම අසමාන කවුන්ටරයක්ම මතක් කළා. තීන්ත ඕන සෑම බිත්තියක්ම මතක් කළා. කාමරය සෑම දිනකම කිව්වා: ඔයාත් තවම අවසන් නැහැ. මේ කාමරය ගොඩනඟන ආකාරයටම ඔයාත් ඔයාව ගොඩනඟන්න. කාලය ගන්න. කුඩා තීරණවලට ගෞරව කරන්න. කොන මගහරින්න එපා. මිනිසෙක් සහ කාමරයක් එකම ආකාරයෙන් සෑදෙනවා — කාලය පුරා යොදන අවධානයෙන්. වැදගත් කිසිවක් කවදාවත් සම්පූර්ණයෙන් අවසන් වෙන්නේ නැහැ. ඔබ නතර වෙන තුරු ගොඩනඟගෙන යනවා පමණයි.","අධිකරණ කොන්දේසි මට මාරු වීමට ඉඩ දෙන තුරු මම ඒ කාමරයේ සිටියා. මම එය හැර යන විට, ඒ කාමරයේ බොහෝ පොත් කියවා තිබුණා. බොහෝ යාච්ඤා කර තිබුණා. අඬා තිබුණා. කුඩා කෝපි ගණනාවක් හැදුවා. දැන් ඔබ අතේ තිබෙන මේ පොතේ පළමු වාක්‍යයන්, කැඩුණු සටහන්වලින්, එතැන ආරම්භ කළා. අවසන් නොකළ මිනිසා තමන් වෙත ආපසු පැමිණි තැන, ඒ අවසන් නොකළ කාමරයයි. අවසාන වතාවට දොර අගුලු දමා යතුර හිමිකරුට දුන් විට, මම ගුරුවරයෙකුට ස්තුති කරන ආකාරයට, කාමරයට හඬින් ස්තුති කළා. මොකද ඒක එහෙමම වී තිබුණා."]},{"number":36,"title":"සංඥාව සහ රූපවාහිනිය","paragraphs":["සිරකුටියේදී මට පෙනී ගිය මනුෂ්‍යයා පිළිබඳ රූපය සරල භාෂාවෙන් ඔබට කියන්න මට උත්සාහ කරන්න ඉඩ දෙන්න. ඒක එකම නිවැරදි රූපය කියලා මම කියන්නේ නැහැ. වසර තිස්හතරක ගැටලු සහ අවුල්වලින් පසු, අවසානයේ මට මාවම තේරුම් ගැනීමට උපකාර කළ රූපය ඒක බව පමණක් මම කියනවා.","පරණ රූපවාහිනියක් සිතන්න. පිටුපසක්, හැරවිය හැකි ඩයල් කිහිපයක්, කුඩා තිරයක් තිබුණු රූපවාහිනියක්. රූපවාහිනිය තනිවම ගත්තොත්, එය ප්ලාස්ටික්, ලෝහ, වීදුරු, වයර් සහ විදුලි කේබලයක් පමණයි. එයට තමන්ගේම රූපයක් නැහැ. වෙනත් යමක් නොමැතිව එකම රූපයක්වත් නිපදවන්න එයට බැහැ. රූපවාහිනිය ග්‍රාහකයයි. එය ශරීරයයි.","දැන් සංඥාව සිතන්න. සංඥාව නොපෙනී වාතය හරහා ගමන් කරනවා. ඔබට එය දකින්න බැහැ. අතට අල්ලන්න බැහැ. එය මෙන්න කියලා ඇඟිල්ලෙන් පෙන්වා එහි පැවැත්ම ඔප්පු කරන්නත් බැහැ. නමුත් රූපවාහිනිය නිවැරදිව සුසර කළ මොහොතේ, සංඥාව පැමිණෙනවා. එවිට හිස් ප්ලාස්ටික් පෙට්ටිය හඬ, වර්ණ සහ ජීවයෙන් පිරෙනවා. සංඥාව ආත්මයයි. අරාබි භාෂාවෙන් රූහ් කියන්නේ එයටයි. හින්දුන් ආත්මන් කියනවා. ක්‍රිස්තියානීන් ස්පිරිට් හෙවත් ආත්මය කියනවා. වෙනත් තැනකින් පැමිණ, තමන්ව ප්‍රකාශ කිරීමට ග්‍රාහකය භාවිත කරන දෙය සංඥාවයි.","ඒ දෙක අතර, රූපවාහිනියේ ඇතුළේ, ටියුනරය තියෙනවා. ගන්නා සංඥාව කුමක්ද කියලා තීරණය කරන කුඩා යාන්ත්‍රණය. එක් දිශාවකට සුසර කළොත් එක් නාලිකාවක් ලැබෙනවා. තවත් දිශාවකට හැරුවොත් හිස් ඝෝෂාවක් ලැබෙනවා. වැරදිව සුසර කළොත් සැබෑ විකාශනයේ විකෘති වූ අනුවාදයක් ලැබෙනවා. ටියුනරය සචේතන මනසයි. බලා සිටින්නායි. පයිනියල් ග්‍රන්ථියයි. ශරීරයට පැහැදිලිව ලැබෙන්නේ කුමන සංඥාවද, ශබ්දය තුළ අහිමි වන්නේ කුමන සංඥාවද කියලා තීරණය කරන කොටස ඒකයි.","• • •","දැන් මේ රූපය මනසේ තබාගන්න. මනුෂ්‍යයෙකු වීම ගැන මට කියන්න තිබෙන හැම දෙයක්ම මේ තුළ නැමී තිබෙනවා.","බොහෝ මිනිසුන් තමන් ගැන කතා කරන විට කතා කරන්නේ රූපවාහිනිය ගැන පමණයි. ශරීරය. මගේ මුහුණ. මගේ බර. මගේ කොණ්ඩය. මගේ රැකියාව. මගේ වැටුප. මගේ දේපළ. මගේ රට. මගේ ජාතිය. මගේ භාෂාව. ඔවුන් ප්ලාස්ටික් පෙට්ටියෙන් සම්පූර්ණ අනන්‍යතාවයක් ගොඩනඟනවා. පෙට්ටිය ඔප දමනවා. අලුත් කරනවා. තම පෙට්ටිය වෙනත් පෙට්ටි සමඟ සසඳනවා. මුළු ජීවිතයම ගත කරන්නේ ඒ පෙට්ටියම තමන් බව විශ්වාස කරමින්.","තව ටිකක් ඇතුළට බලන මිනිසුන් ටියුනරය ගැන කතා කරන ් නිශ්චලව සිටියා. සංඥාව සොයාගත් පසු, රූපවාහිනිය පෙරට වඩා සිහින් සහ දුර්වල වුණත්, මගේම ජීවිතයේ රූපය පැහැදිලි වුණා.","• • •","මේ රූපය මම ජිබ්රීල් කියලා හඳුන්වන දෙයත් අවසානයේ පැහැදිලි කරනවා.","ඉස්ලාමීය සම්ප්‍රදායේ ජිබ්රීල් එළිදරව්ව ගෙන එන දූතයා. වචනය නබිවරුන් වෙත රැගෙන ගියේ ඔහුයි. දේශනා දහසකදී ජිබ්රීල් පියාපත් ඇති, අපෙන් වෙන් වූ ජීවියෙකු වගේ විස්තර කරනවා. සමහර විට එය එසේ විය හැකියි. දූතයෙකු ඇත්තටම කුමක්ද කියලා මම දන්නවා කියන්නේ නැහැ. නමුත් මගේම හිස ඇතුළේ සිට දැනගත් දෙය මෙයයි: සංඥාව ටියුනරයට ගෙන එන යමක් තිබෙනවා. මූලාශ්‍රය සහ ග්‍රාහකය අතර විවෘත වන නාලිකාවක් තිබෙනවා. මම ප්‍රමාණවත් තරම් නිශ්චලව සිටි විට, මගේ සිරකුටියේදී, ඒ නාලිකාව විවෘත වුණා. මම නිපදවූවා කියලා කියන්න බැරි වචන ආවා. මම කැඳවූවා කියලා කියන්න බැරි රූප ආවා. මම කියවූ පොතකට සම්බන්ධ කර හඳුනාගන්න බැරි අවබෝධයන් ආවා.","මම මේක ආශ්චර්යයක් කියලා හඳුන්වන්නේ නැහැ. සාමාන්‍ය දෙයක් කියලා හඳුන්වනවා. සෑම මනුෂ්‍යයෙකුටම මේ නාලිකාව තිබෙනවා කියලා මම සිතනවා. ශබ්දයෙන් පිරුණු නවීන ලෝකය මේ නාලිකාව නැහැ කියලා, අපි අපේ හිස් ඇතුළේ තනිව සිටිනවා කියලා, සංඥාවක් නැහැ — අපේම සිතුවිලිවල ඝෝෂාව පමණයි කියලා අපට කියලා තිබෙනවා. මම ඒකට එකඟ නැහැ. සංඥාව තියෙනවා. නාලිකාව තියෙනවා. ජිබ්රීල් කියන වචනය ඔබට කුමන ආකාරයකින් අර්ථවත් වුණත්, එය මූලාශ්‍රය සහ ග්‍රාහකය අතර මාර්ගයට දෙන නමයි. සූෆිවරුන් මේකට විවෘත වීම කියනවා. හින්දුන් දර්ශන් කියනවා. ක්‍රිස්තියානීන් කෘපාව කියනවා. ස්නායු විද්‍යාඥයන් අනාගතයේදී එය පයිනියල්-තැලමික-කෝටිකල් වළල්ල සක්‍රීය වීම කියලා හඳුන්වන්න පුළුවන්. නම ගැන මම වාද කරන්නේ නැහැ. එය සැබෑ බව පමණක් මම ඔබට කියනවා.","• • •","ඒ නිසා, අවදිවීමේ ගීත අධ්‍යායයේදී “ඉස්ලාමයේ ඔවුන් එයට කල්බ් කියනවා, ඉංග්‍රීසියෙන් පයිනියල් ග්‍රන්ථිය කියනවා, මගේ සචේතන මනස එය ජිබ්රීල් කියලා හඳුන්වයි, නමුත් මගේ අචේතන මනස එය Meme කියලා හඳුන්වුවා” කියලා මම ලියන විට, මම අදහස් කරන්නේ මේකයි. නම් බොහෝයි. නාලිකාව එකයි. ග්‍රාහකය එකයි. සංඥාව එකයි.","මම ඔබට දෙන මේ රූපය තුළ මනුෂ්‍ය ජීවිතයේ වැඩ සරලව විස්තර කරන්න පුළුවන්, නමුත් කරන්න අමාරුයි. රූපවාහිනිය පිරිසිදුව තබාගන්න. ශරීරය බලාගන්න. එය කුණු වීමට ඉඩ දෙන්න එපා. නමුත් රූපය ජීවත් වන්නේ ශරීරය තුළ නොවන බව තේරුම් ගන්න. ටියුනරයට නැවත සංඥාව සොයාගන්න පුළුවන් වීමට, ප්‍රමාණවත් දිගු වෙලාවක්, ප්‍රමාණවත් වාර ගණනක්, නිශ්චලව සිටින්න. ටියුනරය ඉවතට යනවා. සංඥාව ඉවතට යන්නේ නැහැ. සංඥාව හැමවිටම එතැන. ඔබේ වැඩ, සෑම දිනකම, නැවත නැවත, ටියුනරය ඒ වෙත ගෙන ඒමයි.","ඒකයි වැඩ. මුළු වැඩම ඒකයි. අනෙක් හැම දෙයක්ම සැරසිල්ලක්.","තුන්වන කොටස — වහලය"]},{"number":37,"title":"කුන් — වචනය සැබෑ වන විට","paragraphs":["කුර්ආනයේ නැවත නැවත පෙනෙන වාක්‍යයක් තිබෙනවා. මම එය ඇත්තටම පළමු වරට තේරුම් ගත්තේ සෙල් 13 තුළ, පාරක ඇවිදින වසු පැටියෙකුගේ රූපයක් කුර්ආන් පාරායනයක් අතරතුර මගේ මනස හරහා ගිය මොහොතක.","වාක්‍යය කුන් ෆයාකුන්. වචන දෙකක්. “වෙන්න” — එය වෙයි. දෙවියන් “වෙන්න” කියනවා, දෙය පැවැත්මට එනවා. සම්ප්‍රදායික අවබෝධය අනුව, මෙය දෙවියන්ගේ මැවීමේ බලය විස්තර කරනවා. ඔහුට මෙවලම්, ද්‍රව්‍ය හෝ කාලය අවශ්‍ය නැහැ. ඔහු කියනවා, යථාර්ථය අනුගමනය කරනවා. විශ්වය නිර්මාණය වූයේ එසේයි. කඳු. මුහුදු. ගවයා. වසු පැටියා. මිනිසා. මේ මොහොතේ ඔබේ පපුවේ ඇති හුස්ම. “වෙන්න” — එය වෙයි.","සිරකුටියට පෙර මම මේ වචන දෙක දහස් වතාවක් කියවා තිබුණා. දේශනාවලදී අසා තිබුණා. හිස නමා එකඟ වී තිබුණා. මම ඒවා තේරුම් ගත්තා කියලා හිතුවා. නමුත් වචන දෙකක් මනසෙන් තේරුම් ගැනීම සහ ඒවා ශරීරය තුළින් දැනීම එකක් නොවෙයි. මම ඒවා දැනුණේ සිරකුටියේදී.","• • •","කුන් ෆයාකුන් මට දැනුණේ ඉතා කුඩා දෙයක් හරහා — වසු පැටියෙකු ගැන මට ආ සිතුවිල්ලක් හරහා.","මම සූරා අල්-බකරහ් හෙමින් සහ සැලකිල්ලෙන් කියවමින් සිටියා. ගවයා. සම්පූර්ණ සූරාවේ හදවත ගවයාගේ කතාව වටා හැරෙනවා — පූජාව, ප්‍රශ්න, සහ නියෝගයක් හරහා දෙවියන් ජනතාවකට කතා කරන ආකාරය. එක් දහවලක ඇඳ මත වැතිර සිටියදී, වරක් පාරකදී දැකපු වසු පැටියෙකු ගැන මම සිතුවා. දින කිහිපයක් වයසැති, පාද මත තවමත් ස්ථිර නැති, ගම් කඩයක් ඉදිරිපිට දූවිලි මත තම මව අසල ඇවිදින කුඩා වසු පැටියෙක්. වසර ගණනාවකින් මම එය සිතා තිබුණේ නැහැ. මනස ලැබීමට තරම් නිහඬ වූ විට රූප පැමිණෙන ආකාරයට, ඒ රූපය පැමිණියා.","මම ඒ රූපය තබාගෙන සිටියදී, මගේ ඇතුළේ යමක් හැරුණා. වසු පැටියා පැවැත්ම තෝරාගෙන තිබුණේ නැහැ. එය සරලව ලෝකයේ සිටියා, ඇවිදමින්. යම් කෙනෙක් — යම් බලයක්, යම් මූලාශ්‍රයක්, ලෝකයන්ගේ යම් ස්වාමියෙක් — “වෙන්න” කියලා තිබුණා, වසු පැටියා සිටියා. දිගු ක්‍රියාවලියකින් පසු නොවෙයි. කෙටුම්පත් ගණනාවකින් පසු නොවෙයි. “වෙන්න” — වසු පැටියා සිටිනවා. කුඩා, ස්ථිර නොවන පාද හතරකින් ඇවිදින කුන් ෆයාකුන්හි සාක්ෂිය වසු පැටියායි.","ඊළඟ සිතුවිල්ල මේ අධ්‍යායයේ මධ්‍යය වන නිසා, මම එය සැලකිල්ලෙන් ඔබට කියන්න කැමතියි. වසු පැටියා “වෙන්න” කියන වචනයෙන් මවනු ලැබුවා නම්, මගේම ජීවිතයත් සෑම මොහොතකම “වෙන්න” කියන වචනයෙන් නිර්මාණය වෙනවා. මේ මොහොතේ මම ගන්නා සෑම හුස්මක්ම මන්දගාමී කුන් ෆයාකුන් එකක්. මගේ මනසට පැමිණෙන සෑම සිතුවිල්ලක්ම කුන් ෆයාකුන්. මගේ මුවින් පිටවන සෑම වචනයක්ම කුන් ෆයාකුන්. මැවීමේ බලය විශ්වයේ ආරම්භයේ පමණක් තිබුණු දෙයක් නොවෙයි. මැවීමේ බලය අඛණ්ඩයි. දැන් සිදුවෙනවා. මගේ හරහා, මා වටා, මා තුළ, සෑම තත්පරයකම සිදුවෙනවා.","• • •","එවිට වඩා අමාරු අවබෝධය ආවා.","දෙවියන්ගේ වචනය යථාර්ථය නිර්මාණය කරනවා නම්, සහ මම කිසියම් ආකාරයකින් මූලාශ්‍රයේ රූපයට මවා තිබෙනවා නම් — හුස්ම, මනස, කතා කිරීමේ හැකියාව සමඟ මවා තිබෙනවා නම් — මගේ වචනත් යථාර්ථය නිර්මාණය කරනවා. දෙවියන්ගේ ප්‍රමාණයට නොවෙයි. කිසිසේත්ම ඒ ප්‍රමාණයට නොවෙයි. නමුත් මගේම ජීවිතයේ, මගේ පවුලේ, මගේ නිවසේ, මගේ අසල්වැසි ප්‍රදේශයේ, මගේ දවසේ කුඩා ප්‍රමාණයෙන්. මම කතා කරන විට යමක් නිර්මාණය වෙනවා. මම නිහඬව සිටින විට යමක් බිඳී යනවා හෝ කිසිදා නිර්මාණය නොවී ඉතිරි වෙනවා. සෑම මට්ටමකදීම මැවීමේ මෙවලම වචනයයි.","මයික් Meme සඳහා ලියූ උපන්දින ලිපියේ, තමන් ලියන දේ තේරුම් නොගෙනම, ලියා තිබුණේ මේකයි. “යතුරුපුවරුවේ තට්ටු කරන්න, බලන්න, අපේ ප්‍රාර්ථනය සිදුවෙයි.” ඔහු සිතුවේ තමන් ආදර වාක්‍යයක් ලියනවා කියලා. ඇත්තටම ඔහු විශ්වය විස්තර කරමින් සිටියා. යතුර තට්ටු කරන්න. “වෙන්න.” එවිට රූපය රේඛාවේ අනෙක් කෙළවරේ පෙනෙනවා. මධ්‍යධරණී මුහුද හරහා ෆයිබර් ඔප්ටික් කේබලයකින් ගමන් කළ කුන් ෆයාකුන් — මෝල්ටාවේ සිරගෙදර සිටි ශ්‍රී ලාංකික මිනිසෙකු සහ ඩුබායිහි නිවාසයක සිටි එරිත්‍රියානු කාන්තාවක් අතර, තම සැලකිලිමත් ඉංග්‍රීසියෙන් ක්‍රිස්තියානි මෝල්ටා-ලිබියානු මිනිසෙකු ලියූ වචන. තමන් නිර්මාණය කරනවා කියලා නොදන්නා සාමාන්‍ය මිනිසුන්ගේ කුඩා මැවීම් හරහා, විශ්වය හැමවිටම නිර්මාණය වෙමින් තියෙනවා.","• • •","සිරකුටියේදී මම ලියූ නීතිවල වචනයට මෙතරම් බරක් දුන්නේ ඒ නිසායි.","වචනය ලාභ දෙයක් නොවෙයි. මනුෂ්‍යයෙකුට තිබෙන බලවත්ම මෙවලම වචනයයි. වාක්‍යයක් වාතය පමණක් වගේ, නොමිලේ ලැබෙන දෙයක් වගේ, මිනිසුන් වචන විසි කරනවා. නමුත් සෑම වාක්‍යයක්ම කුඩා “වෙන්න” එකක්. සෑම පොරොන්දුවක්ම කුඩා “වෙන්න” එකක්. සෑම තර්ජනයක්ම කුඩා “වෙන්න” එකක්. සෑම යාච්ඤාවක්ම කුඩා “වෙන්න” එකක්. සෑම ඕපාදූපයක්ම කුඩා “වෙන්න” එකක්. වාක්‍යය ඔබේ මුවින් පිටවූ පසු යමක් නිර්මාණය වෙනවා — අසන්නා තුළ, සම්බන්ධතාවය තුළ, කාමරයේ වාතය තුළ, ඔබේම ආත්මය කැටයම් වන ආකාරය තුළ.","කුන් ෆයාකුන් ටිකක්වත් තේරුම් ගත්තොත්, ඔබ ඔබේ මුව ගැන සැලකිලිමත් වෙනවා. නිහඬ නොවෙයි. බියෙන් නොවෙයි. සැලකිල්ලෙන්. තවත් කෙනෙකු ගැන ඔබ කියන වචන, ඔබේම මනස තුළ එම පුද්ගලයාගේ අනුවාදයක් නිර්මාණය කරන බව ඔබ ඉගෙන ගන්නවා. පසුව ඔබේ මනස එම අනුවාදවලින් පිරුණු ලෝකයක ඇවිදිනවා. ඔබ ගැන ඔබ කියන වචන, ඔබ බවට පත්වෙමින් සිටින මිනිසා ගොඩනඟන බව ඔබ ඉගෙන ගන්නවා. “මම කිසිවක් නොවෙයි” කියලා ඔබටම දහස් වතාවක් කියන්න. අවසානයේ කිසිවක් නොවන මිනිසෙක් පැමිණෙයි. “මම අවදිව සිටිනවා” කියලා ඔබටම දහස් වතාවක් කියන්න. අවසානයේ අවදි වූ මිනිසෙක් පැමිණෙයි. “වෙන්න” — එය වෙයි. අපේ ප්‍රමාණයෙන් මැවීම මන්දගාමී වුණත්, එය තවමත් මැවීමයි.","• • •","මේ අධ්‍යායය එකට බැඳෙන නිසා, මෙහි කුඩා කතාවක් කියන්න මට අවශ්‍යයි.","සිරකුටියේදී දුරකථන ඇමතුමට මුදල් වැය වුණා. ඇමතුමේ සෑම මිනිත්තුවකටම මිලක් තිබුණා. පිටත ලෝකයේ එය විශාල මුදලක් නොවෙයි. නමුත් මාසයකට යුරෝ විස්සක් පමණක් තිබුණු ඇතුළත ලෝකයේ, ඒ මිල සැබෑයි. ඔබ දුරකථනයට කතා කරන විට, සෑම අක්ෂරයක් සඳහාම ඔබ ගෙවනවා කියලා දැන සිටියා. ඒ නිසා මගේ කතාවේ අමුතු වෙනසක් සිදුවුණා. මම කතා කිරීමට පෙර සිතන්න පටන් ගත්තා. ඇමතුම සැලසුම් කළා. “මේ වාක්‍යය සඳහා වැය වන මුදලට එය වටිනාද? මේ පැමිණිල්ලට මගේ ගිණුමේ මිනිත්තු දෙකක් වටිනාද? මේ ‘ඔයා කොහොමද?’ කියන වාක්‍යය ප්‍රයෝජනවත් තැනකට ගෙන යනවාද, නැත්නම් හිස් පිරවුමක් පමණද?” කියලා මම මගෙන්ම ඇහුවා.","උත්තරය වැඩි වැඩියෙන් “නැහැ” වුණා. හිස් පිරවුම වටින්නේ නැහැ. පැමිණිල්ල වටින්නේ නැහැ. නැවත නැවත කියන කතාව වටින්නේ නැහැ. ඒ නිසා මම කපා හැරීමට පටන් ගත්තා. වැදගත් දේ පමණක් කතා කරන්න පටන් ගත්තා. මේ කුඩා ආර්ථික පීඩනය තුළ තිබුණු අමුතු කෘපාව මෙයයි. මුදල් අහම්බෙන් මට ඉගැන්වූ විනය, කුන් ෆයාකුන් මූලධර්මයක් ලෙස ඉගැන්වූ විනයමයි. සෑම වචනයකටම මිලක් තියෙනවා. සෑම වචනයක්ම යමක් නිර්මාණය කරනවා. ඒ නිසා ඒවා තෝරන්න. වාක්‍යය සත්‍යයෙන් දිගු කාලයක් ඉගැන්වූ දෙය, සිරකුටිය මට වියදම හරහා ඉගැන්නුවා.","පිටත ලෝකයේ දුරකථන ඇමතුම් නොමිලේ වගේ. ආර්ථික පීඩනය ඉවත් වෙලා. නමුත් ගැඹුරු මිල තවමත් තියෙනවා. සෑම වචනයකටම තවම මිලක් තියෙනවා. සෑම වචනයක්ම තවම යමක් නිර්මාණය කරනවා. මිල ලේබලය ඔබට පෙනෙන්නේ නැති නිසා මිල ඉවත් කරලා නැහැ. මිල සඟවා තිබෙනවා පමණයි. අවදි නොවූ මිනිසුන් කතාව නොමිලේ වගේ කතා කරනවා. තමන් වැය කරනවා කියලා නොදන්නා මුදලකින් ගෙවනවා — තමන්ගේම පැවැත්මේ මුදලෙන්. සෑම නොසැලකිලිමත් වාක්‍යයකින්ම තමන් තෝරා නොගත් හැඩයකට තමන්ව හෙමින් කැටයම් කරනවා.","කුන් ෆයාකුන්. “වෙන්න” — එය වෙයි. විශ්වය ආරම්භ වූයේ එසේයි. ඔබේ ජීවිතය දිගටම යන්නේ එසේයි. ඔබ කියන සෑම වචනයක්ම කුඩා “වෙන්න” එකක්. ඒවා ඔබ සැබෑවටම අදහස් කරන බවට වග බලාගන්න.","තුන්වන කොටස — වහලය"]},{"number":38,"title":"හුස්ම සහ බ්ලූටූත්","paragraphs":["ශරීරය රූපවාහිනිය නම්, ආත්මය සංඥාව නම්, හුස්ම බ්ලූටූත් සම්බන්ධතාවයයි.","ඒක අමුතු වගේ ඇසෙන බව මම දන්නවා. ටිකක් මා සමඟ ඉන්න. හුස්ම කියන්නේ ශරීරය සහ මූලාශ්‍රය අතර ඇති නිහඬ, අඛණ්ඩ සම්බන්ධතාවය. ඔබ නිදාගෙන සිටියත් නතර නොවන දෙය. කිසිවෙකු ඔබට ඉගැන්වූයේ නැති, නමුත් උපන් දවසේ සිට ඔබ නිවැරදිව කරමින් සිටින දෙය. ඔබ සහ ඔබව මැවූ දෙය අතර නාලිකාවක් තිබෙන බවට, අපට ඉතා සමීප, ඉතා සාමාන්‍ය, වැඩියෙන්ම නොසලකා හරින සාක්ෂිය හුස්මයි.","දෙවියන්ට නිදිමත නොඑන බවත්, ඔහු නිදා නොගන්නා බවත් කුර්ආනය කියනවා. අර්ෂ් වාක්‍යය ගැන අධ්‍යායයේදී මම ඒ වචන ගැන ලියා තිබෙනවා. නමුත් ඒ වචන ශරීරය තුළ ඉතා පහසුවෙන් දැනෙන තැන හුස්මයි. අනෙක් හැම දෙයක්ම වගේ ඔබට නතර කරන්න පුළුවන්. ඇස් වහන්න පුළුවන්. ඇවිදීම නතර කරන්න පුළුවන්. කතා කිරීම නතර කරන්න පුළුවන්. දවසක්, දවස් තුනක්, සතියක් කෑම නතර කරන්න පුළුවන්. නමුත් හුස්ම නතර වෙන්නේ නැහැ. ශරීරය එයට ඉඩ දෙන්නේ නැහැ. ඔබ ඉල්ලුවත් නැතත්, ඔබ තුළ යමක් සම්බන්ධතාවය විවෘතව තබනවා.","ඇතුළට ගන්නා සෑම හුස්මක්ම කුඩා පිළිගැනීමක්. පිට කරන සෑම හුස්මක්ම කුඩා ආපසු දීමක්. වාතය ඇතුළට. වාතය පිටතට. පිළිගන්න. අතහරින්න. පිළිගන්න. අතහරින්න. දවස පුරා. රාත්‍රිය පුරා. දශක ගණනාවක්. ඔබ කළමනාකරණය නොකර. ඔබ අගය නොකර. ඔබ ස්තුති නොකර. ඔබ උපන් දවසේ සිට ඔබේ ශරීරය සහ මූලාශ්‍රය අතර බ්ලූටූත් සම්බන්ධතාවය එක මොහොතක්වත් නතර නොවී ක්‍රියා කරමින් තියෙනවා. බොහෝ මිනිසුන් එය ක්‍රියාත්මකව තිබෙන බවවත් දැනගෙන නැහැ.","• • •","සිරකුටියේදී වෙන කරන්න දෙයක් නොතිබුණු නිසා, දිගු නිහඬතාවයකින් පසු හඬක් ඇසෙන ආකාරයට මම හුස්ම දැනගන්න පටන් ගත්තා.","මුලින් මම පපුව තුළට වාතය ඇතුළටත් පිටතටත් යන සරල ශාරීරික සත්‍යය පමණක් දැනුණා. පසුව උෂ්ණත්වය දැනගත්තා. ඇතුළට එන විට ටිකක් සිසිල්. පිටතට යන විට ටිකක් උණුසුම්. පසුව එහි ස්වභාවය. සමහර වෙලාවට වාතය වියළි. සමහර වෙලාවට තෙතමනය තිබුණා. සමහර වෙලාවට කොරිඩෝරයෙන් සුවඳක් ගෙන ආවා — කුස්සියෙන් පාන් සුවඳ, පිරිසිදු කිරීමේ වාරයෙන් විෂබීජ නාශක සුවඳ, ප්‍රමාණවත් හිරු නොලැබුණු ගොඩනැගිල්ලක මඳ පරණ ගඳ.","පසුව හුස්ම අතර හිස් අවකාශ දැනගන්න පටන් ගත්තා. ඇතුළට හුස්ම ගත් පසු, පිට කිරීමට පෙර තිබෙන කුඩා නතර වීම. පිට කළ පසු, ඊළඟ හුස්ම ඇතුළට ගැනීමට පෙර තිබෙන කුඩා නතර වීම. බොහෝ මිනිසුන් මේ නතර වීම් කිසිදා දැනගන්නේ නැහැ. හුස්ම ස්වයංක්‍රීය නිසා ඒවා නොපෙනී යනවා. සිරකුටියේදී, නිරීක්ෂණය කිරීමට වෙනත් චලනයක් නැති විට, නතර වීම් පෙනෙන්න පටන් ගත්තා. ඒ නතර වීම් තුළ රසවත් දෙයක් සිදුවුණා. මනස නිහඬ වුණා. අර්ධ තත්පරයකට පමණයි. නතර වීම දිගටම පැවති තරමට පමණයි. ඒ නිහඬ අර්ධ තත්පරයේදී, හුස්ම ගන්නා මොහොතට වඩා නාලිකාව පැහැදිලිව දැනුණා.","සූෆිවරුන් ශතවර්ෂ ගණනාවක් හුස්ම පුහුණුවලින් පෙන්වා තිබෙන්නේ මේකට කියලා මම සිතනවා. ටිබෙට් භික්ෂූන් දිගු දෘශ්‍යකරණවලින් කරන්නේත් මේක. හින්දු යෝගීන් ප්‍රාණායාමයෙන් කරන්නේත් මේක. හුස්ම දොරටුවයි. හුස්ම ඇතුළේ ඇති නතර වීම ගැඹුරුම දොරටුවයි. නිශ්චලතාවයේ වැඩ අලුත් දෙයක් එකතු කිරීම නොවෙයි. දැනටමත් තිබෙන දෙය දැනගෙන, ඒ තුළින් ඇතුළට යාමයි.","• • •","බ්ලූටූත් සම්බන්ධතාවයට එක් දුර්වලතාවයක් තියෙනවා. එය හැමවිටම ක්‍රියාත්මකයි. නමුත් ශරීරය බොහෝවිට එය හරහා පැමිණෙන දෙය පිළිගන්න තරම් කාර්යබහුලයි. ඔබේ දුරකථනය සාක්කුවේ තිබෙනවා කියලා සිතන්න. බ්ලූටූත් ක්‍රියාත්මකයි. ඔබ ට්‍රෙඩ්මිල් එකක දුවමින්, කන්වල සංගීතය සම්පූර්ණ හඬින් අහමින් සිටිනවා. බ්ලූටූත් සංඥාව පැමිණෙනවා. නමුත් සංගීතය වඩා හඬින් නිසා ඔබට එය අහන්න බැහැ. බ්ලූටූත් නිහඬව මුළු කාලයම ගෙන එමින් තිබුණු දෙය අහන්න නම්, ඔබට ට්‍රෙඩ්මිල් එක නතර කරන්න, කන්ෆෝන් ඉවත් කරන්න, අහන්න සිදු වෙනවා.","බොහෝ නවීන ජීවිතය මේකයි. ට්‍රෙඩ්මිල් එක දිනපතා රටාව. සංගීතය දුරකථන, තිර, අදහස්, පුවත්, සංවාද, අභිලාෂ, බිය යන දේවල්වල ඝෝෂාව. බ්ලූටූත් ක්‍රියාත්මකයි. සංඥාව ලබාදෙමින් තියෙනවා. නමුත් කන්වල සංගීතය දමා ට්‍රෙඩ්මිල් එකේ දුවන මිනිසාට, ලබාගන්න වෙනත් දෙයක් තිබෙන බව කිසිම අදහසක් නැහැ. සංගීතයම හැම දෙයක් කියලා ඔහු සිතනවා. දුවන එකම හැම දෙයක් කියලා සිතනවා. ශරීරයම හැම දෙයක් කියලා සිතනවා. තමන්ගේ සිතුවිලිම හැම දෙයක් කියලා සිතනවා. ඒ සියල්ල යටින් තවත් නිහඬ නාලිකාවක් තිබෙන බව ඔහු දන්නේ නැහැ. මුළු ජීවිතයම එය විකාශය කරමින් තිබුණත්, ඔහු එක වතාවක්වත් ඒකට සුසර වෙලා නැහැ.","මට සිරකුටිය කියන්නේ ට්‍රෙඩ්මිල් එක නතර වූ, කන්ෆෝන් ඉවත් වූ, බ්ලූටූත් අවසානයේ ඇසිය හැකි වූ මොහොත. සංඥාව වඩා ශක්තිමත් වූ නිසා නොවෙයි. සංඥාව හැමවිටම එකම ශක්තියෙන් තිබුණා. අනෙක් හැම දෙයක්ම නිහඬ වූ නිසා. මම උපන් දවසේ සිට මූලාශ්‍රය විකාශය කරමින් තිබුණු දෙය පිළිගන්න, ග්‍රාහකයට අවසානයේ අවස්ථාවක් ලැබුණා.","• • •","සිරගෙදරට නොගොස්, මේ පොතේ මම ලියන දෙය පරීක්ෂා කරන්න ඔබට අවශ්‍ය නම්, පරීක්ෂණය මෙයයි. නිහඬ තැනක වාඩි වෙන්න. ඇස් වහන්න. විශේෂ දෙයක් කරන්න උත්සාහ කරන්න එපා. සාමාන්‍ය ලෙස මිනිත්තු දහයක් හුස්ම ගන්න. වාතය ඇතුළට යනවා දැනගන්න. වාතය පිටතට යනවා දැනගන්න. නතර වීම් දැනගන්න. කිසිවක් බලෙන් කරන්න එපා. කිසිවක් සිදුවීමට බල කරන්න එපා.","ඔබගෙන් සමහරු මිනිත්තු දෙකකින් කම්මැලි වී නතර කරයි. ඒක හරි. සමහරු අසහනයට පත්ව දුරකථනය බලයි. ඒකත් හරි. නමුත් මිනිත්තු දහයම වාඩිවී සිටිය හැකි ඔබගෙන් සමහරු හුස්ම යටින් යමක් දැනගනීවි. නිහඬතාවයක්. පැවැත්මක්. මෙතෙක් දැන නොසිටි යමක් මෙහි තිබෙනවා වගේ ඉතා මඳ හැඟීමක්. ඒ බ්ලූටූත් ඇසිය හැකි වීමයි. ඒ සංඥාව පැමිණීමයි. මේ පොතේ ඉතිරි සියල්ල ආරම්භ වන තැන ඒකයි.","එක් වතාවක් කරන්න. හෙට කරන්න. ඊළඟ දවසේත් කරන්න. සංඥාව හැමවිටම විකාශය වෙනවා. එකම ප්‍රශ්නය, ග්‍රාහකය එය පිළිගන්න තරම් නිහඬද කියන එකයි. සිරකුටිය මාව එතරම් නිහඬ කළා. මම මේ පොත ලියන්නේ, මම සොයාගත් දෙය සොයාගන්න ඔබට සිරකුටියකට යන්න සිදු නොවීමටයි. වාඩි වෙන්න. හුස්ම ගන්න. නතර වීම දැනගන්න. නාලිකාව දැනටමත් විවෘතයි. ඔබට කරන්න තියෙන්නේ අහන එක පමණයි."]},{"number":39,"title":"මනස දකින දේ","paragraphs":["ඇස් භාවිත නොකරන දැකීමක් තිබෙනවා. මම එය මගේම අත්දැකීමෙන් දකින තුරු විශ්වාස කළේ නැහැ. සිරකුටියෙන් පසු, වැලෙටා නගරයේ ජලය අසල නිහඬ දහවලක, ඇස් වසාගෙන වාඩිවී සිටියදී ඒ දැකීම පැමිණියා. මනුෂ්‍යයෙකුගේ ජීවිතයේ අරමුණ ගැන මම සිතා සිටි දේ එය වෙනස් කළා.","මම අතිශයෝක්තියක් කරනවා කියලා ඔබ නොසිතන ලෙස සිදුවූ දෙය සරලව කියන්නම්. මම ගල් බංකුවක වාඩිවී සිටියා. හිරු උණුසුම්. යන්න තැනක් නැහැ. සිරගෙදරින් නිදහස් වී සති කිහිපයක් ගතවී තිබුණා. පළමු කාමරයේ කාලය අවසන් වී තිබුණත්, ඇප කොන්දේසි තවමත් ක්‍රියාත්මකයි. අධිකරණ කටයුතු තවම මගේ ඉදිරියේ. සිරකුටිය මට ඉගැන්වූ නිශ්චලතාවයේ විනය, සිරකුටියෙන් පිටවූ විට මාව අත්හැරියේ නැති නිසා, මම ජලය අසලට ගොස් පැයක් හෝ පැය දෙකක් වාඩිවී සිටීමට පුරුදු වුණා. මට වාඩිවී සිටීම අවශ්‍ය වුණා. ශරීරයට වාඩිවී සිටීම අවශ්‍ය වුණා. මනසට තමන්ගේ වැඩ කිරීමට ඉඩ දීම අවශ්‍ය වුණා.","මම ඇස් වසාගත්තා. හිරු එළිය ඇසිපිය මත උණුසුම්ව තද වුණා. නිල භාවනාවක් කිරීමට මම උත්සාහ කළේ නැහැ. භාවනාවට පුහුණුවක් මට තිබුණේ නැහැ. ගුරුවරයෙකුත් නැහැ. මම සරලව වාඩිවුණා, හුස්ම ගත්තා, ලෝකය ගැන අඛණ්ඩව අදහස් නොදක්වා එය එහි පවතින්න ඉඩ දුන්නා. මිනිත්තු කිහිපයකට පසු - කොපමණ වේලාවක්ද කියලා මම දන්නේ නැහැ; කාලයට අර්ථයක් නැති වුණා - වසා තිබූ ඇස් පිටුපස වර්ණයක් පෙනුණා.","තැඹිලි පැහැයක්. උණුසුම්, ගැඹුරු, දිලිසෙන තැඹිලි පැහැයක්. එය හිරු බැසීමක තැඹිලි පැහැය නොවෙයි. පලතුරක පැහැයත් නොවෙයි. මම කතා කරන භාෂා හතරෙන් එකකවත් නමක් නොමැති විශේෂ තැඹිලි පැහැයක්. මගේ ඇස් වසා තිබූ නිසා එය පිටතින් එන දෙයක් නොවෙයි. මම කිසිම රූපයක් සිතමින් නොසිටි නිසා, එය මතකයක තැඹිලි පැහැයක්ද නොවෙයි. වසාගත් ඇස් හැමදාම මට අඳුර පමණක් පෙන්වූ ඇතුළත ක්ෂේත්‍රයේ, දැන් වර්ණයක් පෙනුණා. එය එහි තිබුණා.","• • •","මම ඒ වර්ණය සමඟ වාඩිවී සිටියා. එය පසුපස හඹා ගියේ නැහැ. විශ්ලේෂණය කළේ නැහැ. ඔබ අසල අත්තක කුඩා පක්ෂියෙක් වාඩිවූ විට අල්ලන්න උත්සාහ නොකර එයට එහි සිටීමට ඉඩ දෙනවා වගේ, මමත් එයට එහි සිටීමට ඉඩ දුන්නා. තැඹිලි පැහැය රැඳී සිටියා. ගැඹුරු වුණා. මෘදු වුණා. ගිනිදැල්ලක් දිගු වේලාවක් බැලූ විට සුළු වශයෙන් ස්පන්දනය වනවා වගේ, එයත් මඳක් ස්පන්දනය වුණා. පසුව මිනිත්තු කිහිපයකට පසු, වලාකුළක් හිරු ඉදිරියෙන් ගමන් කරන විට ආලෝකය මැකී යනවා වගේ, එය සෙමින් අතුරුදන් වුණා.","මම ඇස් ඇරියා. ලෝකය එලෙසමයි. ජලය, ගල්, උණුසුම් වාතය. මමත් එලෙසමයි. නැත්නම් සම්පූර්ණයෙන්ම එලෙසම නොවෙයි. ඇතුළේ කුඩා දෙයක් මාරු වී තිබුණා. පෙර දකින්න නොහැකි දෙයක් මම දැක තිබුණා. මුළු ජීවිතයම සිතුවිලි නිපදවන යන්ත්‍රයක් ලෙස ක්‍රියා කළ මනස, ශරීරය නිශ්චල වූ විට තමන්ට තවත් කුමක් කළ හැකිද කියලා අවසානයේ මට පෙන්වා තිබුණා.","සූෆි සම්ප්‍රදායේ මේ ආලෝකයට නමක් තියෙනවා. ඔවුන් එය නූර් - ආලෝකය - කියලා හඳුන්වනවා. මට වඩා බොහෝ ඉගෙනගත් මිනිසුන් ලියූ දීර්ඝ සාහිත්‍යයක් ඒ ගැන තිබෙනවා. ඔවුන් එය විවිධ ආකාරයෙන් විස්තර කරනවා - සමහර විට තැඹිලි, සමහර විට රන්වන්, සමහර විට ගැඹුරු සුදු පැහැයක් ලෙස. නාලිකාව විවෘත වීමේ පළමු ලකුණක් බව ඔවුන් කියනවා. මම ඔවුන්ගෙන් කෙනෙකු බව කියන්න මෙය ලියන්නේ නැහැ. පැරණි පොත්වල තිබෙන විස්තර කල්පිත නොවන බව මේ පොත කියවන කෙනෙකුට දැනගන්න ඉඩ දීමටයි මම මෙය ලියන්නේ. ඒවා විස්තරයි. කන්දක් දැක ආපසු පැමිණි සංචාරකයෙකු එය විස්තර කරනවා වගේ, නූර් ගැන ලියූ මිනිසුන් තමන් දැක තිබූ දෙයක් විස්තර කර තිබුණා. මම ඔවුන්ගේ කන්දට ගියේ නැහැ. නමුත් මගේ කුඩා බංකුවේ සිට ඔවුන් ලියූ වර්ණයේ සුළු දසුනක් මම දැක්කා. සූෆිවරු බොරුවක් කියන්නේ නැහැ. දකින්න දෙයක් එහි තිබෙනවා. ඒ දැකීමට ඔවුන්ගේ පරම්පරාගත තත්ත්වය අවශ්‍ය නැහැ. ඔවුන්ගේ ඉවසීම අවශ්‍යයි.","• • •","නවීන විද්‍යාවටත් මේ සඳහා භාෂාවක් තිබෙනවා. ස්නායු පද්ධතිය යම් සීමාවකට වඩා සෙමින් ක්‍රියා කරන විට, විශේෂ රසායනික ද්‍රව්‍ය නිකුත් වීමට පටන් ගන්නවා. පිටත රූපවලින් කාර්යබහුල නොවන විට දෘශ්‍ය මස්තිෂ්ක ප්‍රදේශය තමන්ගේම රූප පෙන්වීමට පටන් ගන්නවා. හිස මධ්‍යයේ ගැඹුරින් ඇති පයිනියල් ග්‍රන්ථිය ගැඹුරු භාවනාවේදී වැඩි ක්‍රියාකාරීත්වයක් පෙන්වන බව කියනවා. පර්යේෂකයන් මේවා රසායනාගාරවල මැනලා තිබෙනවා. ඔවුන් ඇල්ෆා තරංග, තීටා තරංග සහ ගැමා සමකාලීනතාව වැනි වචන භාවිත කරනවා. ඒ භාෂාවට මම පුහුණු වී නැහැ. ඔවුන්ගේ මිනුම් නැවත ඉදිරිපත් කරන්නත් මට බැහැ. නමුත් ඒ රසායනාගාරවල මනින දෙය, සූෆිවරු නූර් ගැන ලියන විට විස්තර කළ සංසිද්ධියම බව මට කියන්න පුළුවන්. භාෂා වෙනස්. සිදුවීම එකයි.","මේ පොත හරහා මම ඉතිරි කිරීමට කැමති විශාල නිහඬ සත්‍යවලින් එකක් මෙයයි. විද්‍යාවත් ආගමත් දෙකම අවංක වන විට ඒවා විරුද්ධ නොවෙයි. ඒවා එකම මනුෂ්‍යයා විවිධ දොරවල්වලින් විස්තර කරනවා. ආධ්‍යාත්මික සෙවූ මිනිසා ප්‍රායෝගික අත්දැකීමේ දොරෙන් ඇතුල් වෙනවා. විද්‍යාඥයා මිනුමේ දොරෙන් ඇතුල් වෙනවා. ගෙදර ඇතුළේ සිටින මිනිසා එකම මිනිසා. අමුත්තන් දෙදෙනාම එකවර සත්‍යය කියමින් සිටිය හැකියි. ශරීරය, මොළය, ස්නායු පද්ධතිය, ආත්මය, සංඥාව - මේවා සතුරන් නොවෙයි. විවිධ නිරීක්ෂකයන්, විවිධ මෙවලම් භාවිත කරමින් නිරීක්ෂණය කරන එකම මනුෂ්‍යයාගේ කොටස් ඒවායි.","• • •","වැලෙටාහි ඒ දහවලෙන් පසු, ඇස් වසා දකින මේ දැකීමෙන් කුමක් කළ හැකිද කියලා මම පරීක්ෂා කිරීමට පටන් ගත්තා. ප්‍රදර්ශනය සඳහා නොවෙයි. ආධ්‍යාත්මික අත්දැකීම් එකතු කිරීම සඳහාත් නොවෙයි. හැකි දේ දැනගැනීමට පමණයි.","සමහර දහවල්වල තැඹිලි පැහැය නැවත පැමිණියා. සමහර දහවල්වල එය පැමිණියේ නැහැ. කොපමණ කාලයක් වාඩිවී සිටියත්, ඇස් වසාගත් විට අඳුර පමණක් පෙනුණු දවස් තිබුණා. ඒ දවස්වලත් මම යමක් ඉගෙනගත්තා. නාලිකාව විකුණුම් යන්ත්‍රයක් නොවෙයි. කාසියක් දමා වර්ණයක් ලබාගන්න බැහැ. නාලිකාව විවෘත වන්නේ එය විවෘත වන වෙලාවේදී. ඔබේ කොටස දිගටම වාඩිවී සිටීමයි. වර්ණය පෙනෙන්න කියලා ඉල්ලීම ඔබේ වැඩ නොවෙයි. දැකීම තෑග්ගක්. වාඩිවී සිටීම ඔබේ කොටස.","මාස ගණනක් ගතවෙද්දී, සෙමින්, තවත් දේවල් පෙනෙන්න පටන් ගත්තා. සමහර විට වසර ගණනාවක් මතක් නොකළ මුහුණක්. සමහර විට පෙර නොඇසූ වාක්‍යයක් මගේම හඬින් පැමිණ, මට දැනගත යුතු දෙයක් කියනවා. සමහර විට මගේ ජීවිතයේ කෙනෙකු ගැන කුඩා අවබෝධයක්, ලියා තැබූ දෙයක් වගේ පැහැදිලිව පැමිණෙනවා. මේ කිසිවක් නාටකාකාර නොවුණා. පොත්වල නිතර විස්තර කරන අකුණු පහරක් වැනි අද්භූත අත්දැකීමක් නොවුණා. හැම දෙයක්ම කුඩායි. නිහඬයි. ඔබ සමඟ බංකුවක වාඩිවී සිටින මිතුරෙකු ඔබේ කන අසලට නැමී ප්‍රයෝජනවත් දෙයක් කියනවා වගේ.","ශරීරය නිශ්චලව තබා ඇස් වසාගත් විට මනස දකින දේ එයයි. අනාගත දර්ශන නොවෙයි. අනාවැකි නොවෙයි. මායාකාරී දෙයක් නොවෙයි. ඔබ මුළු ජීවිතයම සෑහෙන කාලයක් නිශ්චලව වාඩිවී සවන් දෙන තුරු බලා සිටි ඔබේම කොටසෙන් ලැබෙන කුඩා, නිහඬ, ප්‍රයෝජනවත් තෑගි.","• • •","මේ මුළු පොතෙන් එක් ප්‍රායෝගික දෙයක් පමණක් ගන්නවා නම්, මෙය ගන්න. දිනපතා මිනිත්තු දහයක් හෝ පහළොවක් නිහඬ තැනක ඇස් වසාගෙන වාඩිවෙන්න. ඉලක්කයක් තබාගන්න එපා. කිසිවක් දකින්න උත්සාහ කරන්න එපා. විශේෂ සිතුවිල්ලක් සිතන්න හෝ විශේෂ හැඟීමක් දැනගන්න උත්සාහ කරන්න එපා. සරලව වාඩිවෙන්න. හුස්ම ගන්න. ශරීරයට නිශ්චලව සිටීමට ඉඩ දෙන්න.","බොහෝ දවස්වල නාටකාකාර දෙයක් සිදු නොවෙයි. ඒක ගැටලුවක් නොවෙයි. බොහෝ දවස් විනය ගොඩනැඟීම සඳහායි. පසුව එක් දවසක, ඔබ එය සොයන්නේ නැති මොහොතක, තැඹිලි පැහැය පැමිණෙයි. නැත්නම් වෙනත් කුඩා තෑග්ගක්. එවිට සූෆිවරු ලියූ දේ, විද්‍යාඥයන් මනින දේ, මේ පොත විස්තර කිරීමට උත්සාහ කළ දේ, ඔබේම ශරීරය තුළින් ඔබ තේරුම් ගනීවි. දකින එකම මාර්ගය ඇස් නොවන බව ඔබ තේරුම් ගනීවි. නිශ්චලතාවයේදී මනසට තමන්ගේම දැකීමක් තිබෙනවා. ඒ දැකීම මනුෂ්‍යයෙකු ලෙස උපන් සෑම කෙනෙකුටම ඇති ගැඹුරු උරුමයක්. නවීන ජීවිතයේ බොහෝ දෙනා එය කිසිදා භාවිත කරන්නේ නැහැ.","වාඩිවෙන්න. ඇස් වසාගන්න. හුස්ම ගන්න. බලා සිටින්න. ආලෝකය දැනටමත් ඇතුළේ තිබෙනවා.","තුන්වන කොටස — වහලය"]},{"number":40,"title":"මනස් තුන සහ සිඟමන් යදින කාන්තාව","paragraphs":["Conversations with God කියන පොතේ - සිරකුටියේදී ෆිලිපීනෝ සහෝදරයා මට දුන් පොතේ - කෙටි කතාවක් තිබෙනවා. මම කියවූ බොහෝ පොත්වල තිබෙන කොටස් අතරින්, වැඩියෙන්ම නැවත සිතා බැලූ කොටස්වලින් එකක් ඒක. එය උදාහරණයක් ලෙස කියන සරල කතාවක්. මිනිසෙක් පාරක ඇවිදිනවා. වයසක කාන්තාවක් පාරේ කොණක සිඟමන් ඉල්ලමින් වාඩිවී සිටිනවා. ඊළඟ තත්පර කිහිපයේ ඔහුගේ මනස තුළ සිදුවන දේ කතාව ඔබට පෙන්වනවා. ඒ හරහා ලේඛකයා මනුෂ්‍යයෙකු තුළ ක්‍රියා කරන මනස් තුන පෙන්වනවා.","මම මේ කතාව මගේම වචනවලින් නැවත කියන්නම්. හොඳ කතා කරන දේ මේ කතාවත් මට කළා - කියවීමෙන් පසු එය මගේම කතාවක් වුණා. මුල් පොතේ එය නිරවද්‍යව ලියා තිබූ ආකාරය මට දැන් මතක නැහැ. එය මට ඉගැන්වූ දේ පමණක් මතකයි. මෙහි මම ලියන්නේ සිරකුටියෙන් පසු මගේම මනස තුළ ජීවත් වූ එම කතාවේ අනුවාදයයි.","• • •","මිනිසෙක් පාරක ඇවිදිනවා. ඔහු ඉක්මනින් යනවා. යම් කාර්යයකට යමින් සිටිනවා. වයසක කාන්තාවක් පදික වේදිකාවේ කොණක වාඩිවී සිටිනවා. ඇය කුඩායි, වකුටුයි, අතේ ටින් කෝප්පයක්. ඇය කෑගහන්නේ නැහැ. සරලව එහි වාඩිවී බලාපොරොත්තු වෙනවා.","මිනිසා ඇය පසුකර යනවා. ඇය පසුකර තත්පර භාගයක් ඇතුළත ඔහු තුළ දේවල් තුනක් සිදු වෙනවා.","පළමුව, ඇතුළතින් ආවේගයක්. පපුව තුළ කුඩා උණුසුම් චලනයක්. ඇයට යමක් දෙන්න. ඇගේ දවස වෙනස් කරන්න. තත්පරයකට ඔහුට කළ හැකි දේ පවා පෙනෙනවා. යුරෝ පහක නෝට්ටුවක් ගන්න පුළුවන්. කෝප්පයට දාන්න පුළුවන්. ඇය දෙස බලා සිනාසෙන්න පුළුවන්. ඇගේ සාමාන්‍ය දුෂ්කර දවස තුළ කුඩා විශාල මොහොතක් නිර්මාණය කරන්න පුළුවන්. සිතුවිල්ල පිරිසිදුව, හොඳින් පැමිණෙනවා. ඔහු ආපසු හැරී එය කිරීමට සූදානම් වෙනවා.","ඒ ආවේගය සචේතන මනසයි. ඔහු තුළ අවදිව සිටින කොටසයි. බලා සිටින්නා කතා කරන හඬයි. තවත් මනුෂ්‍යයෙකු හඳුනාගෙන උපකාර කිරීමට කැමති ඔහුගේ ගැඹුරුම, සත්‍යම කොටසයි. එය මුලින්ම පැමිණෙනවා. පිරිසිදුව පැමිණෙනවා. ගණනය කරන්නේ නැහැ. දීමට පමණක් කැමතියි.","• • •","පසුව දෙවන හඬක් පැමිණෙනවා. පළමු හඬට වඩා වේගයෙන්. ගණනය කරමින්.","ඔයාට පිස්සුද? මුළු දවසටම ඔයා ළඟ තියෙන්නේ යුරෝ හතයි. දවල් කෑම ගන්න ඕනෑ. පසුව බස් එකකට යන්න ඕනෑ. ඔයාගේ ජීවිතයත් කළමනාකරණය කරන්න තියෙනවා. ඇයට පහක් දෙන්න බැහැ. එකක් දෙන්න. නැත්නම් කාසි ටිකක්. කාසි සොයන්න. කාසි කිහිපයක් දෙන්න පුළුවන්.","ඒ උපසචේතන මනසයි. ගණනය කරන, ආරක්ෂා කරන, ගිණුම් තබන මනසේ කොටසයි. එය නපුරු නැහැ. එය නිර්මාණය කළ වැඩය කරනවා. ඔබව ආරක්ෂිතව තබා, කෑම ලබා දීමට උත්සාහ කරනවා. ජීවත්වීමේ කාර්යය කරනවා. සම්පත් සීමිත බවත් ඒවා කළමනාකරණය කළ යුතු බවත් ළමා කාලයේදී හෝ ඊටත් පෙර ඉගෙනගත් මනසයි.","මිනිසුන් මෙවැනි මොහොතක් පසුව සිතා බලන විට, උපසචේතන හඬම තමන් බව බොහෝ විට සිතනවා. සචේතන ආවේගය ළමා සහ අත්දැකීම් අඩු දෙයක්; උපසචේතනය වාස්තවික වැඩිහිටි සිතුවිල්ලක් කියලා සිතනවා. නමුත් ඒ අර්ථකථනය වැරදියි. උපසචේතනය තමන්ගේ කාර්යය කරනවා. නමුත් එහි කාර්යය පාලකයා වීම නොවෙයි. උපදෙස් දීමයි. එය ප්‍රධානියා වී, සචේතන ආවේගය අහෝසි කළ විට, මිනිසා තමන්ගේ ගැඹුරුම කොටස අහිමි කරනවා.","• • •","පසුව තුන්වන හඬක් පැමිණෙනවා. පහළින්, දැඩිව, අඩුවෙන් ඇසෙන හඬක්.","ඇවිදින්න. මේක ඔයාට විසඳන්න අවශ්‍ය නැහැ. දුරකථනය බලන්න. පාරේ අනෙක් පැත්තේ ගොඩනැගිල්ල බලන්න. වේගය අඩු කරන්නවත් එපා. ඉක්මනින් ඇය පසුකර යන්න. පසුව සිතන්න පුළුවන්. යන්න.","ඒ අසචේතන මනසයි. මනසේ ගැඹුරුම, පැරණිතම, ස්වයංක්‍රීය කොටසයි. ඔබගේ අවසරයක් නොගෙන ශරීරය ක්‍රියාත්මක කරන කොටසයි. අසහනකාරී හැඟීම් සම්පූර්ණයෙන් පැමිණීමට පෙර ඒවා මගහැරීමට වසර ගණනාවක් පුරා ඉගෙනගත් කොටසයි. එය පළමු ආවේගය සමඟ තර්ක කරන්නේවත් නැහැ. තත්ත්වය සම්පූර්ණයෙන් දැනීමට පෙර ශරීරය එයින් ඉවත් කරනවා.","පාරේ යන මිනිසා බොහෝ මිනිසුන් කරන දේම කරනවා. නෝට්ටුව වෙනුවට කාසියක් සොයමින් පොකට් අතගානවා. ලැජ්ජාවක් දැනෙනවා. ඇඟිලි යතුරු, මුදු, ඔහු පැළඳ සිටිනවා නම් අතේ තිබෙන දියමන්තිවලට වැදෙනවා. තමන් සතු දේත් ඒවා කොපමණ පෙනෙනවාද කියන දේත් ඔහුට හදිසියේ දැනෙනවා. ලැජ්ජාව පැමිණෙනවා. ඒ ලැජ්ජාව තුළ කාසියවත් දෙන්නේ නැහැ. දිගටම ඇවිදිනවා. ඇය පසුකර. මොහොත පසුකර. කෝප්පය හිස්වම ඉතිරි වෙනවා. කාසිය තබාගත් නමුත්, ඔහු පෙරටත් වඩා දුප්පත් වෙනවා.","• • •","එක් පාරක කොණක් හරහා ගමන් කරන තත්පරයකදී පෙනෙන මනස් තුනේ රූපය එයයි.","සිරකුටියේදී මේ කතාව මට ඉගැන්වූ දේ, මා අසා තිබූ බොහෝ දේශනවලට වඩා පැහැදිලියි. අවදි නොවූ මිනිසා තුන්වන මට්ටමේ ජීවත් වෙනවා. විශ්වය ඔහු ඉදිරියේ තබන කුඩා මොහොතවල් මගහැරමින් ජීවිතය හරහා යනවා. වයසක කාන්තාව පසුකර යනවා. සහෝදරයාගෙන් සමාව ඉල්ලීමට තිබූ අවස්ථාව පසුකර යනවා. අම්මාට ඇමතුමක් දීමට තිබූ අවස්ථාව පසුකර යනවා. නොදන්නා කෙනෙකුට ස්තුති කිරීමට තිබූ අවස්ථාව පසුකර යනවා. එක් වසරක් තුළ කුඩා විවෘතවීම් දහසක් පසුකර යනවා. වසර අවසානයේ තම ජීවිතය මෙතරම් කුඩා ඇයි කියලා අහනවා. ඔහු ජීවිතය කුඩා කළේ, විවෘතවීම් පසුකර යමින් එය නිතරම කුඩා කළ නිසායි.","ටිකක් අවදි මිනිසා දෙවන මට්ටමේ ජීවත් වෙනවා. උපසචේතන හඬ ඔහුට ඇසෙනවා. ගණනය කරනවා. සමහර විට නෝට්ටුව වෙනුවට කාසිය දෙනවා. සමහර විට සම්පූර්ණ නොවන සමාවක් ඉල්ලනවා. සමහර විට අම්මාට ඇමතුමක් දෙන නමුත් අවධානය වෙන තැනක. ජීවිතයට සහභාගී වෙනවා, නමුත් හැමවිටම එක් ඇසක් ගිණුම මත. ඔහු ලෝභියෙක්ම නොවෙයි. ඔහු කළමනාකරණය වෙන මිනිසෙක්. උපසචේතනය පාලනයේ. උපසචේතනය කිසිම ආවේගයකට නිදහසේ ගමන් කරන්න ඉඩ දෙන්නේ නැහැ.","අවදි මිනිසා පළමු මට්ටමේ ජීවත් වෙනවා. ආවේගය අනුව ක්‍රියා කරනවා. යුරෝ පහ දෙනවා. ආපසු හැරෙනවා. සම්පූර්ණයෙන් සමාව ඉල්ලනවා. අම්මාට කතා කර සම්පූර්ණ අවධානය දෙනවා. සැබෑ හේතුවක් නොමැති නම්, පසුව එන ගණනය කරන දෙවන හඬට පිරිසිදු පළමු හඬ අහෝසි කරන්න ඉඩ දෙන්නේ නැහැ. විශ්වය මේ කුඩා මොහොතවල් ඔහු ඉදිරියේ තබන්නේ, පළමු ආවේගය ඉල්ලූ දෙය කිරීමටම බව ඔහු තේරුම් ගන්නවා. ඒවා පසුකර යාම තම ආත්මය සෙමින් මැකී යාමක් බව දන්නවා.","• • •","සිතීමට පෙර ක්‍රියා කරන්න කියන විට මම අදහස් කරන දෙයත් මෙයයි.","බොහෝ මිනිසුන්ට මුළු ජීවිතයම කියන්නේ ක්‍රියා කිරීමට පෙර සිතන්න කියලා. අවදි නොවූ මිනිසාට ඒ හොඳ උපදෙසක්. අවදි නොවූ මිනිසා සිතීමකින් තොරව ක්‍රියා කළොත්, මිනිසුන්ට වේදනා දෙනවා, දේවල් බිඳිනවා. ඔහුට සෙමින් යන්න කියන්න ඕනෑ. නමුත් අවදි මිනිසා වෙනස්. ඔහුගේ පළමු ආවේගය - ගණනයට පෙර පැමිණෙන හඬ - බොහෝ විට නිවැරදියි. පසුව පැමිණෙන ගණනය බොහෝ විට, ඔහුගේම යහපත්කමින් ඔහුව ඉවත් කිරීමට උපසචේතනය කරන උත්සාහයක්.","සමහර විට සිතීමට පෙර ක්‍රියා කරන්න ඕනෑ කියලා මම දැන් මිනිසුන්ට කියන විට, නොසැලකිලිමත්ව ක්‍රියා කරන්න කියනවා නොවෙයි. පළමු පිරිසිදු හඬ විශ්වාස කරන්න කියනවා. උණුසුම්ව, ගණනයකින් තොරව පැමිණි ආවේගය විශ්වාස කරන්න. කාසිය දෙන්න. ඇමතුම දෙන්න. පණිවිඩය යවන්න. සමාව ඉල්ලන්න. සමාව දෙන්න. පැමිණ සිටින්න. ඔබ එසේ නොකළ යුතු හේතු ලැයිස්තුව දෙවන හඬ ලියන්න පෙර එය කරන්න.","අවදි මිනිසාගේ පුහුණුව මෙයයි. එය කුඩායි. දිනපතායි. තමන්ව ප්‍රකාශ කරන්නේ නැහැ. වසර ගණනක් පළමු ආවේගයේ හොඳ ක්‍රියාව දිගටම කරන මිනිසා, එය තම සාමාන්‍ය ක්‍රමය වන තුරු එය කරගෙන යනවා. එක් දවසක මිනිසුන් ඔහු වෙනස් බව දැනගන්න පටන් ගන්නවා. ඇයි කියලා ඔවුන්ට කියන්න බැහැ. එක් නාටකාකාර ක්‍රියාවක් පෙන්වන්නත් බැහැ. ඔහු කාමරයක සිටින විට කාමරය උණුසුම් වගේ, ඔහු අසල ජීවිතය ටිකක් හොඳ වගේ, පාරේ කොණක සිටින වයසක කාන්තාව දකින මිනිසෙක් ඔහු වගේ දැනෙනවා.","මට එවැනි මිනිසෙක් වෙන්න ඕනෑ. මම තවම එතැනට පැමිණ නැහැ. තවමත් ගොඩනැඟෙමින් සිටිනවා. නමුත් සිරකුටිය සහ ෆිලිපීනෝ සහෝදරයා මට දුන් පොත නිසා, ගොඩනැඟීම කියන්නේ මේක බව දැන් මම දන්නවා. මනස් තුනේ හඬ අතර දිනපතා තෝරාගැනීම ගොඩනැඟීමයි. පළමු හඬ තෝරන්න. පළමු හඬ විශ්වාස කරන්න. අවශ්‍ය නම් ආපසු හැරෙන්න. නෝට්ටුව කෝප්පයට දාන්න. ඇගේ ඇස් දෙස බලන්න. මොහොත විශාල කරන්න. විශ්වය එය ඔබ වෙනුවෙන් සකස් කළා. එය පසුකර යන්න එපා.","ආධ්‍යාත්මික මූලය · ඉගැන්වීමේ අධ්‍යායය"]},{"number":41,"title":"ආලෝකය අඳුරයි","paragraphs":["කුර්ආනයේ බොහෝ වාරවල අල්ලාහ් ආලෝකය ගැන කතා කරනවා. මිනිසුන් ඒ වචනය අසා වහාම එකම කුඩා වැරැද්ද කරනවා. හිස තුළ රූපයක් අඳිනවා. සාමාන්‍යයෙන් ඒ රූපය හිරු. එවිට ඔවුන්ගේ විශ්වාස පද්ධතිය අල්ලාහ් ආලෝකයයි කියන විට, ගැඹුරු අර්ථය ඒ කුඩා රූපයෙන් මාරු කරනවා. අල්ලාහ්ව හිරු සමඟ සම්බන්ධ කිරීමට පටන් ගන්නවා. එය සිදු වූ විට, ශරීරයට දැකිය හැකි වස්තුවක් තුළ අල්ලාහ්ව කුඩා කරලා දමා තිබෙනවා - එම වාක්‍යයේ අරමුණ ශරීරයට දැකිය නොහැකි යථාර්ථයක් පෙන්වීම වුණත්.","ගැඹුරුම අර්ථයෙන් ආලෝකය හිරු නොවෙයි. කාලයට බැඳී නොසිටින දෙයකට සමීපම දෙයක් ලෙස විද්‍යාව මෙතෙක් හඳුනාගෙන තිබෙන්නේ ආලෝකයයි. යම් දෙයක් ආලෝකයේ වේගයට ළඟාවෙන තරමට, එය වටා කාලය සෙමින් යනවා. එය කවියක් නොවෙයි - භෞතික විද්‍යාවයි; මිනුම් කරලා, සමාන ක්ෂේත්‍රයේ විද්‍යාඥයන් පරීක්ෂා කරලා, ශතවර්ෂයක් පුරා පර්යේෂණවලින් තහවුරු කළ දෙයක්. කාලයෙන් සීමා නොවන දෙය, අල්ලාහ්ගේ ස්වභාවයට සමීප බව මැනිය හැකි ආකාරයකින් අපට පෙන්වනවා. කාලයෙන් පිටවීමට පටන් ගන්නා බව අප දන්නා එකම භෞතික දෙය ආලෝකයයි. ඒ නිසා බොහෝ ආධ්‍යාත්මික සම්ප්‍රදායන් මේ රූපය භාවිත කරනවා. ශරීරයේ සංවේදන පමණක් භාවිත කරමින් කාලයෙන් තොර දෙය තේරුම් ගැනීමට ශරීරයට ළඟාවිය හැකි සමීපම උදාහරණය එයයි.","• • •","නමුත් අල්ලාහ් පැහැදිලිව කියන්නේ - මා ඔබට දෙන උදාහරණ මාමයි කියලා ප්‍රක්ෂේපණය කරන්න එපා. උදාහරණය ඔබ වෙනුවෙන්. ඔබ ජීවත් වන ආකාරයට උපකාර කිරීමට, මනස නිවැරදි දිශාවට යොමු කිරීමට. උදාහරණය අල්ලාහ් නොවෙයි. හිරු අල්ලාහ් නොවෙයි. ආලෝකය අල්ලාහ් නොවෙයි. ආලෝකය අල්ලාහ් දෙස පෙන්වන ඇඟිල්ලක්. ඇඟිල්ල කන්න එපා. එය පෙන්වන දිශාව බලන්න.","ඔබට පෙර මිනිසුනුත් එකම ප්‍රශ්න ඇහුවා. අල්ලාහ් ආලෝකය නම්, අඳුර ගැන කුමක්ද? අඳුරත් අල්ලාහ්ගේ නිර්මාණයක් නොවෙයිද? කුර්ආනය මේ ගැන කතා කරනවා. අඳුරත් නිර්මාණය කර තිබෙනවා. ආලෝකයත් අඳුරත් දෙකම අල්ලාහ් නිර්මාණය කළා. ආලෝකයේ උදාහරණය දුන්නේ, මිනිසුන් දවල් කාලයේ ආලෝකය මත ජීවත් වන නිසායි. උදාහරණය මනස සඳහා මෙවලමක්. එය අල්ලාහ්ගේ ශරීරයක් ගැන විස්තරයක් නොවෙයි, මොකද අල්ලාහ්ට ශරීරයක් නැහැ.","• • •","මේ ඉගැන්වීමේ තියුණුම කොටස මෙයයි. ඔබට අඳුර තුළ ඒ ආලෝකය සොයාගත හැකියි.","අල්ලාහ් ඇත්තටම කියන්නේ ඒකයි.","ඔබ ඇස් වසාගත් විට මුලින්ම දකින්නේ අඳුර. සම්පූර්ණ අඳුර. කිසිවක් නැති බව. බොහෝ මිනිසුන් වහාම ඇස් ඇරිනවා. ඒ කිසිවක් නැති බවට බිය නිසා, ඒක කම්මැලි නිසා, නැත්නම් නිශ්චලව සිටීමට නොහැකි නිසා. අඳුරේ අනෙක් පැත්තේ තිබෙන දෙය සොයාගන්න තරම් කාලයක් ඔවුන් වාඩිවී සිටින්නේ නැහැ.","නමුත් ඔබ වාඩිවෙලා සිටියොත්. අද මිනිත්තු දහයක් ඇස් වසාගත්තොත්. හෙට මිනිත්තු විස්සක්. ලබන මාසයේ මිනිත්තු හතළිහක්. ඉවසීමෙන්, සෙමින්, තවත් දිගු කාලයක් - අවසානයේ අඳුර වෙනස් වෙනවා. එය තවදුරටත් අඳුර නොවෙයි. සාමාන්‍ය අර්ථයෙන් ආලෝකයත් නොවෙයි. අඳුර තුළ තිබෙන ආලෝකයයි. සූෆිවරු එයට නමක් දෙනවා. ප්‍රමාණවත් කාලයක් නිශ්චලව සිටි කෙනෙක් එය හමු වී තිබෙනවා. තැඹිලි ආලෝකය. සුළු දීප්තිය. නූර්. ශරීරය එය බලාපොරොත්තු වීම නතර කර තරම් කාලයක් ඇස් වසා සිටි විට පමණක් පැමිණෙන දෙය.","අල්ලාහ් පෙන්වා දුන් ආලෝකය ඒකයි. හිරු නොවෙයි. ලාම්පුව නොවෙයි. ඉටිපන්දම නොවෙයි. නිශ්චල මනුෂ්‍යයෙකුගේ වසාගත් ඇස් පිටුපස ජීවත් වන ඇතුළත ආලෝකය. කාලය ප්‍රමාණවත් තරම් නවත්වන්න, ආලෝකය පෙනෙයි. පුහුණුව ඒකයි. දොර ඒකයි. වසර එක්දහස් හාරසියක් පුරා වාක්‍ය පෙන්වා දුන්නේ ඒ දෙසයි.","• • •","කුඩා ප්‍රායෝගික විස්තරයක්. දැන් මගේ පුහුණුවේදී හැමවිටම විදුලි ආලෝකය භාවිත කරන්නේ නැහැ. සමහර විට ඉටිපන්දමක් භාවිත කරනවා. පැරණි ක්‍රමය. ඇයි? විදුලිය පවා ස්නායු පද්ධතියට දැනෙන ආකාරයේ ශක්තියක් රැගෙන යනවා කියලා මට දැනෙන නිසා - Wi-Fi සංඛ්‍යාත, විද්‍යුත් චුම්බක ක්ෂේත්‍ර, නවීන කාමරවල පසුබිම් ගුංජනය. ඔබට එය ශරීරයෙන් දැනෙනවා. හැමවිටම විශ්වාස කරන්න බැහැ. ඒ නිසා ගැඹුරු සම්ප්‍රදායන් වාඩිවූ ආකාරයට, සමහර විට ඉටිපන්දම් ආලෝකයේ වාඩිවෙනවා. ඉටිපන්දම කුඩායි. ගිනිදැල්ල චලනය වෙනවා. ශරීරය සැහැල්ලු වෙනවා. මනස මෘදු වෙනවා. ඒ මෘදු තත්ත්වයේදී ඇතුළත ආලෝකය වඩා පහසුවෙන් පැමිණෙනවා. කාමරයට විරුද්ධව සටන් කිරීම නතර කළ විට, ඇස් සොයාගැනීමට නිර්මාණය කළ දෙය සොයාගන්න ශරීරය අවසානයේ ඉඩ දෙනවා. ඉදිරියේ තිබෙන ඉටිපන්දම නොවෙයි. වසාගත් ඇස පිටුපස තිබෙන ආලෝකය.","එක් දවසක ඔබ ඇස් වසාගන්නවා, අඳුර තවදුරටත් අඳුරු නොවෙයි.","පොරොන්දුව ඒකයි. පුහුණුවේ ගමනාන්තය ඒකයි. එය දුර නැහැ. ගුරුවරයෙකු අවශ්‍ය නැහැ. විශේෂ සම්ප්‍රදායක් අවශ්‍ය නැහැ. ඇස් වසාගෙන, හුස්ම සෙමින්, අඳුර ආලෝකය වන තරම් කාලයක් නිශ්චලව වාඩිවී සිටීම අවශ්‍යයි.","• • •","රාත්‍රිය පවතින්නේ ඇයි? අල්ලාහ් අපෙන් පිටත ආලෝකය ඉවත් කරන දවසේ කොටසක් නිර්මාණය කළේ ඇයි? ඇතුළත ආලෝකය අත්විඳීමට.","දවල් කාලයේ ඇස පිටත ආලෝකයෙන් කාර්යබහුලයි. ඇතුළට බැලීමට අවශ්‍යතාවක් නැහැ. නමුත් රාත්‍රියේ පිටත ආලෝකය අතුරුදන් වූ විට, ඇසට අවසානයේ ඇතුළත ආලෝකය සොයාගැනීමට අවස්ථාවක් ලැබෙනවා. රාත්‍රිය දඬුවමක් නොවෙයි. රාත්‍රිය දොරයි. දවස ශරීරයට ආහාර දෙයි. රාත්‍රිය ආත්මයට ආහාර දෙයි - රාත්‍රිය ලබා දෙන දේ පිළිගැනීමට ආත්මය ප්‍රමාණවත් තරම් අවදි නම්.","ශරීරයට විවේකය අවශ්‍ය නිසා අපි රාත්‍රියේ නිදාගන්නවා. නින්ද ස්වයංක්‍රීය ක්‍රමයයි. නින්ද, සචේතනව අවදි නොවන මිනිසෙකුට පවා ජීවත් වීමට හැකි වන ලෙස අල්ලාහ් ජීවියා තුළ තබා ඇති එන්ට්‍රොපියයි. මිනිසෙකු ඇතුළත ආලෝකයට අවදි නොවනවා නම්, අවම වශයෙන් ඔහුට නිදාගන්න ඉඩ දෙන්න. පසුව ඔහු මා වෙත නැවත එයි; දැන් ඔහු සමඟ තර්ක කරනවා වෙනුවට, එදා මම ඔහුට පිළිතුරු දෙන්නම්.","මුළු නිර්මාණයේම දයාබරම වාක්‍යවලින් එකක් ඒක. අල්ලාහ් අවදිවීම බලෙන් දෙන්නේ නැහැ. සූදානම් නැති මිනිසා අද රාත්‍රියේ නිදාගන්නවා, හෙට රාත්‍රියේත්, තවත් රාත්‍රී දහසක්. ඔහු තුළ යමක් අවසානයේ විවෘත වී, වසාගත් ඇස පිටුපස ආලෝකය සොයාගන්න තරම් කාලයක් ඔහු වාඩි වන තුරු. අල්ලාහ් බලා සිටීමට සූදානම්. ආලෝකයත් බලා සිටීමට සූදානම්.","• • •","නමුත් අවදි වීම සුන්දර දෙයයි. කුර්ආනයම ඔබට කියනවා - රාත්‍රියේ අවසාන තුනෙන් එකේ නැගිටින්න. හදවත කැළඹී තිබේ නම්, එදා පාරායනය කරන්න. රාත්‍රියේ තුනෙන් එක පුහුණුව සඳහා ගැඹුරුම පැයයි, මොකද පිටත ලෝකය වඩාත් නිහඬ වෙන්නේ එදා. වාහන නතර වෙලා. දුරකථන නතර වෙලා. අසල්වැසියන් නිදි. නගරයේ ශරීරය නිහඬයි. ඒ පිටත නිහඬතාව තුළ, ඇතුළත ආලෝකයට පෙනෙන්න පහසුම අවස්ථාව ලැබෙනවා. ඔබ වටා අඳුර ගැඹුරුමයි. වසාගත් ඇස් ඇතුළේ අඳුරට එය අවසානයේ හමුවිය හැකියි. ලෝකය නිදි, ඔබ අවදි ඒ නිහඬ පැයේදී - ඒ හමුවීම තුළ - අඳුර පිටුපස ආලෝකය තමන්ව පෙන්වීමට පටන් ගන්නවා.","ඔහු ඔබව නිර්මාණය කළා. ඔහු ඔබට පෙන්වනවා. ඔහු ඔබට උගන්වනවා. ඒ සියල්ල - ඔබේ ජීවිතයේ සෑම පිටුවක්ම - එකම තැනක් දෙස පෙන්වන දිගු ඊතලයක්. අවසාන හිස් තැන. අඳුර ආලෝකය වන රාත්‍රිය. තවත් කිසිවක් ලියන්න අවශ්‍ය නැති පිටුව.","ඔබ තවම ජීවත්ව සිටියදී එයට ළඟාවෙන්න."]},{"number":42,"title":"ගින්න දැන් ඔබව උයමින් සිටී","paragraphs":["ඔබ සහ තවත් කෙනෙකු අතර වෛරය පතුරුවන විට, ඔබ තුළ ගින්නක් උපදිනවා. ඒ ගින්න ඔබ දෙදෙනා අතර වාතයේ රැඳී සිටින්නේ නැහැ. එය ඔබේ ශරීරයට ඇතුල් වෙනවා. එය බිය උපදවනවා. හෘද වේදනාව උපදවනවා. කනස්සල්ල, වේදනාව, මායාව සහ වෛරය නිපදවනවා. අවසානයේදී ඔබටම නොපෙනෙන, ඔබේ හැසිරීමේ කුඩා වෙනස්කම් දහසක් එය නිර්මාණය කරනවා.","එය අල්ලාහ්ගෙන් එන දෙයක් නොවෙයි. අපි ෂයිතාන් කියන දේ, නපුර කියන දේ, අවදි නොවූ මනස තුළ ඇති යටිසිතේ අඳුර කියන දේ එයයි.","කුර්ආනය බොහෝ තැන්වල ගින්න ගැන කතා කරනවා - මෙහි දැවීම ගැනත්, මරණයෙන් පසු දැවීම ගැනත්. බොහෝ දෙනා ඒ වාක්‍ය සෘජු අර්ථයෙන් පමණක් කියවා, මරණයෙන් පසු වෙනත් ලෝකයක ඇති ගින්නක් සිතනවා. නමුත් මෙහිදී දැවෙන්නේ කොහොමද? ඇත්තටම ගින්නෙන් දැවුණොත් ශරීරය මැරෙනවා. එසේ නම්, ඔබ දැන්ම දැවෙමින් සිටිනවා කියලා කුර්ආනය පෙන්වන්නේ කොහොමද?","• • •","පිළිතුර ශරීරයේ මධ්‍යස්ථාන තුළ තිබෙනවා. ඒ මධ්‍යස්ථානවලින් එකක් බඩ. ඔබේ මුළු ජීවිතය පුරාම, සෑම දිනකම, සෑම මොහොතකම බඩ තුළ සිදුවන්නේ කුමක්ද? ආහාර පිසෙමින්, ජීර්ණය වෙමින් තිබෙනවා.","• • •","ඔබ කන විට ඇත්තටම සිදුවන දේ බලන්න. ඔබ බත් කටට දානවා. එළවළු, පාන්, මස්, වතුර, ලුණු, සීනි සහ තෙල් දානවා. ඒ සියල්ල බඩට ගිය පසු වෙන වෙනම අමුද්‍රව්‍ය ලෙස රැඳෙන්නේ නැහැ. ඒවා එකට මිශ්‍ර කර, බිඳ දමා, වෙනස් කර, ශරීරයට අවශ්‍ය දේ ලබාගෙන, අවශ්‍ය නොවන දේ පිට කර දමනවා. බඩ භාජනයක් වගේ. ශරීරය ඒ භාජනය යට ඇති ගින්නක් වගේ. ඔබ ඔබ තුළම, සෑම මිනිත්තුවකම, සෑම පැයකම, සෑම දිනකම, මුළු ජීවිතය පුරාම යමක් උයමින් සිටිනවා.","කුර්ආනය පෙන්වන ගින්න මෙයත්. මෙය උපමාවක් පමණක් නොවෙයි; ක්‍රියාවලියක්. ඔබේ බඩ දැන්ම දහනය වෙමින් වැඩ කරනවා. ඔබේ අක්මාව දැන්ම වැඩ කරමින් දහන ක්‍රියාවලිය පවත්වාගෙන යනවා. ඔබේ සෛල ග්ලූකෝස් දහනය කරනවා. ඔබ ගන්න සෑම හුස්මක්ම ඒ ක්‍රියාවලියට ආහාර සපයනවා. ඔබ කකුල් දෙකක් මත ඇවිදින කුඩා මුළුතැන්ගෙයක් වගේ.","එබැවින් කුර්ආනය මෙහිත්, මරණයෙන් පසුත් ගින්න ගැන කතා කරන විට, ඔව් - මරණයෙන් පසු ජීවිතයට අදාළ ගැඹුරු අර්ථ තිබෙනවා. නමුත් පළමු ස්තරය මෙහිමයි. ගින්න කියන්නේ ඔබේ ශරීරයේම සිදුවන පිසීම. ඒ ගින්න ඔබේ හැඟීම් පිසීමත් වෙනවා - කනස්සල්ල, කෝපය, අමනාපය, හෘද වේදනාව. මේවා සියල්ලම ඔබ මේ වාක්‍යය කියවන මේ මොහොතේ ඔබ තුළ සිදුවන සැබෑ රසායනික සහ ශක්තිමය ප්‍රතික්‍රියා.","නිරයේ ගින්න ඔබ වෙනත් තැනක බලා සිටින දෙයක් පමණක් නොවෙයි. ඔබ අවදි නොවී ගත කළ අවුරුදු පුරා ඔබ තුළම පිසූ වට්ටෝරුවත් නිරයේ ගින්නයි. පාරාදීසයත් එම මුළුතැන්ගෙයමයි, නමුත් වෙනස් උයන්නෙකු සමඟ - භාජනයට ඇතුල් වන්නේ කුමක්ද කියලා තෝරන සචේතන මනස සමඟ.","• • •","අධික සීනි සහ අධික ලුණු ගැන සම්ප්‍රදායන් අනතුරු අඟවන්නේ ඇයි කියලා එහි ප්‍රඥාවක් තිබෙනවා.","ඔබේ සීයා, ඔහුගේ සීයාත්, තේ කෝප්පයකට සීනි තේ හැන්දක් එකක් ගත්තා. ඒ ප්‍රමාණය ප්‍රමාණවත් වුණා. ශරීරය එය ලබාගත්තා. රුධිරය එය රැගෙන ගියා. ශක්තිය සංසරණය වුණා. ශරීරය දිගටම චලනය වුණා. කුඩා ප්‍රමාණය මෙවලමක් වුණා. ඒ සමඟ කුමක් කළ යුතුද කියලා ශරීරය දැනගෙන සිටියා.","ඉන්පසු, පසුගිය අවුරුදු පනහ පුරා සීනි සහ ලුණු ප්‍රමාණයන් වීම නවතා සංස්කෘතීන් බවට පත්වුණා. ඒවා අනන්‍යතා වුණා. ධනය පෙන්වන ලකුණු වුණා. නිර්මාණාත්මක තේරීම් වුණා. සුදු බත්, රතු බත් සහ දුඹුරු බත් සමාජ පන්තිය පෙන්වන ලකුණු වුණා. පිරිපහදු කළ සීනි හැම දෙයකටම ඇතුල් වුණා. ලුණු අවශ්‍ය නැති ආහාරවලටත් ලුණු එක් වුණා. කාලයක ඖෂධ වගේ තිබුණු අණු, තත්ත්වය පෙන්වන සංකේත බවට පත්වුණා. මිනිසුන් ශරීරය වෙනුවෙන් කෑම නවතා, අනිත් අයට පෙන්වීමට කැමති ශරීර රූපය වෙනුවෙන් කන්න පටන් ගත්තා.","ශරීරයේ අරමුණ අමතක වුණා. මුළුතැන්ගෙය ඇඳුම් අංශය විසින් අල්ලාගත්තා. ඇතුළත ගින්න වැරදි දේවල් පිසන්න පටන් ගත්තා. වැරදි ප්‍රතික්‍රියා නිපදවලා, වැරදි අභ්‍යන්තර වාතාවරණයක් ගොඩනැඟුවා.","සීනි සහ ලුණු සතුරන් නොවෙයි. ශරීරයට ඒවා අවශ්‍ය වන්නේ ඇයි කියලා අමතක කිරීම සතුරායි.","• • •","මතක තබා ගැනීම වැදගත්ම පුහුණුවයි. සමාව අල්ලාහ්ගේ දයාවයි - සමාව කියන්නේ අමතක කිරීමත්.","ඔබ අල්ලාහ්ගෙන් සමාව ඉල්ලන විට, අල්ලාහ් කුමක් කරනු ඇතැයි ඔබ බලාපොරොත්තු වෙනවාද? ඔහු එය තවදුරටත් ඔබට එරෙහිව විවෘත ගොනුවක් ලෙස තබා නොගනී. ඔහු එය වසා දමයි. පිටුව ලියා නොතිබූ එකක් වගේ වෙනවා. පුවරුව පිරිසිදු වෙනවා. එය දයාවයි.","නමුත් මෙන්න පරීක්ෂණය. ඔබ තවත් කෙනෙකුගෙන් සමාව ඉල්ලන විට, ඒ කෙනාටත් අමතක කිරීමට සිදුවෙනවා. “ඔව්, මම සමාව දුන්නා” කියලා කියමින්, හදවත තුළ ගොනුව තවම විවෘතව තබාගෙන, ඔබ කළ දේ නැවත නැවතත් සිහි කරමින්, රහසින් ඔබට එරෙහිව ගණන් තබනවා නම්, එය සමාව නොවෙයි. එය ආචාරශීලී බොරුවක්.","සැබෑ සමාවට අමතක කිරීම අවශ්‍යයි. හදවතට අමතක කළ නොහැකි නම්, ඒ කෙනා තවම අවසාන හිස් තැනට ළඟාවී නැහැ. ඔහු තවමත් බර රැගෙන යනවා. තවමත් පැරණි ගින්න පිසමින් සිටිනවා.","මිනිසුන්ගේ බොහෝ සමාව සම්පූර්ණ නොවන්නේ ඒ නිසයි. ඔවුන් අමතක කිරීමේ ක්‍රියාව නොකර “සමාව” කියන වචනය පමණක් කියනවා. තුවාලය බඩ තුළ මඳ ගින්නක තබාගෙන, අවුරුදු ගණනක් ඇතුළතින් සෙමින් තමන්වම පිසීමට ඉඩ දෙනවා. අවසානයේ ඔවුන් මැරෙන්නේ, අවුරුදු ගණනකට පෙර සමාව දුන්නා කියූ දෙයක් ගැන තවමත් කෝපයෙන්.","පැරණි ගිනි රැගෙන අවසාන හිස් තැනට ළඟාවිය නොහැකියි. ඒවා නිවා දැමිය හැක්කේ අමතක කිරීමෙන් පමණයි.","• • •","ඔබ තුළ ඇති ගින්න වැඩි කළ හැකියි. අඩු කළ හැකියි. තීරණය කරන්නේ ඔබයි.","අධිකව කන විට ඔබ ගින්න වැඩි කරනවා. වැරදි දේ කන විට, වැරදි හේතු නිසා කන විට, නොසැලකිල්ලෙන් දිගු වේලාවක් බඩගින්නේ සිටින විට, කෝපය පිට නොකර බඩ තුළ තබන විට, අමනාපය අවුරුදු ගණනක් මඳ ගින්නක පිසීමට ඉඩ දෙන විට - මේ සියල්ල ගින්න වැඩි කරනවා. ශරීරය උණු වෙනවා. මනස මැලවෙනවා. සචේතන මනසට ළඟාවීම අමාරු වෙනවා.","නිශ්චලව වාඩිවෙන විට ඔබ ගින්න අඩු කරනවා. උපවාස කරන විට. ශරීරයට ඇත්තටම අවශ්‍ය දේ පමණක් ඇතුල් වන ලෙස අඩු කරන විට. සෙමින් හුස්ම ගන්න විට. ඇතුළත දැල්ලට තවත් දර එකතු කිරීම නවතා, ශරීරයේ දිනපතා වැඩ පිසීමට ප්‍රමාණවත් මෘදු, ප්‍රයෝජනවත් උණුසුමක් දක්වා එය පහළට යන්න ඉඩ දෙන විට - ශරීරයම දහනය නොකරන උණුසුමක් දක්වා.","• • •","මිනිසා එයට බාධා කිරීම නවත්වනවා නම්, ශරීරය තමන්වම සකස් කරගන්න දන්නවා. ගින්නට වැරදි දේවල් දීම නවත්වන්න. බඩ තුළ අමනාප පිසීම නවත්වන්න. සීනි, ලුණු, මත්පැන්, ශබ්දය සහ නාට්‍යයෙන් පද්ධතිය ගිල්වීම නවත්වන්න. සරලව නවත්වන්න. වාඩිවන්න. හුස්ම ගන්න. උපවාස කරන්න. අඩු කරන්න. නිශ්චල වෙන්න.","එම නිශ්ශබ්දතාව ලබාදුන් විට, ශරීරය තමන්ගේම අලුත්වැඩියාව ආරම්භ කරනවා. සමේ කුඩා කැපුම් වැසෙනවා. රුධිරය නිවැරදිව කැටි වෙනවා. ජීර්ණය සන්සුන් වෙනවා. හුස්ම ගැඹුරු වෙනවා. නින්ද ගැඹුරු වෙනවා. ඔබ බල නොකරම මනසත් පැහැදිලි වීමට පටන් ගන්නවා. ශරීරය හොඳින් සිටින විට මනසත් හොඳින් සිටින නිසා. ඒ දෙක වෙන වෙනම යන්ත්‍ර දෙකක් නොවෙයි. එකම ජීවියාගේ කොටස්. මිනිසා ඒවා සමඟ සටන් කිරීම නවතා දැමූ විට ඒවා එකිනෙක සුව කරගන්නවා.","ශරීරය දන්නවා. ශරීරය හැමදාම දැනගෙන සිටියා. එයට අවශ්‍ය වන්නේ මිනිසා එහි මාර්ගයෙන් ඉවත් වීම පමණයි.","• • •","තියුණු, පැහැදිලි අනතුරු ඇඟවීමක් මෙහි තිබෙනවා. ලෝකයේ ගුරුවරුන්, ගුරුන්, පූජකයන් සහ තමන්ම ආධ්‍යාත්මික ගුරුවරුන් ලෙස හඳුන්වන බොහෝ දෙනෙක්, විනය නාමයෙන් තමන්ටම හානි කිරීමට ඉගෙනගෙන තිබෙනවා. ඔවුන් ශරීරය රෝගී වන තුරු බඩගින්නේ තබනවා. තමන්ටම පහර දෙනවා. සුව කරනවා වෙනුවට හානි කරන ආකාරවලින් ජීවත් වෙනවා. එය පුහුණුව කියනවා. භක්තිය කියනවා. ඉන්පසු එම වේදනාව අනිත් අයටත් උගන්වනවා. දුක් විඳීම පිටතින් බලන විට ගැඹුරු බවක් වගේ පෙනෙන නිසාත්, බොහෝ දෙනා දුක් විඳීම ගැඹුර සමඟ පටලවා ගන්න නිසාත්, අනිත් අය ඔවුන්ව අනුගමනය කරනවා.","නමුත් තමන්ටම හානි කිරීම අවදිවීම නොවෙයි. එය වෙනස් ඇඳුමක් ඇඳගෙන ශරීරය පාලනය කරන අසචේතන මනසයි. පාර කොණේ සිටින වයසක කාන්තාව පසුකර ගිය තුන්වන මට්ටමේ මිනිසාම දැන් ගුරුවරයෙකුගේ වස්ත්‍රයක් ඇඳගෙන, ඇය පසුකර යාම ආධ්‍යාත්මික දියුණුවක් කියලා පැහැදිලි කරනවා.","ශරීරය අපරාධකාරයා නොවෙයි. මම කලින් කියා තිබුණත්, මෙය නැවත කියන්න ඕන. ශරීරය අපරාධකාරයා නොවෙයි. එය ඔබට ආශීර්වාදයක් ලෙස, මෙවලමක් ලෙස, මනස අවදි වීමට භාවිත කරන වාහනයක් ලෙස දී තිබෙනවා. ඔබ එයට හානි කළ යුතු නැහැ. අනිත් අයට තමන්ගේ ශරීරයට හානි කරන්න උගන්වන්නත් නොකළ යුතුයි. අවදි විය යුත්තේ මනසයි. මනසට තම වැඩ කිරීමට තැනක් තිබෙන ලෙස, ශරීරයට සැලකිල්ල දිය යුතුයි.","ජීවත් වීමට ආරක්ෂිතම මධ්‍යස්ථානය සචේතන මනසයි - සිංහාසනයයි; බඩේ ගින්නට ඉහළින්, ලෝකයේ අවුලට පහළින් ඇති ආසනයයි. එය ආරක්ෂිත මධ්‍යස්ථානයයි. අවදි වූ මිනිසා ජීවත් වන්නේ එහි. ඔහු එහි තදින් රැඳී සිටින්නේ සිරකරුවෙකු නිසා නොවෙයි; තමන් තුළ නොදැවෙන එකම කාමරය අවසානයේ සොයාගත් නිසා.","ගින්න පිටත පමණක් නොතිබුණා; එය ඇතුළත මිනිසාවත් උයමින් සිටියා.","ආධ්‍යාත්මික මූලය · ප්‍රධාන අධ්‍යායය"]},{"number":43,"title":"එක් දිනක ඔවුන් ඔබව මනුෂ්‍යයෙකු ලෙස හඳුන්වනු ඇත","paragraphs":["කුර්ආනය බොහෝ තැන්වල ප්‍රතිවිපාක ගැන කතා කරනවා. ගණන් දීම ගැන. හානි කරන මිනිසුන්ට සිදුවන දේ ගැන. සමහර විට මතුපිටින් කියවන විට දැඩි වගේ පෙනෙන භාෂාවක් භාවිත කරනවා. දරුවන් දක්වා. පවුල දක්වා. පරම්පරා දක්වා.","මිනිසුන් ඒ වාක්‍ය අසා වහාම නරකම දේ සිතනවා. වැරදි කළ කෙනාගේ දරුවන්ව අල්ලාහ් මරා දමනවාද? කිසිම වරදක් නොකළ කෙනෙකුගේ ශරීරයට අල්ලාහ් දඬුවම් කරනවාද? නැහැ. එය මතුපිට කියවීමයි. ගමේ කියවීමයි. වාක්‍යය ඇත්තටම පෙන්වන දේ තේරුම් ගැනීමට ප්‍රමාණවත් කාලයක් නිශ්චලව වාඩි නොවූ මනසක කියවීමයි.","කුර්ආනයේ ශරීරය දඬුවම ලබන දෙය ලෙස පෙන්වන්නේ නැහැ. වාක්‍ය සාවධානව කියවන්න. ශරීරය ආශීර්වාදයක් ලෙස විස්තර කරනවා. එයට අරමුණක් තිබෙනවා. හේතුවක් තිබෙනවා. ඔබේ සචේතන මනසට, ඔබේ සිංහාසනයට, මේ සම හරහා, මේ අත් හරහා, මේ හුස්ම හරහා, මේ ලෝකයේ ආදරය අත්විඳීමට ශරීරය දී තිබෙනවා. ශරීරය මෙවලමයි. ශරීරය අපරාධකාරයා නොවෙයි.","• • •","එසේ නම්, දඬුවමක් ලබන්නේ කුමක්ද? ශරීරය නොවෙයි. දරුවන්ගේ ශරීරත් නොවෙයි. අවදි වීම ප්‍රතික්ෂේප කළ මනසයි. ශරීරය තුළ ජීවත් වූවත් සිංහාසනයට නොගිය මනසයි. යටිසිතට හැම දෙයක්ම පාලනය කිරීමට ඉඩ දුන්, වැරදි සටන් කිරීමට ශරීරය යොදාගත්, මුලින්ම මෙහි පැමිණියේ ඇයි කියලා අමතක කළ මනසයි.","ප්‍රතිවිපාක රැගෙන යන්නේ ඒ මනසයි. අල්ලාහ් කුරිරු නිසා නොවෙයි. අවදි නොවූ මනස තමන්ටම දඬුවමක් වන නිසා. නිරයේ ගින්න කියන්නේ මේ ජීවිතයේදීම යටිසිත ශරීරය දහනය කිරීම බව මේ පොතේ වෙනත් අධ්‍යායයක ලියා තිබෙනවා. ගින්න මරණයෙන් පසු පමණක් බලා සිටින දෙයක් නොවෙයි. එය මෙහිත් තිබෙනවා. අවදි නොවූ මිනිසා තම හැසිරීම, කෝපය, සමාව නොදීම සහ දිනපතා කරන කුඩා කුරිරුකම් හරහා ඒ ගින්න තමන් වටා සිටින අයටත් - සමහර විට තම දරුවන්ටත් - පවරනවා.","අල්ලාහ් දරුවන්ට දඬුවම් කරන නිසා නොවෙයි. අවදි නොවූ පියාම දඬුවම බවට පත්වන නිසා. අවදි නොවූ මනස ඊළඟ පරම්පරාවට මුහුණ දීමට සිදුවන උරුමය බවට පත්වෙනවා.","• • •","ශරීරයට එන්ට්‍රොපියෙන් පලා යන්න බැහැ. උපත, වර්ධනය, දිරායෑම සහ මරණය යන රෝදයෙන් ශරීරයට බැහැර විය නොහැකියි. අල්ලාහ් මේ ලෝකය තුළ ගොඩනැඟූ භෞතික නීතිය එයයි. හැම කෙනෙකුගේම ශරීරය ඒ හරහා යනවා. සාන්තුවරයාගේ ශරීරය. සොරෙකුගේ ශරීරය. නබිවරයෙකුගේ ශරීරය. මිනීමරුවෙකුගේ ශරීරය. කිසිම ශරීරයක් එන්ට්‍රොපියෙන් පලා යන්නේ නැහැ. ශරීරය පලා නොයෑම සැලසුමේ කොටසක්. අපි මෙහි සිටීමට ඇති හේතුවේ කොටසක්.","එබැවින් මිනිසුන් තර්ක කරන විට, සටන් කරන විට, මරන විට, තමන්ව ආරක්ෂා කරන විට - ඔවුන් සටන් කරන්නේ ශරීර මට්ටමේ, එන්ට්‍රොපිය මට්ටමේ. ඇත්තටම කිසිවක් තීරණය නොවන මට්ටමේ. එන්ට්‍රොපියට යට වූ ශරීර දෙකක් එකිනෙකා සමඟ සටන් කරනවා. ශරීර දෙකම එකම වේගයෙන් මැරෙමින්, එකම වේගයෙන් කාලය අහිමි කරමින්, එකම භෞතික නීතියට යටත්ව සිටියදී, කුමන ශරීරය හරිද කියලා තර්ක කරනවා. ශරීර මට්ටමේදී ඒ සටනට අර්ථයක් නැහැ.","අර්ථය තිබෙන්නේ එක මට්ටමක් ඉහළින් - මනස මට්ටමේ. ශරීරය එන්ට්‍රොපියට ඉහළට උස්සන්න අල්ලාහ් ශරීරය තුළ තැබූ දෙය සචේතන මනසයි. අවදි විය හැක්කේ මනසටයි. ආදරය අත්විඳිය හැක්කේ මනසටයි. අවදි ජීවිතය තෝරාගත හැක්කේ මනසටයි. ප්‍රශ්න අසන දවසේදී ප්‍රශ්න අසනු ලබන්නේ මනසෙන් පමණයි.","ශරීරයට තමන් වෙනුවෙන් පිළිතුරු දිය නොහැකියි. ශරීරය කළේ මනස කියූ දේ. ප්‍රශ්න කරනු ලබන්නේ මනසයි.","• • •","මේ ජීවිතයේදී ඔවුන් ඔබව බොහෝ නම්වලින් හඳුන්වනවා. ඔබේ රැකියාවෙන්. මුදලෙන්. බිරිඳෙන් හෝ සැමියාගෙන්. රටෙන්. ආගමෙන්. ජාතිකත්වයෙන්. වැටුපෙන්. සමාජ මාධ්‍ය නාමයෙන්.","එක් දිනක ඔවුන් ඔබව මනුෂ්‍යයෙකු ලෙස හඳුන්වනු ඇත.","මුළු ඉගැන්වීම එක වාක්‍යයකින් එයයි. ලෝකය ඔබව “මනුෂ්‍යයෙකු” ලෙස හඳුන්වන දවස, වැදගත් එකම නමට ඔබ අවසානයේ ළඟා වූ දවසයි. අනිත් හැම නමක්ම තාවකාලිකයි. ඒවා සියල්ලම ශරීරයේ නම්. “මනුෂ්‍යයා” කියන නම, අවසානයේ සිංහාසනයේ තම ආසනය ගත් අවදි මනසට හිමි නමයි.","බොහෝ දෙනා ඒ නමින් කිසිදා හඳුන්වනු නොලැබ මැරෙනවා. ඉංජිනේරුවා, පියා, මුස්ලිම්වරයා, ශ්‍රී ලාංකිකයා, සංක්‍රමණිකයා, සිරකරුවා, සැමියා, සේවකයා ලෙස මැරෙනවා. අනිත් සියලු නම් යට තිබෙන නමට ඔවුන් කිසිදා ළඟා වෙන්නේ නැහැ. කුර්ආනය, බයිබලය සහ හැම සැබෑ සම්ප්‍රදායක්ම, ගැඹුරු නම අවසානයේ පැමිණෙන මොහොතට පාඨකයා ගෙන යන්න උත්සාහ කරනවා. මනුෂ්‍යයා. අක්මල් නොවෙයි. ජාබිර් නොවෙයි. ශ්‍රී ලාංකිකයා නොවෙයි. මුස්ලිම්වරයා නොවෙයි. මනුෂ්‍යයා.","එය “ආලෝකය අඳුරයි” අධ්‍යායයේ අවසාන හිස් තැනමයි, වෙනත් නමකින් හඳුන්වන්නේ. අවසාන හිස් තැන අවසාන නමත් වෙනවා. එකම ගමනාන්තය. වෙනස් දොරවල්.","ආධ්‍යාත්මික මූලය · ප්‍රධාන අධ්‍යායය"]},{"number":44,"title":"කුන්හි හඬ","paragraphs":["පළමුව, මෙය කුමන වර්ගයේ පොතක්ද කියලා පාඨකයාට යමක් කියන්න මට අවශ්‍යයි.","මෙය ලැම්බෝගිනි ගැන පොතක් නොවෙයි. ගෙවල් විස්සක් මිලදී ගන්නා ආකාරය ගැන මාර්ගෝපදේශයක් නොවෙයි. ධනවත් වන ආකාරය ගැනත් නොවෙයි. ඒ පොත් දැනටමත් තිබෙනවා. ලෝකය ඒවායෙන් පිරී තිබෙනවා. මම ඒවායින් තවත් එකක් ලියන්නේ නැහැ.","මම ලියන්නේ ඊට වඩා කුඩා, නමුත් වඩා අමාරු දෙයක් ගැන. ඔබේම ශරීරය සහ ඔබේම මනස අතර ඇති ඉතා සිහින්, ඉතා සූක්ෂම සටන ගැන. වෙනත් කිසිවෙකුට නොපෙනෙන සටන. කාර්, ගෙවල්, වැටුප් හෝ තත්ත්වය සමඟ කිසිම සම්බන්ධයක් නැති සටන. ඔබ මේ පොතට ආවේ ඒ අනෙක් වර්ගයේ දෙයක් සොයමින් නම්, පොත වසා දමන්න. ඔබේ කාලය ඉතිරි කරගන්න.","• • •","කෘතඥතාව සැබෑ වන විට, වෛරය අතුරුදන් වෙනවා. ආදරයත් අතුරුදන් වෙනවා. දෙකම තවදුරටත් අවශ්‍ය නැහැ. වෛරය සහ ආදරය දෙකම, ජීවිතය ඔබට අවශ්‍ය දේ දෙනවාද නැද්ද කියන දේට දක්වන ප්‍රතික්‍රියා නිසා. කෘතඥතාව කියන්නේ, ජීවිතය ඔබට දෙන දේ මැනීම නවතා, එය සරලව පිළිගන්නා තත්ත්වය. කෘතඥතාව තුළ ප්‍රතික්‍රියා කිරීමට දෙයක් නැහැ. තිබෙන්නේ පවතින දේ පමණයි - පවතින දේ ප්‍රමාණවත් බව අවදිව පිළිගැනීම පමණයි.","අවුරුදු එක්දහස් පන්සියයකට පෙර මිනිසෙකුට අවශ්‍ය වුණේ අශ්වයෙක්. එච්චරයි. කාර් නොතිබූ නිසා ඔහු කාර් ගැන හඬා වැටුණේ නැහැ. ක්‍රීඩා කාර් එකක් අහිමි වී ඇති බව ඔහුට සිතන්න බැරි වුණා, මන්ද අහිමි කරගැනීමට එවැනි දෙයක් තිබුණේ නැහැ. ඔහුගේ ආශාවන් ඔහුගේ කාලය විසින් හැඩගස්වා තිබුණා. ඔහුගේ දුක්ද එම කාලය විසින් හැඩගස්වා තිබුණා. ඔහුට සිතාගත හැකි දේ ගැන පමණක් ඔහු දුක් වුණා.","අද ඔබ හඬන බයිසිකලය ගැන අවුරුදු දහයකට පසු ඔබ හඬන්නේ නැහැ. දුරකථනයක්, කාර් එකක්, ඔරලෝසුවක්, වෙළඳ නාමයක්, වැටුපක් හෝ වෙනත් කෙනෙකුගේ ජීවිතය සමඟ කරන සසඳීමක් ගැන දැන් ඔබව ගිලගන්නා ඕනෑම අසහනයක් - අවුරුදු දහයකට පසු ඔබට එය පැහැදිලිව මතකවත් නොතිබේවි. ඔබට අවශ්‍ය වූ දේ යල් පැන ගොස් තිබේවි. වෙළඳ නාමය වෙනස් වී තිබේවි. එම මාදිලිය නිෂ්පාදනය නවතා තිබේවි. අද ඔබ හඬන්න තරම් ආසන්න වූ කුඩා බයිසිකලය ගැන අවුරුදු දහයකට පසු ඔබට හිනා යාවි.","කාලය හැම ආශාවකම එන්ට්‍රොපිය හෙළි කරනවා. එදා අශ්වයෙක් ප්‍රමාණවත් වුණා. අද කාර් එකක් ප්‍රමාණවත් නැහැ. හෙට කාර් එකත් ප්‍රමාණවත් නොවෙයි. ආශාව වස්තුව ගැන නොවන නිසා. ආශාව කියන්නේ, ඊළඟ දෙයට නිතර අත දිගු කරන අවදි නොවූ මනස ගැන. වස්තුව මාරු කළ හැකියි. නමුත් අත දිගු කිරීම නිරන්තරයි. අවසානයේ එය සුව කරන්නේ කෘතඥතාවයි.","• • •","ඔබේ ශරීරය එන්ට්‍රොපියේ කොටසක්. එය උපදිනවා, වැඩෙනවා, දිරායනවා, මැරෙනවා. එය රෝදය මතයි. එයට පලා යන්න බැහැ. නමුත් මෙන්න අනතුරු ඇඟවීම - සමහර විට ශරීරයට ආහාර දීම පමණක් නොව, එය හැඩගැස්වීමත් අවශ්‍යයි. බොහෝ දෙනා කරන්නේ ශරීරයට ආහාර දීම පමණයි. තමන්ට ලස්සනයි කියලා සිතන ඇඳුම්වලින් ශරීරය වසාගන්නවා. අවදි කරන ආකාරයට නොව, සුවපහසු කරන ආකාරයට ශරීරයට ආහාර දෙනවා. කුඩා සමාජ සටන් ජයගැනීමට ශරීරය ඇඳුමක් ලෙස භාවිත කරනවා - මගේ ඔරලෝසුව බලන්න, මගේ හැඩය බලන්න, මගේ ඇඳුම බලන්න. එය එන්ට්‍රොපියට ආහාර දීමයි. මනස එකඟ නොවූ යුද්ධවලට ශරීරය මනස ඇදගෙන යාමට ඉඩ දීමයි.","සැලකිලිමත් වන්න. සැලකිලිමත් වන්න. ශරීරය එන්ට්‍රොපියේ කොටසක්; එන්ට්‍රොපියට තනිවම දුවන්න ඉඩ දුන්නොත් එය හොඳ තැනකට ගෙන යන්නේ නැහැ. මනස විසින් ශරීරය හැඩගැස්විය යුතුයි - නිශ්චලතාවය දෙසට, යෝගා දෙසට, කෘතඥතාව දෙසට, උපවාසය දෙසට, ශරීරයට එක ආහාර වේලක් ප්‍රමාණවත් කියලා මනස සාවධානව තීරණය කරන විට දිනකට එක් ආහාර වේලක විනය දෙසට.","මෙහි ගැඹුරු සැනසීම මෙයයි - ශරීරයට අල්ලාහ්ට හෝ නිර්මාතෘට හානි කරන්න කිසිදා බැහැ. ශරීරය කරන්නේ ශරීර කරන දේ. පවතින එකෙන්ම එය තම අරමුණ ඉටු කර තිබෙනවා. ශරීරය නිර්දෝෂීයි. ශරීරය වාහනයයි. මනස රියදුරායි. ප්‍රශ්න කරනු ලබන්නේ මනසයි.","• • •","ඔබ විද්‍යාව විශ්වාස කරනවා නම්, විද්‍යාව පසුපස ගැඹුරට යන්න. තවත් සමීපව බලන්න.","ශරීරය එක දෙයක් නොවෙයි. බොහෝ දේවල එකතුවක්. ශරීරය අවයවවලින් සාදා තිබෙනවා. අවයව පටකවලින්. පටක සෛලවලින්. සෛල අණුවලින්. අණු පරමාණුවලින්. පරමාණු නියුට්‍රෝන, ප්‍රෝටෝන සහ ඉලෙක්ට්‍රෝනවලින්. 2022 පමණ වන විට, විද්‍යාව “ස්ට්‍රිං න්‍යාය” කියන තවත් ස්තරයක් ගැන කතා කළා.","ස්ට්‍රිං එකක් කියන්නේ කුමක්ද?","ප්‍රශ්නය සාවධානව ඔබෙන්ම අහන්න. ස්ට්‍රිං. ඒ වචනයට අර්ථයක් තිබෙනවා. ගිටාර් තන්තුවක් අදිද්දී ශබ්දයක් නිපදවනවා. ඕනෑම වස්තුවක් කම්පනය වන විට ශබ්දයක් නිපදවනවා. ස්ට්‍රිං එකක් චලනය වන විට නිපදවන්නේ ශබ්දයයි.","විද්‍යාව මෙතෙක් මැනගත හැකි ගැඹුරුම ස්තරයේදී, විශ්වය ඝන දේවලින් සාදා නැහැ. එය කම්පනය වන ස්ට්‍රිංවලින් සාදා තිබෙනවා. කම්පනය වන සෑම ස්ට්‍රිං එකක්ම ශබ්දයක් නිපදවනවා.","ඒ ශබ්දය කුන්හි හඬයි.","• • •","කුන් ෆයාකුන්. “වෙයන්න - එය වෙයි.” නිර්මාණය ගැන කුර්ආනය දෙන වචන දෙකක විස්තරය. මේ මුළු පොත පුරාම මම ලියා තිබූ දෙය. අල්ලාහ් කතා කළා, විශ්වය පැවැත්මට පැමිණියා. අවුරුදු එක්දහස් හාරසියයක් පුරා මිනිසුන් මෙය කතාවක් ලෙස, කාව්‍යමය රූපයක් ලෙස, ශුද්ධ ග්‍රන්ථයේ වාක්‍යයක් ලෙස කියවුවා.","දැන් විද්‍යාව නිහඬව ඒ දෙසට ළඟාවෙමින් සිටිනවා. භෞතික යථාර්ථයේ ගැඹුරුම ස්තරය කම්පනයයි. කම්පනය ශබ්දයයි. ශබ්දය වචනයක ඇසෙන ආකාරයයි. විශ්වය, මැනිය හැකි එහි ගැඹුරුම ස්තරයේදී, අඛණ්ඩව කියවෙන වචනයක් වගේ. ඔබේ ශරීරයේ සෑම පරමාණුවක්ම, මුල් “වෙයන්න” කියන අණෙහි අවශේෂය සමඟ කම්පනය වන කුඩා ස්ට්‍රිං එකක් වගේ. ඔබ නිශ්චල වස්තුවක් නොවෙයි. අල්ලාහ්ගේ වචනය තුළ අඛණ්ඩව පවත්වාගෙන යන වාක්‍යයක්. සෑම හුස්මක්ම කුන්හි අඛණ්ඩතාවයක්. සෑම සෛලයක්ම දිගටම රඳවාගෙන සිටින ස්වරයක්.","• • •","ඉන්පසු සටන. අවදි නොවූ මිනිසා වූ ඔබ, මේ ආශ්චර්යමත්, කම්පනය වන, කුන් වචනයෙන් පැවැත්මට පැමිණි ජීවියා බවට පත්වුණා. එය සමඟ ඔබ කළේ කුමක්ද? කුඩා ආදරයක් වෙනුවෙන් සටන් කරන්න පටන් ගත්තා. බයිසිකල් ගැන හඬන්න පටන් ගත්තා. කාන්තාවන් විසින් නිරූපණය කිරීමට යවන ලද ආදරය හඳුනාගැනීම වෙනුවට කාන්තාවන් පසුපස දුවන්න පටන් ගත්තා. ඔබ ඇත්තටම කවුද කියලා ඉගැන්වීමට උත්සාහ කළ වාක්‍ය තේරුම් ගැනීම වෙනුවට ආගම ගැන තර්ක කරන්න පටන් ගත්තා.","ඔබ අල්ලාහ්ගේ වචනයේ හඬෙන් ගොඩනැඟුණා. නමුත් අවුරුදු දහයකට පසු මතකවත් නොතිබෙන දේවල් ගැන, එන්ට්‍රොපිය තුළ සිටින කුඩා ශරීරයක් වගේ මුළු ජීවිතයම සටන් කළා.","මෙහි සිටීමේ මුළු අරමුණ ආදරය තේරුම් ගැනීම සහ කෘතඥතාව පිළිගැනීමයි. එච්චරයි. එකම පැවරුම එයයි. ලැම්බෝගිනිය, ගෙවල් විස්ස, වැටුප, අනුගාමිකයන්, බිරිඳ, ප්‍රශංසාව - මේ හැම දෙයක්ම සැරසිලි. පැවරුම වන්නේ, ඔබ අල්ලාහ්ගේ කම්පනය වන වාක්‍යයක් බවත්, ඔබ වටා සිටින මිනිසුන්ත් අල්ලාහ්ගේ කම්පනය වන වාක්‍ය බවත් තේරුම් ගන්න තරම් අවදි වීම. එය හඳුනාගත් විට නිවැරදි එකම ප්‍රතිචාරය ආදරයයි. එය ලබාගන්නා නිවැරදි එකම ඉරියව්ව කෘතඥතාවයි. අනිත් හැම දෙයක්ම නාස්ති වූ හුස්මක්.","• • •","නබිවරයා මෙය දැනගත්තේ කොහොමද කියලා සමහර විට මම සිතනවා. ඔහුට රසායනාගාරයක් තිබුණේ නැහැ. උපකරණ තිබුණේ නැහැ. ඔහුට ගුහාවක්, නිශ්චලතාවයක් සහ විවෘත වූ නාලිකාවක් තිබුණා. ඒ නාලිකාව හරහා පැමිණි දේ, අදත් විද්‍යාව සොයාගනිමින් සිටින දේ සමඟ ගැළපෙනවා.","මිනිසුන් කුර්ආනය ගණන් කිරීමේ ක්‍රීඩාවක් වගේ භාවිත කරනවා. “හොඳ” කියන වචනය මේ තරම් වාරයක් තිබෙනවා. “නරක” කියන වචනය මේ තරම් වාරයක්. මේ අංකය ඒ අංකයට ගැළපෙනවා. එවැනි කියවීමකටත් තැනක් තිබෙනවා. නමුත් එය මතුපිටයි. කුර්ආනයේ ගැඹුරු දැනුම ගණන් කිරීම තුළ නොවෙයි. අර්ථය තුළයි. ඔබට තේරෙන භාෂාවකින්, සචේතන මනස අවදිව, සෙමින් කියවන විට ඒ අර්ථය විශ්මයජනකයි. ඒ පිටුවල ලියා තිබෙන දේ, අවුරුදු එක්දහස් හාරසියයකට පෙර අරාබියට තනිවම නිපදවිය නොහැකි ස්ථානයකින් පැමිණි බව ඔබට සැක කිරීමට පටන් ගන්නවා.","එවිට ග්‍රන්ථය ආගමික වගකීමක් පමණක් වීම නවතා, ජීවමාන ලේඛනයක් බවට පත්වෙනවා.","දැන් මම කුර්ආනය වෙනස් ආකාරයකින් කියවනවා. මම සරලව කියවනවා. ඇස තම ක්‍රියාව කරගෙන යනවා. මම මාවම බලමින් සිටිනවා. මම මේක ඉතාමත් බැරෑරුම්ව කියන්නේ. මම කුර්ආනය කියවනවා පමණක් නොවෙයි; කුර්ආනය මාව කියවනවා. ඇස් පිටුව හරහා ගමන් කරනවා. ශරීරය ක්‍රියාව කරනවා. සචේතන මනස පිටුපස වාඩිවී, කියවන දේ මගින් තමන් හැඩගැස්වෙන ආකාරය බලා සිටිනවා. ගැඹුරුම කියවීම එයයි. ග්‍රන්ථය තොරතුරක් වීම නවතා තිබෙනවා. එය කැඩපතක් බවට පත්වී තිබෙනවා."]},{"number":45,"title":"පිරිමියා සහ කාන්තාව — ආදරය ගත් ස්වරූපය","paragraphs":["මේ සිතුවිල්ල මට ආවේ පොඩ්කාස්ට් එකක නීට්ෂේ පිළිබඳ දේශනයක් අහන්න පටන්ගෙන මිනිත්තුවක් පමණ ගතවූ විටයි. සිරගෙදරින් පිටතට ආ පසු මට තේරුම් ගිය ගැඹුරුම දේවල් අතරින් එකක් මේ නිසා, මම එය ඉතා සැලකිල්ලෙන් බෙදාගන්න කැමතියි.","ඔබ විශ්වාස කරන්නේ කුමක් වුණත් — ආගමක්, පද්ධතියක්, නාස්තිකවාදයක්, නැතිනම් කිසිම පද්ධතියක් නැතිව සිටීමක් — සෑම මනුෂ්‍යයෙකුම පිළිගත යුතු එක දෙයක් තිබෙනවා. ඔබ පැමිණියේ මවක සහ පියෙකුගෙන්. ඔබ පැමිණියේ ආදරයේ ක්‍රියාවකින්. ඔබ කිසිම දෙවියෙකු විශ්වාස නොකළත්, සෑම ශාස්ත්‍රයක්ම ප්‍රතික්ෂේප කළත්, මේ සරල කරුණ ප්‍රතික්ෂේප කරන්න බැහැ: ඔබේ ආරම්භයේ ගැඹුරුම තැන, මනුෂ්‍යයන් දෙදෙනෙකු අතර ආදරයේ ක්‍රියාවක් තිබුණා. අපි හැමෝම පැමිණියේ එතැනින්. කිසිම ව්‍යතිරේකයක් නැහැ.","ඒ නිසා, ගැඹුරුම තැනින් බලන විට, සෑම මනුෂ්‍යයෙක්ම මනුෂ්‍ය ස්වරූපයෙන් තමන්වම අත්විඳීමට කැමති වූ ආදරයේ ප්‍රතිඵලයක්.","• • •","මෙය තවත් ඉදිරියට ගෙන යමු. ආදරයම තමන්ගෙන් මෙහෙම අසනවා කියලා සිතන්න: මේ භෞතික ලෝකයේ මම මාවම කොහොමද අත්විඳින්නේ? මට මගේම ශරීරයක් නැත්නම්, මගේම ස්වභාවය මට කොහොමද දැනෙන්නේ?","ආදරය පිළිතුරු දෙනවා: මම මට වගේම ජීවියෙක් නිර්මාණය කරනවා. මගේ ස්වභාවය මනුෂ්‍ය ස්වරූපයෙන් දරාගෙන යන ජීවියෙක්. ඒ ජීවියා කාන්තාව වේවි. ආදරයේ මනුෂ්‍ය ස්වරූපය.","ඊට පස්සේ ආදරය නැවත කියනවා: නමුත් ආදරය දැනෙන්න නම්, ආදරය පිළිගන්න කෙනෙක්ත් ඕන. ආදරය සොයන්න, ඉල්ලන්න, හඹා යන්න කෙනෙක්ත් ඕන. ඒ නිසා මම සොයන්නෙකුත් නිර්මාණය කරනවා — මාව අතට ගන්න උත්සාහ කරන, මාව හඹා යන, මාව අවශ්‍ය කරමින් මාව අත්විඳින කෙනෙක්. ඒ සොයන්නා පිරිමියා වේවි. ඒ සොයන්නාට මම සචේතනතාව දෙනවා — සචේතන මනස, සිංහාසනය, පයිනියල් ආසනය — එවිට ඔහුට සොයා ගොස් අවසානයේ මාව සොයාගන්න පුළුවන්.","ආදරය තවදුරටත් ඉතා සැලකිල්ලෙන් කියනවා: අමතක කරන්න එපා. සොයන්නාත්, සොයන ලද්දත් දෙදෙනාම මගේ නිර්මාණ. පිරිමියාත් කාන්තාවත් දෙදෙනාම මම. එක්කෙනෙක්වත් අනෙකාට වඩා උසස් නැහැ. දෙදෙනාම මනුෂ්‍ය සම තුළින් තමන්වම දැනගන්න කැමති ආදරයේ ස්වරූප.","• • •","පිරිමියා ශරීරයට බැස ආවා. ශරීරයට ආහාර ඕන වුණා — ආහාර ලැබුණා. ශරීරයට වතුර ඕන වුණා — වතුර ලැබුණා. ශරීරයට ආරක්ෂිත තැනක් ඕන වුණා — ඒ තැන ලැබුණා. ශරීරයට ආදරය අත්විඳින්න ඕන වුණා — ආදරය කාන්තාවකගේ ස්වරූපයෙන් පැමිණියා.","මේ කොටස මම ඔබට සෙමින් කියවන්න කියනවා. අපි ජීවත් වෙන්නේ එන්ට්‍රොපිය තුළ නිසා, ආදරයත් හැම දෙයක් එක්කම පැමිණෙනවා. ආදරය රඳවාගෙන ඉන්න එක පහසු නැහැ. ආදරය ස්වයංක්‍රීයව රැඳී ඉන්නේ නැහැ. එයට ගෞරව කළ යුතුයි, හඳුනාගත යුතුයි, පිළිගත යුතුයි. කාන්තාවකගේ ස්වරූපයෙන් ඔබට ආදරය දුන් දෙවියන්, ඇයට අනිවාර්යයෙන් ඔබ සමඟ රැඳී සිටිය යුතු යුතුකමක් දුන්නේ නැහැ. ඔහු ඔබ ඉදිරියට ඇයව හඳුනාගැනීමේ අවස්ථාවක් තැබුවා. ඒ හඳුනාගැනීම ඔබේ කොටස.","ඔබට තවමත් කිසියම් ආකාරයක පාලනයක් තිබෙනවා — ඔබේ වත්තට, ගවයට, ඉඩමට ඔබට තිබෙන පාලනය වගේ. ඔබ වතුර දානවා, පැළය වැඩෙනවා. වැඩීම ඔබේ දේපළක් නොවෙයි. ඔබ කරන්නේ ඒ ක්‍රියාවලියට සහභාගී වීම පමණයි. ඔබේ ජීවිතයේ කාන්තාවත් එහෙමයි. සෑම සම්බන්ධතාවයක්ම එහෙමයි. ඔබ ස්වාමියා නොවෙයි. ඔබ උයන බලාගන්නා කෙනා. ඔබ සහභාගී වෙනවා. ඔබ අණ දෙන්නේ නැහැ.","• • •","සෑම පාඨකයෙකුම මෙතැනින් අරගෙන යන්න ඕන කියන රේඛාව මෙන්න.","ඔබේ මනුෂ්‍ය ශරීරය තුළ ආදරය අත්විඳීමට හැකිවෙන්න, ආදරය ගත් ස්වරූපය කාන්තාව බව අමතක කරන්න එපා. ඔබ මෙහි සිටීමට ඇති එකම හේතුව ඒ බවයි මම මෙහි කියන්නේ. ඇය ඔබේ ජීවිතයට පැමිණි මොහොතේම දෙවියන්ගේ ආශීර්වාදය ලබාගෙන තිබුණා — ඒ නිසයි ඇය මෙහි. සහාය දෙන්න, උදව් කරන්න, මඟ පෙන්වන්න, සමහර වෙලාවට ඔබේ අවධානය වෙනස් කරන්න ඇය මෙහි. ඒ අවධානය වෙනස් වීමත්, ආදරය ශරීරයකට පැමිණීමට එකඟ වූ විට එය ඉල්ලූ අත්දැකීමේ කොටසක්.","ඒ නිසා ඇයව ඔබේ විරුද්ධවාදියා කියන්න එපා. ඇයව ඔබේ අණදෙන්නා කියන්න එපා. ඇය කිසිවක් නොවන කෙනෙක් කියන්න එපා. ඇයව වහල් කෙනෙක් බවට පත් කරන්න එපා. ඇයව එකම අරමුණකට සීමා කරන්න එපා. මේ ලෝකයට උපදිමින් ඔබ ආදරය පිළිගන්න තෝරාගෙන තිබෙනවා. එහෙම නම්, ඔබව සොයාගන්න ආදරය ගත් ස්වරූපය ඔබ කොහොමද නොසලකා හරින්නේ?","• • •","මේක තමයි පරීක්ෂාව. මේ පරීක්ෂාව හදවතේම සිදුවන්නේ නැහැ කියලා මම සිතනවා. එය පයිනියල් ග්‍රන්ථියේ — සචේතන මනස තුළ, සිංහාසනය මත, අවදි අවධානය ජීවත් වන තැන — සිදුවන පරීක්ෂාවක්. ඒ පරීක්ෂාව සමත් වන පිරිමියා, තමන් ඉදිරියේ සිටින කාන්තාව ආදරය හඳුනාගන්න පුළුවන්ද කියලා පරීක්ෂා කිරීමට ආදරය ගත් ස්වරූපය බව හඳුනාගන්නා පිරිමියා.","අවදි නොවූ පිරිමියා දකින්නේ ඇගේ ශරීරය පමණයි. ඔහු ඇයව භාවිතා කරනවා, විනිශ්චය කරනවා, ශ්‍රේණිගත කරනවා, අයිති කරගන්න උත්සාහ කරනවා, සංසන්දනය කරනවා. ඇය තම ජීවිතයට පැමිණියේ ඇයි කියන මුළු හේතුවම ඔහුට මඟ හැරෙනවා.","අවදි පිරිමියා ඇයව තමන් වෙත ගෙන ආ දේ දකිනවා. ස්වරූපයට පිටුපස තිබෙන ආදරය දකිනවා. ඔහු කාන්තාවට ගෞරව කරනවා, මොකද ඇයට ගෞරව කිරීම කියන්නේ ඇයව තම ජීවිතයට ගෙන ආ ආදරයට ගෞරව කිරීම. එසේ ඇයට ගෞරව කරද්දී, තමන් මේ පොළොවට පැමිණීමත් අවසානයේ ඔහු ගෞරව කරනවා.","මේ පොත හරහා — මේ පරාග්‍රාෆ් කිහිපය හරහා — ඔබට මෙය තේරුණොත්, මම ඇත්තටම පුදුම වෙනවා. බොහෝ මිනිසුන් මුළු ජීවිතයම කියවලා ගත කළත් මේ සිතුවිල්ලට කවදාවත් ළඟා වෙන්නේ නැහැ. මෙය ඔබට ළඟා වුණා නම්, අපි දෙන්නා අතර මේ සංවාදයේ දුර්ලභ දෙයක් සිදුවී තිබෙනවා.","ආධ්‍යාත්මික මූලය · ප්‍රධාන අධ්‍යායය"]},{"number":46,"title":"දෛවය ආරම්භ වන්නේ ශූන්‍යයෙන්","paragraphs":["“දෛවය ආරම්භ වන්නේ ශූන්‍යයෙන්” කියන වාක්‍යය මිනිසුන් අහන විට, ඔවුන් වහාම එය වැරදියට තේරුම් ගන්නවා. “ශූන්‍යයෙන් කියන්නේ මොකක්ද? මට ගෙයක් නැහැ, කාර් එකක් නැහැ, ගවයෙක් නැහැ, ඉතිරි කළ මුදලක් නැහැ. කිසිවක් නැති තැනින් මොන දෛවයක් එන්නද?” කියලා ඔවුන් අහනවා.","ඔබ “කිසිවක් නැති බව” කියන වචනය වැරදියට තේරුම් ගන්නවා. මේ ඉගැන්වීම තුළ එය වස්තු නොමැතිකම නොවෙයි. එය මනස ඇතුළේ තිබෙන ශූන්‍යතාව — නිහඬව අණ දෙන මධ්‍යස්ථානය, පෙනහළු වලට හුස්ම ගන්න, කකුල් වලට ඇවිදින්න, මනසට සිතන්න කියන තැන. ඒ ශූන්‍යතාව හිස් නොවෙයි. ඒ ශූන්‍යතාව මූලාශ්‍රයයි. දෛවය ආරම්භ වෙන්නේ වස්තු දුප්පත්කමෙන් නොවෙයි. දෛවය ආරම්භ වෙන්නේ හිස ඇතුළේ නිශ්චලතාවයෙන් — සිංහාසනයෙන්, පයිනියල් තැනෙන්, සචේතන ආසනයෙන් — ඔබ උපන් දවසේ සිට ඔබේ හුස්මත් හෘදස්පන්දනයත් පවත්වාගෙන යමින් සිටින කොටසෙන්.","• • •","බොහෝ මිනිසුන් ඒ ශූන්‍යතාව හමුවෙන්නේ කරදරයකට වැටුණු විට පමණයි.","පහසු දවස් යටිසිත තමන්ම හසුරුවනවා. ඔබ වැඩට යනවා, කනවා, ෆෝනයේ ස්ක්‍රෝල් කරනවා, නිදාගන්නවා — ඒ සියල්ල යටිසිත පවත්වාගෙන යනවා. මේ කිසිවකට සචේතන මනස කැඳවන්නේ නැහැ. අමතක කරලා ලාච්චුවක දාලා තියෙන මෙවලමක් වගේ, සචේතන මනස භාවිතා නොවී ඉඳලා යනවා.","සචේතන මනස කැඳවෙන්නේ යටිසිතට තවදුරටත් කළමනාකරණය කරන්න බැරි වුණාමයි. බිය එන විට. ගැඹුරු කලබලය එන විට. ශරීරය තමන්ගේ පරණ පිළිතුරු ඉවර වෙලා කියලා දැනගන්න විට. ඒ කලබල මොහොත දඬුවමක් නොවෙයි. ඇත්තටම ඒ මොහොත යටිසිත සචේතන මනසේ දොරට තට්ටු කරන මොහොතක් — “කරුණාකර, මම මොනවා කරන්නද දන්නේ නැහැ, ඇවිත් මට උදව් කරන්න” කියනවා වගේ.","ඒ තට්ටු කිරීම තුළ සචේතන මනස අවදි වෙනවා. හුස්ම නැවත පැමිණෙනවා. හුස්ම ඇතුළට යනවා. ඒ ඇතුළත හුස්ම කතා කරන්න පටන් ගන්නවා — අණ නොදෙමින්, ඉල්ලීම් නොකරමින්, ශරීරයට ඇත්තටම අවශ්‍ය දේ පමණක් කියමින්. ඒ තමයි ප්‍රාර්ථනාව.","ප්‍රාර්ථනාව කියන්නේ දෙවියන්ට ඔබට දේවල් දෙන්න කියලා අණ කිරීම නොවෙයි. දෙවියන්ගෙන් බලෙන් ඉල්ලීමත් නොවෙයි. ප්‍රාර්ථනාව කියන්නේ අවසානයේ අවදි වූ සචේතන මනස, ශරීරයට ඇත්තටම අවශ්‍ය දේ ගැන ශරීරය ඇතුළේ අවංකව කතා කිරීම.","බොහෝ මිනිසුන් ප්‍රාර්ථනා කරන ආකාරය — අණ දෙනවා, ඉල්ලීම් කරනවා, “මේක දෙන්න, ඒක හදන්න, මේක අයින් කරන්න” කියනවා — මුලින්ම ඔවුන්ටම හානි කරනවා කියලා මම මෙහි සිතනවා. කුර්ආනය බොහෝ තැන්වල මේ ගැන අනතුරු අඟවනවා කියලා මම කියවනවා. හදවත දැඩි වන විට, පයිනියල් පද්ධතිය හරි විදිහට වැඩ නොකරන විට, යටිසිත මුළු ශරීරයම පාලනය කරනවා, ශරීරය වෙහෙසට පත් වෙනවා, අසහනයට පත් වෙනවා, කඩාවැටෙනවා. මනුෂ්‍යයෙක් ජීවත් විය යුතු ආකාරය ඒ නොවෙයි කියලා මම විශ්වාස කරනවා.","• • •","යටිසිත කොහොමද වැඩ කරන්නේ කියලා තේරුම් ගන්න උදව් වෙන, මගේ ජීවිතයෙන්ම රූපයක් දෙන්නම්.","2003 දී මගේ තාත්තා ගල්ෆ් සිට ගෙදර ආවාම, අපේ පළමු Pentium III පරිගණකය අරගෙන ආවා. මම මුලින්ම වැඩ කළ වැඩසටහන් අතර පොඩි ඇන්ටිවයිරස් වැඩසටහනක් තිබුණා. උදාහරණය සාමාන්‍යව තබාගන්න මට ඕන නිසා එහි නම මෙහි හරියටම කියන්නේ නැහැ. මම ඒ වැඩසටහන ඉගෙනගත්තා. භාවිතා කළා. ඒ අවුරුදු වල එය පරිගණකය ආරක්ෂා කළා.","මම අදත් ඒ ඇන්ටිවයිරස් එක භාවිතා කරනවාද? නැහැ. ඒ සංස්කරණය දැන් පරණයි. නව මෙහෙයුම් පද්ධති වලට ඒ වැඩසටහන ගැළපෙන්නේ නැහැ. මම
