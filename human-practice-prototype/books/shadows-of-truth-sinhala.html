වැඩි ප්‍රයෝජනවත්. මේ පොත අධිකරණ ශාලාවක සිදුවෙන දේ ගැන නොව, කූඩුවක් ඇතුළේ මිනිසෙකු තුළ සිදුවෙන දේ ගැන. ඒ දෙක වෙනස් කතා දෙකක්. මේක ඒවෙන් එකක්.","• • •","මේ පිටුවල අක්ෂර වින්‍යාසය සහ ව්‍යාකරණය ගැන: මම මුලින් Tamil භාෂාව කතාකරන කෙනෙකු කෙනෙක්, පසුව Sinhala භාෂාව කතාකරන කෙනෙකු කෙනෙක්, ඉන්පසු English භාෂාව කතාකරන කෙනෙකු කෙනෙක්. English මගේ තුන්වන භාෂාව. වැඩිම කියවන්නන්ට ඇතුල් වෙන්න පුළුවන් දොර English කියලා මට දැනුණු නිසා මේ පොත English වලින් ලිව්වා. භාෂාවෙන් මට හැකි හොඳම දේ කළා. English අසම්පූර්ණ තැන් තියෙනවා නම්, අර්ථය තවමත් ඔබ වෙත ළඟා වෙලා ඇති කියලා මම බලාපොරොත්තු වෙනවා. මගේ රටේ කියවන්නන් වෙනුවෙන් Tamil සංස්කරණය එකක් මම කරගෙන යනවා; ඒකත් තමන්ගේම කාලයට එයි.","English ඔබටත් තුන්වන භාෂාවක් නම්, මේ පොත ඔබට ළඟා විය හැකි වුණා නම්, ඒකත් මම මේ විදිහට ලිව්ව හේතුවේ කොටසක්. දොර පුළුල් කරන්න මට ඕන වුණා. කොහේ හරි කුඩා නගරයක, ජීවිතයේ අමාරු මොහොතක මේ පොත අතට ගන්න මිනිසෙකුට හැම පිටුවකටම ශබ්දකෝෂයක් ඕන නොවී කියවන්න පුළුවන් වෙන්න මට ඕන වුණා. සරල බවත් දයාවක ආකාරයක්. මේ පොත ඔබට දයාවෙන් හැසිරී ඇති කියලා මම බලාපොරොත්තු වෙනවා.","• • •","දැන් මම අවසන් කරනවා.","ඔබ මේ පොත මුල සිට අග දක්වා කියවලා නම්, ස්තුතියි. මම ඒක සුළු දෙයක් විදිහට ගන්නේ නැහැ. ලෝකයේ පොත් ගොඩක් තියෙනවා; ඔබේ කාලයෙන් කොටසක් මේ පොත සමඟ ගත කරන්න ඔබ තෝරාගත්තා. ඒක ප්‍රයෝජනවත් වුණා කියලා මම බලාපොරොත්තු වෙනවා. අවම වශයෙන් එක වාක්‍යයක්වත් ඔබ තුළ ඒක අවශ්‍ය වුණු තැනට ගියා කියලා මම බලාපොරොත්තු වෙනවා. මම ලියන මේ නිහඬ සවසක වහල මත සිටින මගේ ලෝකය, ඔබ කියවන ඔබේම නිහඬ සවසක ඔබේ කාමරයට ළඟා වෙලා ඇති කියලා මම බලාපොරොත්තු වෙනවා.","කවදා හෝ ඔබ මුහුද අසල ගලක් මත, ජනේලයක් ළඟ පුටුවක, හෝ ජීවිතයේ අමාරු කාලයක කාමරයක බිම වාඩි වී, ඇස් වසාගත් පසු තැඹිලි ආලෝකය එනවා නම් — ඔබ තනිව නැහැ කියලා දැනගන්න. ඒ ආලෝකය මාව බලා සිටියා වගේ, මට කලින් Shehu Muhammadව බලා සිටියා වගේ, මිනිසෙක් එය ලැබෙන්න තරම් දිගට නිශ්චලව වාඩි වූ මුල් කාලයේ සිට සෑම නිහඬ සෙවන්නෙකුම බලා සිටියා වගේ, ඔබවත් බලාගෙන ඉඳලා තියෙනවා. මේ පේළියට සාදරයෙන් පිළිගන්නවා. ඔබත් මෙතැනට අයිති. හැමෝටම බෙදාගන්න තරම් ගින්න ඕනෑවටත් වැඩියෙන් තියෙනවා.","ඔබ කොහේ ගියත්, ඔබේ මනස ඔබ සමඟ යනවා. ප්‍රශ්නය — ඔබ ඒ මනසට ආහාර දෙන්නේද?","Mathihul Akmal Mohamed Jabir","Malta, 2026","තුන්වන කොටස — වහල මත"]},{"number":60,"title":"විස්තරයෙන් පැහැදිලි කළ දේ","paragraphs":["මම විවෘතව තැබූ පිටුවේ දිගුවක්","• • •","මම හිතාමතාම එක පිටුවක් විවෘතව තැබුවා.","මුලදී, ඇයි කියලා මටම සම්පූර්ණයෙන් තේරුණේ නැහැ. පොත තවමත් සම්පූර්ණයෙන් වසාගෙන නැහැ කියලා විතරයි මම දැනගෙන හිටියේ. පිරිමි ළමයා, පියා, මව, ගම, ගල්ෆ් කලාපය, Dubai, Malta, සිරගෙදර, පළමු නමූ කඩදාසිය, වහලය මත, ඉගැන්වීම්, සාක්ෂිකරුවන්, පොත් දෙක, නිශ්චලත්වයේ වේගය — ඒ හැම කතාවම මම දැනටමත් කියලා තිබුණා. ශරීරය එහි බඩගින්න, බිය, වැඩ, ආදරය, ලැජ්ජාව, වෙහෙස, දිවි රැකගැනීම හරහා මම දැනටමත් අනුගමනය කරලා තිබුණා. මනස අවසානයේ දුවන එක නවත්වපු කාමරය දක්වාත් මම ගිහින් තිබුණා.","ඒත් තවමත් මගේ ඇතුළේ යමක් කිව්වා: එක පිටුවක් තබන්න.","පොත දිගු කරන්න මට ඕන නිසා නොවෙයි. සමහර පොත් පිරෙන්නේ නැතුව තරබාරු වෙනවා. මට මේ පිටුව ඕන වුණේ, තවමත් තමන්ගේ තැනට පැමිණ නොසිටි අවසාන වර්ගයේ අවබෝධයක් තිබුණු නිසා. ඒක තවත් සිදුවීමක් නෙවෙයි. තවත් සිරගෙදර මතකයක් නෙවෙයි. ඒක අර්ථයට පිටුපස තිබුණු අර්ථය — විසිරී තිබුණු සලකුණු එකිනෙකට පසෙකින් නවතින්න පටන් ගත්ත තැන.","ඉදිරියට යන්න කලින් මේක ඉතා සැලකිල්ලෙන් කියන්න ඕන.","මම තෆ්සීර් දෙන්නේ නැහැ. අධිකාරියෙන් කුර්ආන් එක පැහැදිලි කරනවා කියලා මම කියන්නේ නැහැ. මම අවුරුදු ගණන් පාසලක වාඩි වී විද්වතා කෙනෙක් වුණේ නැහැ. මම පොතට ඉහළින් ඉන්නේ නැහැ. මම ඒකට පහළින් සිටින මනුෂ්‍යයෙක් — කැඩුණු, නතර කළ, චෝදනා කළ, ගණන් කළ, නිරීක්ෂණය කළ, සමහර ආයත් මට වෙනස් විදිහකට ඇතුල් වෙන්න තරම් නිශ්චලතාවයට බලෙන් ගෙන ගිය කෙනෙක්.","ඒ නිසා මම මෙතැන දෙන්නේ සාක්ෂියක්. සමහර අර්ථ මගේ ජීවිතයට ස්පර්ශ වූ ආකාරය. විද්වතුන්ගේ පැරණි කියවීම් ඒ තැනම තබාගන්න පුළුවන්. ඒවා ඉවත් කරන්න මම උත්සාහ කරන්නේ නැහැ. මම ඒවාට පසෙකින් තබන්නේ මට අවබෝධය ලැබුණු තුවාලය විතරයි.","ශුද්ධ ග්‍රන්ථයක් අනිත් අයට පැහැදිලි කරන එකත්, ඒ ග්‍රන්ථය ඔබව ඔබටම පැහැදිලි කළ ආකාරය ගැන සත්‍යය කියන එකත් වෙනස් දේවල් දෙකක්. මේ අධ්‍යායය දෙවැනි එක ගැන.","සූරා ෆුස්සිලාත් — විස්තරයෙන් පැහැදිලි කළ දේ","මගේ මනසට නැවත නැවත ආපු වචනය ෆුස්සිලාත් — විස්තරයෙන් පැහැදිලි කළ — කියන අර්ථය.","ඒ අර්ථය පළමු වතාවට ඇහුණු විට, මට සූරාවක මාතෘකාව විතරක් ඇහුණේ නැහැ. මගේම ජීවිතයේ ක්‍රමය එක ඇහුණා. මගේ ජීවිතයේ වැදගත් කිසිම දෙයක් එක වාක්‍යයකින් පැහැදිලි කරලා දීලා නැහැ. අවුරුදු හරහා ඒවා පැහැදිලි වුණා. නැවත නැවත ආ සලකුණු හරහා පැහැදිලි වුණා. මම අහිමි කළ දේ, මම වැරදි ලෙස තේරුම්ගත් දේ, මම පසුපස දුවපු දේ, මම බය වුණු දේ, අවසානයේ නිශ්චලව වාඩි වී බලන්න තරම් සූදානම් වූ දේ හරහා පැහැදිලි වුණා.","පරිවර්තනයක් ඔබට තොරතුරු දෙන්න පුළුවන්. දේශනය එකක් ව්‍යුහය එක දෙන්න පුළුවන්. නමුත් ජීවිතය පීඩනයෙන් පැහැදිලි කරනවා. සිරගෙදර නිදහස එක පැහැදිලි කළා. බලා සිටීම කාලය එක පැහැදිලි කළා. අවමානය අහංකාරය පැහැදිලි කළා. චෝදනාව නම පැහැදිලි කළා. අගුලු දැමූ කළ කාමරයක් ශරීරයත්, ශරීරය ඇතුළේ සිටින කෙනාත් අතර වෙනස පැහැදිලි කළා. දරුවන් අටදෙනෙක් දරාගෙන ගිය මවක් වැඩ කියන්නේ මොකක්ද කියලා පැහැදිලි කළා. අවුරුදු විසිහයක් දුරින් ජීවත් වූ පියා කැපකිරීම එක පැහැදිලි කළා. ලෝකය “මේ මිනිසා ඉවරයි” කියලා හිතන වෙලාවක කැඩුණු පෑනක්, පොතක් කොහොම ආරම්භ වෙන්න පුළුවන්ද කියලා පැහැදිලි කළා.","සූරා ෆුස්සිලාත් මට මෙතරම් ගැඹුරින් ස්පර්ශ කළේ ඒ නිසා. ඒ සූරාව පැහැදිලි කරනු ලැබූ පණිවිඩයක් ගැන කතා කරනවා; නමුත් මිනිසුන්ට පැහැදිලි බව පළමු වතාවේම ලැබෙන්නේ නැහැ. සමහර වෙලාවට පැහැදිලි කිරීම එක අපේ ඉදිරියේම තිබුණත් අපි හැරී යනවා. සමහර වෙලාවට ආයතය හදවතට යන්න කලින් කටේ තියෙනවා. සමහර වෙලාවට සලකුණක් අවුරුදු ගණනක් අපි ළඟම ඉඳලා, අපි ඒක සලකුණක් කියලා දැනගන්නේ බොහෝ පසුව.","ඒ සූරාව තුළ අහසත් පොළොවත් මළ වස්තු විතරක් නෙවෙයි. ඒවා තමන්ගේ රබ්ගේ ආඥාවට ප්‍රතිචාර දක්වනවා. ආසන්න අහස පහන්වලින් අලංකාර කරලා ආරක්ෂා කරනවා කියන රූපකය මට පහන එක, තෙල්, පවුලේ කතාවේ ගින්න, සිරගෙදර ජනේලයට ඉහළින් තිබුණු අහස, ඒකට යටින් තමන්ගේ ජීවිතය වේදනාවෙන් මෙතරම් විස්තරාත්මක වෙලා ඇයි කියලා තේරුම්ගන්න උත්සාහ කරන කුඩා මිනිසාව මතක් කළා.","මම විද්වතා කෙනෙක් විදිහට මේක ලියන්නේ නැහැ. පිටත අහසත් ඇතුළත අහසත් සලකුණුවලින් පිරී ඇති බව දකින්න පටන් ගත්ත මිනිසෙක් විදිහට ලියනවා. ලෝකයට ඉහළින් තරු පහන් වගේ. ඒත් සමහර වෙලාවට මිනිසෙකුගේ ඇතුළේ මතකත් පහන්. පිටව යන පියෙක්. උයන මවක්. පාන්දර තුනට කැස්සෙන සීයෙක්. මැන්ගෝ ගසක් යට පිරිමි ළමයෙක්. පටු ජනේලයක් දිහා බලන සිරකරුවෙක්. ඒ හැම එකක්ම කුඩා ආලෝකයක් දෙන්න පුළුවන් — නමුත් ශරීරය දුවන එක නවත්වලා මනසට බලන්න ඉඩ දුන්නොත් විතරයි.","සූරා ෆුස්සිලාත් මිනිසාගේම ශරීරය සාක්ෂිකරුවෙක් වෙන එක ගැනත් කතා කරනවා. ඇසීම, බැලීම, සම — අපි භාවිත කරන දේවල් විතරක් නෙවෙයි; ඒවා සාක්ෂි දෙන්නත් පුළුවන් කියන රූපකය. සිරගෙදරින් පස්සේ ඒ අදහස මට වෙනස් විදිහකට ඇතුල් වුණා. මගේ ශරීරය වෙනත් අය බලනවා මම දැනටමත් අත්විඳලා තිබුණා: නිලධාරීන්, කැමරා, කඩදාසි, දිනයන්, ගොනු, ඇඟිලි සලකුණු, ඡායාරූප, අධිකරණ ශාලා. නමුත් ඒ හැම එකකටත් ගැඹුරින්, ශරීරයම සටහන් කිරීම කරමින් සිටි බව මම තේරුම්ගන්න පටන් ගත්තා. සමට බිය මතකයි. කනට යතුරු වල ශබ්දය මතකයි. ඇසට අහසේ කුඩා කොටසක් මතකයි. පපුවට ලැජ්ජාව මතකයි. ශරීරය කියන්නේ ජීවිතය සිදුවන තැන විතරක් නෙවෙයි. ආත්මය තේරුම්ගන්න ප්‍රතික්ෂේප කළ දේ ගැනත් ඒක සාක්ෂිකරුවෙක්.","මුලදී ඒක මාව බය කළා. පසුව ඒක මාව මෘදු කළා. ශරීරය සාක්ෂිකරුවෙක් නම්, මට මටම බොරු කියන්න දිගටම බැහැ. පපුව ඇතුළේ පළිගැනීම එක දැල්වෙන බව දැනගෙන “මම සන්සුන්” කියන්න බැහැ. මගේ පුරුදු නිදාගැනීම පෙන්වන විට “මම අවදි” කියන්න බැහැ. මනසට වඩා ශරීරය පෝෂණය කරගෙන “මම සත්‍යයට ආදරය කළා” කියන්න බැහැ. දිව අවංක වෙන්න කලින් ශරීරය සාක්ෂි දෙනවා.","ඒ සූරාව අවසාන පැයේ දැනුම අල්ලාහ් වෙත ආපසු දෙන්නත් මතක් කරනවා. අවසාන වේලාවට කිසිම ආත්මයකට අයිතියක් නැහැ. අවසාන විවෘතවීම හෝ අවසාන වසාගැනීම කිසිම මිනිසෙක් පාලනය කරන්නේ නැහැ. ඒක මාව නමා දැම්මා. මගේ නඩුවේදී මට හැම පිළිතුරක්ම වහාම ඕන වුණා. හැම වැරදි අවබෝධය එකක්ම එක දවසකින් නිවැරදි වෙන්න ඕන වුණා. මට ඇතුළේ සත්‍යය දැනෙන නිසා ලෝකයත් ඒ සම්පූර්ණ සත්‍යයවර දකින්න ඕන වුණා. නමුත් තුවාල වුණු කෙනා ඉල්ලන මොහොතට හැම සත්‍යයක්ම විවෘත වෙන්නේ නැහැ. සමහර සත්‍යයට නියමිත කාලයක් තියෙනවා. සමහර පැහැදිලි කිරීම තවමත් ගමන් කරමින් තියෙනවා. සමහර දොරවල් විවෘත වෙන්නේ හදවත ඒවා මූණතුරුවලින් කඩන්න උත්සාහ කරන එක නවත්වපු පසුව.","මේකෙන් මම යුක්තිය අත්හරිනවා කියන්නේ නැහැ. බොරු පිළිගන්නවා කියන්නේ නැහැ. මට පාලනය කරන්න බැරි කාලය එකකට මගේ ආත්මය භාර දෙන්නේ නැහැ කියන එකයි. මට පැහැදිලිව කතා කරන්න පුළුවන්. මගේ නම ආරක්ෂා කරන්න පුළුවන්. සූදානම් වෙන්න පුළුවන්. බලාගෙන ඉන්න පුළුවන්. ඒ අතරතුර, මේ බලාසිටීම මාව මොන වගේ මනුෂ්‍යයෙක් කරයිද කියලා තෝරන්න පුළුවන්.","සූරා ෆුස්සිලාත්හි අර්ථයෙන්, හොඳත් නරකත් එක වගේ නොවන බවත්, හානියට වඩා හොඳ දේකින් ප්‍රතිචාර දක්වන්න කියන ආරාධනයක් තියෙනවා. තුවාලය කුඩා වුණාම ඒක අගය කරන්න ලේසියි. තුවාලය ඔබේ නම, නිදහස, පවුල, නිදාගැනීම, ශරීරය, අනාගතය ඇතුළට ගියාම ඒක බර වෙනවා.","“වඩා හොඳ දේකින් ප්‍රතිචාර දක්වන්න” කියන එක දුර්වල වෙන්න කියන එක නෙවෙයි. බොරුවට යටත් වෙන්න කියන එක නෙවෙයි. මිනිසුන්ට ඔබව තුවාල කරන්න දීලා ඒකට ආධ්‍යාත්මිකත්වය කියන්න කියන එකත් නෙවෙයි. ඔබට ආපු හානිය ඔබේ ආත්මයේ හැඩය වෙන්න දෙන්න එපා කියන එකයි. ඔබව තුවාල කළ දෙය බවට ඔබම පත්වෙන්නේ නැතුව සත්‍යය ආරක්ෂා කරන්න කියන එකයි. වෙන කෙනෙකුගේ අඳුර ඔබේ ස්ථිර භාෂාව වෙන්න ඉඩ දෙන්න එපා කියන එකයි.","මම තවමත් ඉගෙනගන්න තැන මේකයි. සමහර දවස්වල මම අසාර්ථක වීම වෙනවා. සමහර දවස්වල පපුව උණු වෙනවා. සිතුවිලි වේගයෙන් දුවනවා. එවිට මම මටම අහනවා: දැන් මම මොන දේ පෝෂණය කරනවාද? තුවාලයද? නැත්නම් සාක්ෂිකරුවාද?","ඒ සූරාව ක්ෂිතිජයන් වලත් අපේ ඇතුළේත් සලකුණු ගැන පෙන්වනවා. මේ මුළු පොතම මේ දිශා දෙකෙන් හදලා තියෙන නිසා ඒ අදහස මගෙන් ගියේ නැහැ. ක්ෂිතිජය: මුහුද, අහස, පාර, බෝට්ටුව, සිරගෙදර බිත්තිය, ගුවන් තොටුපළ, ගම, Malta, Qatar, Dubai. ඇතුළත: ලැජ්ජාව, බඩගින්න, ආශාව, බිය, ඉවසීම, අහංකාරය, මතකය, හුස්ම, බලා සිටින්නා. කුර්ආන් එක පිටත සලකුණු සහ ඇතුළත සලකුණු අතර එකක් තෝරන්න මට කියන්නේ නැහැ. දෙකම කියවන්න කියනවා.","විද්‍යාවත් ක්ෂිතිජය කියවමින් ඉන්නවා. ඖෂධය ශරීරය කියවනවා. මනෝවිද්‍යාව හැසිරීම කියවනවා. භෞතික විද්‍යාව චලනය කියවනවා. සෙවන්නා නිශ්චලතාවය කියවනවා. ඒවා අවංක නම්, ඒවා සතුරෝ නෙවෙයි. එකම පුස්තකාලයේ වෙනස් කියවන්නෝ. වැරැද්ද විද්‍යාව කියවීම නෙවෙයි. විස්මය නැතුව විද්‍යාව කියවීමයි. වැරැද්ද ශුද්ධ ග්‍රන්ථයට ආදරය කිරීම නෙවෙයි. ශරීරය, අහස, තුවාලය, ලෝකය තුළ අල්ලාහ් තැබූ සලකුණු කියවන්න ප්‍රතික්ෂේප කරමින් ශුද්ධ ග්‍රන්ථයට ආදරය කරන එකයි.","සූරා ෆුස්සිලාත් තුළ සූර්යයාත් සඳත් වන්දනා කළ යුතු වස්තු නෙවෙයි. ඒවා සලකුණු. දිලිසෙන දේවල් ඉදිරියේ නොනමන්න; ඒවා දිලිසෙන්න කළ එකා ඉදිරියේ නමන්න. ඒක මට ඉතා පුද්ගලික වුණා. මමත් මගේ ආකාරයෙන් අල්ලාහ් නොවන දේවල් ඉදිරියේ නමාගෙන තිබුණා: සම්බන්ධතාවය, ශරීරය, අවධානය, අනුමැතිය, චලනය, මාව තේරුම් ගැනීම, මාව ආශාව කිරීම, මාව දැකීම. ඒවා තමන්ම නරක දේවල් නෙවෙයි. නමුත් ආත්මය ඒවා ඉදිරියේ නමා ගත්තාම පිළිවෙළ කැඩෙනවා. සලකුණක් පිළිමය එකක් වෙනවා, ඒ සලකුණ පෙන්වන එකා අපි අමතක කළාම.","ඒ නිසා සූරාව මට කැඩපතක් වුණා. දුර අතීතයේ මිනිසුන් ගැන විතරක් ඒක කතා කළේ නැහැ. මාව ගැනත් කතා කළා. හොඳ දේ ඉල්ලලා, හානියක් ඇවිත් සෙලවුණාම බලාපොරොත්තු නැති වන මිනිසා. දයාව ලැබිලා “මේක මගේ දෙයක් වෙන්න ඇති” කියන මිනිසා. අහනවා, නමුත් සවන් දෙන්නේ නැති මිනිසා. කට කියන්න සූදානම් දේට වඩා වැඩි සත්‍යය ශරීරය දන්න මිනිසා. තමන්ට තමන් විස්තරයෙන් පැහැදිලි කරලා දිය යුතු මිනිසා.","සූරා අර්-රහ්මාන් — නැවත නැවත පැමිණෙන දයාව","ඊට පස්සේ සූරා අර්-රහ්මාන්.","මම ඒක “මගේ ආත්මයේ සූරාව” කියලා හැඳින්වූවා, සාමාන්‍ය උපදෙස්වලට කරන්න බැරි දෙයක් ඒක අහංකාරයට කරන නිසා. මිනිසෙක් වාද කරන විදිහට ඒක වාද කරන්නේ නැහැ. ඒක නැවත නැවත කියනවා. මිනිසාව එකම ප්‍රශ්නයට ආයෙත් ආයෙත් ගෙන එනවා: ඔබේ රබ්ගේ කුමන දානය ඔබ ප්‍රතික්ෂේප කරනවාද?","සමහර අය නැවත නැවත කිරීම අහලා එපා වූ වෙනවා. නමුත් අහංකාරයට නැවත නැවත කිරීම ඕන, අහංකාරය ඉක්මනින් අමතක කරන නිසා. උදේ කෑම ලැබුණු කෙනෙක් දවල් වෙද්දී පැමිණිලි කරන්න පුළුවන්. මුදල් නොගෙවා හුස්ම ගන්න, බලන්න, සිතන්න, ආදරය ලබන්න, සමාව ලබන්න පුළුවන් — ඒත් ජීවිතය කිසිම දෙයක් දීලා නැහැ වගේ හැසිරෙන්නත් පුළුවන්. ඒ නිසා දයාව නැවත කියනවා. නැවත දොරට තට්ටු කරනවා. නැවත අහනවා. අල්ලාහ් පිළිතුර නොදන්න නිසා අහනවා නෙවෙයි. මිනිසා තමන්ව නොදන්න නිසා අහනවා.","සූරා අර්-රහ්මාන් හැම දෙයකටම පෙර දයාවෙන් ආරම්භ වෙනවා. අර්-රහ්මාන්. පසුව කුර්ආන් උගන්වීම. පසුව මිනිසා නිර්මාණය කිරීම. පසුව ප්‍රකාශනය, කතා කිරීමේ හැකියාව. මේ පිළිවෙළ මාව ගැඹුරින් ස්පර්ශ කළා. මගේ ශරීරයට පෙර දයාව තිබුණා. මගේ කතාවට පෙර ඉගැන්වීම තිබුණා. මගේ පැහැදිලි කිරීම එකට පෙර, මම හදපු එකක් නොවන තෑග්ග එකක් තිබුණා.","මිනිසෙක් හිතන්නේ තමන් භාෂාව තමන්ගේ කරන නිසා කතා කරනවා කියලා. නමුත් ප්‍රකාශනය දයාවක්. “මට තුවාලයි”, “මට සමාවෙන්න”, “මට මතකයි”, “මම සමාව දෙනවා”, “මට තේරෙන්නේ නැහැ”, “මම උත්සාහ කරනවා” — මේවා කියන්න පුළුවන් එක කුඩා දෙයක් නෙවෙයි. සිරගෙදර මට ප්‍රකාශනය එකේ වටිනාකම පෙන්නුවා. ඔබේ කටට ආදරය කරන මිනිසුන් ළඟට යන්න බැරි වෙලාවක පෑන පූජනීය වගේ වෙනවා. පිටුව දෙවැනි හුස්මක් වෙනවා. වාක්‍යයක් ඇතුළේ තවම කෙනෙක් ඉන්නවා කියන සාක්ෂියක් වෙනවා.","ඊට පස්සේ සූරාව පිළිවෙළ වෙත යනවා. සූර්යයාත් සඳත් මිනුමකට ගමන් කරනවා. අහස උස් කරලා තියෙනවා. සමතුලිතතාව එක තබලා තියෙනවා. සමතුලිතතාව එක උල්ලංඝනය කරන්න එපා. යුක්තියෙන් තරාදිය තබන්න. මිනුම අඩු කරන්න එපා. මේක වෙළඳපොළවල්, මුදල්, මිනුම ගැන විතරක් නෙවෙයි. ඇතුළත පරිමාණය ගැනත්.","මම අසමතුලිතතාව තුළ ජීවත් වෙලා තිබුණා. මනසට වඩා ශරීරය. ප්‍රඥාවට වඩා ආශාව. නිශ්චලතාවයට වඩා චලනය. සාක්ෂිකරුට වඩා ප්‍රතිචාරය. සමහරවිට අපේක්ෂාව එක්ක මිශ්‍ර වූ දීම. බඩගින්න එක්ක මිශ්‍ර වූ ආදරය. පුරුද්ද එක්ක මිශ්‍ර වූ විශ්වාසය. මගේ ඇතුළේ පරිමාණය හැමදාම සෘජු නොවුණා. සූරා අර්-රහ්මාන් මාව කෲර ලෙස චෝදනා කළේ නැහැ. මැවීමේ පිළිවෙළ පෙන්නලා, ඒක ඉදිරියේ මගේ අක්‍රමිකතාව මට දැකගන්න ඉඩ දුන්නා.","සූර්යයාත් සඳත් තමන්ගේ මිනුම තබනවා නම්, මුහුද තමන්ගේ සීමාව තබනවා නම්, බීජයක් තමන්ගේ කාලයට පලතුරක් වෙනවා නම්, මගේ උපදෙස් එකක් නැතුව ශරීරය කුඩා තුවාලයක් සුව කරන්න දන්නවා නම් — මිනිසා සමතුලිතතාව නැතුව ජීවත් වෙන්න ඇයි මෙතරම් අවධාරණය කරන්නේ? අපේම පරිමාණය කඩාගෙන, හදවත බර වුණාම ලෝකයට දොස් කියන්නේ ඇයි?","ඒ සූරාවේ පෘථිවිය ජීවීන්ට සූදානම් කරලා තියෙනවා. පලතුරු, ධාන්‍ය, සුවඳ, සැපයීම. කියවන්නා ඉදිරියේ දයාව නැවත නැවත තබනවා; අවසානයේ ප්‍රතික්ෂේපය එකම ලැජ්ජාවක් වෙන තරම්. “ඔයා එන්න කලින් කොච්චර දේ සූදානම් කරලා තිබුණාද බලන්න. ඔයා ආවේ දැනටමත් පිළියෙල කළ මේසයකට පසුව. ඒත් කිසිම දෙයක් ලැබුණේ නැහැ වගේ පැමිණිලි කරනවා” කියලා වචනය එක කියනවා වගේ.","මේක මගේ මව දිහා බලන විදිහ වෙනස් කළා. ඇගේ කුස්සිය එකත් අපි වෙනුවෙන් සූදානම් කරපු කුඩා පෘථිවියක්. බත්, තේ, ව්‍යංජනය, පාන්, කනස්සල්ල, සේදීම, කෑගැසීම, මෘදුකම, විනය, යාච්ඤාව. හැමදාම යම් ආකාරයක මේසය එකක් ඇය සකස් කළා. සාමාන්‍ය දෙයක් වගේ පෙනුණු නිසා අපි ඒකට දයාව කියලා නම දුන්නේ නැහැ. නමුත් බොහෝ දයාව සාමාන්‍ය වගේ පේන්නේ ඒක අහිමි වෙන තුරු.","සූරාව මිනිසාව මැටිවලින්ත් ජින්නුව දුම නැති ගින්නෙන්ත් නිර්මාණය කළ බව කියනවා. මැටි සහ ගින්න. ශරීරය සහ බලය. බර සහ චලනය. ස්වරූපය සහ ශක්තිය. මගේම මාතෘකාව මට මතක් වුණා: මනස සහ ශරීරය. ශරීරය මැටි වගේ: බරයි, බඩගිනි වෙනවා, වෙහෙසෙනවා, සැනසීම, ස්පර්ශය, ආහාර, නින්ද ඕන. මනස ගින්න වගේ වෙන්න පුළුවන්: වේගවත්, නොපෙනෙන, අසන්සුන්, දැල්වෙන, ශරීරයට යන්න බැරි තරම් දුරට යන. නමුත් දයාව නැතුව මැටිවත් ගින්නවත් ආරක්ෂිත නැහැ. රූහ් නැති මැටි බර විතරක් වෙනවා. සමතුලිතතාව නැති ගින්න විනාශයක් වෙනවා.","ඊට පස්සේ හමුවෙන මුහුදු දෙක සහ ඒවා අතර බාධකය. ඒවා එකිනෙකට ස්පර්ශ වෙනවා, නමුත් එකිනෙකා මත ගලාගෙන යන්නේ නැහැ. ඒ රූපය මගේ ජීවිතයේ බොහෝ තැන්වලට ආවා. පිරිමියා සහ කාන්තාව. ශරීරය සහ මනස. ආදරය සහ සීමාව. විශ්වාසය සහ විද්‍යාව. කථනය සහ නිහඬතාව. ශ්‍රී ලංකාව සහ Malta. අතීතය සහ අනාගතය. ප්‍රඥාව තබපු සීමාවක් තියෙනවා නම්, ඒවා එකිනෙකා විනාශ නොකර හමුවෙන්න පුළුවන්.","මගේ වේදනාවෙන් ගොඩක් ආවේ සීමා ගැලපෙන්නේ නැති වෙලාවල. මම ආදරය කියපු දේ සමහර වෙලාවට අවශ්‍යතාව වෙත ගියා. රැකබලා ගැනීම කියපු දේ අපේක්ෂාව අරගෙන ගියා. විශ්වාසය කියපු දේ අනතුරු ඇඟවීම නොසලකා හැරියා. නිහඬතාව කියපු දේ බිය වුණා. සූරා අර්-රහ්මාන් මට මතක් කළා — මුහුදු දෙකටත් බාධකයක් ඕන. ඒවා එකිනෙකාට වෛර කරන නිසා නොවෙයි; සමහර වෙලාවට දයාව ආරක්ෂා කරන්නේ වෙන් කිරීමෙන් නිසා.","මුහුදෙන් මුතු සහ කොරල් එනවා. සැඟවුණු ලස්සන. පීඩනය සහ ගැඹුරෙන් කුඩා වටිනා දෙයක් හැදෙනවා. ඒකත් මගේ අවබෝධයේ කොටසක් වුණා. මුතු ඇටයක් සැනසීමක හදෙන්නේ නැහැ. කොරල් වියළි තැනක පැනනගින්නේ නැහැ. සමහර අලංකාරය පීඩනය, ලුණු, ගැඹුර, කාලය හරහා එන්න පුළුවන්. මම වේදනාව ලස්සනයි කියන්නේ නැහැ. වේදනාව අයිති කරගන්න උත්සාහ කළ තැන්වලින් අල්ලාහ් අලංකාරය ගෙන එන්න පුළුවන් කියනවා.","අර්-රහ්මාන්හි නැවත නැවත අහන ප්‍රශ්නය මගේ මනසට විනයක් වුණා. කුමන දානය ඔබ ප්‍රතික්ෂේප කරනවාද? හුස්ම? මව? පියා? ගුරුවරයා? නාඳුනන කෙනා? පෑන? තව කාලයක් දුන් අධිකරණය දිනය එක? ශරීරය නතර කළ සිරගෙදර බිත්තිය? අහගෙන සිටි මිතුරා? ලැබුණු කෑම? උගන්වපු වැරැද්ද එක? “ඇතුළේ කවුද?” කියලා අහන්න කරපු කඩා වැටීම?","අවංක නම්, දානයක් ඇතුළේම සිටගෙන මම දානය ගොඩක් ප්‍රතික්ෂේප කරලා තියෙනවා. කාලය අපතේ යවන්න කරලා කාලයේ දානය ප්‍රතික්ෂේප කළා. ශරීරයට වැරදි කෑම දීලා ශරීරයේ දානය ප්‍රතික්ෂේප කළා. බිය සමඟ ආදරය මිශ්‍ර කරලා ආදරයේ දානය ප්‍රතික්ෂේප කළා. අර්ථය නැතුව ශබ්දය දරාගෙන විශ්වාසයේ දානය ප්‍රතික්ෂේප කළා. නිශ්චලතාව මතට බලෙන් තල්ලු වෙන තුරු නිශ්චලතාවයේ දානය ප්‍රතික්ෂේප කළා.","ඒත් දයාව අහන එක නවත්වලා නැහැ. නැවත නැවත කිරීමට මම ආදරය කරන්නේ ඒ නිසා. ඒක කාව්‍යය විතරක් නෙවෙයි. ප්‍රතිකාරයක් එකක්. අහංකාරය මවාපෙන්වීම කරන එකෙන් වෙහෙසට පත් වෙන තුරු ඒක එකම තුවාලයට නැවත යනවා. “නැවත බලන්න. නැවත ගණන් කරන්න. නැවත පිළිගන්න. ඔබ හදපු නොවන තෑගි ඇතුළේ ඔබ ජීවත් වෙනවා” කියලා කියනවා.","එක ජීවිතයක් තුළ සූරා දෙක","සූරා ෆුස්සිලාත් සහ සූරා අර්-රහ්මාන් එකිනෙකට පසෙකින් තැබුවාම, මේ පොතේ අවසානය සම්පූර්ණ කරන චලන දෙකක් මට පේනවා.","ෆුස්සිලාත් කියනවා: සලකුණු විස්තරයෙන් පැහැදිලි වේවි. ක්ෂිතිජයන් දිහා බලන්න. ඔබේම ඇතුළට බලන්න. ශරීරයට සාක්ෂි දෙන්න ඉඩ දෙන්න. දිලිසෙන දේ වන්දනා කරන්න එපා. “මගේ රබ් අල්ලාහ්” කියලා කියලා පසු ස්ථිරව සිටින්න. නරක ඔබ තුළට ඇවිත් ඔබම නරක බවට පත් වෙන්න ඉඩ නොදී නරක හමුවන්න.","අර්-රහ්මාන් කියනවා: මේ හැම පැහැදිලි කිරීම එකක්ම දයාව තුළ වට කරලා තියෙනවා. කුර්ආන් උගන්වන්නේ දයාව. මිනිසා නිර්මාණය කරන්නේ දයාව. කතා කිරීම දයාව. සමතුලිතතාව දයාව. සීමා දයාව. සැපයීම දයාව. නැවත නැවත කිරීම දයාව. අහංකාරය කඩන ප්‍රශ්නය පවා දයාව.","එක සූරාව විස්තරය එක පැහැදිලි කළා. අනෙක් සූරාව විස්තරය එක ඇතුළේ තිබුණු දයාව පැහැදිලි කළා.","මගේ ජීවිතයටත් වුණේ ඒක. විස්තර අහඹු නෙවෙයි. බෝට්ටුව පුළුස්සපු පිරිමි ළමයා. සුනාමියට පෙර පරාටා හදපු පිරිමි ළමයා. රුපියල් අනූවේ දූතයා. බයිසිකලයේ සීයා. නොදන්න උස්තාද්. Musammil Alim සහ අඹ කොළ. ගල්ෆ් කලාපයේ පියා. දරුවන් අටදෙනෙක් දරාගෙන සිටි මව. Dubai ශරීරයට ආහාර දුන්නා. Malta ශරීරය නතර කළා. සිරකුටිය 13. Thomas සහ කැඩුණු පෑන. පරවියා. වහලය මත. පොත. ඡායාරූප. විවෘතව තැබූ අධ්‍යාය. ඒ හැම එකක්ම පැහැදිලි කිරීමක් වුණේ දයාව මට ඒවා එකට කියවන්න ඉඩ දුන්නාම.","මේකෙන් මට හැම දෙයක්ම තේරෙනවා කියන්නේ නැහැ. එහෙම නැහැ. “මට හැම දෙයක්ම තේරෙනවා” කියන මිනිසා තව ඉගෙනගන්න නොහැකි තැනකට නතර වෙලා. අවසාන පාඩම “මම සම්පූර්ණ වුණා” කියන එක නෙවෙයි. මම සම්පූර්ණ නොවූ තැන් දැනගන්න පටන් ගත්තා කියන එක.","ඒක වෙනස් වර්ගයේ දයාව.","තමන් ඉවරයි කියලා හිතන මිනිසෙකුට වැඩෙන්න බැහැ. තමන් තවමත් ඉවර නැහැ කියලා දන්න මිනිසෙකුට පරවියෙක්ගෙන්, කෝපි කෝප්පය එකකින්, ආයතයකින්, බෝට්ටුවකින්, දරුවෙකුගෙන්, මවකගෙන්, පියෙකුගෙන්, නාඳුනන කෙනෙකුගෙන්, සිරගෙදර බිත්තියකින්, විනිසුරු කෙනෙකුගෙන්, පිරිසිදු කරන්නා කෙනෙකුගෙන්, වහලය මතක පැළය එකකින්, වසාගන්න ප්‍රතික්ෂේප කරන පිටුවකින් තවමත් ඉගෙනගන්න පුළුවන්.","සමහරවිට මම විවෘතව තැබූ පිටුව මට කියන්න උත්සාහ කළේ මේක. මිනිසා ඉවර නැති නිසා පොතත් ඇත්තටම ඉවර නැහැ. අධ්‍යාය පැමිණෙනවා, නමුත් අධ්‍යායෙන් පස්සේ ජීවිතය දිගටම යනවා. ඡායාරූප ඇල්බමය එක පැමිණෙනවා, නමුත් මුහුණු රුධිරය තුළ දිගටම යනවා. අවසාන පිටුව වසාගන්නවා, නමුත් සාක්ෂිකරුවා තවමත් ඇවිදගෙන යනවා.","ඒ නිසා “මට හැම පිළිතුරක්ම තියෙනවා” කියලා මවාපෙන්වීම කරමින් මේ පොත අවසන් කරන්න මට ඕන නැහැ. මාව නැවත නැවත බේරාගත්ත ප්‍රශ්නය කියවන්නාගේ අතේ තබලා අවසන් කරන්න මට ඕන:","ඇතුළේ තවමත් බලා සිටින්නේ කවුද?","ඔබ ඒ කෙනාව හොයාගත්තාම, ඔහුව ආරක්ෂා කරන්න. ඔහුට ආහාර දෙන්න. ඔහුට පොත් දෙකම කියවන්න දෙන්න. පැහැදිලි කිරීමට පෙර ශබ්දය අහන්න දෙන්න. අල්ලාහ්ව අහිමි කරගන්නේ නැතුව ස්වභාවධර්මයෙන් ඉගෙනගන්න දෙන්න. සත්‍යයට බය නොවී අල්ලාහ්ව සොයන්න දෙන්න. මනස හැඩගැස්වූ මවට, දුර දරාගෙන ගිය පියාට, ගින්න දරාගෙන ආ මුතුන්මිත්තන්ට, ආත්මයට කතා කරන්න තරම් ශරීරය නතර කළ වේදනාවට ගෞරව කරන්න දෙන්න.","නිශ්චල වෙන්න සිරගෙදර එකක් එනකල් බලාගෙන ඉන්න එපා. “මම කවුද?” කියලා අහන්න කඩා වැටීමක් එනකල් බලාගෙන ඉන්න එපා. ශරීරය අගුලු දැමූ කරනකල් මනසට ආහාර දෙන්න පටන් ගන්න බලාගෙන ඉන්න එපා.","වාඩි වෙන්න. හුස්ම ගන්න. බලන්න. ලෝකය කියවන්න. පොත කියවන්න. ඔබව කියවන්න.","පැහැදිලි කිරීම දැනටමත් සිදුවෙමින් තියෙන්න පුළුවන්.","• • •","අල්ලාහ්,","මේ අධ්‍යාය තුළ සත්‍යයක් තිබේ නම්, ඒ සත්‍යය අවශ්‍ය හදවතට ළඟා කරවන්න.","මම වැරදි ලෙස තේරුම්ගෙන තිබේ නම්, දයාවෙන් මාව නිවැරදි කරන්න.","මම වැඩිපුර කතා කරලා තිබේ නම්, නිහඬතාවය මට උගන්වන්න.","මම වැඩිපුර සැඟවී තිබේ නම්, ධෛර්යය මට උගන්වන්න.","මගේ වේදනාව වෙන කෙනෙකුට ආලෝකයක් වෙන්න පුළුවන් නම්, ඒක අහංකාරයක් නොවී ආලෝකයක් වෙන්න දෙන්න.","කවුරුවත් ගණන් නොකළ දින ගණනාවක් දරාගෙන ගිය මගේ මව ආරක්ෂා කරන්න.","මුහුද එහා තමන්ගේ අවුරුදු දුන් මගේ පියා ආරක්ෂා කරන්න.","කතා, රුධිරය, විනය සහ නිහඬතාව හරහා මට ගින්න ළඟා කළ මුතුන්මිත්තන්ට දයාව දෙන්න.","මේ පොත වෛරය වැඩි කරන එකක් වෙන්න දෙන්න එපා. එක හදවතක් මෘදු කරන්න. එක මනසක් අවදි කරන්න.","ශරීරය මුළු කතාව නොවන බවත්, ඉතාම අඳුරු කාමරයක පවා ඇතුළේ තවමත් කෙනෙක් බලාගෙන ඉන්න බවත්, අවම වශයෙන් එක මනුෂ්‍යයෙකුට මතක් කරවන්න.","ආමීන්.","තුන්වන කොටස — වහල මත"]},{"number":61,"title":"ශරීරය දිවි රැකගනී, නමුත් ආත්මය මතක තබාගනී","paragraphs":["• • •","60 වන අධ්‍යාය මගේ ජීවිතය හරහා මාව අනුගමනය කළ සලකුණු එකට ගෙන ආවා. නමුත් ඒවා යටින් තවමත් එක ප්‍රශ්නයක් තිබුණා: මගේ ඇතුළේ දිවි රැකගත්තේ මොකක්ද, සාක්ෂි දුන්නේ මොකක්ද, මතක තබාගත්තේ මොකක්ද?","ශරීරය දිවි රැකගනී. මනස පැහැදිලි කරයි. නෆ්ස් ප්‍රතිචාර දක්වයි. කල්බ් සාක්ෂි දරයි. රූහ් මතක තබාගනී.","මම මේක විද්වතෙකු විදිහට ලියන්නේ නැහැ; විධිමත් තෆ්සීර් එකක් දෙන්නත් නැහැ. කුර්ආන් එකට විද්වතුන් ඉන්නවා, ඔවුන්ගේ වැඩ තමන්ගේ තැනේ තියෙනවා. මම ලියන්නේ අහපු, වේදනා විඳපු, බලපු, යාච්ඤා කළ, භාවනා කළ, කැඩුණු, ආපහු හැරුණු, තමන්ගේම ශරීරය සහ ජීවිතය හරහා අල්ලාහ් තමන්ට පෙන්වූ දේ තේරුම්ගන්න උත්සාහ කළ මිනිසෙක් විදිහට.","මෑතකදී ඉගැන්වීම් තුනක් මට කැඩපත් තුනක් වගේ ආවා. ඒවා හැම එකක්ම මගේ සම්ප්‍රදායෙන් නෙවෙයි. ඒවා තුළ තිබුණු සමහර වචන මගේ වචන නෙවෙයි. සමහර යොමු බයිබලය එකෙන්. සමහර භාෂාව විද්‍යාවෙන්. සමහර දේ වෙනත් ආධ්‍යාත්මික සම්ප්‍රදායන් වලින්. ඒ හැම එකම පිටපත් කරන්න මට ඕන නැහැ. ඒවා බලෙන් ඉස්ලාමය එකට ඇතුල් කරන්නත් ඕන නැහැ. කැඩපතක් වුණු දේ අරගෙන, ඒකට නිවැරදි භාෂාව කුර්ආන් එකෙන් ලැබෙන්න ඉඩ දෙන්න මට ඕන.","මේ අධ්‍යායේ මගේ ක්‍රමය ඒකයි.","පළමු කැඩපත අඳුර, භාවනාව, ශරීරයේ සැඟවුණු රිද්ම, නිශ්චලතාවය ඇතුළත පද්ධතිය වෙනස් කරන හැටි ගැන කතා කළා. දෙවැනි කැඩපත කොඳු ඇට පෙළ එක හරහා අභ්‍යන්තර මධ්‍යස්ථාන ඔස්සේ මිනිසා තුළ ශක්තියක් ඉහළට යන රූපකය ගැන කතා කළා. තුන්වැනි කැඩපත සරල නමුත් භයානක වාක්‍යයක් කිව්වා: ඔබ ඔබේ ශරීරය නෙවෙයි; ශරීරය දිවි රැකගැනීම මත දුවනවා, බිය වැඩසටහනක් වෙන්න පුළුවන්.","මම ඒවා මතුපිටේම තැබුවොත් ඒවා අහිමි වෙනවා. අන්ධ ලෙස පිටපත් කළොත් පොත දුර්වල වෙනවා. නමුත් ඒවා කුර්ආන් හරහා, මගේම ජීවිතය හරහා, නෆ්ස්, කල්බ්, රූහ්, දික්ර්, රාත්‍රිය, සලකුණු, බිය, ආපසු හැරීම කියන භාෂාව හරහා ඇතුළට ගත්තොත්, ඒවා ප්‍රයෝජනවත් දෙයක් වෙනවා.","ඒවා මගේ අධ්‍යාය වෙනවා.","• • •","ශරීරය දිවි රැකගනී.","ඒ වාක්‍යය කුඩා වගේ පේනවා. ඒක තේරුම්ගන්න මට අවුරුදු ගියා.","ශරීරය මෝඩ නෙවෙයි. ශරීරය පැරණි. මනස අනතුර පැහැදිලි කරන්න කලින්ම අනතුරේ මතකය ශරීරය දරාගෙන ඉන්නවා. පපුව තද කරන හැටි, හෘද ස්පන්දනය වැඩි කරන හැටි, හුස්ම නවත්වන හැටි, බඩ අක්‍රිය කරන හැටි, මාංශ පේශි ගල් කරන හැටි, රුධිරය උණු කරන හැටි, භයානක දෙයක් සඳහා මිනිසාව සූදානම් කරන හැටි ශරීරය දන්නවා. බිය ඇත්තද බොරුවද කියලා ශරීරය මුලින් අහන්නේ නැහැ. ඒක අහන්නේ එක ප්‍රශ්නයක්: අපි බේරෙයිද?","දිගු කාලයක් මම හිතුවේ ශරීරයේ පිළිතුරම මගේ පිළිතුර කියලා. ශරීරය කම්පනය වුණොත් “මමම බිය” කියලා හිතුවා. පපුව බර වුණොත් “මම ඉවරයි” කියලා හිතුවා. මනසම මතකය නැවත නැවත නැවත ධාවනය කළොත් නැවත නැවත කිරීමම සත්‍යය කියලා හිතුවා. නිදාගන්න බැරි වුණොත් අල්ලාහ් මගෙන් දුර ගියා කියලා හිතුවා. නමුත් සෙමින් මම දැක්කා — ශරීරය බොරු කියන්නේ නැහැ. ඒක කතා කරනවා. වාර්තා කරනවා. මගේ ඇතුළේ පැරණි දිවි රැකගැනීම පද්ධතියෙන් පණිවිඩය එකක් ගෙන එනවා.","ශරීරය කියන්නේ: මෙතැන යමක් සිදු වුණා. යමක් මාව බය කළා. යමක් තවමත් සන්සුන් වී වෙලා නැහැ.","ඒකෙන් ශරීරය රජු කියන එක අදහස් කළේ නැහැ. ඒකෙන් අදහස් වුණේ ශරීරය තමන්ගේම වර්ගයේ සාක්ෂිකරුවෙක් කියන එක.","ශරීරය දිවි රැකගනී. මනස පැහැදිලි කරයි. නෆ්ස් ප්‍රතිචාර දක්වයි. කල්බ් සාක්ෂි දරයි. රූහ් මතක තබාගනී.","දැන් මට තියෙන සිතියම මේක. මේක විද්‍යාත්මක රූප සටහන එකක් නෙවෙයි. තමන්ගේම නිර්මාණය තේරුම්ගන්න උත්සාහ කරන මිනිසෙකුගේ සිතියම. ශරීරය භාරයක්. මනස මෙවලම එකක්. නෆ්ස් පරීක්ෂාවක්. කල්බ් සාක්ෂිකරුවෙක්. රූහ් මගේ රබ්ගේ ආඥාවට අයිති අභිරහසක්.","මේ පිළිවෙළ අමතක වුණාම හැම දෙයක්ම මිශ්‍ර වෙනවා. ශරීරය රජු වුණොත් බිය මාව පාලනය කරනවා. මනස රජු වුණොත් අධික ලෙස සිතීම. නෆ්ස් රජු වුණොත් ආශාව, කෝපය, අහංකාරය, ලැජ්ජාව, පළිගැනීම. නමුත් සිහිකිරීම ආපහු ආවාම, හැම කොටසක්ම තමන්ගේ තැන හොයාගන්නවා.","මනස සහ ශරීරය කියනකොට මම අදහස් කරන්නේ මේක. ඒක සිතුවිලි සහ මාංසය අතර සටන එකක් විතරක් කවදාවත් නෙවෙයි. මුළු මනුෂ්‍යයාම නැවත පිළිවෙළට එන්න කරන උත්සාහය.","• • •","පළමු ඉගැන්වීම මාව අඳුර ගැන හිතන්න කළා.","කතා කරන කෙනා භාවනාව, අඳුරු කාමර, මෙලටොනින්, පයිනියල් ග්‍රන්ථිය, ශරීරය ඔරලෝසුව, ශරීරයේ සැඟවුණු රසායන විද්‍යාව ගැන කතා කළා. කුර්ආන් එක රසායනාගාර පෙළපොත එකක් කරන්න මට ඕන නැහැ. ඒක වැරදිත් දුර්වලත් වෙනවා. විද්‍යාව යාන්ත්‍රණය එකක් විස්තර කරන්න කරන්න පුළුවන්. නින්ද, හෝර්මෝන, ආලෝකය, අඳුර, ස්නායු පද්ධතිය, ශරීරය රිද්මය අධ්‍යයනය කරන්න පුළුවන්. නමුත් කුර්ආන් එක මට යාන්ත්‍රණය එකට පිටුපස අර්ථය එක දෙන්න පුළුවන්.","එකක් යාන්ත්‍රණය එක විස්තර කරනවා. අනෙක අර්ථය එක දෙන්න පුළුවන්.","කුර්ආන් එක රාත්‍රිය ගැන වැඩක් නැති අඳුරක් වගේ නොව, ආවරණයක් වගේ කතා කරනවා. නින්ද විවේකයක්. දවස නැගිටීම, වැඩ සහ චලනය සඳහා තැනක්. රාත්‍රිය සහ දවස අපට පිටත ඔරලෝසු දෙකක් විතරක් නෙවෙයි. ඒවා ලකුණු. රිද්මය උගන්වනවා. දයාව උගන්වනවා. මිනිසා හැම මොහොතකම උත්සාහයේ දැඩි ආලෝකය යට ජීවත් වෙන්න නිර්මාණය කරලා නැහැ කියලා මතක් කරනවා.","දවසේ මම වැඩ කරනවා. ඇමතුම්වලට පිළිතුරු දෙනවා. යන්ත්‍ර අලුත්වැඩියා කරනවා. Malta හරහා ධාවනය කරනවා. මුදල් ගැන කනස්සල්ල, පවුලේ වගකීම්, අධිකරණ දිනයන්, මතක, සැලසුම්, පණිවිඩ, කුලිය, ආහාර, මෙවලම්, දිගටම යන්න ඕන ශරීරයක් — මේ හැම එකම දරාගෙන යනවා. දවස මාව පිටතට ඇදගෙන යනවා.","නමුත් රාත්‍රිය මාව ඇතුළට ඇදගෙන යනවා.","රාත්‍රිය ජනේලය එකට පිටත විතරක් නෙවෙයි. ශරීරය ඇතුළෙත් රාත්‍රියක් තියෙනවා. මනස හැම දෙයක්ම තමන් පාලනය කරනවා කියලා මවාපෙන්වීම කරන එක නවත්වන අඳුරු තැනක්. හදවත අහන්න පුළුවන් නිහඬ තැනක්. ශබ්දය එකට ආහාර දෙන එක නවත්තද්දී සිදුවන සැඟවුණු සුවපත් වීම එකක්.","ඒ නිසා නිශ්චලතාව කියන්නේ කම්මැලිකම නෙවෙයි. නිහඬතාව කියන්නේ හිස් බව නෙවෙයි. මම භාවනාව කියන වචනය භාවිත කරන විට, ඒක යාච්ඤාවට ආදේශකයක් නෙවෙයි. මට වඩා පිරිසිදු ඉස්ලාමීය වචන තියෙනවා: දික්ර්, තෆක්කුර්, තදබ්බුර්, සුකූන්, ඛුෂූ. සිහිකිරීම. ආවර්ජනය. ගැඹුරු සිතීම. නිශ්චලතාව. නමුණු පැමිණීම.","අල්ලාහ්ගේ සිහිකිරීම තුළ හදවත් සැනසීම ලබනවා කියලා කුර්ආන් එක කියනවා. අහංකාරය ජය ලබනවා කියලා නෙවෙයි. වාදය තවත් හඬ උස් කරනවා කියලා නෙවෙයි. හදවත විවේකය ලබනවා. කල්බ්. හැරෙන තැන. ඇස් විවෘතව තිබුණත් අන්ධ වෙන්න පුළුවන් තැන. මනස සටන් කරලා වෙහෙසට පත් වුණත් නැවත ආපසු හැරෙන්න පුළුවන් තැන.","වැඩෙන් පස්සේ නාගෙන සවසක වාඩි වී සිටියදී සූරා අල්-බකරහ් මගේ ඇතුළේ විවෘත වුණාම, කුර්ආන් එක මගෙන් පිටත තියෙන පොතක් විතරයි කියලා දැනුණේ නැහැ. කැඩපතක්, සිතියමක්, මනුෂ්‍යයාගේ ගැඹුරුම කොටස සමඟ සංවාදයක් වගේ දැනුණා. ඒ සූරාව මම බොහෝ වතාවක් අහලා තිබුණා. රිද්මය, අලංකාරය, බලය අහලා තිබුණා. නමුත් ඒ නිශ්චලතාවයේදී ඒක ළඟට ආවා. ශරීරයට, මනසට, ආත්මයට, පිටත තමා අමතක කළත් සත්‍යය තවම දන්න සැඟවුණු තැනට කතා කළා.","ඒ නිසා පාරායනය පිටතෙන් එන ශබ්දයක් විතරයි කියලා මට බලන්න බැහැ. මනස පැහැදිලි කරන්න කලින් ශබ්දය ශරීරයට ඇතුල් වෙනවා. “අලිෆ් ලාම් මීම්” කියන එක ඉක්මනින් මගේ කුඩා නිර්වචනයක් ඇතුළේ අගුලු දාන්න මට ඕන නැහැ. අල්ලාහ් වඩා හොඳින් දන්නවා. නමුත් ඒ සමඟ නිශ්චලව සිටියදී, ඒක අර්ථයට පෙර ශබ්දය, පැහැදිලි කිරීමට පෙර කම්පනය, අයිති කරගැනීමට පෙර ලැබීම වගේ දැනුණා. හැම දැනුමක්ම වාක්‍යයකින් ආරම්භ වෙන්නේ නැහැ කියලා මතක් කළා. සමහර දැනුම කම්පනයකින්, නිහඬතාවකින්, රිද්මයකින්, ලැබීමකින් ආරම්භ වෙනවා.","අර්ථය එක තමන්ගේ කරන්න ඉක්මන් වෙන්න එපා. සමහර වෙලාවට පළමු පාඩම ශබ්දය ලැබීම කරන එක.","ශරීරයත් එහෙම කතා කරනවා. පැහැදිලි කිරීමට පෙර චලනය. වචනයට පෙර හුස්ම. මනස “කම්පනය”, “බිය”, “ශෝකය”, “දිවි රැකගැනීම” කියලා නම් කරන්න කලින් පපුව, බඩ, සම, හුස්ම, ඇස් හරහා ශරීරය දැනටමත් යමක් කියලා තියෙනවා.","ඒ නිසා රාත්‍රිය, ශබ්දය, හුස්ම, නිශ්චලතාව — එක පාඩමේ කොටස් වුණා. මනුෂ්‍යයා පැතලි නෙවෙයි. අපි ස්තර ගණනාවකින් යුක්තයි. පොළොව සහ හුස්ම. ශරීරය සහ ආත්මය. පෙනෙන සහ නොපෙනෙන. ශබ්දය සහ නිහඬතාව. දවස සහ රාත්‍රිය. බිය සහ සිහිකිරීම.","• • •","දෙවැනි ඉගැන්වීම ඇතුළත ඉහළ නැඟීම එක ගැන කතා කළා.","Kundalini, chakras වගේ වචන භාවිත කළා. කොඳු ඇට පෙළේ පහලින් අභ්‍යන්තර මධ්‍යස්ථාන හතක් හරහා ශක්තියක් ඉහළට යන රූපකය ගැන කතා කළා. ලෝකයේ මිනිසුන් තමන්ට උරුම වුණු භාෂාවෙන් අභ්‍යන්තර ගමන විස්තර කරන්න උත්සාහ කරලා තියෙන එකට මම ගෞරව කරනවා. නමුත් හැම වචනයක්ම ණයට ගන්න මට ඕන නැහැ. වෙන පද්ධතියක් ඉස්ලාමය කියලා කියන්න ඕන නැහැ. ඒක බලෙන් කරන්න ඕන නැහැ. ඉහළ නැඟීම ගැන මගේම භාෂාව කුර්ආන් එක මට දැනටමත් දීලා තියෙනවා.","නෆ්ස් පිරිසිදු වෙන්න ඕන. කල්බ් අවදි වෙන්න ඕන. බන්දාවා ආපසු හැරෙන්න ඕන. පහළ තමා ස්වාමියා වෙලා ඉන්න එක නවත්වන්න ඕන.","මට ඇත්ත ඉහළ නැඟීම එක ඒක.","නෆ්ස් තුළ දූෂණය සහ ධාර්මිකත්වය දෙකම පිළිබඳ ප්‍රේරණයක් තියෙන බවත්, ඒක පිරිසිදු කරන කෙනා සාර්ථක බවත් කුර්ආන් එක කියනවා. ඒ ආයතය මට න්‍යායක් නෙවෙයි. මගේ ඇතුළේ පහළ තමා මම දැකලා තියෙනවා. සත්‍යයට පෙර කෝපය කතා කරන්න ඕන වුණු තැන. අනාගතයම පාලනය කරන්න බියට ඕන වුණු තැන. ලැජ්ජාව සඟවන්න උත්සාහ කළ තැන. අහංකාරය තමන්ව ආරක්ෂා කරන්න උත්සාහ කළ තැන. අමනාපය මාව තුවාල කළ එකම දෙය බවට පත් වෙන්න කියපු තැන.","මම මට ආධ්‍යාත්මික කියලා කියාගෙන නෆ්ස් දිහා බලන්න ප්‍රතික්ෂේප කරනවා නම්, මම පවිත්‍ර වචනවලින් අහංකාරය අලංකාර කරනවා විතරයි.","බිය තව රජු නොවන විට මනුෂ්‍යයා ඉහළ නැඟීම වෙනවා. ආශාව තව දෙවියන් නොවන විට ඉහළ නැඟීම වෙනවා. කෝපය දිව එක ධාවනය නොකරන විට ඉහළ නැඟීම වෙනවා. වේදනාව අනන්‍යතාව නොවන විට ඉහළ නැඟීම වෙනවා. රූපයට වඩා සත්‍යය ආදරේ වුණු විට ඉහළ නැඟීම වෙනවා.","වෙනත් සම්ප්‍රදායන් ස්තර, මධ්‍යස්ථාන, ඉහළ නැඟීම ගැන කතා කළාම මම ඒවාට හිනා නොවෙන්නේ ඒ නිසා. ලෝකයේ හැම තැනම මිනිසුන් “අපි මාංසය සහ ඇට විතරක් නෙවෙයි” කියන දැනීම අත්විඳලා තියෙනවා. නමුත් මම කුර්ආන් එකට ආපහු එනවා, ශරීරය පිළිමයක් කරන්න එපා කියලා ඒක මාව ආරක්ෂා කරන නිසා. ශරීරය ලකුණක්, මූලාශ්‍රය නෙවෙයි. හදවත සාක්ෂිකරුවෙක්, රබ් නෙවෙයි. රූහ් මගේ රබ්ගේ ආඥාවට අයිති අභිරහසක්; අහංකාරයට අයිති කරගන්න පුළුවන් දෙයක් නෙවෙයි.","සූරා අල්-බකරහ් පවා මනුෂ්‍යයාගේ මේ ස්තරගත ස්වභාවය මට දැනෙන්න කළා. පෘථිවිය, ස්වර්ගය, අදෘශ්‍යය, හදවතේ රෝගය, ආලෝකය සහ අඳුර, ගිවිසුම සහ ආපසු හැරීම, Adam සහ දේවදූතයන්, නම් සහ වගකීම — මේවා ගැන කතා කරනවා. මිනිසා ගැන පැතලි රූපයක් දෙන්නේ නැහැ. ගැඹුරු රූපයක්. මිනිසා දූෂණය කරන්නත් රුධිරය වගුරවන්නත් පුළුවන්, ඒත් අල්ලාහ් “ඔබ නොදන්න දේ මම දන්නවා” කියනවා. ඒ වාක්‍යය මාව නිහතමානී කරනවා. පිරිසිදු කීකරුකමටත් සම්පූර්ණයෙන් පේන්න බැරි අභිරහසක් මනුෂ්‍යයා තුළ තියෙනවා.","ශරීරය කීකරු බලවේගවලින් පිරීලා. මගේ උපදෙස් නැතුව හදවත ස්පන්දනය වෙනවා. පෙනහළු හුස්ම ගන්නවා. රුධිරය චලනය වෙනවා. සෛල සුවපත් වෙන්න උත්සාහ කරනවා. අහංකාරයට වඩා ශරීරය විශ්වාසවන්ත සේවකයෙක්. මගේ අහංකාරය කීකරු වන තරමට වඩා මගේ ශරීරය කීකරු වෙනවා.","ඒ සිතුවිල්ල මාව නිහඬ කරනවා.","ශරීරයම කීකරුකමෙන් පිරී නම්, මගේ සචේතන තමා විරුද්ධ වන්නේ ඇයි? දිව විරුද්ධ වන්නේ ඇයි? අහංකාරය? නෆ්ස්? සමහරවිට අභ්‍යන්තර ගමන කියන්නේ ශරීරයෙන් පලා යන එක නෙවෙයි; මැවීම තුළ දැනටමත් ලියලා තියෙන කීකරුකමෙන් ඉගෙනගන්න එක.","යහපත් වචන ඉහළට යනවා, ධාර්මික ක්‍රියාව ඒවා උස් කරනවා කියන රූපකය ඉහළ නැඟීම ගැන තවත් රූපයක් දෙන්නෙ. පෙන්වන්න ශක්තියක් නෙවෙයි. අභිරහස් අහංකාරයක් නෙවෙයි. පිරිසිදු වෙන වචන. අවංක වෙන ක්‍රියා. නමන ශරීරය. මෘදු වෙන හදවත. ආපසු හැරෙන තමා.","ඒක ඉහළ නැඟීම.","• • •","තුන්වැනි ඉගැන්වීම මාව වැඩිම තරම් හෙලවුවේ මේ පොතේ නිශ්චිත මාතෘකාවට ස්පර්ශ කළ නිසා.","ඔබ ඔබේ ශරීරය නොවෙයි.","මුලින් ඒ වාක්‍යය වැරදි ලෙස තේරුම්ගන්න පුළුවන්. ශරීරය කිසිවක් නෙවෙයි කියලා මම කියන්නේ නැහැ. වේදනාව කල්පනයක් කියලා කියන්නේ නැහැ. බඩගින්න, සිරගෙදර, රෝගය, වෙහෙස, බිය ව්‍යාජ කියන්නේ නැහැ. සිරකුටියක් ඇතුළේ ශරීරයක් තුළ මම ජීවත් වුණා. ශරීරය සැබෑ කියලා මම දන්නවා. කූඩුව මුලින්ම ශරීරය දරාගන්න කරවනවා. අගුලු දැමූ දොරට ඔබේ දර්ශනය කොච්චර ගැඹුරුද කියලා වැඩක් නැහැ. ඒක ශරීරය අගුලු දානවා. අධිකරණ දිනයන්, පොලිස් ස්ථාන, මුදල්, වැඩ, ආගමන කටයුතු, පවුලේ වගකීම් — හැම එකක්ම කාලය තුළ මුලින්ම ශරීරයට ස්පර්ශ වෙනවා.","නමුත් මම ශරීරය විතරක් නෙවෙයි.","මම ශරීරය විතරක් වුණොත් දිවි රැකගැනීම මගේ ආගම වෙනවා. ශරීරය විතරක් වුණොත් බිය මගේ ඉමාම් වෙනවා. ශරීරය විතරක් වුණොත් සැනසීම මගේ ස්වර්ගය, වේදනාව මගේ නිරය. ශරීරය විතරක් වුණොත්, ආරක්ෂාවට මිලක් ගෙවන්න වෙන වෙලාවක සත්‍යය පාවා දෙන්න පුළුවන්.","කුර්ආන් එක මනුෂ්‍යයා කනස්සල්ලෙන් සහ අසන්සුන්තාවයෙන් සිටිය හැකි බව කැඩපතක් වගේ පෙන්වනවා. හානිය ස්පර්ශ කළාම භීතිය. යහපත ස්පර්ශ කළාම අත තද කරගැනීම. මම ඒක දොස් පැවරීමක් විතරක් විදිහට කියවන්නේ නැහැ. කැඩපතක් විදිහට කියවනවා. නෆ්ස් පිරිසිදු නොවී බිය පද්ධතිය දුවන විට මනුෂ්‍යයා කොහොම වෙනවද කියන කැඩපත.","බිය හැඟීමක් විතරක් නෙවෙයි. බිය වැඩසටහනක් වෙන්න පුළුවන්.","කෙනෙක් අවුරුදු ගණනක් බියට කීකරු වෙමින් ජීවත් වෙන්න පුළුවන් — තමන් ඒක කරනවා කියලා දැනගන්නේ නැතුව. පවුලක් බියට කීකරු වෙන්න පුළුවන්. සමාජයක් එහෙම වෙන්න පුළුවන්. අධිකරණයකට බිය බලපාන්න පුළුවන්. රටක් බිය මගින් මෙහෙයවෙන්න පුළුවන්. ප්‍රවෘත්ති බිය විකුණන්න පුළුවන්. දැන්වීම් බිය විකුණන්න පුළුවන්. වෛද්‍ය ප්‍රතිකාර බියෙන් ඔතා ඉදිරිපත් කරන්න පුළුවන්. ආගම බිය හරහා වැරදි ලෙස භාවිත කරන්න පුළුවන්. ආදරය බිය නිසා විෂ වෙන්න පුළුවන්. “මිනිස්සු මොනවා හිතයිද?” කියලා බිය අහන විට කරුණාව පවා ප්‍රදර්ශනයක් වෙන්න පුළුවන්.","මිනිස්සු නළල බිම තබලා බියට නමස්කාර නොකරනවා වගේ පේනවා. ඒත් ඒකට කීකරු වෙනවා. තීරණ ඒකෙන් ගන්නවා. ඒක නිසා බොරු කියනවා. නිහඬ වෙනවා. පහර දෙනවා. වෙන අය විනාශ කරනවා. අසත්‍යය ආරක්ෂා කරනවා. නමක් නැති ආගමක් වගේ බිය වෙන්න පුළුවන්.","මගේ ඇතුළෙත් ඒක දැක්කා.","සිරගෙදර මගේ ශරීරය එක තැනක තැබුවා. නමුත් සිරගෙදර පස්සේ මම දැක්කා — ශරීරය කූඩුවෙන් පිටවුණත් මනස තවම කූඩුවක ජීවත් වෙන්න පුළුවන්. පිටත දොර විවෘත වුණත් ස්නායු පද්ධතිය තවම දොර ආපහු වැහෙයි කියලා බලාපොරොත්තු වෙන්න පුළුවන්. මිනිසෙක් Malta මුහුද අසල ඇවිදගෙන යන්න පුළුවන්; ඒත් ඔහුගේ කොටසක් තවමත් සිරකුටිය 13 තුළ අඩි හඬ අහගෙන, ඊළඟ බාධාව බලාගෙන ඉන්න පුළුවන්.","ඒ නිසා සුවපත් වීම කියන්නේ තැනක් අතහැර යන එක විතරක් නෙවෙයි. වැඩසටහනක් අතහැර යන එක.","සිරගෙදර එකකට ශරීරය දරාගන්න කරන්න පුළුවන්. චෝදනාවකට නම පහර දෙන්න පුළුවන්. බියකට මනස පහර දෙන්න පුළුවන්. ඒත් ඇතුළේ සාක්ෂිකරු අවදි වෙලා ඉන්න පුළුවන්.","මනුෂ්‍යයා තමන්ටම විරුද්ධව සාක්ෂිකරුවෙක් කියන කුර්ආන් රූපකය දැන් මට වෙනස්. අපි ඇතුළේ දන්න දෙයක් තියෙනවා. වෙන අයට බොරු කිව්වත් යමක් දන්නවා. අපි අපිවම අවුල් කළත් යමක් දන්නවා. ශක්තිමත් වගේ මවා පෙන්වුවත් කම්පනය යමක් දන්නවා. “මම ඉවරයි” වගේ හැසිරුණත් ඇතුළේ යමක් තවම බලාගෙන ඉන්නවා.","ඒ සාක්ෂිකරු බිය නෙවෙයි.","බිය කෑගහනවා. සාක්ෂිකරු බලනවා. බිය ඉක්මන් කරනවා. සාක්ෂිකරු බලාගෙන ඉන්නවා. බිය කියනවා: ඕනෑම මිලකට ඔබව ආරක්ෂා කරන්න. සාක්ෂිකරු අහනවා: සත්‍යය මොකක්ද?","කල්බ් වැදගත් ඒ නිසා. සැබෑ අන්ධභාවය කියන්නේ ඇස් අන්ධ වෙන එක විතරක් නොව, පපුව ඇතුළේ හදවත් අන්ධ වීම කියලා කුර්ආන් රූපකය මට මතක් කරනවා. ඇස්වලින් බලලාත් යථාර්ථය අහිමි කරගන්න පුළුවන්. සාක්ෂි තියලාත් සත්‍යය අහිමි කරගන්න පුළුවන්. ආගමික වචන භාවිත කරලාත් දයාව නැති වෙන්න පුළුවන්. පිටත බලවත් වගේ පේන කෙනෙක් ඇතුළේ මඟහැරී ඉන්න පුළුවන්.","ඒ නිසා මම මගෙන් අහනවා: හදවත අන්ධ වෙනවා නම් වාද ජයගන්න එකෙන් මට මොන ප්‍රයෝජනයක්ද?","වේදනාව මාව අන්ධ කරන්න මට ඕන නැහැ. අයුක්තිය මාව අයුක්තිසහගත කරන්න ඕන නැහැ. චෝදනාව මාව සත්‍යයට වෛර කරන කෙනෙක් කරන්න ඕන නැහැ. බිය මගේ දෙවියන් වෙන්න ඕන නැහැ. දිවි රැකගැනීම මගේ ජීවිතයේ අවසාන අර්ථය වෙන්න ඕන නැහැ.","• • •","සූරා අල්-බකරහ් මේකට තවත් දොරක් මට දුන්නා.","ඒක දයාව සමඟ ආරම්භ වෙනවා. බිස්මිල්ලාහිර් රහ්මානිර් රහීම්. අල්ලාහ්ගේ නාමයෙන්, අති කරුණාවන්ත, අති දයාබර. හැමෝම මේ වචන දන්නවා. නමුත් නිශ්චල ආවර්ජනයේදී ඒවා සාමාන්‍ය වගේ දැනුණේ නැහැ. මුළු මනුෂ්‍ය පද්ධතිය විවෘත වෙනවා වගේ. කුර්ආන් එක මගේ බියෙන් ආරම්භ වෙන්නේ නැහැ. අල්ලාහ් සහ දයාවෙන් ආරම්භ වෙනවා.","දයාව අලංකාරයට එකතු කළ සැරසිල්ලක් නෙවෙයි. මැවීමේ මුල් වාතාවරණය දයාව. අවසර අහන්නේ නැතුව හදවත ස්පන්දනය වෙනවා. පෙනහළු හුස්ම ගන්නවා. තුවාලය සුව වෙන්න උත්සාහ කරනවා. මව දරාගෙන යනවා. දරුවා සොයනවා. මනස “දයාව” කියන වචනය ඉගෙනගන්න කලින් ශරීරයම දයාව හරහා වැඩ කරනවා.","දයාව අමතක කළොත්, ආරම්භයම මම අමතක කරලා.","පසුව අල්-බකරහ් මුත්තකීන් ගැන කතා කරනවා — අල්ලාහ් පිළිබඳ සචේතන මිනිසුන්. මම කලින් හිතුවේ මිනිස්සු ඒක බාහිර ලකුණු වලින් මනිනවා කියලා: ඇඳුම්, භාෂාව, රැවුල, චාරිත්‍ර, පෙනුම. නමුත් නිශ්චලතාව තුළ මට මුත්තකීන් කියන්නේ සචේතන අය, අවධානයෙන් සිටින අය, අභ්‍යන්තර ඇස මැරෙන්න දීලා නැති අය වගේ දැනුණා. තක්වා කියන්නේ භීතියක් විතරක් නොව, අල්ලාහ් පිළිබඳ සචේතනභාවය. ක්‍රියාවට පෙර චේතනාව බලන සචේතනභාවය. මුහුණට පෙර හදවත. පොදු ප්‍රදර්ශනයට පෙර සැඟවුණු තමා.","පසුව කුර්ආන් අදෘශ්‍යය විශ්වාස කිරීම ගැන කතා කරනවා. අදෘශ්‍යය මාව අල්ලාහ්ව මගේ කල්පනයක් බවට හැරවීමෙන් ආරක්ෂා කරනවා. මූලාශ්‍රය මගේ රූපයට, උරුම වූ මානසික රූපයට, වර්ණයකට, ප්‍රතිමාවකට, ස්වරූපයකට, හැඩයකට එහා කියලා මතක් කරනවා. අදෘශ්‍යය මනසෙන් නිහතමානීකම ඉල්ලනවා. “දෙවියන්ව අයිති කරගන්න බැහැ. යටත් වෙන්න විතරයි පුළුවන්” කියලා කියනවා.","මේක මගේ පොතට වැදගත්, මනස හැමදාම අයිති කරගන්න උත්සාහ කරන නිසා. නිර්වචනය කරන්න, පැහැදිලි කරන්න, කොටු කරන්න, පාලනය කරන්න, නමක් දෙන්න, ජයගන්න. නමුත් සමහර සත්‍යයන් මුලින් ලැබෙන්න ඕන. සමහර සත්‍යයන් පැහැදිලි කරන්න කලින් ජීවත් කරලා බලන්න ඕන.","අල්-බකරහ් හදවතේ රෝගය ගැනත් කතා කරනවා. ඒක මට ගැඹුරින් වැදුණා. රෝගය වෛද්‍ය විතරක් නෙවෙයි. ආශාව තුළත් රෝගය තියෙනවා: කෝපය, ඊර්ෂ්‍යාව, පළිගැනීම, අසන්සුන්තාව, බොරු, අමනාපය, සැඟවුණු වැඩසටහන්කරණය. ක්‍රියාව හදිසි වගේ පේන්න පුළුවන්, ඒත් රෝගය ක්‍රියාවට කලින් නිහඬව පෝෂණය වෙමින් වෙලා තිබුණා.","වඩාම භයානක බොරුව එක වෙන කෙනෙකුට කියන බොරුව විතරක් නෙවෙයි. තමා ඇතුළේ කියන බොරුව. මම මටම බොරු කියද්දී ආලෝකය අඩුවෙන්න පටන් ගන්නවා.","ඊට පස්සේ “ප්‍රතිසංස්කරණය” කියන නම ඇඳගෙන දූෂණය එන රූපකය. ඒක මාව බය කළා. දූෂණය කරන්න එපා කියද්දී “අපි ප්‍රතිසංස්කාරකයින් විතරයි” කියන මිනිසුන් ගැන කුර්ආන් එක කියනවා. මනුෂ්‍ය අන්ධභාවයේ ඛේදවාචකය ඒක. දූෂණය හැමදාම කැත මුහුණකින් එන්නේ නැහැ. සමහර වෙලාවට ප්‍රගතිය, ආරක්ෂාව, යුක්තිය, කීර්තිය, ආගම, පවුලේ ගෞරවය, ජාතික ආරක්ෂාව, සදාචාර සැලකිල්ල වගේ ඇඳුම් ඇඳගෙන එනවා. “මම වැඩිදියුණු කරනවා” කියලා හිතන අතර කෙනෙක් ජීවිතයට හානි කරන්න පුළුවන්.","දූෂණය හැමදාම අලංකාර නොවන මුහුණක එන්නේ නැහැ. සමහර වෙලාවට ප්‍රතිසංස්කරණය වගේ ඇඳගෙන එනවා.","ලෝකයට යොදන්න කරන්න කලින් මට මේක මට යොදන්න කරන්න ඕන. අහංකාරයක් විතරක් තිබුණු දේට “ප්‍රතිසංස්කරණය” කියලා මම කොහෙද කිව්වේ? වේදනාව කතා කළ දේට “සත්‍යය” කියලා? සන්නාහය ඇඳපු බියට “ශක්තිය” කියලා?","ඒ නිසා කුර්ආන් එක වෙන අයට විරුද්ධව භාවිත කරන පොතක් විතරක් වෙන්න මට ඕන නැහැ. මගේ ඇතුළේ අඳුරට ඒක ජයගන්න මට ඕන.","• • •","අල්-බකරහ්හි ආලෝකය සහ අඳුර රූප මටත් ළඟට ආවා.","කෙනෙක් ගින්නක් දල්වලා මොහොතක් දකිනවා; පසුව ආලෝකය ඉවත් වෙනවා. අකුණු දෘෂ්ටිය උදුරාගන්න තරම් වේගයෙන් දිලිසෙනවා. ආලෝකය ආවාම ඔවුන් ඇවිදිනවා. අඳුර ආවාම නතර වෙනවා. මේක මගේ ජීවිතයේ ගැඹුරුම පාඩම් වලින් එකක්.","ආලෝකය ආවාම ඇවිදින්න. අඳුර ආවාම දකිනවා වගේ මවාපෙන්වීම කරන්න එපා.","මගේ ජීවිතයෙන් වැඩි කාලයක් මම “මට පේනවා” වගේ මවා පෙන්වලා. නිහඬතාව දුර්වල වගේ දැනෙන නිසා මනස ක්‍රියා කරන්න ඕන වෙන වෙලාවල්. බලා සිටීම පරාජයක් වගේ දැනෙන නිසා අහංකාරයට පිළිතුරු දෙන්න ඕන වෙන වෙලාවල්. නිශ්චලතාව භයානක වගේ දැනෙන නිසා ශරීරයට දුවන්න ඕන වෙන වෙලාවල්. නමුත් සමහර වෙලාවට අල්ලාහ් මුළු පාරටම ආලෝකය දෙන්නේ නැහැ; ඊළඟ පියවරට විතරයි. චලනය වෙන්න කලින් මුළු පාරම ඉල්ලනවා නම් මම කිසිදා චලනය නොවෙන්න පුළුවන්. අඳුර තුළ “මට පේනවා” වගේ චලනය වුණොත් මාවත් වෙන අයවත් රිදවන්න පුළුවන්.","පාඩම සරල, ඒත් අමාරු: ආලෝකය දීලා තියෙන විට ඇවිදීම කරන්න; නැති විට සිටින්න නිශ්චල.","මේක කුඩාම ලකුණු වලටත් සම්බන්ධ. අල්-බකරහ් මදුරුවා ගැනත්, ඊටත් කුඩා දෙයක් ගැනත් සඳහන් කරන රූපකය කුඩා දේවල වැදගත්කම ආරක්ෂා කරනවා. හැම ලකුණක්ම කන්දක් නෙවෙයි. හැම පාඩමක්ම මුහුද බෙදන අද්භූත සිදුවීමක් නෙවෙයි. සමහර ලකුණ හුස්මක්. කුඩා වේදනාවක්. නැවත නැවත එන සිහිනයක්. දරුවෙක්. පක්ෂියෙක්. මදුරුවෙක්. වාක්‍යයක්. මාව අසන්සුන් කරන වීඩියෝවක්. අවුරුදු ගණනකට පස්සේ ආපසු එන මතකයක්. ජීවිතය පුරා අහලා, නාගෙන ඉවර වූ එක සවසක පළමු වතාවට තේරුම්ගත් වචනයක්.","විවෘත හදවතකට කුඩාම ලකුණ ප්‍රමාණවත්. “මම බලන්නේ නැහැ” කියලා දැනටමත් තීරණය කළ හදවතකට විශාලතම ලකුණත් ප්‍රයෝජනයක් නැති.","මෑතකදී මට ආපු දේ අපතේ යවන්න මට ඕන නැත්තේ ඒ නිසා. වෙන කෙනෙකුට ඒවා වීඩියෝ තුනක් විතරක් වෙන්න පුළුවන්. මට ඒවා ලකුණු වුණේ මේ පොත මුල සිට වටේ ගිය එකම සත්‍යයට ස්පර්ශ කළ නිසා.","ශරීරය ලකුණක්. බිය ලකුණක්. රාත්‍රිය ලකුණක්. හුස්ම ලකුණක්. කූඩුව ලකුණක්. විවෘත පිටුව ලකුණක්. කුර්ආන් එක මාව මගේම ඇතුළට ආපහු හරවන එක ලකුණක්.","පෘථිවියේ සහ අප තුළම ලකුණු තියෙනවා කියලා කුර්ආන් එක කියනවා. ක්ෂිතිජයන් වලත් අපේ ඇතුළේත් ලකුණු පෙන්වනු ලැබෙන බවත්, සත්‍යය පැහැදිලි වෙන තුරු කියන රූපකය මට වැදගත්. 60 වන අධ්‍යාය — විස්තරයෙන් පැහැදිලි කළ දේ — මේකට පෙර එන්න ඕන වුණේ ඒ නිසා. ෆුස්සිලාත් ක්ෂිතිජය විවෘත කළා. අල්-බකරහ් අභ්‍යන්තර ශරීරය විවෘත කළා. වීඩියෝ තුන ප්‍රශ්නය මගේ ස්නායු පද්ධතියට ආපහු තල්ලු කළා: බේරී ජීවත් වෙන්නේ මොකක්ද, සාක්ෂි දරන්නේ මොකක්ද, මතක තබාගන්නේ මොකක්ද?","තවත් ගැඹුරට සිතන්න.","ක්ෂිතිජය ජනේලයට පිටත විතරක් නෙවෙයි. ක්ෂිතිජය පපුව ඇතුළෙත් තියෙනවා. අධිකරණය පිටත, පරීක්ෂාව ඇතුළෙත්. සිරගෙදර පිටත, කූඩුව ඇතුළෙත්. චෝදනාව පිටත, බිය ඇතුළෙන් අයින් කරන්නත් ඕන.","තවත් ගැඹුරට සිතන්න.","සමහරවිට විශාලතම නිදහස කියන්නේ මිනිස්සු අවසානයේ මාව තේරුම් ගන්නා එක නෙවෙයි. ඔවුන්ගේ වැරදි අවබෝධයේ සිරකරුවා වෙලා ඉන්න එක මම නවත්වන මොහොත.","• • •","මේකෙන් යුක්තිය තව වැදගත් නැහැ කියන්නේ නැහැ.","යුක්තිය වැදගත්. සත්‍යය වැදගත්. සාක්ෂි වැදගත්. මගේ නම වැදගත්. නීතිය වැදගත්. මිනිසෙකුගේ ගෞරවය වැදගත්. හැම වැරදි දෙයක්ම නිහඬව පිළිගන්න ආධ්‍යාත්මිකත්වය නිදහසට කරුණක් කරගන්න මට බැහැ. කුර්ආන් එකත් යුක්තිය, සාක්ෂිය, සත්‍යය, වගකීම ගැන කතා කරනවා. නමුත් මගේ ආත්මය අල්ලාහ් වෙත ආපසු හැරෙන්න කලින් හැම මනුෂ්‍යයෙකුම මාව තේරුම් ගන්නාකල් බලා සිටින්න බැහැ. මගේ සාමය මිනිසුන් මත විතරක් රඳා පවතිනවා නම්, මිනිසුන් මගේ රබ් වෙනවා. මට ඉන්නේ එක රබ් කෙනෙක්.","ඒ නිසා මම ආපහු හැරෙනවා.","පරිපූර්ණ කෙනෙක් වගේ නෙවෙයි. සාන්තුවරයෙක් වගේ නෙවෙයි. කෝපය, බිය, දුර්වලකම, මතකය, වෙහෙස නැති කෙනෙක් වගේ නෙවෙයි. මම ඉන්න විදිහට ආපසු හැරෙනවා: තුවාල ලැබූ, ඉගෙනගනිමින් සිටින, සමහර විට ලැජ්ජාවෙන්, සමහර විට ශක්තිමත්, සමහර විට වෙහෙසට පත්, සමහර විට කෘතඥ. මගේ ශරීරය, මනස, නෆ්ස්, කල්බ්, සහ අල්ලාහ් මට දරාගෙන යන්න ඉඩ දුන් අභිරහස සමඟ ආපසු හැරෙනවා.","අතීතය නැහැ. අනාගතය නැහැ. මේ හුස්ම විතරයි.","අතීතය මතකය හරහා මාව ඇදගෙන යන්න උත්සාහ කරනවා. අනාගතය බිය හරහා. නමුත් අල්ලාහ්ව මතක කරන්න පුළුවන් තැන මේ හුස්ම.","ශරීරයේ සමතුලිතතාව ඉගෙනගන්නවා. මනස නිහඬතාව ඉගෙනගන්නවා. ආත්මය තමන් දැනටමත් දන්න දේ මතක් කරනවා විතරයි.","මේ වාක්‍යය, අවුරුදු ගණනක් මම කියන්න උත්සාහ කළ බොහෝ දේවල අවසානය වගේ. ශරීරයේ සමතුලිතතාව පුහුණු කළාම මාංශ පේශි විතරක් පුහුණු කළේ නැහැ; මනස බලා සිටියා. සිරගෙදර පස්සේ ඇවිද්දාම කකුල් විතරක් චලනය කළේ නැහැ; කූඩුව ඇදගෙන නොගෙන මනසට ඇවිදින්න පුළුවන්ද කියලා පරීක්ෂා කළා. කුර්ආන් අහනකොට පාරායනයක් අහනවා විතරක් නෙවෙයි; පැහැදිලි කිරීමට ළඟා වෙන්න බැරි කොටස්වලට ශබ්දය ඇතුල් වෙන්න ඉඩ දුන්නා.","ශරීරය තුවාල මතක තබාගනී. ආත්මය මූලය මතක තබාගනී. මනස කතා එකතු කරයි. කල්බ් සත්‍යය සොයයි.","“මම මගේ ශරීරය නෙවෙයි” කියනකොට ශරීරය ප්‍රතික්ෂේප කරනවා කියන්නේ නැහැ. මාව දිවි රැකගැනීමට සීමා කරන්න කරන්න ප්‍රතික්ෂේප කරනවා. බිය විතරක් වෙන්න ප්‍රතික්ෂේප කරනවා. මතකය විතරක් වෙන්න ප්‍රතික්ෂේප කරනවා. වේදනාව මගේ අනන්‍යතාව වෙන්න ඉඩ දෙන්නේ නැහැ.","මම අල්ලාහ්ගේ බන්දාවෙක් — ශරීරයක් තුළ ජීවත් වෙමින්, මනසක් දරාගෙන, නෆ්ස් සමඟ සමඟ අරගල කරමින් කරමින්, කල්බ් මගින් මාර්ගෝපදේශය වෙමින්, සම්පූර්ණ අභිරහස මගේ රබ්ට පමණක් අයිති රූහ් මගින් දරාගෙන.","• • •","තව එක දෙයක් තියෙනවා.","Adamගේ කතාවේ අල්ලාහ් ඔහුට නම් උගන්වනවා. ඒ රූපකය සාමාන්‍ය ජීවිතයට මට ළඟට ආවා. හැම දරුවෙකුටම නම් උගන්වනවා. මේ මව. මේ වතුර. මේ ගින්න. මේ අනතුර. මේ ආදරය. මේ ලැජ්ජාව. මේ පොලිසිය. මේ සිරගෙදර. මේ අධිකරණය. මේ පොත. මේ අල්ලාහ්. නම් හරහා ලෝකය තේරුම්ගත හැකි වෙනවා. නම් ලේබල් විතරක් නෙවෙයි. ඒවා සම්බන්ධතා වෙත දොරවල්.","නමුත් හදවත අවදි නැති විට නම් කූඩු වෙන්නත් පුළුවන්. සත්‍යය සම්පූර්ණ වෙන්න කලින් කෙනෙකුට “අපරාධකරු” කියන්න පුළුවන්. වේදනාව තේරුම් ගැනීම නොවන නිසා “පිස්සු” කියන්න පුළුවන්. සන්සුන් වගේ ශබ්දය කරන නිසා “ආධ්‍යාත්මික” කියන්න පුළුවන් — ඒත් ඇතුළේ තවම නෆ්ස් සමඟ සටන් කරනවා. අඬන්න නොකරන නිසා “ශක්තිමත්” කියන්න පුළුවන් — ඒත් ශරීරය නිහඬව කඩා වැටීම වෙනවා.","අල්ලාහ් Adamට නම් උගන්වුවා; නමුත් සැබෑ දැනුම යටත් වීමෙන් අවසන් වෙන්න ඕන. දේවදූතයන් කිව්වේ අල්ලාහ් උගන්වූ දේ හැර අපට දැනුම නැහැ කියලා. මට ඕන වාක්‍යය ඒක. ජීවිතයෙන් මම නම් ගොඩක් ඉගෙනගත්තා: සුනාමිය, සංක්‍රමණය, Dubai, සිරගෙදර, සිරකුටිය 13, Malta, අධිකරණය, ආදරය, ද්‍රෝහය, නිශ්චලතාව, බිය, මනස, ශරීරය, නෆ්ස්, කල්බ්, රූහ්. මේ නම් මාව අහංකාර කරනවා නම් ඒවා තවත් සිරගෙයක්. යටත් වෙන්න උදව් කරනවා නම් ඒවා ප්‍රඥාව.","යටත් වීම නැති දැනුම අහංකාරය වෙනවා. යටත් වීම එක්ක දැනුම ප්‍රඥාව වෙනවා.","මේ අධ්‍යාය ලියන්න ඕන වුණේ ඒ නිසා. පොතට අඩුවෙලා තිබුණේ සිදුවීමක් නෙවෙයි. මේ යටත් වීම. ශරීරය සමඟ වාද කරන එක නවත්වන, මනස වන්දනා කරන එක නවත්වන, බියෙන් දුවන එක නවත්වන, කුර්ආන් එකට කොටස් තමන්ගේ පිළිවෙළට ආපහු තබන්න ඉඩ දෙන මොහොත.","පළමු වීඩියෝව මට රාත්‍රිය සහ සැඟවුණු ශරීරය දුන්නා. දෙවැනි වීඩියෝව ඉහළ නැඟීමේ සංකේතය දුන්නා. තුන්වැනි වීඩියෝව “මම ශරීරය විතරක් නෙවෙයි” කියන කම්පනයත්, බිය වැඩසටහනක් වෙන්න පුළුවන් කියන කැඩපතත් දුන්නා. සූරා අල්-බකරහ් දයාව, ශබ්දය, අදෘශ්‍යය, හදවතේ රෝගය, ආලෝකය සහ අඳුර, කුඩා ලකුණු, ගිවිසුම, Adam, නම්, වගකීම දුන්නා. සූරා ෆුස්සිලාත් ක්ෂිතිජයන් සහ අප තුළම ඇති ලකුණු දුන්නා. මගේම ජීවිතය කූඩුව, මුහුද, සිරකුටිය, යාච්ඤාව, නිශ්චලතාව, පිටුව දුන්නා.","දැන් පිටුව හිස් නැහැ.","ඒක පැමිණියා.","• • •","මාව රෝගයක් ලෙස මතක තබාගන්න මට ඕන නැහැ.","චෝදනාවක් ලෙස මතක තබාගන්න ඕන නැහැ.","සිරගෙදර එකක් ලෙස මතක තබාගන්න ඕන නැහැ.","දුක් විඳලා, පසුව දුක්විඳීමම අනන්‍යතාව කරගත් මිනිසෙක් ලෙස මතක තබාගන්න ඕන නැහැ.","ගමන මතක තබාගන්න. ලකුණු මතක තබාගන්න. මිනිසෙක් ඔහු ගැන කියපු නරකම දෙයට වඩා වැඩියි. ඔහු බේරී ජීවත් වූ දුර්වලම රාත්‍රියට වඩා වැඩියි. කම්පනය වූ ශරීරයට වඩා වැඩියි. බිඳුණු මනසට වඩා වැඩියි.","ඔබ මේක ඔබේම කූඩුවෙන් කියවනවා නම්, ඒ කූඩුව හරහා නිදාගෙන යන්න එපා. මම ඒක සැහැල්ලුවෙන් කියන්නේ නැහැ. කූඩුව රිදවනවා. අවමානයට පත් කරනවා. “මේ මගේ සාමාන්‍ය ජීවිතය” කියලා හිතපු දේ අරගෙන යනවා. නමුත් අද කූඩුවෙන් පිටවෙන්න බැරි නම්, අඩුම ගානේ කූඩුවට ඔබව නිදාගෙන තබන්න දෙන්න එපා. පැය භාවිත කරන්න. නිහඬතාව භාවිත කරන්න. හුස්ම භාවිත කරන්න. වචනය භාවිත කරන්න. කුඩා ලකුණ භාවිත කරන්න. හදවත ආයෙත් දකින්න ඉගෙනගන්න තුරු අඳුර පවා භාවිත කරන්න.","ආලෝකය ආවාම ඇවිදින්න. අඳුර ආවාම දකිනවා වගේ මවා පෙන්වන්න එපා. අභ්‍යන්තර ඇස නැවත ඉගෙනගන්න තුරු නිශ්චලව සිටින්න.","ශරීරය දිවි රැකගනී. මනස පැහැදිලි කරයි. නෆ්ස් ප්‍රතිචාර දක්වයි. කල්බ් සාක්ෂි දරයි. රූහ් මතක තබාගනී.","බන්දාවා ආපසු හැරෙයි.","ශරීරය දිවි රැකගනී. නමුත් ආත්මය මතක තබාගනී.","අල්ලාහ් කැමති විට, ආත්මයට තවමත් ගෙදරට ආපසු යන්න පුළුවන්."]}],"finalReflections":["අවසාන අධ්‍යායෙන් පසු වචන","අවසාන සිතුවිලි අවසාන අධ්‍යායෙන් පසු වචන","• • •","වචනවලට පෙර අකුරු","ඔබව කුර්ආනය වෙත යොමු කිරීමට පෙර, තවත් එක් දෙයක් මෙහි තැබිය යුතුයි.","සමහර සූරා වචනයකින්වත් ආරම්භ වෙන්නේ නැහැ. ඒවා අකුරුවලින් ආරම්භ වෙනවා — අලිෆ්, ලාම්, මීම්. හා, මීම්. වාක්‍යයක් නැති, පරිවර්තනයක් නැති, අධ්‍යායේ දොරකඩ තනිව සිටින අකුරු. විද්වත් උලමා ඔවුන්ගේ අවංකභාවයෙන් කියන්නේ ඒවායේ සැබෑ අර්ථය අල්ලාහ්ට පමණක් දන්නා බවයි. මම ඒ සමඟ තර්ක කරන්නේ නැහැ. මම කියන දේ ඒ අර්ථකථනයට අසලින් පමණක් තබනවා — කිසිදා එයට ඉහළින් නොවේ.","නමුත් ඒ අකුරු අසන විට මට දැනෙන්නේ මෙහෙමයි. ඒවා වචන නොවේ. ඒවා ශබ්දයක් — අර්ථයටත් වඩා පැරණි, ඒවා කවදා හෝ උච්චාරණය කළ සෑම මුඛයක් හරහාම, පරම්පරා හරහාම, පළමු උච්චාරණය දෙසට ආපසු යනවා වගේ දැනෙන පුරාණ ශබ්දයක්. මම අලිෆ්, ලාම්, මීම් සෙමින් කියන විට, මගේ පපුව තුළ කුඩා කම්පනයක් වගේ දෙයක් චලනය වෙනවා. නිර්මාණයේ ශක්තිය තවමත් ශරීරය තුළ මෘදු හඬකින් කම්පනය වෙනවා වගේ — ඒම “වෙන්න”, ඒම “කුන්”, භෞතික විද්‍යාඥයන් ලෝකයේ ගැඹුරුම තට්ටුව ගැන කතා කරන විට හමු වූ කම්පනය ගැන මතක් කරනවා වගේ.","මට මෙය ඔප්පු කරන්න බැහැ. මෙය සත්‍යයක් හෝ විද්‍යාවක් කියලා මම පෙන්වන්නේ නැහැ. මම මෙය ඉදිරිපත් කරන්නේ එක් මිනිසෙකුගේ විස්මයක් ලෙස පමණයි: කුර්ආනය ඔබට අර්ථයක් ලබා දීමට පෙර, එය මුලින්ම ඔබට ශබ්දයක් ලබා දෙනවා. ඒ ශබ්දය ඔබටත්, ඔබේ නමටත් වඩා පැරණියි. ඔබේ මනස තර්ක කිරීමට පෙර, ඔබේ හදවතට අසන්න කියලා ඒක ඉල්ලනවා.","ඒ නිසා එවැනි තනි අකුරු වෙත පැමිණි විට, ඒවා හිස් දෙයක් වගේ ඉක්මනින් පසුකර යන්න එපා. සෙමින් කියන්න. ඒවා කම්පනය වීමට ඉඩ දෙන්න. ශබ්දයට ඔබව විවෘත කිරීමට ඉඩ දෙන්න. ඉන්පසු ඉදිරියට කියවන්න.","◇","කුර්ආනය මාව කියවූ ආකාරය පමණයි මම ඔබට පෙන්වා දුන්නේ. ඔබ වෙනුවෙන් මට එය කියවන්න බැහැ. ඒ නිසා දැන්, මෘදුව, මම ඔබව ඒ දෙසට හැරවන්නම්: යන්න, එයට ඔබව කියවන්න ඉඩ දෙන්න.","තවත් ගැඹුරින් සිතන්න. මගේ ජීවිතයේ සිදු වූ දේ පමණක් කියවන්න එපා — පෙන්වා දී තිබුණේ මොකක්ද කියලා කියවන්න. මතුපිට දොරයි; අර්ථය කාමරයයි.","කොතැනින් ආරම්භ කරන්නද කියලා නොදන්නේ නම්, කුඩා තැනකින් පටන් ගන්න. සූරා අල්-ෆාතිහා විවෘත කරන්න. සූරා අල්-බකරහ් සෙමින්, ටික ටික කියවන්න. දයාව සහ සමතුලිතතාව ගැන සිතීමට සූරා අර්-රහ්මාන් කියවන්න. විස්තරයෙන් පැහැදිලි කර ඇති සලකුණු සඳහා සූරා ෆුස්සිලාත් කියවන්න. තනිකම දැනෙන විට සූරා අද්-දුහා කියවන්න. ඔබේ දවසට රැගෙන යා හැකි අර්ථයක් ඇති ඕනෑම කෙටි සූරාවක් ගන්න. එක් ආයතයක් කියවලා, නිශ්ශබ්දව වාඩි වෙලා එකම ප්‍රශ්නය අහන්න: මේ ආයතය මට මගේ ඇතුළේ මොකක් දැකගන්න කියනවාද?","දැන් එය කියවන්න.","ඉන්පසු මගේ පොත වසා, කුර්ආනය විවෘත කරන්න.","◇","මගේ තාත්තා හැමදාම කියූ වචන","වසර විසිහයක් තිස්සේ සාගරයක් හරහා මා වෙත පැමිණි නිසා, මගේ ජීවිතයේ තවත් එක් ශබ්දයක් මේ පොත තුළ ජීවත් විය යුතුයි.","මගේ තාත්තා කතා කළ හැම වතාවකම — ගල්ෆ් රටවලින්, දුරින්, වසර ගණනාවක් හරහා — ඔහුගේ පළමු වචන හැමදාම එකම වුණා. කිසිම පුවතකට පෙර, කිසිම කනස්සල්ලකට පෙර, කිසිම උපදෙසකට පෙර, ඔහුගේ හඬ පැමිණ මෙහෙම කියනවා:","“Eppadi? Enna vishesham?”","කොහොමද? මොනවද අලුත්?","ළමයෙකු ලෙස මම එය සාමාන්‍ය සුබපැතුමක් කියලා හිතුවා. මිනිසෙකු ලෙස දැන් මට තේරෙනවා — ඒක ඔහු ආදරය කළ මුළු ආකාරයම බව. මගේ අම්මා වගකීමෙන් ආදරය කළා — කෑමෙන්, වැඩෙන්, එක දවසක් ඇතුළේ සතියක බර උසුලමින්. මගේ තාත්තා උනන්දුවෙන් ආදරය කළා — මාව දැනගන්න කැමති වීමෙන්, තමන් ගැන කියන්නට පෙර මගේ ජීවිතය ගැන අහමින්. ආදරයේ භාෂා දෙකක්. වසර ගණනාවක් තිස්සේ මට ඒ දෙකෙන් එකක්වත් හොඳින් කියවන්න බැරි වුණා.","දැන් මම මගේම මිනිසුන්ට කතා කරන විට, මම තෝරාගන්නත් පෙර ඔහුගේ වචන මගේ මුඛයෙන් පිටවෙනවා මට ඇහෙනවා. Eppadi? Enna vishesham? තාත්තා පුතා තුළින් ඉදිරියට ගමන් කරනවා. ඒ සුබපැතුම උරුමයයි.","මෙම පිටුවෙන් ඔබ එක් අභ්‍යාසයක් රැගෙන යනවා නම්, මේක රැගෙන යන්න: ඔබ ආදරය කරන මිනිසුන්ට කතා කරන විට, මුලින් ඔවුන් ගැන අහන්න. ආදරය ඇතුළට එන කුඩාම දොර ඒකයි — සමහරුන්ට වසර ගණනාවකට පස්සේ පමණයි තේරෙන්නේ, මුළු කාලයම එතැන සිටියේ ආදරය බව.","◇","රැගෙන යාමට වෛරයක් නැහැ","මේ පිටු අවසානයට ඔබ පැමිණි විට, මම මගේ මාර්ගය එහි නිශ්ශබ්ද දොර දක්වා සම්පූර්ණයෙන්ම ඇවිද ගියා කියලා ඔබට දැනෙන විට — මාව පොළොවේ සොයන්න එපා, කිසිම දුකකත් මාව සොයන්න එපා.","මම එතැන අල්ලාගෙන නැහැ. ලෝකය හරහා මාව රැගෙන ගිය ශරීරයම මම කිසිදා නොවුණා; ඇස් පිටුපස වාඩි වී ඒ ශරීරය ඇවිදිනවා බලා සිටියේ මමයි.","මාර්ගයේදී මම බොහෝ දේ බිම තැබුවා. පොල් ගස පිටුපස සැඟවූ ලජ්ජාව. ගුවන් තොටුපළේදී මගෙන් ගත් නම. අවසානයේ නිශ්චල වීම මට උගන්වූ කුඩා සිරකුටිය. මගේ මුළු මුහුණ වෙන්න කැමති වූ තුවාලය.","නමුත් මම රැගෙන යාම ප්‍රතික්ෂේප කළ එක් දෙයක් තිබුණා. මම වෛරය රැගෙන ගියේ නැහැ. ගිය අය වෙනුවෙන් නොවේ. මාව ගණන් කර දොර වසා දැමූ අය වෙනුවෙන් නොවේ. ඇසීමට නොහැකි වූ අය වෙනුවෙන් නොවේ.","ඒ නිසා ඔබට මාව කොතැනකවත් සිරවී හමු වෙන්නේ නැහැ. වෛරයක් රැගෙන නොයන මිනිසෙකු ඔහුව බිමට අල්ලා තබන්න තරම් බර දෙයක් පසුපස තබන්නේ නැහැ.","ඔහු සැහැල්ලුවෙන් යනවා. ඔහු නිදහස්ව යනවා. මුළු ජීවිතයම සොයමින් සිටි නිශ්චලත්වයම ඔහු බවට පත්වෙනවා.","ඒ නිසා ඔබ මෙතරම් දුර කියවා ඇත්නම්, මගේ විවෘත අත්වලින් මෙච්චරක් පමණක් ගන්න: ඔබේම මාර්ගය ඇවිදින්න, බලා සිටින්න, පලා යන්න එපා, ශරීරය පමණක් නොව මනසත් පෝෂණය කරන්න — වෛරයක් රැගෙන යන්න එපා.","ඉන්පසු, ඔබ කොතැන සිටියත්, මම කොතැන සිටියත්, අපි දෙදෙනාම එකම නිශ්ශබ්ද ආලෝකය තුළ සිටිනවා.","◇"],"authorNote":"මෙය මතක සටහනකි. මෙහි ආධ්‍යාත්මික, දාර්ශනික සහ විද්‍යාත්මක සිතුවිලි කර්තෘගේ පෞද්ගලික අත්දැකීම් හා අවබෝධයන් ලෙස ඉදිරිපත් කෙරේ; ඒවා විධිමත් තෆ්සීර්, වෛද්‍ය උපදෙස් හෝ විද්‍යාත්මක සාධක ලෙස නොගත යුතුය.\nපෞද්ගලිකත්වය ආරක්ෂා කිරීම සඳහා සමහර නම් වෙනස් කර ඇත. පවතින නීතිමය කරුණක විස්තර හිතාමතාම මෙම පොතෙන් ඉවත් කර ඇත.\nමෙම සිංහල සංස්කරණය ඉංග්‍රීසි අවසන් මූලාශ්‍රයේ අර්ථය හා කර්තෘගේ හඬ හැකි තරම් සත්‍යව රැකගැනීමට සකස් කර ඇත. ස්වදේශීය සිංහල පාඨක සංශෝධනය අවසාන භාෂාමය පියවර ලෙස සලකන්න."};
const all=[...BOOK.chapters,{number:"final",title:"අවසාන සිතුවිලි",paragraphs:BOOK.finalReflections}];
const sel=document.getElementById("chapterSelect"),out=document.getElementById("reader"),status=document.getElementById("status"),note=document.getElementById("authorNote");
let idx=Math.max(0,Math.min(all.length-1,Number(localStorage.getItem("hcSinhalaBookChapter")||0)));
let fontSize=Math.max(15,Math.min(28,Number(localStorage.getItem("hcSinhalaBookFont")||18)));
String(BOOK.authorNote||"").split(/\n+/).filter(Boolean).forEach(x=>{const p=document.createElement("p");p.textContent=x;note.appendChild(p)});
all.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=c.number==="final"?"අවසාන සිතුවිලි":("අධ්‍යාය "+c.number+" · "+c.title);sel.appendChild(o)});
function render(top=false){const c=all[idx];sel.value=idx;out.innerHTML="";const k=document.createElement("div");k.className="kicker";k.textContent=c.number==="final"?"අවසාන කොටස":"අධ්‍යාය "+c.number;out.appendChild(k);const h=document.createElement("h2");h.textContent=c.title;out.appendChild(h);(c.paragraphs||[]).forEach(x=>{const p=document.createElement("p");p.textContent=x;if(x==="• • •"||x==="◇")p.className="sep";out.appendChild(p)});out.style.fontSize=fontSize+"px";status.textContent=(idx+1)+" / "+all.length+" · ඔබගේ ස්ථානය මෙම උපාංගයේ සුරැකේ";localStorage.setItem("hcSinhalaBookChapter",String(idx));localStorage.setItem("hcSinhalaBookFont",String(fontSize));document.getElementById("prev").disabled=idx<=0;document.getElementById("next").disabled=idx>=all.length-1;if(top)scrollTo(0,0)}
sel.addEventListener("change",()=>{idx=Number(sel.value);render(true)});
document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render(true)}};
document.getElementById("next").onclick=()=>{if(idx<all.length-1){idx++;render(true)}};
document.getElementById("smaller").onclick=()=>{fontSize=Math.max(15,fontSize-1);render(false)};
document.getElementById("larger").onclick=()=>{fontSize=Math.min(28,fontSize+1);render(false)};
render(false);
</script>
</body></html>
