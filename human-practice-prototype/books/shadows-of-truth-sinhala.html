const BOOK={"chapters":[{"number":1,"title":"ඒ වන විටත් බලා සිටි පිරිමි ළමයා","paragraphs":["නිශ්චලව වාඩිවෙන්න ඉගෙනගන්න කලින්, මට චලනය වෙන්න දැනුණා.","මගේ මුල් ජීවිතයේ බොහෝ කාලයක්, චලනයම මම ජීවතුන් අතර සිටින බවට සාක්ෂියක් වුණා. අවදි වීම. වැඩ කිරීම. ගමන් කිරීම. ඔසවා ගැනීම. බර දැරීම. උපයා ගැනීම. උදව් කිරීම. කොහේ හරි යාම. යමක් පසුපස හඹා යාම. වෙහෙසට පත් වී ගෙදර ඒම. නිදා ගැනීම. නැවත ආරම්භ කිරීම. මම කළ සියල්ලේ මධ්‍යයේ සිටියේ ශරීරයයි. එදා ඔබ මගෙන්, “ඔබ ඔබේ ජීවිතය නාස්ති කරනවාද?” කියා ඇසුවා නම්, මම “නැහැ” කියනවා. මම උත්සාහ කරමින් සිටියා. මම කම්මැලියෙක් නොවෙයි. මගේ පවුලත්, මගේ රටත්, වැඩිමහල් පුතෙකුගෙන් බලාපොරොත්තු වූ දේ මම කරමින් සිටියා. නමුත් ඒ පළමු සත්‍යයට යටින් තවත් සත්‍යයක් සැඟවී තිබුණා. මම මනසට ආහාර දීමට වඩා ශරීරයට බොහෝ වැඩියෙන් ආහාර දෙමින් සිටියා. කෙනෙකු ඉතා කාර්යබහුලව සිටියත්, ඇතුළින් ගැඹුරු නින්දක සිටිය හැකියි. මම එසේම සිටියා. නිතරම චලනය වෙමින්. කලාතුරකින් පමණක් බලා සිටිමින්.","ඒත්, ඒ කාලයේත්, මගේ ඇතුළේ තිබුණු නිහඬ කොටසක් ඒ වන විටත් බලා සිටිමින් සිටියා. එයට නමක් තිබෙන බව මට දැනුණේ නැහැ. තවත් අවුරුදු විසිපහක් යන තුරු මම එයට නමක් දෙන්නේ නැහැ. ඒ නම පැමිණෙන්නේ මම අක්කරයිපත්තුහි දූවිලි පාරවල් ඔස්සේ ඇවිද ගිය පිරිමි ළමයෙකු වූ කාලයේ සිතාගන්නත් නොහැකිව තිබූ, වෙනත් රටක කුඩා කාමරයකින්. නමුත් ඒ බලා සිටින්නා ආරම්භයේ සිටම එහි සිටියා. මගේ ඉතිරි කොටස ජීවිතය ජීවත් කරමින් කාර්යබහුලව සිටියදී, මගේ ළමා කාලයේ ඡායාරූපය ඇතුළින් නිහඬව ගනිමින් සිටියේ ඒ කොටසයි.","• • •","මගේ ආච්චි මගේ පළමු ගුරුවරුන්ගෙන් එක් අයෙකි. නමුත් ඇය කවදාවත් මාව වාඩි කරවා පාඩමක් ඉගැන්වූයේ නැහැ. ඇය මට ඉගැන්වූයේ ඇවිදීමෙන්.","අපි දෙදෙනා එකට ගිය ඒ පාර තවමත් මට මතකයි. ප්‍රධාන වීදිය. පැරණි පෙට්‍රල් ස්ටේෂනය පසුකර වමට හැරෙන මඟ. පාරවල් තවමත් තාර දමා පිළිවෙළකට සකසා නොතිබූ කාලයේ, ඒ පටු පාර දිගේ නිදහසේ ඇවිද ගිය ගවයන්. මගේ නැන්දාගේ ගෙදරට යන විට, ඇතැම් ගස්වලින් වැටුණු කුඩා තියුණු කටු මගේ කකුල්වලට විදින්නට පටන් ගනී. ඇය නවතිනවා. එකින් එක ඒවා ඉවත් කරනවා. කිසිවෙකු විසින් ඉගැන්වීමකින් තොරව සමහර මිනිසුන් තමන් තුළ රැගෙන යන ඉවසීමක් තිබෙනවා; ඇය ඒ ඉවසීමෙන් එය කළා. එවැනි සැලකිල්ලක්, දරුවෙකුට එයට වචන ලැබීමට පෙරම, ඔහුගේ ශරීරයට ඇතුළුවී පදිංචි වෙනවා. භාෂාවට යටින් තිබෙන දෙයක් එය ඔබට උගන්වනවා: මෘදුකම දුර්වලකමක් නොවේ; කුඩා දේවල් පවා සැලකිල්ලෙන් අල්ලන මිනිසුන්, පසුව මිනිසුන්වද සැලකිල්ලෙන් අල්ලන අය වෙයි.","ඒ පාරට දූවිල්ලේ සුවඳ තිබුණා. දහවල් උණුසුමේ රත් වූ තාරයේ සුවඳ තිබුණා. ඉරෙන් වියළී ගිය ගව මළයේ සුවඳ තිබුණා. කොණේ කඩයෙන් එන බැදපු තෙල් සුවඳත් තිබුණා. මගේ ආච්චි ඒ සියල්ල මැදින් ඇවිද ගියේ, ඉවසීමටම කකුල් තිබුණා වගේ.","එක් දවසක්, ඇය අසලින් ඇවිදගෙන යද්දී, මම කුඩා ගලක් අහුලාගෙන ගවයෙකුගේ පිටුපසට හෙමින් ගියා. දරුවෙකුගේ අහංකාරකමක් විය යුතුයි. මම ඒ ගල විසි කරන්න උත්සාහ කළා. ගවයා වහාම පසුපසට පා පහරක් දුන්නා. තදින්. වේගයෙන්. කිසිවෙකු වචනයක් කියන්නට පෙරම, ලැජ්ජාව මගේ පපුවට වැටුණු බව මට දැනුණා. දේශනයක් අවශ්‍ය වුණේ නැහැ. මගේ මනස තවම කියන්න ඉගෙනගෙන නොතිබූ දේ මගේ ශරීරය ඒ වන විටත් තේරුම් ගෙන තිබුණා: අහිංසක දෙයක් කෝපයට පත් කරන්න එපා. ගැඹුරුම පාඩම් ඇතුළට යන ආකාරයටම, ඒ පාඩමත් විස්තරයක් නැතිවම සෘජුව ඇතුළට ගියා. ගවයා ඉදිරියට ඇවිද ගියා. ආච්චි ඉදිරියට ඇවිද ගියා. පිරිමි ළමයාද ඉදිරියට ඇවිද ගියා, පෙරට වඩා ටිකක් වෙනස් කෙනෙකු ලෙස.","• • •","මගේ ආච්චිගේ ගෙදර අසල ගෙවල් අතර මැද අඹ ගසක් තිබුණා. එය පළලයි, දායාදශීලීයි. එහි අතු වහලය දෙසට විහිදී තිබුණේ, දරුවන්ට නැගීමටම එය වැඩී තිබුණා වගේ. මගේ සහෝදරයාත් මමත් ඒ ගසට නැගී වහලයට ගොස්, අනතුර කියන්නේ වෙනත් මිනිසුන්ට පමණක් සිදුවන දෙයක් ලෙස සිතාගෙන එහි සෙල්ලම් කළා. වහලය අපේ පාද යට උණුසුම් වුණා. ටයිල් පැරණි, දූවිලි පිරුණු ඒවා වුණා. එතැනින් බැලූ විට පහළ කුඩා ගම, නොදන්නා කෙනෙකු විසින් යවන තැපැල් කාඩ්පතක් වගේ පෙනුණා.","එක් දහවලක, මගේ ආච්චි ඒ ගස යට වාඩිවී තියුණු ලෝහ කපනයකින් බුලත් පුවක් කපමින් සිටියා. මගේ සහෝදරයාත් මමත් එකිනෙකා සමඟ රළු ලෙස සෙල්ලම් කරමින් සිටියා; සහෝදරයන්ගේ ශක්තිය ඔවුන්ගේ ප්‍රඥාවට වඩා විශාල වන වයස එයයි. සැලකිල්ලක් නැති එක් තත්පරයක, මම ඒ කපනය විසි කළා. එය ඔහුගේ මුහුණේ වම් පැත්ත අසල වැදුණා, රුධිරය වහාම ආවා. මගේ අම්මා, බියත් කෝපයත් එකම හුස්මක මිශ්‍ර වී, පිටතට දුවගෙන ආවා. මම දුව ගියා. පැය ගණනක් සැඟවී සිටියා.","මම මගේ ශරීරය කුඩා කළා. මගේ හුස්ම නිහඬ කළා. මම සැඟවී සිටි ඒ කුඩා ඉඩටත් වඩා මාව තවත් කුඩා කළා; මම තවත් කුඩා වුණොත්, මගේ අත කළ දේ ඉවත් කළ හැකි යැයි සිතුවා වගේ. දරුවෙකු සැඟවී සිටින විට ඔහු ඉගෙන ගන්නා දේ අමුතුයි. එක් තත්පරයක් මුළු දවසක්ම “ඊට පෙර” සහ “ඊට පසු” ලෙස දෙකට කපා දැමිය හැකි බව ඔබ ඉගෙන ගන්නවා. සමහර දේවල් කළ පසු, ඔබ බිත්තියක් පිටුපස කොතරම් සම්පූර්ණයෙන් අතුරුදහන් වුණත්, ඒවා ආපසු ගන්න බැරි බවත් ඔබ ඉගෙන ගන්නවා.","එදා මට එය දැනුණේ නැහැ. නමුත් ඒ කුඩා ඉඩක සැඟවී සිටි පිරිමි ළමයා යමක් පුහුණු කරමින් සිටියා. දශක කිහිපයකට පසු, තවත් දූපතක සිර කුටියක, පිටව යා නොහැකි කාමරයක් තුළ තම ශරීරය කුඩා කරගන්නේ කෙසේදැයි මගේ ශරීරය මතකයට ගනු ඇත. සිරගෙදරට බොහෝ පෙරම සැඟවීම ආරම්භ වී තිබුණා.","• • •","අපේ ගෙදර පිටුපස, වහලය දෙසට නැඹුරු වූ පේර ගසක් තිබුණා. එක් දවසක් මගේ සහෝදරයා වහලයේ අගින් ලිස්සා වැටුණා. ඒ නිශ්චිත මොහොතේම, මගේ අම්මා කුස්සියෙන් පිටතට එමින් සිටියා. ඔහු සෘජුවම ඇගේ පිට මත වැටුණා.","මම තවමත් වහලය මත සිටියා. කම්පනයෙන් කැටිවී, පහළට ඔවුන් දෙස කෑ ගසමින්. අදත් මට ඇය එතැන පෙනෙනවා. ඒ වැටීමේ සම්පූර්ණ බර තම ශරීරයෙන් දරාගෙන, ඇය පහත් වී සිටියා. මවක් ගැන මිනිසුන් බොහෝ දේ කියන්න පුළුවන්. ඒ සියල්ල කරුණාවන්ත දේවල් විය යුතු නැහැ. නමුත් ඒ සියල්ලට යටින්, ඇය තවමත් ඔබේ මවයි. ඒ එක් මොහොතේ, මට විස්තර කළ නොහැකි දෙයක් මම දුටුවා — අභ්‍යන්තර හැඟීම, පරිත්‍යාගය, ආරක්ෂාව, සමහර විට කරුණාව පවා. තුවාල ලැබූයේ මම නොවෙයි. බලා සිටියේ මමයි.","සමහර විට, සියල්ලටම වඩා දිගු මතකය රැගෙන යන්නේ සාක්ෂිකරු බව මම පසුව ඉගෙන ගත්තා.","• • •","මෙහි කුඩා දෙයක් එකතු කිරීමට මට අවශ්‍යයි. මන්ද, මේ පොතේ ඉතිරි සියල්ල ඔබට තේරුම් ගැනීමට, එය ඔබ තේරුම් ගත යුතුයි.","ඒ කුඩා මුල් මොහොතවල් — ඉවත් කළ කටුව, පා පහර දුන් ගවයා, පියාසර කළ කපනය, වැටීම අල්ලාගත් මව — ඒ කිසිවක් මම ඒවා ජීවත් කරමින් සිටියදී වැදගත් ලෙස පෙනුණේ නැහැ. ඒවා ළමා කාලය පමණයි. ශ්‍රී ලංකාවේ නැගෙනහිර වෙරළේ කුඩා දෙමළ-මුස්ලිම් ගමක පිරිමි ළමයෙකු ලෙස ජීවත් වීමේ කුඩා අනතුරු සහ පාඩම් පමණයි. ඒ කිසිම මොහොතක, මාව හැඩගස්වමින් සිටින බව මම තේරුම් ගත්තේ නැහැ.","දැන් පමණයි, වසර විස්සකටත් වැඩි කාලයකට පසු, මධ්‍යධරණී මුහුදේ කුඩා දූපතක මේසයක් අසල වාඩිව සිටින විට, සිදුවෙමින් තිබුණේ කුමක්දැයි මට පෙනෙන්නේ. ඒ සෑම මොහොතක්ම මගේ ඇතුළත තිබුණු බලා සිටින්නාට බලා සිටීමට ඉගැන්වමින් තිබුණා. අඹ ගස මට ප්‍රතිඵල ගැන ඉගැන්වුවා. ආච්චි මට ඉවසීම ගැන ඉගැන්වුවා. ගවයා මට කෝපයට පත් කිරීම ගැන ඉගැන්වුවා. කපනය මට ආපසු ගන්න බැරි එක් තත්පරයක් ගැන ඉගැන්වුවා. මගේ අම්මාගේ පිට මට පරිත්‍යාගය ගැන ඉගැන්වුවා.","බලා සිටින්නා ඉගෙන ගනිමින් සිටියා. නමුත් ඔහු තවමත් නිශ්චලව වාඩිවීමට බල කරනු ලැබී තිබුණේ නැහැ.","ඒක පසුව එනවා. ඉතා පසුව. මම තවමත් සිතා නොතිබූ ස්ථානයක. නමවත් අසා නොතිබූ දූපතක. තමන් එහි පැමිණෙන බව තවමත් නොදන්නා මිනිසෙකු වෙනුවෙන් ඒ වන විටත් ඉදිකරමින් තිබූ බිත්ති ඇතුළත. අඹ ගසට තමන් මාව සූදානම් කරමින් සිටින බව දැනුණේ නැහැ. ආච්චිට දැනුණේ නැහැ. මගේ අම්මාට දැනුණේ නැහැ. මට දැනුණේ නැහැ. නමුත් බලා සිටින්නා දැන සිටියා. බලා සිටින්නාට හැමවිටම දැන සිටියා."]},{"number":2,"title":"බෝට්ටුව, සුනාමිය, සහ බලා සිටි පිරිමි ළමයා","paragraphs":["මේ අධ්‍යායයේ මට ලියන්න ඕන වෙරළ දෙකක් ගැනයි. ඒවා වසර වෙනස් වූ, සිදුවූ ආකාරය වෙනස් වූ, ප්‍රතිඵල වෙනස් වූ සිදුවීම්. ඒත් මගේ මතකයේ ඒ දෙක එකිනෙකට ළඟින් වාඩිවෙලා තියෙනවා. මොකද ඒ දෙකම මට එකම දෙයක් වෙන වෙනස් රූපවලින් ඉගැන්නුවා. ලෝකය එකපාරටම ශරීරයට දරාගන්න බැරි තරම් විශාල වෙද්දී ශරීරය කොහොම ප්‍රතිචාර දක්වනවාද කියලා.","• • •","පළමු වෙරළ. මම අටවන ශ්‍රේණියේ හිටියා. පාසලෙන් පස්සේ, ජුම්මා යාච්ඤාවෙන් පස්සේ, සිකුරාදා දහවලක්. නැගෙනහිර වෙරළේ කුඩා මුස්ලිම් නගරයක සිකුරාදාට විතරක් තියෙන ඒ විශේෂ නිදහස වාතය ඇතුළේ තිබුණු වෙලාවක්. මගේ යාළුවෝ දෙන්නෙක් එක්ක මම වෙරළට ගියා.","ඔවුන්ගෙන් එක්කෙනෙකුගේ පවුලට වතුර ළඟ ඉඩමක් තිබුණා. අපි කෑම ටිකක් ගත්තා. අපේ බයිසිකල් ගත්තා. මගේ එක කොළ පාට මවුන්ටන් බයිසිකලයක්. පිරිමි ළමයෙක් තමන්ට තියෙනවා කියලා අනිත් අය දැක්කොත් ආඩම්බර වෙන වර්ගයේ එකක්. අපි තුන්දෙනා එකට පැදගෙන ගියා.","අපි එතැනට ගියාම බයිසිකල් හොඳට හේත්තු කරන්න තැනක් තිබුණේ නැහැ. ඒ නිසා තුනම ත්‍රිකෝණයක් වගේ නවත්තා, එකක් තවත් එකක් අල්ලාගෙන සිටින විදියට තැබුවා. කෙනෙක් වැලි මතට ඇදලා දාපු කුඩා ලී රුවල් බෝට්ටුවක් යට අපි වාඩි වුණා.","වතුර ඒ වටේ තිබුණු පස කාගෙන ගිහින් තිබුණ නිසා අපේ පිටිපස්සේ බිම හදිසියෙන් පහළට වැටෙනවා වගේ තිබුණා. පාරෙන් අපිව කිසිම විදියකින් දකින්න බැහැ. අපි තුන්දෙනෙක්, එක බෝට්ටුවක්, විවෘත මුහුදක් එක්ක, අපේම කුඩා රහස් ලෝකයක් ඇතුළේ හිටියා.","මගේ යාළුවන්ට බීඩි උත්සාහ කරලා බලන්න ඕන වුණා. මගේ සීයා මොහොමඩ් ඉස්මයිල් — හැමෝම ෆාරූක් කියලා කතා කළ මිනිසා — ඒවා හදන කෙනෙක්. දුම්කොළේ සුවඳත්, ගෙදර සුවඳත්, ඔහුගේ ඇඟිලිවල සුවඳත් ගෙන ආ ඒ කුඩා අතින් සරලව රෝල් කළ සුරුට්ටු. මම ඒවා වටේ හැදී වැඩුණා. ඒත් එකකටවත් අත නොතැබුවා.","නමුත් කණ්ඩායමක් ඇතුළේ කුතුහලය, තාත්තා දුන් ඕනෑම හොඳ උදාහරණයකටත් වඩා වේගයෙන් දුවනවා. මම ගෙදරින් ටිකක් හොරෙන් ගත්තා. පිරවුමට කියලා මගේ දකුණු සාක්කුවට ලිහිල්ව හාල් පොත්තක් දාගත්තා. අපි බීඩිය පත්තු කරන්න උත්සාහ කළා. ඒක පත්තු වුණේ නැහැ. මුහුදෙන් එන සුළඟ අපි දල්වන හැම ගිනිකූරක්ම නිවලා දැම්මා.","සුළඟෙන් බේරෙන්න මම බෝට්ටුව යටට රිංගුවා. ගිනිකූරක් ගැහුවා. ඒක පත්තු වුණා. දුම දැක්කා. පස්සේ මම ගිනිකූර පැත්තකට විසි කළා. ළමයෙක් තමන් බැලීම නවත්තපු නිසාම ගින්නත් නිවී ගියා කියලා විශ්වාස කරන සැහැල්ලු ආකාරයෙන්. මම ආපහු පිටට ඇවිත් මුහුද දෙසට මුහුණලා වාඩි වුණා. වතුරෙන් ආ සුළඟ අපේ මුහුණවලට තල්ලු වෙමින් තිබුණා. එයින් අපේ පිටිපස්සේ ඇති ඕනෑම දෙයක් — සුවඳ, ශබ්දය, උණුසුම — බෝට්ටුවට ඉහළින් අහසට නැඟී අපට නොදැනී ගියා.","අපේම පිටිපස්සේ සිදුවෙමින් තිබුණු දේ අපි දැක්කේ නැහැ.","• • •","ටික වෙලාවකට පස්සේ මම හැරී බැලුවා.","බෝට්ටුව ගිනි ගනිමින් තිබුණා. කුඩා ගින්නක් නොවෙයි. සම්පූර්ණයෙන් නැඟී එන ගින්නක්. කළු දුම අහසට ඝන මෂ්රූම් හැඩයකින් නැඟෙමින් තිබුණා. බය එන්න කලින්, මට අදටත් මතකයි, මම බොහෝ සන්සුන්ව ඒක න්‍යෂ්ටික දෙයක් වගේ පෙනෙනවා කියලා සිතුවා. ව්‍යසනයේ පළමු තත්පරයේ ළමා මනස අල්ලගන්න දේ අමුතුයි. භීතිය නොවෙයි. සැසඳීමක්. මනසට බය වෙන්න පටන් ගන්න කලින්, ඒ රූපය කොහේ හරි තැන්පත් කරගන්න ඕන වගේ.","පාර දෙසට දුවද්දී, මම සුදු කමිසයක් සහ සුදු තොප්පියක් ඇඳගත් මිනිසෙක් දැක්කා. ඔහු පිරිමි පාසල පිටිපස්සේ ජීවත් වුණා. ජසිල් කාකාගේ කඩේ පවුලට සම්බන්ධ කෙනෙක්. උපන් දා සිට ඔහු කතා කරලා තිබුණේ නැහැ. වචන නැති මිනිසෙක්. ඒ මිනිසා කෑගහමින් සිටියා. ජීවිතේ කිසිදා කතා නොකළ මිනිසා කෑගහමින් සිටියා.","මම යාළුවන්ට කිව්වා, පිටිපස්ස බලන්න, දුවන්න කියලා. ඒත් වැලි වෙරළ, බයට දුවන්න ඕන වේගයට දුවන්න දෙන්නේ නැහැ. පාද වැලි ඇතුළට ගිලෙනවා. ශරීරයට වේගය ඕන. වැලි ඒකට එකඟ වෙන්නේ නැහැ. දුම උඩට ගියාම මිනිස්සු හැම පැත්තෙන්ම එන විදියට, මිනිස්සු හැම දිසාවෙන්ම ආවා.","අපි දුවද්දී, ගින්න අපේ පිටිපස්සේ. ඇඟ ඇතුළේ ලැජ්ජාව, බය, විශ්වාස කළ නොහැකි හැඟීම එකට මිශ්‍ර වෙලා තිබුණා. ඒක මගේ අතින් සිදු වූ බව මම දැනගෙන හිටියා. ඒ මොහොතේ කිසිවෙකු මට කිව්වේ නැහැ. අවශ්‍යත් නැහැ. ශරීරය දන්නවා. සමහර සත්‍යයන් වචනවලට කලින්ම ශරීරය දන්නවා.","පස්සේ අපිව අල්ලගත්තා. අපිව රැගෙන ගියා. මිනිස්සු කෑගැහුවා. වැඩිහිටියන්ගේ මුහුණු තදවුණා. ඒ බෝට්ටුව කෙනෙකුගේ ජීවිකාවක්, කෙනෙකුගේ ගෞරවයක්, කෙනෙකුගේ දවසේ වැඩක් බව මට පසුව තේරුණා. ඒ වෙලාවේ මට දැනුණේ මගේ අතින් ලෝකයට විශාල හානියක් සිදු වෙලා තියෙනවා කියලා විතරයි. ගිනිකූරක් කෙතරම් කුඩාද කියලා මම දැනගෙන හිටියා. ඒත් කුඩා දෙයක් කොතරම් විශාල ප්‍රතිඵලයක් ගෙන එන්න පුළුවන්ද කියලා ඒ දවසේ මට පළමු වරට දැනුණා.","ඒ බෝට්ටුවේ ගින්න මගේ ඇතුළේ දිගු කාලයක් රැඳුණා. එය දරුවෙකුගේ වැරදීමක් විතරක් නොවෙයි. එය වගකීම පිළිබඳ පළමු පාඩම්වලින් එකක්. තමා කළ දෙය සහ සිදුවූ දෙය අතර තියෙන දුර ගැන පාඩමක්. ගිනිකූර මම විසි කළා. බෝට්ටුව ගිනි ගත්තා. ඒ දෙක අතර තිබුණු හැම තත්පරයක්ම මම නොදැක සිටියා. ඒ නොදැක සිටීම මට වසර ගණනාවකට පස්සෙත් අමතක වුණේ නැහැ.","• • •","දෙවන වෙරළ ආවේ වෙනත් වසරක. ඒ වෙලාවේ මම තවමත් ළමයෙක්. 2004 දෙසැම්බර් මාසයේ ඒ උදෑසන, මුහුද තමාගේ සාමාන්‍ය ස්ථානයෙන් ඉවත් වෙන්න පටන් ගත්තා. මුලින් එය පුදුමයක් වගේ පෙනුණා. මිනිස්සු වතුර පසුබැසීම දැක්කා. සමහරු බලන්න ගියා. සමහරු එය අවදානමක් බව තේරුම් ගන්න බැරි තරම් පුදුමයෙන් හිටියා. මුහුද වසර ගණනාවක් එකම ආකාරයට ජීවත් වූ නිසා, ඒක එකපාරටම වෙනස් වුණාම මනස ඒ වෙනසට නමක් දාන්න ප්‍රමාද වුණා.","සුනාමිය එන්න කලින් ලෝකය අමුතු විදියට නිශ්ශබ්ද වුණා. ඒ නිශ්ශබ්දතාවය හිස් නොවෙයි. එය පිරී තිබුණා. වාතය ඇතුළේම කෙනෙක් හුස්ම තද කරගෙන ඉන්නවා වගේ. මම ඒ වෙලාවේ සම්පූර්ණ අර්ථය දැනගෙන හිටියේ නැහැ. නමුත් ශරීරය යමක් දැනුණා. කුඩා පිරිමි ළමයෙකුගේ ශරීරය පවා ලෝකයේ වෙනස දැනගන්නවා. මනස තවමත් ඒකට හේතුවක් සොයාගෙන නැති වෙලාවකත්.","පස්සේ වතුර ආවා. සාමාන්‍ය රැල්ලක් වගේ නොවෙයි. මුහුද තමාගේ සීමාව මතක් නැති කරගෙන, ගොඩබිම ඇතුළට පැමිණෙනවා වගේ. එය දුවන ජලය, ඇදගෙන යන ජලය, මිනිස්සුන්ගේ කෑගැසීම්, දොරවල්, බිත්ති, බඩුබාහිරාදිය, කුඩා දේවල්, විශාල දේවල්, හැම දෙයක්ම එකට ගෙන ආ ජලයක්. ඒක ජලය පමණක් නොවෙයි. ඒක බලයක්. මිනිසුන්ගේ අර්ථයන්, සැලසුම්, කාලසටහන්, දෛනික ජීවිත, ගෙවල් — හැම දෙයකටම වඩා විශාල දෙයක්.","ඒ දවසේ මම සම්පූර්ණ ලෝකය තේරුම් ගත්තේ නැහැ. ළමයෙක් විදියට මට පේන්නෙ කෑලි කෑලි. මුහුණු. ශබ්ද. දුවන පාද. වතුරේ ගඳ. මිනිසුන්ගේ ඇස්. වැඩිහිටියන් මොනවා කළ යුතුද කියලා නොදන්න මොහොතක ඔවුන්ගේ මුහුණුවල ඇති ඒ භාවය. ළමයෙකුට වැඩිහිටියන්ගේ බය දකින්න ලැබෙන දවසක්, ලෝකය ස්ථිරයි කියන විශ්වාසයේ කොටසක් කැඩෙන දවසක්.","සුනාමිය බෝට්ටුවේ ගින්නට වඩා වෙනස්. බෝට්ටුවේ ගින්නට මගේ අත තිබුණා. සුනාමියට මගේ අත තිබුණේ නැහැ. එය මට සිදු වූ දෙයක්, අපට සිදු වූ දෙයක්, රටට සිදු වූ දෙයක්. නමුත් ශරීරය ඒ දෙකම එකම භාෂාවකින් මතක තබාගත්තා. හදිසි වෙනස. පාලනය නැතිවීම. තත්පරයකින් සාමාන්‍ය ජීවිතය නව නමක් ගන්න හැකි බව.","වෙරළ දෙකම මගේ ඇතුළේ එකම ප්‍රශ්නය තබා ගියා. මිනිසාට ඇත්තටම පාලනය කොච්චර තියෙනවාද? අපි අපේ දවස තීරණය කරගෙන, අපේ බයිසිකල් තැනකට නවත්වලා, කෑම ගෙන, සැලසුම් කරගෙන යනවා. එවිට ගිනිකූරක් හෝ රැල්ලක් එනවා. ලෝකය අපට වඩා වේගයෙන් තීරණය කරලා ඉවරයි.","මම එය අල්ලාහ් ගැන දැනුමක් විදියට ඒ වෙලාවේ කියලා නොගත්තත්, පසුකාලයේ මම එය එහෙම දැනුණා. මිනිසාගේ පාලනය ඉතා කුඩා දෙයක්. මිනිසාගේ වගකීමත් ඉතා සැබෑ දෙයක්. මේ දෙක එකට ජීවත් වෙනවා. අපි කළ දේට වගකියන්න ඕන. ඒ අතරම අපි නොකළ දේවල්, අපට වඩා විශාල රැලි වගේ අපේ ජීවිතයට ඇතුල් වෙනවා. ඒ දෙක අතර මිනිසා තමන්ව හොයාගන්න පටන් ගන්නවා.","• • •","ඒ නිසා මම ඒ වෙරළ දෙක එකට මතක තබාගන්නවා. එක වෙරළක, මගේම අතින් විසි කළ ගිනිකූරක් කෙනෙකුගේ බෝට්ටුව ගිනිගත්තා. අනෙක් වෙරළක, මුහුදම තමාගේ සීමා අමතක කරගෙන ගොඩබිමට ආවා. එකක් මගේ වගකීම ගැන කතා කළා. අනෙක මගේ අසරණකම ගැන කතා කළා. දෙකම මට මිනිසාගේ ශරීරය ගැන ඉගැන්නුවා.","ශරීරය දුවනවා. ශරීරය ගැහෙනවා. ශරීරය වැලි තුළට ගිලෙන පාද අදින්න උත්සාහ කරනවා. ශරීරය වතුරෙන් බේරෙන්න උත්සාහ කරනවා. ශරීරය පළමුව බේරෙන්න හදනවා. පස්සේ පමණයි මනස ඇවිත් අර්ථය හදන්න පටන් ගන්නේ. ඒ දවස්වල මට ඒ වචන තිබුණේ නැහැ. ඒත් අත්දැකීම තිබුණා.","මගේ ඇතුළේ බලා සිටින්නා ඒ දෙකම දුටුවා. ඒක දරුවෙකුගේ ඇතුළේ තිබුණ නිහඬ කොටස. එය ගින්න දුටුවා. එය දුම දුටුවා. එය මුහුද පසුබැසීම දුටුවා. එය මිනිස්සුන්ගේ බය දුටුවා. එය තවමත් කිසිවක් විනිශ්චය කළේ නැහැ. එය ඉගෙනගනිමින් තිබුණා. එය එකතු කරමින් තිබුණා.","අද මම ඒ පිරිමි ළමයා ගැන සිතද්දී, මට ඔහුව දොස් කියන්න බැහැ. ඔහු කුතුහලයෙන් සිටි ළමයෙක්. ඔහු ගිනිකූරක් කුඩා දෙයක් කියලා සිතූ ළමයෙක්. ඔහු මුහුද සාමාන්‍යයෙන් වගේම හැමදාම පවතිනු ඇතැයි සිතූ ළමයෙක්. ළමයින් ලෝකය ගැන ඉගෙනගන්නේ ලෝකය කැඩෙන තැන්වලිනුත්.","ඒ පිරිමි ළමයා ලොකු වුණා. ඔහු රටවල් හැර ගියා. ඔහු වැඩ කළා. ඔහු ආදරය කළා. ඔහු වැරදි කළා. ඔහු වැටුණා. ඔහු තමාගේ ශරීරය පෝෂණය කරන්න ඉගෙනගත්තා, නමුත් මනසට ආහාර දිය යුතු බව තවම සම්පූර්ණයෙන් දැනගෙන හිටියේ නැහැ. ඒත් බෝට්ටුව සහ සුනාමිය ඔහුගේ ඇතුළේ හිටියා. ඒවා සඟවා තිබුණු පාඩම් වගේ, නිවැරදි කාලය එනතුරු නිහඬව බලා සිටියා.","ඔහු ඒ සිදුවීම් දෙකම තමන් ඇතුළේ දරාගෙන ගියා. ඒ දෙක ගැන කුමක් කළ යුතුද කියලා නොදැන. බලා සිටින්නා දැන් විශාල දේවල් දෙකක් දැකලා තිබුණා — එකක් ඔහුගේම අතින් ඇති වූ දෙයක්, අනෙක ඔහුගේ අවසරයක් නැතුව ඔහු මතින් ගිය දෙයක්.","දෙකම වෙනස් රූපවලින් එකම පාඩම ඉගැන්නුවා: කුඩා ක්‍රියාවක්, හෝ වැරදි තැනක තත්පරයක්, හැම දෙයක්ම වෙනස් කරන්න පුළුවන්. පාලනය කියන දේ බොහෝ විට මායාවක්. ඔබව බේරාගන්න දේත් ඔබව විනාශ කරන්න දේත් එකම වර්ගයේ උදෑසනක පැමිණිය හැක.","වසර විස්සකට පස්සේ, තවත් රටක, තවත් වෙරළක, වෙනත් වර්ගයේ රැල්ලක් මගේ ජීවිතයට එන්න තිබුණා. එය ජලයෙන් හදපු එකක් නොවෙයි. එය කවුරුත් මරා දැම්මේ නැහැ. ඒත් එයත් ඒ තරම්ම හදිසි. එයත් මගෙන් ඒ තරම්ම ගත්තා. දැවුණු බෝට්ටුව දුටු, මුහුද තමාගේ වෙරළ ගිලගන්නා දේ දුටු ඒ පිරිමි ළමයා, තුන්වන රැල්ල එන වෙලාවේ ශරීරය ඇතුළේ සිටින මිනිසා වුණා.","නමුත් ඒක පසුව එන අධ්‍යායයක්. දැන් අපි තවමත් වෙරළේ. බෝට්ටුව තවමත් ගිනි ගනිමින් තිබෙනවා. මුහුද තවමත් පසුබැසීම ආරම්භ කරලා විතරයි.","පළමු කොටස — දූතයා"]},{"number":3,"title":"අම්පාරේ දූතයා","paragraphs":["1999 දී, අම්පාර බස් නැවතුම්පොළේ වාතය ඩීසල් ගඳින් සහ වසර විසි හයක් දිගට පවතින පිටවීමක බරින් ඝන වුණා.","මගේ තාත්තා, මුහම්මදු ජාබිර්, සෞදි අරාබියට යන්න තිබුණා. ජීවිතය ඔහුව අපෙන් දුරට ගෙන යන්න තිබුණා. ඒ වෙලාවේ මම අවුරුදු අටක ළමයෙක්. පිටවීමක් කියන්නේ දින ගණනක් නොව වසර ගණනක් බව මට තේරුණේ නැහැ. මම දැනගෙන හිටියේ තාත්තා යනවා කියන එක, ඒ යාම අපේ ගෙදර හැමෝම මත වෙනස් බරක් තබනවා කියන එක විතරයි.","ඔහු බස් නැවතුම්පොළෙන් පිටත් වෙන්න කලින්, ඔහු මාව පසෙකට කැඳවා රුපියල් අනූවක් මගේ අතට දුන්නා. අද ඒ මුදල කුඩා වගේ පෙනෙන්න පුළුවන්. ඒත් ඒ මොහොතේ එය මගේ අතේ තබන ලද විශ්වාසයක් වගේ දැනුණා. ඔහු කිව්වා, මේක අම්මට දෙන්න කියලා. ඒ තරම් සරලයි. ඒ තරම් ගැඹුරුයි. තාත්තාගෙන් අම්මට යන කුඩා මුදලක්. නමුත් එය මගෙන් හරහා යන්න තිබුණා.","මම ඒ සල්ලි අරගෙන ඇවිද්දා. කුඩා පිරිමි ළමයෙක්, තමාගේ වයසට වඩා ටිකක් ලොකු කාර්යයක් අරගෙන. අම්පාරේ වෙළඳපොළේ පාරවල්, වෙළඳසැල්වල ශබ්ද, මිනිසුන්ගේ හඬ, බස්වල දුම, මේ හැම දෙයක්ම මතකයේ අදත් තියෙනවා. මගේ අතේ තිබුණ රුපියල් අනූව පමණක් නොවෙයි. මගේ තාත්තාගේ හඬත් ඒ අතේ තිබුණා.","ඒ කාලයේ මම මාව දූතයෙක් වගේ දැනුණා. ඒ වචනය මට එදා තිබුණේ නැහැ. නමුත් ඒ හැඟීම තිබුණා. කෙනෙකුගේ පණිවුඩය තවත් කෙනෙකුට ගෙන යන ළමයෙක්. පණිවුඩය මුදලක්. ඒත් එයට අමුණා තිබුණේ ආදරය, වගකීම, බිය, ගෙදරක නොකියූ අවශ්‍යතාවය.","• • •","මගේ තාත්තා යාම අපේ ගෙදරට එක දවසක සිදුවීමක් නොවෙයි. එය දිගු කාලයක් පුරා විහිදුණු නිහඬ සිදුවීමක්. ඔහු ගුවන් යානයක නැගී ගියා. නමුත් ඔහුගේ නොසිටීම අපේ නිවසේ හැම කාමරයකම, හැම කෑම වේලකම, හැම උදෑසනකම, හැම රාත්‍රියකම නැවත නැවත පැමිණියා.","මගේ අම්මා ඒ නොසිටීම සමඟ ගෙන ගියා. ඒක කිසිවෙක් නිල වශයෙන් ඇයට දුන් තනතුරක් නොවෙයි. කිසිවෙක් ඇයට පදක්කමක් දුන්නේ නැහැ. කිසිවෙක් ඇගේ දවසේ පැය ගණන් ගණන් කළේ නැහැ. නමුත් ඇය ගෙදර තබාගෙන හිටියා. ළමයින් තබාගෙන හිටියා. ආහාරය, පාසල, ඇඳුම්, රෝග, බිය, කෝපය, නිහඬතාවය — මේ හැම දෙයක්ම ඇය සමඟ ගෙන ගියා.","මම එදා ඒක දැක්කේ නැහැ. ළමයෙක් තමන්ට ඉදිරියේ දිනපතා සිදුවන දේවල් ස්වාභාවිකයි කියලා හිතනවා. උදේට කෑම තියෙනවා. ඇඳුම් සෝදා තියෙනවා. ගෙදර තවමත් ගෙදරක් වගේ පවතිනවා. ළමයෙක් ඒක හැදෙන ආකාරය බලන්නේ නැහැ. ඔහුට එය ලැබෙනවා. ඒක ලැබෙන නිසා, ඒක ලැබිය යුතු දෙයක් වගේ පෙනෙනවා.","අද මට තේරෙනවා. තාත්තා සෞදිට යාමෙන් අපේ ජීවිතයට මුදල් ආවා. නමුත් ගෙදරක් ගෙදරක් ලෙස දිගටම පවත්වාගෙන ගියේ මගේ අම්මාගේ දෛනික බලය. ඇය සද්ද නැතිව කළ වැඩ. ඇය කෑගැසීමකින් තොරව දැරූ බර. ඇයගේ ශරීරය මහන්සි වූවත්, ඇය පසුදා නැවත නැගිටින හැකියාව.","මගේ තාත්තාගේ යාම මට පිරිමි ලෝකය ගැන පළමු රූපයක් දුන්නා. පිරිමියෙක් යනවා. වැඩ කරනවා. මුදල් එවනවා. පවුල වෙනුවෙන් තමන්ගේ ශරීරය දුර රටකට දෙනවා. ඒකත් ආදරයේ එක් රූපයක්.","නමුත් මගේ අම්මාගේ සිටීම මට තවත් රූපයක් දුන්නා. කෙනෙක් යන්නේ නැහැ. එතැනම සිටිනවා. ඒ නිසා හැමෝම ඉදිරියට යන්න පුළුවන් වෙනවා. ඒකත් ආදරය. සමහර විට එය වඩා නිහඬ නිසා, වඩා අමතක වෙනවා.","• • •","රුපියල් අනූවක් අරගෙන වෙළඳපොළ පාරේ ඇවිදින ඒ කුඩා පිරිමි ළමයාට මේ කිසිවක් තේරුණේ නැහැ. ඔහුට දැනුණේ තමාට කාර්යයක් ලැබී තිබෙන බව. තාත්තාගේ විශ්වාසය ලැබී තිබෙන බව. මගේ අතේ තිබුණ මුදල් මම තදින් අල්ලාගෙන සිටියා. ඒක නැති වුණොත් මමම නැති වෙනවා වගේ.","මට මතකයි මම කොච්චර ප්‍රවේශමෙන් ඇවිද්දාද කියලා. පාර හරහා යද්දී, මිනිසුන් අතරින් යද්දී, කඩවල් ළඟින් යද්දී. ළමයෙකුට කුඩා මුදලක් ලොකු වගකීමක්. ඒ වගකීම ශරීරය වෙනස් කරයි. පාද ටිකක් සැලකිල්ලෙන් යනවා. ඇස් ටිකක් වැඩියෙන් බලනවා. අත සාක්කුව මත තද වෙනවා. මනස පළමු වතාවට “මට මේක ඉටු කරන්න ඕන” කියලා කියනවා.","මගේ අම්මා ළඟට ගිහින් ඒ මුදල් දුන්න මොහොත මට සම්පූර්ණයෙන් පින්තූරයක් වගේ මතක නැහැ. නමුත් ඒ ගමන මතකයි. පණිවුඩය ගෙන යාමේ හැඟීම මතකයි. තාත්තා යන අතර, මම ඔහුගේ කුඩා දිගුවක් වුණා. ඔහුගේ අත මගේ අත හරහා අම්මාගේ අතට ගියා.","පසුව මගේ ජීවිතය පුරා මම බොහෝ දේවල් සමඟ ගෙන ගියා. මුදල්. ලියකියවිලි. පවුලේ බලාපොරොත්තු. මගේම වැරදි. සිරකුටියක අංකයක්. අධිකරණයේ බර. මගේ නම. මගේ නිහඬතාවය. නමුත් ඒ දරාගෙන යාමේ මුල් පාඩම, ඒ රුපියල් අනූවෙන් ආරම්භ වුණා කියලා මට හිතෙනවා.","තාත්තා මාව දූතයා කළේ කෙටියෙන්. ඔහුට එය විශාල දාර්ශනික දෙයක් නොවෙයි. ඔහුට එය ප්‍රායෝගික දෙයක්. “මේක අම්මට දෙන්න.” නමුත් ජීවිතයේ බොහෝ ගැඹුරු දේවල් එහෙමයි. ඒවා අපට ඉගැන්වීමක් ලෙස එන්නේ නැහැ. ඒවා කාර්යයක් ලෙස එනවා. පස්සේ, වසර ගණනාවකට පසුව, අපි ඒ කාර්යයේ ඇතුළේ තිබුණු අර්ථය දැකගන්නවා.","• • •","මගේ තාත්තා දුර රටක ජීවත් වුණා. අපි මෙහි ජීවත් වුණා. ඔහුගේ ජීවිතය සහ අපේ ජීවිතය අතර මුදල්, ලිපි, දුරකථන ඇමතුම්, බලාපොරොත්තු, නොකියූ වේදනාවන් ගමන් කළා. විදේශගත පියාගේ දරුවෙක් වීම කියන්නේ, කෙනෙක් ඔබට ආදරය කරන බව දැනගෙන සිටීමත්, ඒ ආදරය ඔබ ළඟ ශරීරයකින් නැති බව දැනගෙන සිටීමත් එකටයි.","ඒ ආදරය මුදල්වලින් පමණක් මැනිය නොහැක. ඒත් මුදල් නැතිව එය ජීවත් කරගන්නත් බැහැ. අපේ පවුලේ ඒ පරස්පරය මම කුඩා කාලයෙන්ම දැක්කා. ආදරය සහ අවශ්‍යතාවය එකිනෙකට බැඳී තිබුණා.","තාත්තා අපෙන් දුරට ගියේ අපෙන් ඈත් වෙන්න නොවෙයි. අපට ආහාර, පාසල්, ඇඳුම්, අනාගතයක් දෙන්න. ඒත් දරුවෙකුගේ හදවත එහෙම ගණන් හදන්නේ නැහැ. දරුවෙකුගේ හදවත දන්නේ “තාත්තා මෙහි නැහැ” කියන එක.","මම ඔහු ගැන කෝපයෙන් හිටියාද? සමහර විට. මම ඔහුව මග හැරුණාද? ඔව්. මම ඒ දෙකම එකට වචනවලට දාන්න දැනගෙන හිටියාද? නැහැ. ළමයින් බොහෝ විට තමන්ගේ අඩුව අඩුවක් ලෙස නොව, හැසිරීමක් ලෙස පෙන්වනවා. ඔවුන්ට කියන්න බැරි දේ ඔවුන්ගේ ශරීරය කියනවා.","අද මට ඔහුගේ යාම වෙනත් විදියට පේනවා. එය පවුලකට ආහාර ගෙන ඒමට තම ශරීරය විකුණන මිනිසෙකුගේ යාම. උණුසුම් රටක, වෙනත් භාෂාවක, වෙනත් අණවල යට, තමන්ගේ දරුවන්ගේ නම් හදවතේ තබාගෙන වැඩ කරන මිනිසෙක්. ඒක පහසු නොවෙයි. ඒක වීරකම වගේ පෙනෙන්නේ නැහැ. ඒක සාමාන්‍ය වැඩක් වගේ පෙනෙනවා. නමුත් සාමාන්‍ය වැඩ තුළම පවුල් බේරෙනවා.","මගේ අම්මාගේ සිටීමත් එහෙමයි. ඇය කරන දේවල් සාමාන්‍ය වගේ පෙනුණා. උයනවා. සෝදනවා. බලාගන්නවා. බෙදනවා. නිවැරදි කරනවා. ඉවසනවා. නමුත් ඒ “සාමාන්‍ය” දේවල් නැති වුණොත් ගෙදර කඩා වැටෙනවා. එය දැකීමට මට වැඩි වයසක්, වැඩි වේදනාවක්, වැඩි නිහඬතාවයක් අවශ්‍ය වුණා.","මම අවුරුදු අටේදී වෙළඳපොළට ඇවිදගෙන යද්දී, ඒ බර තේරුම් ගත්තේ නැහැ. තාත්තා මට වැඩක් දුන් නිසා මම මිනිහෙක් වගේ හැසිරෙනවා කියලා හිතුවා. මගේ වටේ අම්මා දිනපතා කළ දේ මම දැක්කේ නැහැ. ඇය එය එතරම් ස්ථිරව කළ නිසා, ළමයෙකුට එය ජීවිතයේ ස්වාභාවික පසුබිම වගේ පෙනුණා.","දැන් මට තේරෙනවා.","අම්පාරේ දූතයා රුපියල් අනූවක් අරගෙන ගිය කුඩා පිරිමි ළමයෙක්. අපේ පවුල වසර විසි හයක් පුරා ඇත්තටම සමඟ ගෙන ගිය තැනැත්තිය, ගෙදරක නිහඬව සිටි කාන්තාවක්. කිසිවෙක් වැඩක් කියලා හඬින් නම් නොකළ දේ කරමින්. මේ පොතේ ගොඩක් පස්සේ මම ඇයට විශේෂයෙන් ණය අධ්‍යායයක් තියෙනවා.","මේ පොතේ මේ තැනට ඇවිත් තිබුණත්, තවම මම එය ලියන්න සූදානම් නැහැ. නමුත් මම ලියනවා. කාලය නිවැරදි වෙද්දී ඒ අධ්‍යායය එයි. දැන්, ආරම්භයේදී, මට කළ හැක්කේ ඇයව නම් කිරීම, මගේ හිස නමා, තාත්තා මට දුන් කුඩා නෝට්ටු අතෙන් ආරම්භ වූ පාර දිගේ තවදුරටත් ඇවිදීම පමණයි.","පළමු කොටස — දූතයා"]},{"number":4,"title":"බයිසිකලයේ මිනිසා","paragraphs":["මගේ සීයා මොහොමඩ් ඉස්මයිල් — ඔහුව දන්න අයට ෆාරූක් — වයස අසූ දෙකක් වන තුරු ජීවත් වුණා. ඔහු මැරුණා කියන එක පමණක් නොවෙයි. ඔහු අවසන් හුස්ම දක්වා ජීවත් වී, පසුව අවසන් වුණා.","මන්දගාමීව මැකී යන මිනිසෙක් සහ තමන්ව සම්පූර්ණ කරගෙන අවසන් වන මිනිසෙක් අතර වෙනසක් තියෙනවා. ඔහු දෙවැනි වර්ගයේ මිනිසෙක්. ඉටිපන්දම කෑලි කෑලි නිවුණේ නැහැ. එය අවසානය දක්වා දැවී, පසුව අවසන් වුණා.","මගේ ජීවිතයේ ඔහු කුඩා මිනිසෙක් නොවෙයි. ඔහුගේ ශරීරය ලොකු නොවුණත්, ඔහුගේ පැමිණීම ලොකුයි. ඔහු බයිසිකලයක මිනිසෙක්. මගේ මතකයේ ඔහුගේ පාද තවමත් පේඩල් මත ගමන් කරනවා. බයිසිකලයේ ශබ්දය, පැරණි මාර්ග, උදෑසනේ වාතය, ඔහුගේ මුහුණේ සන්සුන් තීරණය — මේ සියල්ල එක් රූපයක් වගේ මට රැඳී තියෙනවා.","ඔහු බීඩි හැදුවා. කුඩා අතින් රෝල් කළ සුරුට්ටු. ඒවා ඔහුගේ ජීවිතයේ වැඩක්, පවුලේ ආදායමක්, නගරයේ මිනිසුන්ගේ පුරුදු එක්ක බැඳී තිබුණු දෙයක්. බීඩියේ සුවඳ මට දුම්කොළේ සුවඳ පමණක් නොවෙයි. එය මගේ සීයාගේ අත්, ඔහුගේ දවස, ඔහුගේ වැඩ, ඔහුගේ නිහඬ ගෞරවය මතක් කරවන සුවඳක්.","ඔහුව මිනිස්සු බීඩි ෆාරූක් කියලා කතා කළා. ඒ නම අවමානයක් නොවෙයි. ඒක ඔහුගේ වැඩෙන් උපන් නමක්. ගම්වල නාමයන් එහෙමයි. කෙනෙකුගේ කුඩා වැඩක්, ඔහුගේ හැසිරීමක්, ඔහුගේ දුර්වලතාවයක්, ඔහුගේ ශක්තියක් — එකක් අල්ලාගෙන, එය නමක් කරයි. සමහර නම් කෙනෙකුට බරක්. සමහර නම් කෙනෙකුගේ පැවැත්ම පිළිබඳ සාක්ෂියක්.","• • •","මගේ සීයාට මාර්ග තිබුණා. ඔහු යන මාර්ග. ඔහුගේ බයිසිකලය දන්න මාර්ග. නිවෙස්වලට, කඩවලට, මිනිසුන්ට, දෛනික අවශ්‍යතාවලට යන මාර්ග. ඔහුගේ ජීවිතය විශාල වේදිකාවක නොවෙයි. කුඩා පාරවල් මත, කුඩා ගනුදෙනු අතර, මිනිසුන්ගේ කතා අතර ගමන් කළා.","මට ඔහුගේ සරලකම මතකයි. ඒක දුර්වල සරලකමක් නොවෙයි. ශක්තිමත් සරලකමක්. කෙනෙක් තමන් කවුද කියලා අධික ලෙස කියන්න අවශ්‍ය නොවුණු විදිය. ඔහු ඉන්න ආකාරය, ගමන් කරන ආකාරය, කතා කරන ආකාරය, අඩුවෙන් කතා කර වැඩිපුර කරන ආකාරය, ඒවා ඔහු ගැන කියනවා.","මගේ මතකයේ ඔහු නිතරම වැඩ කරන මිනිසෙක්. කෙනෙකුගේ ගෙදරට යාම, යමක් ගෙන යාම, යමක් ගෙන ඒම, පවුලේ අවශ්‍යතාවලට පිළිතුරු සෙවීම. ඔහුගේ ශරීරය වැඩට හුරු වී තිබුණා. බයිසිකලය ඔහුගේ ශරීරයේ දිගුවක් වගේ. පේඩල් තල්ලු කරන පාද, හසුරුව අල්ලාගත් අත්, මාර්ගය මතට බලා සිටින ඇස්.","ඔහු වයසට ගියත්, මගේ ඇතුළේ ඔහුගේ රූපය කඩා වැටුණේ නැහැ. සමහර වැඩිහිටියන් වයසට යද්දී දරුවන්ගේ මතකය තුළ කුඩා වෙලා යනවා. ඔහු එහෙම නොවුණා. ඔහුගේ ශරීරය දුර්වල වුණත්, ඔහුගේ ජීවිතයේ රේඛාව තදින්ම තිබුණා. ඔහුට තමාගේ අවසානය දක්වා යන්න තිබුණා, මන්දගාමීව නොව, සම්පූර්ණව.","• • •","ඔහු මියගිය දවසේ මම වෙනත් රටක හිටියා. එය මිනිසා විදේශගතව ජීවත් වෙන විට ඇති වන වේදනාවලින් එකක්. කෙනෙක් මිය යයි. ඔබට දුරකථනයෙන් දැනගන්න ලැබෙයි. ලෝකය ඔබ වටේ තවමත් සාමාන්‍යව ගමන් කරයි. ඔබ සිටින කාමරය, ඔබේ වැඩ, ඔබේ ආහාර, ඔබේ දවස — කිසිවක් එම ප්‍රවෘත්තියට ගැළපෙන පරිදි නතර වෙන්නේ නැහැ.","මට මතකයි මම මුළුතැන්ගෙයක දණ ගසා වැටුණු ආකාරය. වැඩිහිටි මිනිසෙක් විදියට පළමු වරට එහෙම අඬන එක. එය ළමයෙකුගේ අඬීමක් නොවෙයි. එය ශරීරය තුළ වසර ගණනාවක් සඟවා තිබුණු දෙයක් එකවර බිඳී එළියට එන අඬීමක්.","මගේ සීයා මියගියා කියලා මට දැනුණේ පවුලේ කෙනෙක් නැතිවීම පමණක් නොවෙයි. මගේ ඇතුළේ තිබුණු එක් මුල් කොටසක් කපා දමා ඇතැයි දැනුණා.","මිනිසා මිය යන විට, ඔහු සමඟ කතා නොකළ ප්‍රශ්න, නොකියූ ස්තූති, නොදැනූ පාඩම්, සෑම දෙයක්ම අමුතු විදියට සජීවී වෙනවා. ඔහු තවමත් සිටින අතරතුර අපි තේරුම් නොගත් දේ, ඔහු ගිය පසු බර වන්නේ ඒ නිසායි.","මම ඔහුට කවදාවත් සම්පූර්ණයෙන් කිව්වේ නැහැ ඔහු මට කුමක්ද කියලා. ළමයින් බොහෝ විට තම වැඩිහිටියන්ගේ වටිනාකම කියන්නේ නැහැ. ඔවුන් එය ලබනවා. එය පසුබිම වගේ භාවිත කරනවා. පසුව, ඒ පසුබිම ඉවත් වූ විට, තමන් එය මත කොපමණ කාලයක් හේත්තු වී සිටියාද කියලා දැනගන්නවා.","මගේ සීයා මට වචනවලින් දර්ශනයක් ඉගැන්නුවේ නැහැ. ඔහු ජීවිතයෙන් ඉගැන්නුවා. වැඩ කිරීම. සරලව සිටීම. ගෞරවය කෑගසා ඉල්ලන්න අවශ්‍ය නැති බව. කෙනෙකුගේ දිනපතා ගමනම ඔහුගේ නම සෑදිය හැකි බව. බයිසිකලය මත ගමන් කරන මිනිසෙක් පවා, පවුලක රුධිරය තුළ ගැඹුරු රේඛාවක් තබා යා හැකි බව.","• • •","මම පසුව තේරුම් ගත්තා, මගේ පවුලේ පුරුෂ රුධිර රේඛාව මට නිකම් නම් ලැයිස්තුවක් නොවෙයි. එය ගමන් කරන බරක්. මගේ පියා, ඔහුගේ පියා, ඔහුගේ පියා. මිනිසුන්ගේ ශරීරවලින්, වැඩවලින්, ඉවසීමෙන්, ගින්නෙන්, නිහඬතාවයෙන් ගමන් කරන දෙයක්.","එවකට මට එය දැනුණේ නැහැ. ළමයෙක් සීයා කියන්නේ සීයා කියලා දන්නවා. ඔහුගේ පවුල් කතාවේ ඉහළට ගිය රේඛාවක්, ඒ රේඛාව තුළ ගමන් කරන ගුණ, පුරුදු, වේදනා, ආශිර්වාද — මේවා තේරුම් ගන්න ජීවිතය තමන්ව දුරකට ගෙන යා යුතුයි.","මගේ සීයාගේ මරණය මට පළමු වතාවට, මම එක් ශරීරයකින් පමණක් සෑදුණු කෙනෙක් නොවෙයි කියලා දැනෙන්න පටන් ගත්තා. මගේ ඇතුළේ ඔහුගේ කොටසක් තිබුණා. ඔහුගේ වැඩ කිරීමට හුරු ශරීරය. ඔහුගේ නිහඬත්වය. ඔහුගේ ගෞරවය. ඔහුගේ බයිසිකලයේ මාර්ග. මිනිසා තමා නොදැනම පසු පරම්පරාවට යමක් දෙනවා.","පසුව, මම සිරකුටියක ඉඳගෙන මගේම ජීවිතය විවෘත කර බලද්දී, මේ රුධිර රේඛාව නැවත මගේ ඉදිරියට ආවා. මම තනි මිනිසෙක් නොවෙයි. මම මගේම වැරදි පමණක් නොවෙයි. මම මගේ පියාගේ පුතා. මම බයිසිකලයේ මිනිසාගේ මුණුබුරා. මම මට පෙර තිබුණු ගින්නක්, වැඩක්, නිහඬතාවයක්, විශ්වාසයක් සමඟ රැගෙන ආ කෙනෙක්.","එය මට නිදහසක් දුන්නාද, බරක් දුන්නාද? දෙකම. රුධිර රේඛාව එහෙමයි. එය ඔබට මුල් දෙනවා. එම මුල් ඔබව අල්ලාගෙන සිටිනවා. සමහර විට එය ඔබව සුව කරනවා. සමහර විට එය ඔබට ඔබට පෙර සිදු වූ දේවල්ගේ බර දැනවෙනවා. නමුත් මුල් නැති මිනිසෙක් වීම, තමන් කොහෙන් ආවාද නොදැන සිටීම, තවත් ආකාරයක අහිමිවීමක්.","• • •","මගේ සීයාගේ බයිසිකලය මට අදත් පේනවා. ඒක පොතක රූපයක් වගේ නොවෙයි. මතකයේ චලනයක් වගේ. ඔහු පැදගෙන යනවා. පාර පසුකරනවා. මිනිසුන් ඔහුව දන්නවා. ඔහුගේ නම කියනවා. ඔහු තමන්ට තිබුණු වැඩ කරනවා. ලෝකයට විශාල ප්‍රකාශයක් කරන්නේ නැහැ. නමුත් ඔහුගේ ජීවිතයම ප්‍රකාශයක්.","මිනිසාගේ වටිනාකම ඔහු කොපමණ ජනප්‍රියද කියලා මැනිය නොහැක. ඔහු කොපමණ නිහඬව තමන්ට දී තිබුණු දේ ඉටු කළාද කියලා මැනිය හැක. මගේ සීයා එහෙම මිනිසෙක්. ඔහුගේ මාර්ග කුඩා වුණත්, ඒ මාර්ගවලින් ගිය පාඩම් මගේ ජීවිතයේ ඉතා දුරට ආවා.","ඔහු මට ආදරය කළා. ඒ ආදරය සෑම විටම වචනවලින් නොවෙයි. සමහර පරම්පරාවල පිරිමි ආදරය පෙන්වන්නේ කතා කිරීමෙන් නොව, සිටීමෙන්. දරුවෙකුට ඒක තේරුම් ගන්න අපහසුයි.","දරුවෙකුට “මම ඔයාට ආදරෙයි” කියලා ඇසීමට කැමතියි. නමුත් වැඩිහිටියෙකු වූ පසු, කෙනෙකුගේ පැමිණීම, ඔහුගේ වැඩ, ඔහුගේ බයිසිකලය, ඔහුගේ නිහඬ පරිත්‍යාගයත් ආදරය කියලා දැනගන්නවා.","මම මුළුතැන්ගෙයක දණ ගසා අඬද්දී, මම ඔහුට ආදරය කළ බව මගේ ශරීරය මට කියමින් තිබුණා. මනසට ඒකට වචන සොයාගන්න පස්සේ කාලයක් ගියා. ශරීරය කලින්ම දැනගෙන තිබුණා.","ඒ මොහොතේ මම විදේශ රටක හිටියත්, මගේ ඇතුළේ ඔහුගේ ගම වාසය කළා. ඔහුගේ මාර්ග. ඔහුගේ බයිසිකලය. ඔහුගේ බීඩි. ඔහුගේ නම. ඔහුගේ ජීවිතයේ සරල ගෞරවය. මිනිසා මිය ගියත්, ඔහු ගමන් කළ රේඛාව එතරම් ඉක්මනින් මිය යන්නේ නැහැ.","• • •","මම ඉක්මනින්ම ඒ රුධිර රේඛාව ගැන තවත් ලියනවා. ඒ රේඛාවේ ඉහළ කොටසේ මිනිසෙක් ඉන්නවා — මගේ පිතෘ පාර්ශ්වයේ මහ සීයා, ශෙයිහු මුහම්මද් — මම දැන් පමණක් තේරුම් ගන්න පටන් ගන්න දෙයක් සමඟ ගෙන ගිය කෙනෙක්. ගම ඔහුට දුන් නමක් තිබුණා. ළමයෙක් විදියට මම ඒ නම ගැඹුරින් ගත්තේ නැහැ. නෙරුප්පු මස්තාන්. ගින්නේ සාන්තුවරයා.","මම ඒක පරණ කතාවක් කියලා හිතුවා. ගම්වල මිනිස්සු වැඩිහිටියන්ට සතුටු කරන්න දෙන නමක් කියලා හිතුවා. පස්සේ මම සිරගෙදරට ගියා. බොහෝ දවස් ඉතා නිශ්ශබ්දව වාඩි වුණා. එවිට මට තේරෙන්න පටන් ගත්තා ඒ නම සතුටු කිරීමක් නොවෙයි. ඒ නම විස්තරයක්. ඒ විස්තරය මම නොදැනම මගේම රුධිරය තුළ සමඟ රැගෙන ආ දෙයක්.","නමුත් ඒ අධ්‍යායය පසුවට. දැන් බයිසිකලය නවතිනවා. මාර්ගය අවසන්. බයිසිකලයේ මිනිසා අවසන් වරට ගෙදර ගිහින්. ඔහු ආදරය කළ පිරිමි ළමයා, තවත් රටක, මුළුතැන්ගෙයක දණ ගසා, වැඩිහිටි මිනිසෙක් ලෙස පළමු වතාවට අඬනවා.","සීයා මොහොමඩ් ඉස්මයිල් — බීඩි ෆාරූක් — බයිසිකලයේ මිනිසා.","පළමු කොටස — දූතයා"]},{"number":5,"title":"මම සමඟ රැගෙන සිටි බව නොදැන සිටි ප්‍රශ්න","paragraphs":["මගේ ඇතුළේ ප්‍රශ්න තිබුණු මිනිසෙක් මම හැමදාම. හැම වෙලාවෙම හඬින් නොවෙයි. බොහෝ විට මම ඒවා මගේ ඇතුළේම තබාගෙන, පිළිතුරක් වගේ දෙයක් නැඟී එන තුරු නිහඬව ඒවා පෙරළමින් සිටියා.","මගේ කුඩා කාලයේදීම ආගම මගේ ජීවිතය වටා තිබුණා. මදරසාව. උස්තාද්. අරාබි අකුරු. කටපාඩම් කිරීම. වුලු. ෆජ්ර්. ජුම්මා. මිනිසුන්ගේ කටින් පිටවෙන වචන සහ ඔවුන්ගේ ජීවිතවල හැසිරීම අතර තිබුණු දුර. මම ඒ දුර දැක්කා. ඒකට නමක් දාන්න දැනගෙන හිටියේ නැහැ.","මම අල්ලාහ් ගැන ඇසුවා. නබිවරුන් ගැන ඇසුවා. කුර්ආන් වචන කියවන්න ඉගෙනගත්තා. නමුත් ළමයෙකුගේ ඇතුළේ තවත් ප්‍රශ්නයක් ඉපදෙමින් තිබුණා. මිනිසුන් පවිත්‍ර වචන කියනවා නම්, ඔවුන්ගේ හදවත හැම විටම පවිත්‍ර නොවන්නේ ඇයි? කෙනෙක් ආගම ගැන කතා කරමින්, එකම වෙලාවේ අහංකාරය දරාගෙන යන්නේ කොහොමද? කෙනෙක් හොඳ දෙයක් උගන්වමින්, තව කෙනෙකුට වේදනා කරනවා නම්, ඒ දෙක අතර සත්‍යය කොහෙද?","ඒ ප්‍රශ්නවලට මම එදා පිළිතුරු සොයාගත්තේ නැහැ. මම ඒවා සඟවා ගත්තා. පිරිමි ළමයෙකුට බොහෝ විට ප්‍රශ්න හංගාගෙන ජීවත් වෙන්න ඉගෙනගන්න වෙනවා. විශේෂයෙන් ඔහු වටා සිටින වැඩිහිටියන් පිළිතුරු දෙනවාට වඩා අණ කරන විට. ඒ නිසා මම බැලුවා. මම ඇසුවා. මම මතක තබාගත්තා.","• • •","මගේ ජීවිතය සම්පූර්ණයෙන් ආගමික ප්‍රශ්නවලින් පමණක් පිරුණු එකක් නොවෙයි. මම සාමාන්‍ය පිරිමි ළමයෙක්. මට යාළුවෝ හිටියා. මට කුතුහලය තිබුණා. මට ශරීරය තිබුණා. මට ආශාවන් තිබුණා. මට මෝඩකම් තිබුණා. මම දුවන්න, බලන්න, උත්සාහ කරන්න, වැරදි කරන්න, නැවත සාමාන්‍ය වෙන්න උත්සාහ කරන්න දන්නවා.","නමුත් එහි යටින් ප්‍රශ්න තිබුණා. ඒවා මගේ ඇතුළේ ගල් වගේ නිහඬව තිබුණා. ඒවා හැම දවසේම මාව බාධා කළේ නැහැ. නමුත් ඒවා ගියේත් නැහැ. සමහර ප්‍රශ්න එහෙමයි. ඒවා ඔබේ ජීවිතයට පිළිතුරක් ලැබෙන තුරු ඉවසීමෙන් බලා සිටිනවා.","මම මිනිසුන්ගේ විරෝධාභාස දැක්කා. ආගමික මිනිසුන්ගේ අහංකාරය දැක්කා. සමාජය නරකයි කියලා විනිශ්චය කරන මිනිසුන් තුළ තිබෙන පුද්ගලික කරුණාවත් දැක්කා. සෑම දේම ලේබලයකට දාන්න බැරි බව මට කුඩා කාලයෙන්ම පෙනෙන්න පටන් ගත්තා. හොඳ මිනිසා සෑම විටම හොඳ නැහැ. නරක කියලා නම් කළ මිනිසා සෑම විටම නරක නැහැ.","මේ දැකීම් මගේ ඇතුළේ නීති කඩා දැම්මේ නැහැ. ඒවා මට ගැඹුරු වශයෙන් වියවුලක් දුන්නා. මට විශ්වාසය තිබුණා. ඒත් මට සැකත් තිබුණා. මට ආදරය තිබුණා. ඒත් මට කෝපයත් තිබුණා. මට යාච්ඤාව තිබුණා. ඒත් මට ශරීරයේ තල්ලුවත් තිබුණා. මම එක පැත්තකින් සරල විශ්වාසයක් සොයමින්, අනෙක් පැත්තෙන් මිනිසාගේ සංකීර්ණතාවය දකිමින් සිටියා.","• • •","එදා මට තේරුණේ නැහැ, මේ සියලු ප්‍රශ්න මාව සූදානම් කරමින් සිටින බව. මම ඒවාට පිළිතුරු සොයන්න පුස්තකාලයකට යන්නේ නැහැ. විද්‍යාලයකට යන්නේ නැහැ. මට දීර්ඝ දේශනයක් ලැබෙන්නේ නැහැ. මට ලැබෙන්නේ කුඩා කාමරයක්. හතර බිත්ති. පිටතින් අගුලු වැටෙන දොරක්. මගේම මනසට මුහුණ දීමට හැර වෙනත් වැඩක් නැති කාලයක්.","නමුත් ඒ දවස එන්න කලින්, මම ජීවිතය ජීවත් වුණා. වැඩ කළා. රටවල් ගියා. ශරීරය පෝෂණය කළා. ආහාර හොයාගත්තා. මුදල් හොයාගත්තා. මගේ හුස්මට වඩා වේගයෙන් දුවන ලෝකයක් පසුපස ගියා. මනසට ආහාර දීමට අවශ්‍ය බව මම තවමත් දැනගෙන හිටියේ නැහැ.","මම මගේ ඇතුළේ ඇති බලා සිටින්නා ගැන දැනගෙන හිටියේ නැහැ. මට එය වචනයක් ලෙස තිබුණේ නැහැ. නමුත් එය තිබුණා. මිනිසුන්ගේ හැසිරීම බලන කොටස. මගේම හැසිරීම බලන කොටස. කෙනෙක් කතා කරන වචන සහ ඔහුගේ ඇස් අතර වෙනස දකින කොටස. මම වැරදි කරන විටත්, ඒ වැරදි දකින නිහඬ කොටස.","සමහර විට මිනිසෙකුගේ ගැලවීම ආරම්භ වෙන්නේ ඔහුට පිළිතුරු ලැබෙන තැනින් නොවෙයි. ඔහුගේ ඇතුළේ ප්‍රශ්න මිය නොයන තැනින්. මගේ ප්‍රශ්න මිය ගියේ නැහැ. ඒවා මගේ ඇතුළේ බලා සිටියා.","• • •","මම ආගමට එරෙහිව නොසිටියා. මම ආගම තුළ මිනිසා ගැන ප්‍රශ්න කළා. ඒ වෙනස වැදගත්. අල්ලාහ් ගැන මට තිබුණ ගෞරවය, මිනිසුන්ගේ අහංකාරය නිසාම නැති වුණේ නැහැ. නමුත් මිනිසුන්ගේ අහංකාරය මට පෙන්වා දුන්නා, වචන කියවීම සහ වචනයක් ජීවත් කිරීම එකම දෙයක් නොවන බව.","මම කුර්ආන් වචන කටපාඩම් කළා. නමුත් ඒ වචන මගේ ඇතුළේ සම්පූර්ණයෙන් විවෘත වුණේ නැහැ. මම ඒවා සමඟ ගෙන ගියා, තේරුම් නොගෙන. පසුව, සිරකුටියක, ඒ වචන නැවත පැමිණියා. එවිට ඒවා ළමා කාලයේ ශබ්දයක් පමණක් නොවී, මගේම ජීවිතය විවෘත කරන යතුරු වගේ දැනුණා.","ඒ නිසා මේ අධ්‍යායය ප්‍රශ්න ගැනයි. පිළිතුරු ගැන නොවෙයි. මම ඉක්මනින්ම සියල්ල තේරුම් ගත්තා කියලා කියන්න මට ඕන නැහැ. මම එහෙම කළේ නැහැ. මම බොහෝ දේ නොදැන සිටියා. මම මගේම ශරීරයේ ශබ්දවලට ලෙහෙසියෙන් ඇදගෙන යන තරුණයෙක් වුණා. මම වගකීම දැනගෙන සිටියත්, එය සෑම විටම තදින් අල්ලාගෙන සිටියේ නැහැ.","මම පරස්පරතාවය ඇතුළේ ජීවත් වුණා. විශ්වාසය සහ සැකය. විනය සහ අසන්සුන්කම. පරිත්‍යාගශීලීත්වය සහ වියවුල. හැම දෙයක්ම බලා සිටි, එසේ වුවත් තමන් ගැන තවමත් සම්පූර්ණයෙන් කිසිවක් නොතේරුම් ගත් පිරිමි ළමයෙක්.","හතර බිත්තිවලට පෙර තිබුණු මගේ රූපය හිස් නොවෙයි. ඔහු ව්‍යාජත් නොවෙයි. ඔහු සැබෑ. ඔහුට සැලකිල්ල තිබුණා. ඔහු උත්සාහ කළා. නමුත් ඔහු අවසන් නොවූ කෙනෙක්. මම සමඟ රැගෙන සිටි බව නොදැන සිටි ප්‍රශ්න — ආගමික මිනිසුන් අහංකාරය දරාගෙන යන්නේ ඇයි?","සමාජය විනිශ්චය කරන මිනිසුන් සමහර විට පුද්ගලික කරුණාව දරාගෙන යන්නේ ඇයි? මදරසාවේ උස්තාද් ඉදිරියේ කුඩා පිරිමි ළමයෙක් ලෙස කියවූ වචනවල යටින් තිබුණු අර්ථය කුමක්ද? — ඒ ප්‍රශ්න, ඇසීමට තරම් නිහඬ තැනක් එනතුරු, ගල් වගේ ඉවසීමෙන් බලා සිටියා.","ඒ තැන පල්ලිය නොවෙයි. ජිම් එක නොවෙයි. අබුඩාබියේ තේමා උද්‍යානයක ආහාර ශාලාව නොවෙයි. මම වැඩ කළ කිසිම සමාගමක කාර්යාල නොවෙයි. ඒක, එදා මට උච්චාරණය කරන්නවත් නොදන්න දූපතක කුඩා කාමරයක්. පිටතින් අගුලු වැටෙන දොරක්.","සුළඟ යම් කෝණවලින් පමණක් ඇතුල් වන තරම් පටු කවුළුවක්. නමුත් මම ඒක එදා දැනගෙන හිටියේ නැහැ. ප්‍රශ්න දැනගෙන හිටියා. ප්‍රශ්න දැනටමත් ඒ කාමරය දෙසට ගමන් කරමින් තිබුණා. එහි ගෙන යා යුතු කෙනා මමයි.","පළමු කොටස — දූතයා"]},{"number":6,"title":"ගුවන් යානයේ සූරාව","paragraphs":["සූරා අල්-බකරහ් කියන්නේ කුමක්ද කියලා මට තේරෙන්න කලින්, මම ඒක මගේ ශරීරයේ සමඟ ගෙන ගියා. එය මට අමාරු මාර්ගයෙන් ඇතුල් වුණා.","බොහෝ පවිත්‍ර දේවල් ළමයෙකුට ඇතුල් වන ආකාරයෙන් — මුහුණට වැටෙන සීතල වතුරෙන්, අඳුරේ කම්බලියකින් නැගී සිටීමෙන්, වෙනත් ඕනෑම තැනක ඉන්න කැමති නින්දෙන් පිරුණු පිරිමි ළමයෙකුගේ ප්‍රතිරෝධයෙන්.","අම්මා අපිව ෆජ්ර් සඳහා අවදි කළා. ඇයගේ අත, ඇයගේ හඬ, ඇයගේ නොනවතින ඉවසීම. ළමයෙකුගේ ශරීරය ඒ වෙලාවට යාච්ඤාවට ආදරය කරන්නේ නැහැ. ශරීරයට නිදාගන්න ඕන.","උණුසුමට නැවත යන්න ඕන. කම්බලිය ඇතුළේ අතුරුදන් වෙන්න ඕන. නමුත් අම්මා නැගිටුවා. අපි වුලු කළා. සීතල වතුර සම මත වැදුණා. නිදිමත ශරීරය අල්ලාහ් ඉදිරියේ නවත්වනු ලැබුවා.","ඒ කාලයේ මම අල්-බකරහ් තේරුම් ගත්තේ නැහැ. මම එය ඇසුවා. මම එය කියෙව්වා. මම එය කටපාඩම් වූ කොටස් ලෙස දැනුණා. නමුත් අර්ථය මගේ ඇතුළේ විවෘත වී තිබුණේ නැහැ. වචන පළමුව ශරීරය හරහා ගියවා. අර්ථය පසුව එන්න තිබුණා.","සමහර විට ඒක තමයි ආගම ළමා කාලයේ අපට ඇතුල් වන ආකාරය. අපි තේරුම් ගැනීමට පෙර අපි නැගිටිනවා. තේරුම් ගැනීමට පෙර අපි නමනවා. තේරුම් ගැනීමට පෙර අපි වචන කියනවා. පසුව ජීවිතය අපව බිඳිද්දී, එම වචන නැවත පැමිණ, “මම මෙතැන මුල සිටම හිටියා” කියනවා වගේ.","• • •","වසර ගණනාවකට පස්සේ, මම ගුවන් යානයක සිටියා. මම ශ්‍රී ලංකාවෙන් පිටවෙමින් සිටියා. මගේ ජීවිතය තවත් රටකට, තවත් වැඩකට, තවත් ශරීරයේ සටනකට ගෙන යමින් තිබුණා.","මම සූරා අල්-බකරහ් වාදනය කළා. ඒ වෙලාවේ එය තවමත් සම්පූර්ණයෙන් තේරුම් ගත්තෙ නැහැ. නමුත් එහි ශබ්දය මට අවශ්‍ය වුණා. ඒ ශබ්දය මගේ ශරීරයට වඩා ගැඹුරු තැනකට කතා කරනවා වගේ දැනුණා.","ගුවන් යානයේ ශබ්දය, එන්ජින්වල දිගු ගුණගුණය, මිනිසුන්ගේ නිහඬ චලනය, කවුළුවෙන් පෙනෙන අහස — මේ හැම දෙයක්ම අතර, සූරාව වාදනය වුණා. මම වාඩිවෙලා හිටියා. ශරීරය ගමන් කරමින් තිබුණා. මනස තවමත් තමාගේ බර සමඟ රැගෙන තිබුණා. වචන ඒ අතරින් ගමන් කළා.","සූරා අල්-බකරහ් දිගයි. එය පහසු සූරාවක් නොවෙයි. එහි නීති තිබෙනවා. කතා තිබෙනවා. අනතුරු ඇඟවීම් තිබෙනවා. මිනිසාගේ හදවත, විශ්වාසය, සැකය, ඉවසීම, යටත් වීම ගැන ගැඹුරු දේවල් තිබෙනවා. එදා ගුවන් යානයේ මට ඒ සියල්ල විවෘත වූයේ නැහැ. නමුත් වචනවල බර දැනුණා. මම ඒ බර සමඟ වාඩි වුණා.","මගේ අත්දැකීමේ, සමහර ශබ්ද අර්ථයට පෙරත් මිනිසාව අල්ලනවා. අම්මාගේ හඬ වගේ. අසාන් වගේ. කුර්ආන් කියවීම වගේ. ඔබ සෑම වචනයක්ම තේරුම් නොගත්තත්, ශරීරය ඒ ශබ්දය හඳුනාගන්නවා. මනස තවමත් ප්‍රශ්න කරමින් සිටියත්, ඇතුළේ තවත් කොටසක් නිහඬව ඇසෙනවා.","• • •","ඒ ගුවන් ගමන මගේ ජීවිතයේ අමුතු සීමාවක්. මා පිටත් වුණා. නමුත් මට යන තැනේ අර්ථය සම්පූර්ණයෙන් දැනගෙන හිටියේ නැහැ. මම රට හැර යමින් සිටියා. නමුත් මට දැනුණේ මම මගේ පරණ ජීවිතයේ සමහර කොටස් ද රැගෙන යනවා කියලා.","මිනිසා ගුවන් යානයකට නගින විට, ඔහු සූට්කේස් පමණක් ගන්නේ නැහැ. ඔහු තමන්ගේ මතක, පවුල, භීතිකාවන්, ආශාවන්, නොවිසඳුණු ප්‍රශ්න, සහ තමන්ගේ ඇතුළේ ඇති නොකියූ සත්‍යයන් රැගෙන යනවා.","මට එදා දැනුණේ සූරා අල්-බකරහ් මාව ආවරණය කරනවා වගේ. මම එය ආරක්ෂාවක් කියලා නිල වශයෙන් කියන්න නොදන්නා වෙලාවක්. මම එය විද්‍යාත්මකව විස්තර කරන්න උත්සාහ කළේ නැහැ. එය මට දැනුණ ආකාරයයි. වචන ශරීරය වටා නෙළන ලද ආවරණයක් වගේ. මගේ ඇතුළේ ඇති අසන්සුන්කමට ඉහළින් වැටෙන නිහඬත්වයක් වගේ.","ඒ වෙලාවේ මට සිරකුටියක් ගැන දැනුමක් තිබුණේ නැහැ. මගේ ඉදිරියේ වසර ගණනාවකට පසුව එන දොරවල්, අංක, අධිකරණය, කූඩුව, නිහඬතාවය — කිසිවක් මට පෙනුණේ නැහැ.","මම ගුවන් යානයක මගියෙක් පමණයි. නමුත් අද පසුපස බලද්දී, ඒ සූරාව මට කලින්ම යමක් ලබාදුන්නා කියලා මට දැනෙනවා. සම්පූර්ණ පිළිතුර නොවෙයි. රසයක්. නිහඬත්වයේ රසයක්.","අල්-බකරහ් මට පසුව වෙනත් ආකාරයෙන් විවෘත වුණා. සිරකුටියකදී. මිනිසාට පිටත ලෝකය අඩුවෙන තැනක. ශරීරයට යා හැකි තැන සීමා වන තැනක. එවිට වචනවලට ඇතුළේ වැඩි ඉඩක් ලැබෙනවා. ගුවන් යානයේ එය ශබ්දයක්. සිරකුටියේ එය දොරක් වුණා.","මම මෙය තෆ්සීර් ලෙස කියන්නේ නැහැ. මම මෞලවි කෙනෙක් නොවෙයි. ශේඛ් කෙනෙක් නොවෙයි. මගේ ජීවිතය තුළ, මගේ ශරීරය සහ මනස හරහා, මට දැනුණ ආකාරය කියනවා පමණයි. සූරා අල්-බකරහ් මට මුලින්ම ශරීරයට ඇතුල් වූ වචන. පසුව එය මනසට විවෘත වූ වචන. අවසානයේ එය නිහඬතාවයේදී මට සාක්ෂි දුන් වචන.","• • •","ළමා කාලයේ ෆජ්ර් සඳහා අවදි වූ මම, ඒ වෙලාවේ අම්මා මට දෙන දේ තේරුම් ගත්තේ නැහැ. ඇය මට යාච්ඤාව පමණක් දුන්නේ නැහැ. ඇය මට පුරුද්දක් දුන්නා. ශරීරය කැමති නැති වෙලාවක, ශරීරයට වඩා ඉහළ දෙයක් වෙනුවෙන් නැගිටීමට හැකියාවක් දුන්නා. එය පසුව මට අවශ්‍ය වුණා.","සිරගෙදරදී ශරීරය බොහෝ දේ ඉල්ලනවා. පහසුව. නිදහස. ආහාර. චලනය. ගෞරවය. නම. එය ඉල්ලනවා, ඉල්ලනවා. එවැනි තැනක, ශරීරය කැමති නැති වෙලාවකත් නැගිටීමට ළමා කාලයේ ඉගෙනගත් පාඩම නැවත පැමිණෙනවා. අම්මා සීතල වතුරෙන් පටන් ගත් පාඩම, පසුව සිරකුටියක ජීවිත පාඩමක් බවට පත් වුණා.","මට එදා ඒක අකමැති වුණා. බොහෝ ළමයින්ට වගේ. මට නිදාගන්න ඕන වුණා. මට ඇස් වසාගෙන ඉන්න ඕන වුණා. නමුත් අම්මා නතර වුණේ නැහැ. අද මම ඇයට ස්තූති කරනවා.","ඒ වෙලාවේ කෝපයෙන් කළ දේකට අද ආශීර්වාදය කියලා කියන්න මට පුළුවන්. ජීවිතයේ බොහෝ දේ එහෙමයි. අපට දඬුවමක් වගේ පෙනෙන දෙයක් පසුව ආරක්ෂාවක් බවට පත්වෙනවා.","සූරා අල්-බකරහ් ගුවන් යානයේ වාදනය කරද්දී, ළමා කාලයේ එම උදෑසනවල් මගේ ශරීරයේ තිබුණා. අම්මාගේ හඬ. සීතල වතුර. නිදිමත. අරාබි වචන. මදරසාවේ අකුරු. මම තේරුම් නොගත් දේවල් තේරුම් ගන්න දිගු කාලයක් ගතවුණා. නමුත් කිසිවක් නාස්ති වෙලා නැහැ. සෑම අත්දැකීමක්ම මගේ ඇතුළේ තැන්පත් වෙලා තිබුණා.","• • •","ගුවන් යානයක් කියන්නේ අමුතු තැනක්. ඔබ බිමට අයත් නැහැ. තවම ගමනාන්තයටත් අයත් නැහැ. ඔබ මැද. ඒ මැද තැනකදී මම සූරාව ඇසුවා.","මට පසුව තේරුණා, මගේ ජීවිතයේ බොහෝ ගැඹුරු වෙනස්කම් ආරම්භ වුණේ එවැනි මැද තැන්වලින්. නිවස සහ විදේශය අතර. නිදහස සහ සිරගෙදර අතර. ශරීරය සහ මනස අතර. පැරණි මම සහ නව මම අතර.","එදා මම මගේ ජීවිතය ගුවන් යානයේ කුඩා අසුනක තබාගෙන වාඩිවෙලා හිටියා. කෙනෙකුට පෙනුණේ සාමාන්‍ය මගියෙක්. නමුත් ඇතුළේ, කාලයක් පුරා දරාගෙන තිබූ ප්‍රශ්න සහ බර ගමන් කරමින් තිබුණා. කුර්ආන් ශබ්දය ඒවා අතරින් ගලා ගියා. එය මට සම්පූර්ණයෙන් සුව කළේ නැහැ. නමුත් එය මගේ ඇතුළේ යමක් ස්පර්ශ කළා.","මම කීපවරක්ම හිතනවා, මිනිසාට පවිත්‍ර වචනයක් මුලින්ම දැනෙන්නේ කවදාද කියලා. ඔහු එය කියවන දවසද? කටපාඩම් කරන දවසද? අර්ථය තේරුම් ගන්න දවසද? නැත්නම් ජීවිතය ඔහුව එතරම් නිහඬ කර, ඒ වචනය තමන්ගේ ඇතුළේම හඬ නඟන දවසද? මගේ ජීවිතයේ, මේ සියල්ල වෙන වෙනම කාලවල සිදු වුණා.","ළමා කාලයේ මම සූරාව සමඟ ගෙන ගියා. ගුවන් යානයේ මම එය ඇසුවා. සිරකුටියේ මම එය නැවත හමුවුණා. එය මට එකවර සම්පූර්ණයෙන් විවෘත වුණේ නැහැ. එය මන්දගාමීව විවෘත වුණා. මගේ ජීවිතය මන්දගාමීව විවෘත වූ ආකාරයටම.","මට දැන් තේරෙන දේ මේකයි. කුඩා කාලයේ අපට බලෙන් වගේ දෙන සමහර දේවල්, පසුව අපේම කැමැත්තෙන් නැවත සොයාගන්න වෙනවා. එවිට ඒවා තවදුරටත් අම්මාගේ අණක් නොවෙයි. උස්තාද්ගේ පාඩමක් නොවෙයි. සමාජයේ පුරුද්දක් නොවෙයි. එය ඔබේම ආත්මයේ අවශ්‍යතාවයක් බවට පත්වෙනවා.","සූරා අල්-බකරහ් මට එහෙම වුණා. මුලින්ම එය සීතල වතුර සහ නිදිමත සමඟ ආවා. පසුව එය ගුවන් යානයේ එන්ජින් ශබ්දය අතර ආවා. පසුව එය සිරකුටියේ නිහඬතාවය තුළ ආවා. සෑම වතාවකම එකම වචන. නමුත් මම වෙනස්. ඒ නිසා වචනත් වෙනස්ව ඇසුණා.","• • •","මගේ ජීවිතය ගැන ලියන විට, මට මේ දේවල් සරල රේඛාවක් වගේ පෙන්වන්න බෑ. ඒවා සරල රේඛාවක් නොවෙයි. ඒවා ආපසු එන රැලි වගේ. ළමා කාලයේ අත්දැකීමක්, තරුණ කාලයේ ගුවන් ගමනක්, පසුව සිරකුටියක අර්ථයක්. ඒවා එක් කාලයක සිදුවන දේවල් නොවෙයි. ඒවා ජීවිතය පුරා එකිනෙකට කතා කරන දේවල්.","ඒ නිසා ගුවන් යානයේ සූරාව ගැන ලියද්දී, මම ගුවන් යානය ගැන පමණක් ලියන්නේ නැහැ. මම අම්මා ගැනත් ලියනවා. මදරසාව ගැනත්. මගේ ශරීරයේ ප්‍රතිරෝධය ගැනත්. මගේ මනස තේරුම් නොගත් වචන ගැනත්. පසුව එම වචන මාව තේරුම් ගන්න පටන් ගත් ආකාරය ගැනත්.","මම දන්න දේ, වසර ගණනාවක් මට ඉගැන්වූ දේ, මෙයයි: සූරා අල්-බකරහ් මුල සිටම කියමින් සිටි දෙය අවසානයේ සම්පූර්ණයෙන් ඇසීමට මට ප්‍රමාණවත් නිහඬ තැන වූයේ, මම තවම ඇතුල් නොවූ සිරකුටියක්. ගුවන් ගමන මට නිහඬත්වයේ රසයක් දුන්නා. සිරගෙදර මට එහි ඉතිරි කොටස දුන්නා.","නමුත් මම ඉක්මනින් ඉදිරියට යමින් ඉන්නවා. සිරකුටියට පෙර කටාර් තිබුණා. කටාර්ට පෙර බොහෝ මාර්ග තිබුණා. මම සූරා අල්-බකරහ් වාදනය කළ ගුවන් ගමන ශ්‍රී ලංකාවෙන් පිටවූ පළමු වතාව නොවෙයි. දොර වසා දැමීමට පෙර, එය අවසන් වතාව.","මට පිටවීමේ ආරම්භයට ආපසු යන්න දෙන්න — අතේ පාස්පෝට් එකක්, විදේශ ගුවන් තොටුපොළක ඔහු වෙනුවෙන් බලා සිටින පියෙක් ඇති තරුණයෙකු වෙත — ඒ සූරාව එක් දවසක අවශ්‍ය වන ශරීරය, තම ගමෙන් පළමුව රැගෙන ගිය ආකාරය කියන්න.","තේරුම් ගැනීමට පෙරම වචන සමඟ ගෙන ගිය පිරිමි ළමයා."]},{"number":7,"title":"නම තුළ තිබුණු ගින්න","paragraphs":["මගේ නම තුළ තිබුණු ගින්න මම කුඩා කාලයේ දැන සිටියේ නැහැ. නමක් කියන්නේ මිනිසාගේ මුහුණට පෙර ලෝකය අසන ශබ්දයක්.","නමුත් සමහර නාමවල පරම්පරා, ප්‍රාර්ථනා, බර, ගිනි, ආශීර්වාද, සහ නොකියූ ඉතිහාසය සැඟවෙලා තිබෙනවා.","මම මගේ නම දරාගෙන ගියා.","එහි ඇතුළේ තිබුණු රුධිර රේඛාව, මට වඩා පැරණි මිනිසුන්ගේ හුස්ම, මගේ පියාගේ නිහඬ වැඩ, මගේ සීයාගේ බයිසිකලය, සහ මහ සීයාගේ ගිනි නාමය තිබුණා කියලා මට පසුවයි දැනුණේ. ශෙයිහු මුහම්මද් ගැන කුඩා කාලයේ මම ඇසූ දේවල් මට පරණ ගම් කතා වගේ පෙනුණා.","නෙරුප්පු මස්තාන් කියන නම මට එදා අලංකාරයක් වගේ පමණයි.","ගම්වල මිනිස්සු වැඩිහිටියන්ට දෙන ගෞරව නාමයක් වගේ.","නමුත් පසුව, සිරකුටියක නිශ්චලව වාඩිවී මගේ රුධිරය ගැන සිතද්දී, ඒ නම කවුරුහරි මිනිසෙකුට ලස්සනට දුන් වචනයක් නොවෙයි කියලා මට දැනුණා. ඒක විස්තරයක්.","ගින්න ඇතුළේ දරාගෙන සිටි මිනිසෙකුගේ විස්තරයක්.","මගේ පිතෘ රේඛාව මම දැන් මෙසේ අල්ලාගන්නවා.","ශෙයිහු මුහම්මද්, නෙරුප්පු මස්තාන්.","ඔහුගේ පුතා මුහම්මද් ඉබ්‍රාහිම්. ඔහුගෙන් මුහම්මදු ජාබිර්, මගේ පියා.","පසුව මම, මතිහුල් අක්මල්.","මේ නම් ලැයිස්තුවක් පමණක් නොවෙයි.","එක් නමකින් තවත් නමකට ගිය නිහඬ ගමනක්. ගෙදරවල්, කම්කරු ජීවිත, ආගම, ඉවසීම, අහංකාරය සමඟ සටන, පවුලේ බර, සහ නොකියූ ආශාවන් ඒ රේඛාව හරහා ගමන් කරලා තියෙනවා.","මම මේ ගැන ලියන්නේ පුරාවෘත්තයක් සෑදීමට නොවෙයි.","මගේ පවුලේ මිනිසුන්ව අධික ලෙස උසස් කර පෙන්වන්නත් නොවෙයි.","ඔවුන් මිනිසුන්.","ඔවුන්ගේ ශක්ති තිබුණා. දුර්වලකම් තිබුණා.","නොදැන කළ දේවල් තිබුණා.","නමුත් රුධිර රේඛාවක සත්‍යය කියන්නේ එයයි.","එය පිරිසිදු රන් දාමයක් නොවෙයි. එය මැටි, දහඩිය, ලේ, අසම්පූර්ණකම, ආදරය, සහ අල්ලාහ් පමණක් සම්පූර්ණයෙන් දන්නා රහස්වලින් සෑදුණු දාමයක්.","සිරගෙදරදී මම මගේ නම නැවත ඇසුවා.","ලෝකය මට අංකයක් දෙද්දී, මගේ ඇතුළේ මගේ නම වෙනත් ආකාරයකින් පිබිදුණා.","නම තවදුරටත් පාස්පෝට් එකේ ලියන අකුරු නොවුණා.","එය මට පෙර සිටි මිනිසුන්ගේ දිගු සෙවණක් වුණා. ඔවුන්ට ලියන්න නොලැබුණු පොතක්, ඔවුන්ට කියන්න නොලැබුණු වචන, ඔවුන්ගේ ජීවිතවලින් මට ලැබුණු නොකියූ වගකීමක් වුණා.","නෙරුප්පු මස්තාන් ගින්නක් දරාගෙන සිටියා නම්, ඒ ගින්න කෝපය පමණක් නොවෙයි.","එය දහනය.","පවිත්‍ර කිරීම. ඇතුළේ තිබුණු ව්‍යාජ දේවල් පිළිස්සී යන තැන.","මගේ ජීවිතයේ ගින්න බොහෝ විට වේදනාවෙන් ආවා.","ලැජ්ජාවෙන් ආවා.","අත්අඩංගුවෙන් ආවා. සිරකුටියේ නිහඬතාවයෙන් ආවා.","නමුත් ඒ ගින්න මාව විනාශ කිරීමට පමණක් නොව, මාව පිරිසිදු කිරීමටත් ආ බව පසුව මට දැනුණා.","මම මෙය ආගමික තෆ්සීර් ලෙස නොකියමි.","මෙය මගේ අත්දැකීම.","මගේ රුධිරය සහ මගේ නිශ්චලතාවය අතර මට දැනුණු අර්ථය. කුන් ෆය කුන් කියන පවිත්‍ර අදහස මම පසුව මගේ ජීවිතය තුළ අමුතු ආකාරයෙන් දැනුණා.","අල්ලාහ් කියන විට, දේවල් පවතිනවා.","මිනිසාගේ ගමන තුළත් සමහර බීජ, වසර ගණනාවක් නිහඬව සිට, නියම වෙලාවේ පවතින්න පටන් ගන්නවා.","ශෙයිහු මුහම්මද් පොතක් දාලා ගියේ නැහැ. මුහම්මද් ඉබ්‍රාහිම් පොතක් දාලා ගියේ නැහැ.","මගේ පියා ජීවතුන් අතර සිටියත්, ඔහුත් තවම පොතක් දාලා නැහැ.","මේ රේඛාවේ පොතක් තබන පළමු කෙනා මමයි.","ඒක ආඩම්බරයක් නොවෙයි.","ඒක වගකීමක්. ගින්න රුධිර රේඛාවේ තිබුණා.","එය දැනීමට තරම් නිශ්චල කෙනෙක්, එය ලියීමට තරම් කැමැත්තක් ඇති කෙනෙක් අවශ්‍ය වුණා.","කුන් ෆය කුන්.","වන්න — එය වේ. ගින්න දිගටම යනවා.","මේ පොතේ ඊළඟ අධ්‍යායය, කිසියම් ආකාරයකින්, ගිනි සාන්තුවරයාට ලියන්න නොලැබුණු අධ්‍යායයයි.","ඔහු මට නම දුන්නා.","මම ඔහුට පිටුව දෙනවා.","පළමු කොටස — දූතයා"]},{"number":8,"title":"මම නිහඬව දරාගෙන ගිය දේවල්","paragraphs":["මම නිහඬව දරාගෙන ගිය දේවල් බොහොමයක් තිබුණා. දරුවෙකුගේ කටින් පිට නොවන දේවල්, තරුණයෙකුගේ හදවතේ අඳුරු කොටස්වල තැන්පත් වන දේවල්, පසුව මිනිසාගේ මුහුණට බරක් වන දේවල්.","මම ඒවා එකවර හඳුනා ගත්තේ නැහැ. මම ඒවා දිනෙන් දින, සිදුවීමෙන් සිදුවීම, නිහඬව එකතු කරගත්තා.","මගේ පියාගේ යාම, අම්මාගේ දිගු දවස, සීයාගේ මරණය, ගෙදර බර, මගේම කුතුහලය, බීඩි, දැවුණු බෝට්ටුව, මුහුදේ බිය, අමතක වූ පිඟාන, කතා නොකළ දේවල්. මේ හැම එකක්ම මගේ ඇතුළේ නිශ්චලව තැන්පත් වුණා.","ඒවා කුඩා ගල් වගේ. එක් ගලක් බර නැති වගේ පෙනෙයි.","නමුත් වසර ගණනාවක් පුරා ගල් එකතු වුණොත්, මිනිසාගේ පපුව වඩා බර වේ.","මම හොඳින් සිටිමි කියලා කියන්න ඉගෙන ගත්තා. ඇත්තටම හොඳින් නැති වෙලාවලත්.","මිනිසුන්ට මුහුණ දී, සිනහවක් දී, අඩු වචන කියා ඉවතට යන්න ඉගෙන ගත්තා. එය ශක්තියක් වගේ පෙනුණා.","නමුත් සමහර ශක්ති, පසුව තුවාල බවට පත් වෙනවා. කියන්න නොදැන සිටීම, ගැලවීමක් නොවෙයි.","එය ඇතුළේ සිරවීමක්. මගේ ජීවිතයේ බලා සිටින්නා ඒ හැම දෙයක්ම සටහන් කරමින් සිටියා.","මම ඒකට නමක් දුන්නේ නැහැ.","නමුත් එය තිබුණා. එය මගේ වචනවල හිස් තැන් දුටුවා.","මම සඟවන බිය දුටුවා. මම කතා නොකරන ආදරය දුටුවා.","පසුව, සිරකුටියක, ඒ බලා සිටින්නා මට කියන්න පටන් ගත්තා: මේවා අතුරුදන් වී නැහැ. මේවා තවමත් මෙහි තියෙනවා.","නිහඬව දරාගෙන යාම සැමවිටම උතුම් දෙයක් නොවෙයි.","සමහර විට එය අවශ්‍යයි. සමහර විට එය පවුල ආරක්ෂා කරයි.","සමහර විට එය දරුවෙකුට බේරීමට උපකාරී වේ. නමුත් නිහඬතාවය ඇතුළේ සත්‍යය සිරවී යන විට, එය මිනිසාට අඳුරු කාමරයක් හදයි.","මම ඒ කාමරය තුළ බොහෝ කාලයක් ජීවත් වුණා. මට පසුව තේරුණේ, මා සිරගෙදරට ගිය දවසේ පමණක් මගේ සිරවීම ආරම්භ වූයේ නැහැ.","සිරගෙදර බිත්ති මගේ ඇතුළේ තිබුණු පැරණි බිත්ති පෙනෙන්නට කළා. මම දරාගෙන ගිය දේවල්, එහිදී හඬක් ලබා ගත්තා.","මම කතා නොකළ පවුලේ වේදනාව, මගේම ලැජ්ජාව, මගේම බිය, මගේම ආදරය — ඒවා සියල්ල නිහඬතාවයේදී නැවත මාව හමු වුණා.","මේ අධ්‍යායය තාත්තා සහ අම්මා වෙත යන පාලමක්. මම නිහඬව දරාගෙන ගිය දේවල් අතර ඔවුන් දෙදෙනාගේ නොකියූ ජීවිත තිබුණා.","තාත්තාගේ පිටුපස. අම්මාගේ දවස.","ඔවුන්ට පසුව මම වෙන්වෙන්ව හිස නමන්න ඕන. මොකද මගේ කතාව මගේ පමණක් නොවෙයි.","එය ඔවුන්ගේ ශරීරවලින්, ඔවුන්ගේ ඉවසීමෙන්, ඔවුන්ගේ නොකියූ පරිත්‍යාගයෙන් ගොඩනැඟුණු කතාවක්.","පළමු කොටස — දූතයා"]},{"number":9,"title":"තාත්තා කිසිදා නම් නොකළ නිශ්චලතාවය","paragraphs":["මගේ ජීවිතයේ බොහෝ කාලයක් මම තාත්තාව පිටුපසක් ලෙස දැන සිටියා. අම්පාර බස් නැවතුම්පොළේ 1999 දී බස් එකට නඟිමින් ගල්ෆ් රටට යන පිටුපස.","කුඩා පිරිමි ළමයෙක් ලෙස ඔහුගේ මෝටර්සයිකලයේ පිටුපස වාඩිවී, ඔහුගේ උරහිස ළඟ කම්මුල තබා, ඔහුගේ ශරීරය සුළඟ කැඩූ ආකාරය දැනුණු පිටුපස.","වසර විසි හයක් තවත් රටකට අතුරුදන් වූ පිටුපස, අපි වැඩෙන්නට. පියාගේ ආදරය සමහර විට ඉදිරියෙන් එන්නේ නැහැ.","එය පිටුපසක් ලෙස පෙනෙයි.","යන මිනිසෙක්. වැඩට යන මිනිසෙක්.","දුර රටක දහඩිය දමන මිනිසෙක්.","දරුවාට එය අහිමිවීමක් ලෙස දැනේ. පසුව මිනිසාට එය පරිත්‍යාගයක් ලෙස දැනේ.","මේ දෙකම සත්‍යය.","දරුවාගේ වේදනාවත් සත්‍යය. පියාගේ පරිත්‍යාගයත් සත්‍යය.","මගේ තාත්තා නිශ්චලතාවය ගැන කවදාවත් දේශනා කළේ නැහැ.","ඔහු ඒ වචනය භාවිත කළේ නැහැ. නමුත් ඔහුගේ ජීවිතයේ යම් නිශ්චල බරක් තිබුණා.","අඩුවෙන් කතා කරන මිනිසෙකුගේ බර.","ගෙදරින් දුරට ගොස් පවුලට ආහාර සොයන මිනිසෙකුගේ බර. දුක පෙන්වන්නේ නැති මිනිසෙකුගේ බර.","තමන් දරාගෙන යන දේ ගැන වැඩි විස්තර නොකියන මිනිසෙකුගේ බර.","මම ඔහුට කෝප වුණා. ඔහු මග හැරුණා.","ඔහු මට අවශ්‍ය වූ දවස් තිබුණා.","එසේම ඔහු දුරට ගියේ අප වෙනුවෙන් බව පසුව දැනුණු දවස් තිබුණා. පියා ගැන දරුවෙකුගේ හදවත සරල නැහැ.","ආදරය සහ අඩුව, ගෞරවය සහ කෝපය, අවශ්‍යතාවය සහ නිහඬ විරුද්ධත්වය එකට වාසය කරනවා.","මට ඔහුගෙන් ලැබුණු දේවල් වචනවලට වඩා අත්දැකීම්. වැඩ කිරීම.","පවුල වෙනුවෙන් ශරීරය දීම.","හඩක් නොකර දරාගෙන යාම. යාම සහ නැවත පැමිණීම අතර ජීවත් වීම.","ඔහුගේ නිශ්චලතාවය පූජනීය ලෙස මට පසුව පෙනෙන්න පටන් ගත්තා.","එය සම්පූර්ණ නොවුණත්, එය සැබෑ වුණා. මම සිරකුටියක වාඩිවී සිටියදී, තාත්තාගේ පිටුපස නැවත මගේ මතකයට ආවා.","මම තේරුම් ගත්තා, ඔහුගේ පිටුපස මට අහිමිවීමක් පමණක් නොව, පාඩමක්ද දී ඇති බව.","මිනිසෙක් තමන්ට නොතේරෙන බරක් වසර ගණනාවක් දරාගෙන යන ආකාරය. මිනිසෙක් ගෙදර ආදරය කරන නිසාම ගෙදරින් දුරට යන ආකාරය.","තාත්තා කිසිදා නම් නොකළ නිශ්චලතාවය, මට පසුව සිරකුටියේදී නමක් ලබා ගත්තා.","ඒ නිශ්චලතාවය තුළ කෝපය සෙමින් පහළට වැටුණා. ළමා කාලයේ අඩුව, වැඩිහිටි අවබෝධයට ඉඩ දුන්නා.","මගේ පියා පරිපූර්ණ මිනිසෙක් නොවෙයි.","මමත් නොවෙයි. නමුත් ඔහුගේ ගමන මගේ ගමන තුළ තිබුණා.","ඔහුගේ පිටුපස මගේ පොතේ පළමු රේඛාවලින් එකක් වුණා.","පළමු කොටස — දූතයා"]},{"number":10,"title":"ඇගේ දවස අටෙන් බෙදන්න බැහැ","paragraphs":["මගේ අම්මාගේ දවස අටෙන් බෙදන්න බැහැ. ඇයගේ දවස පැය අටක වැඩක් නොවෙයි. ඇය එක් කාන්තාවක් ලෙස එක් සරල දවසක් ජීවත් වූවා නොවෙයි.","ඇය දශක ගණනාවක් තනිවම සම්පූර්ණ ආයතනයක් වගේ සිටියා. ගෙදර, දරුවන්, ආහාර, රෝග, පාසල්, බිය, කෝපය, යාච්ඤාව, වස්ත්‍ර, නිදි නැති රාත්‍රී — මේ සියල්ල ඇය තුළින් ගමන් කළා.","අම්මාගේ වැඩ බොහෝ විට කවුරුත් නම් නොකරන වැඩ. උදේ ආහාරය සකස් කිරීම, දරුවන් අවදි කිරීම, ඇඳුම් සෝදීම, කුඩා රෝග හඳුනා ගැනීම, ගෙදරේ මුදල් දිගු කිරීම, කවුරුත් බිඳී නොවැටෙන පරිදි තමන්ම බිඳී නොවැටීම.","ඒවා පඩි නොලැබෙන වැඩ. නමුත් පවුලක ජීවිතය ඒවා මත රඳා පවතී. තාත්තා දුර රටක සිටියදී, අම්මා අපේ නිවසේ පෘථිවිය වුණා.","අපි ඇය වටා ගමන් කළා. ඇය තමන්ගේ මහන්සිය ගැන දිගු කතා කළේ නැහැ.","ඇය කළා. නැවත කළා.","පසුදා නැවත කළා. දරුවෙක් එය ස්වාභාවිකයි කියලා හිතනවා. පසුව මිනිසාට තේරෙනවා, එය ස්වාභාවික නොවෙයි.","එය වීරකමක්, නමුත් කෑගහන්නේ නැති වීරකමක්. අම්මාගේ අත් මට මතකයි.","උයන අත්. සෝදන අත්.","දරුවෙකුගේ නළලට තබන අත්. කෝපයෙන් වැඩ කරන අත්.","ආදරයෙන් වැඩ කරන අත්. ඒ අත් පවුලක් ගෙන ගියා. කවුරුත් ඒ අත් ගැන පොතක් ලියන්නේ නැහැ.","නමුත් ඒ අත් නොතිබුණා නම්, අපේ පොතම නොතිබෙන්න තිබුණා. මම ඇයව එදා තේරුම් ගත්තේ නැහැ.","මම ඇයගේ මහන්සිය පසුබිම ලෙස භාවිත කළා. ළමයෙකුගේ වරදක් ලෙස නොව, ළමයෙකුගේ නොදැනීම ලෙස.","නමුත් අද, මම ඇයගේ දවසට හිස නමනවා. අටෙන් බෙදන්න බැරි දවසට. කාලසටහනක දාන්න බැරි ආදරයට.","සිරකුටියේදී, අම්මාගේ ජීවිතය මට වෙනත් ආකාරයකින් පෙනුණා. මම බිත්ති හතරක් තුළ දින ගණන් ගණන් කළා.","ඇය දශක ගණනාවක් පුරා නිවසක් තුළ දින ගණන් නොකර, දින ජීවත් කළා. මට සිරගෙදර නිහඬතාවය පාඩමක් දුන්නා.","ඇයගේ නිහඬතාවය, මම කුඩා කාලයේ සිටම පාඩමක් දී තිබුණා. අම්මා, මම දැන් දකිමි. ඔබ කළ දේවල් මම එදා නොදැක්කා.","ඔබේ දවස අටෙන් බෙදන්න බැහැ. ඔබේ ආදරය වචන කිහිපයකින් මැනිය නොහැක.","මේ පොතේ ඔබේ නම එන්නේ, මගේ ජීවිතයේ මුල් ආලෝකය ලෙස. මම ඔබට ණයයි.","උම්මා මැදිරියේ, පටු ආලෝකයක් නිවස ගෙන ගිය තැන. උම්මා, වසර ගණනාවක් ජීවිතය දරාගෙන යමින්.","පළමු කොටස — දූතයා · ආපසු මතකයක්"]},{"number":11,"title":"කොළඹ — පෙන්ටියම් තුන සහ පැදුර","paragraphs":["කොළඹ මට විශාල පාසලක් වුණා. පෙන්ටියම් තුනක්, පැදුරක්, කුඩා කාමරයක්, බස්, මාර්ග, විවිධ ආගම්වල මිනිස්සු, විවිධ සුවඳවල්, විවිධ ජීවිත. ගමෙන් පැමිණි තරුණයෙකුට කොළඹ කියන්නේ ගොඩනැඟිලි පමණක් නොවෙයි.","එය මනස පුළුල් කරන ශබ්දයක්. මම එහි ඉගෙන ගත්තා.","පරිගණකය ඉදිරිපිට වාඩි වුණා. පෙන්ටියම් තුන මට ලෝකයට කුඩා දොරක් වුණා.","පැදුර මගේ නිදාගැනීමේ තැන. ඒ දෙක අතර මගේ තරුණ ජීවිතයේ පුදුම සමතුලිතතාවයක් තිබුණා.","මනස ඉගෙන ගැනීමට කැමතියි. ශරීරය මහන්සි වෙයි. නමුත් අනාගතය ගැන ඇති ආශාව ඒ දෙක අතර මාව තබාගත්තා.","කොළඹ මට මිනිසුන් ගැන වෙනත් පාඩමක් දුන්නා. මම මගේ ආගමෙන් ඉවත් වුණේ නැහැ.","නමුත් මගේ ආගම තුළ මිනිසුන්ට ඇති ඉඩ වඩා පුළුල් බව දැනුණා. හින්දු දේවාලයක් අසලින් යන මිනිසුන්, බෞද්ධ පන්සලකට යන මිනිසුන්, කිතුනු පල්ලියකට යන මිනිසුන් — ඔවුන් මගේ සතුරන් නොවෙයි.","ඔවුන්ත් තමන්ට දැනෙන ආලෝකය සොයන මිනිසුන්. මම මේ අවබෝධය පොතකින් පමණක් නොගෙන, මාර්ගවලින්, කෑමෙන්, කාමරවලින්, අසල්වැසියන්ගෙන් ගත්තා.","ආගම මිනිසාට මිනිසාගේ වටිනාකම අඩු කිරීමට භාවිත කළහොත්, එය මට තදින් දැනුණා. කොළඹ මට ඉගැන්නුවේ, තමන්ගේ විශ්වාසය තබාගෙන, තවත් කෙනෙකුගේ මිනිසත්කම පිළිගන්න පුළුවන් බව.","පසුව සෙල් දහතුනේදී, මම කුර්ආන් අසල බයිබලය කියවීමට බිය නොවූයේ, කොළඹ මා තුළ සිටි නිසා. මම එය ආගම මාරු කිරීමක් ලෙස නොදැක්කා. මම එය මිනිසාගේ සාක්ෂියන්ට ඇහුම්කන් දීමක් ලෙස දැක්කා.","කොළඹ මාව අඩු මුස්ලිම් කෙනෙක් කළේ නැහැ. කොළඹ මාව වඩා පුළුල් මුස්ලිම් කෙනෙක් කළා.","එම පුළුල් මම නැතිව, වසර දහයකට පසුව සෙල් දහතුන එකම මිනිසාව නිපදවන්නේ නැහැ. සිරකුටියේ බීජ කොළඹ පාරවල්වල සිටුවුණා.","කුර්ආන් අසල බයිබලය ගැටුමකින් තොරව කියවූ බලා සිටින්නා, උදෑසන හින්දු දේවාලයක් අසලින් පන්ති වෙත ගිය, ඇතුළේ පහන් දැල්වූ මිනිසුන් තම ආගමට සතුරන් නොවන බව නිහඬව තේරුම් ගත් ඒ බලා සිටින්නාමයි. ඔවුන් මිනිසුන්.","ඔහු වගේම. උත්සාහ කරමින්.","පළමු කොටස — දූතයා · ආපසු මතකයක්"]},{"number":12,"title":"හින්දු ආර්චි","paragraphs":["කොළඹ කොළ පාටින් පින්තාරු කළ ගෙයක් තිබුණා. එහි මම වසර දෙකක්, එතැන උපන් කෙනෙක් වගේ ජීවත් වුණා. එම නිවසේ සිටි ආර්චි හින්දු කාන්තාවක්. නමුත් මට ඇය ආගමික ලේබලයක් පමණක් නොවෙයි. ඇය මට නිවසක් දුන් මිනිසත්කමක්. ඇය මට කාමරයක් දුන්නා.","බිමක් දුන්නා. පැදුරක් දුන්නා. ආහාර දුන්නා. විශ්වාසය දුන්නා. කවුරුත් ලොකු දේශනයක් නොකළා.","සාමය ගැන, ආගමික එකමුතුව ගැන, මානවත්වය ගැන ඇය වේදිකාවක සිට කතා කළේ නැහැ. ඇය උයලා මට කන්න දුන්නා. සමහර විට එය දේශනයකට වඩා ගැඹුරුයි. අපේ ලෝකයේ එකම පිඟානකින් කෑම කන්නේ විශේෂ විශ්වාසයක්. වෙනත් සංස්කෘතියක කෙනෙකුට එය අමුතු වාක්‍යයක් වගේ ඇසෙනු ඇත. නමුත් අපේ පැත්තේ එය ආදරය සහ විශ්වාසය පෙන්වන ක්‍රියාවක්.","ඇය සරල දෙමළ විලාසයෙන් නිර්මාංශ කෑමක් උයනවා. බත්, සාම්බාර්, එළවළු, චට්නි. අපි බිම වාඩිවී, එකම වානේ පිඟාන ඉදිරිපිට, දකුණු අතින් එකම බත්, එකම හොදි, එකම මතුපිටින් කනවා. ඇය මගේ ඉදිරියට තව ටිකක් දානවා. මම සාමාන්‍යයට වඩා අඩුවෙන් කෑවොත් ඇය දැකලා අහනවා.","උදේ පන්තියක් නිසා මම උදේ ආහාරය මගහැරියොත්, අම්මලා බනින්නේ වගේ ඇය බනිනවා. ඒ බැනීම ආදරයේ භාෂාවක්. ආගම වෙනස් වුණත්, අම්මාගේ රැකවරණය සමානයි. ආර්චි මට කුලියක් නැති තැනක් දුන්නා. කෑමෙන් ඉගැන්නුවා. ආගමට එහා කරුණාව පෙන්වුවා.","කොළඹ මගේ මිනිසත්කම පිළිබඳ අවබෝධය පුළුල් කළා. නමුත් ඒ පුළුල් වීම මිනිස් මුහුණක් ලබා ගත්තේ ආර්චි නිසා. ඇය මට ආහාරයක්, බිමක්, කාමරයක්, පිඟානක්, සහ විශ්වාසයක් දුන්නා. එය ප්‍රමාණවත්. ප්‍රමාණයටත් වඩා.","පළමු කොටස — දූතයා · ආපසු මතකයක්"]},{"number":13,"title":"බෙරගල — රෝසි සහ ෆ්‍රෙඩී","paragraphs":["බෙරගලේ රෝසි සහ ෆ්‍රෙඩී මගේ ජීවිතයේ අමුතු, උණුසුම් පාඩමක්. ශ්‍රී ලංකාවේ කන්දක් මැද, නව අක්කරයක හරිත භූමියක, ඔවුන්ගේ නිවස මට තාවකාලික නවාතැනක් පමණක් නොවුණා. එය දිගු විවාහයක්, සැබෑ ආදරයක්, කෝපය සහ රැකවරණය එකට ජීවත් වන ආකාරය දකින්න ලැබුණු තැනක්.","මම එතැනට තරුණ යතුරුපැදි ධාවකයෙකු ලෙස ආවා. මහන්සි, නොදැන, ලෝකය ගැන තවමත් අඩු අවබෝධයෙන්. ඔවුන් මාව ඇතුල් කරගත්තා.","කෑම දුන්නා. කෝපි දුන්නා. සමහර විට මට එහි රසය දරාගන්න බැරි වූ නිසා මම හොරෙන් ඉවතට දමා ඇති කෝපි තිබුණා.","පසුව ඒ ගැන වරදකාරි හැඟීමත් මගේ මතකයේ රැඳුණා. රෝසි සහ ෆ්‍රෙඩී එකිනෙකා සමඟ සණ්ඩු කළා.","නමුත් ඒ සණ්ඩු හිස් නොවෙයි. ඒවා දිගු ජීවිතයක් එකට ගත කළ මිනිසුන්ගේ ශබ්ද. ආදරය සෑම විටම මෘදු හඬකින් පමණක් පවතින්නේ නැහැ.","සමහර විට එය තර්ක කරයි. බනියි. කෝප වේ.","එසේ වුවත් පසුව කෑම තබයි. බාල්දිය පිරිසිදු කරයි. තවත් දවසක් එකට ජීවත් වෙයි.","ෆ්‍රෙඩීගේ බාල්දිය මට නිතර මතකයි. එය බාල්දියක් පමණක් නොවෙයි.","එය පිළිවෙල. එය දිනපතා ගෞරවය. රෝසිගේ ආදරය, ෆ්‍රෙඩීගේ පුරුදු, ඔවුන්ගේ නිවසේ සැබෑ ශබ්ද — මේ සියල්ල මට පාසලක් වුණා, මට එය පාසලක් බව නොදැන.","සෙල් දහතුනේ නිහඬ දහවල්වල, මම රෝසි සහ ෆ්‍රෙඩී ගැන සිතුවා. ස්නේක් ක්‍රීඩාව ගැන. හොරෙන් ඉවත දැමූ තුනී කෝපි ගැන.","ෆ්‍රෙඩීගේ බාල්දිය ගැන. එකිනෙකා සමඟ ආදරයෙන් සටන් කළ, ශ්‍රී ලංකා කන්දක මැද සිටි මහලු දෙදෙනෙකු ගැන. බලා සිටින්නා මගේ ඇතුළේ නිහඬව තේරුම් ගත්තා, මගේ ජීවිතයේ ගැඹුරු පාඩම්වලින් කිහිපයක් එම ගොවිපළේ සිදුවී ඇති බව.","රෝසි. ෆ්‍රෙඩී.","ඔබලා දැන් කොහේ සිටියත්, වෙන්ව හෝ එකට, මේ ජීවිතයේ හෝ ඊළඟයේ — ස්තූතියි. ඔබලාට මාව ගන්න අවශ්‍ය නොවුණා. කෑම දීමට අවශ්‍ය නොවුණා.","ඔබලාගේ සත්‍ය ආදරයේ පටල මට පෙන්වීමට අවශ්‍ය නොවුණා. නමුත් ඔබලා කළා. ඔබලා මට ඉගැන්නුවේ, විවාහයක් පූජනීය වීමට නිහඬ විය යුතු නැති බව.","එය සැබෑ විය යුතුයි. සණ්ඩුව සැබෑ වුණා. ආදරය සැබෑ වුණා.","කෝපිත් අවසානයේ සැබෑ වුණා. ඔබලාට මම ණය වූ අධ්‍යායය මෙයයි.","පළමු කොටස — දූතයා · ආපසු මතකයක්"]},{"number":14,"title":"ජයිලානි — මධ්‍යරෑ කන්ද","paragraphs":["ජයිලානි කන්ද මට මධ්‍යරෑ අඳුරකින් විවෘත වුණා. මම එතැනට යාමට ගත් තීරණය හදිසි වගේ පෙනුණා. නමුත් පසුව මට තේරුණා, ඒ තීරණයේ බීජය වසර දහයක් හෝ දොළහක් පෙර තාත්තා විසින් සිටුවා තිබුණා.","ඔහු ගල්ෆ් රටෙන් ආපසු පැමිණ අපව එම කන්දට ගෙන ගිය දවසේ, ඔහු ගලක් මත ලිස්සා වැටුණා. මම එය දැක්කා.","කිසිවක් කිව්වේ නැහැ. නමුත් එය මගේ ඇතුළට නිහඬව ගියා.","දශකයකට වැඩි කාලයකට පසුව, මම දහඅට වියේදී, ඒ බීජය කැඩී විවෘත වුණා. හදිසියෙන් මට තනිවම යන්න ඕන වුණා.","රාත්‍රියේ. සැලසුමක් නැතිව.","එම කන්දට. තාත්තා මාව නවත්තලා නැහැ.","ඔහු මට ආශීර්වාදය දුන්නා. ඔහු තමන් බීජයක් සිටුවා තිබුණු බව දැනගෙන හිටියේ නැහැ.","ඔහු එය සම්පූර්ණ කරමින් සිටින බවත් දැනගෙන හිටියේ නැහැ. මධ්‍යරෑ කන්දේ ගමන ශරීරයට පහසු නොවෙයි.","අඳුර, මාර්ගය, බස්, නොදැනීම, තනිව සිටීම. නමුත් තරුණයෙකුගේ මනසට සමහර විට අනතුරත් ආකර්ෂණයක්.","මට ගෙදරින් පිටවෙන්න, කන්දට යන්න, මගේ ඇතුළේ යමක් අසන්න අවශ්‍ය වුණා. එදා මට ඒකට වචන තිබුණේ නැහැ.","ජයිලානි මට ආගමික ස්ථානයක් පමණක් නොවෙයි. එය ශරීරය සහ මනස අතර පාලමක් වුණා.","කන්ද නැගීමේ මහන්සිය, රාත්‍රියේ නිහඬතාවය, ආගන්තුකයන්ගේ කරුණාව, තනිව ගමන් කිරීමේ බිය — මේ සියල්ල මට යම් අභ්‍යන්තර දොරක් අසලට ගෙන ගියා. මම එදා සම්පූර්ණයෙන් තේරුම් ගත්තේ නැහැ, ළමා කාලයේ ශරීරයට තැන්පත් වූ දේවල් තමන්ගේ කාලයේ මතු වන බව.","වසර ගණන් යයි. බීජය බලා සිටියි.","පසුව එක් දහවලක එය කුඩා හරිත රිකිල්ලක් එවයි. ඔබ බස් ටිකට් එකක් ගන්නවා.","තාත්තාට මට යන්න ඕන කියනවා. තාත්තා, තමන් සිටුවූ බීජය නොදැන, ආශීර්වාදය දෙයි.","මගේ අවබෝධයේ, ඒක කුන් ෆය කුන් මන්දගාමී චලනයකින් වසර දොළහක් පුරා සිදුවීමක් වගේ. මෙය නිල විස්තරයක් නොවෙයි.","මගේ ජීවිතය තුළ මට දැනුණු ආකාරයයි. අල්ලාහ් සමහර මාර්ග, අපි නොදැන සිටියදී පවා, ඇතුළේ සකස් කරනවා.","පළමු කොටස — දූතයා · ආපසු මතකයක්"]},{"number":15,"title":"ඔළුවිල් — අමතක වූ පිඟාන","paragraphs":["ඔළුවිල් වෙරළේ අමතක වූ පිඟාන මගේ ජීවිතයේ කුඩා මතකයක් වගේ පෙනෙයි. නමුත් කුඩා මතකවලින්ම මිනිසාගේ රටා පෙනෙයි.","මම පිඟාන අමතක කළා. කෑම තිබුණා.","මිනිස්සු තිබුණා. මට ඉල්ලන්න පුළුවන් වුණා.","නමුත් මම ඉල්ලුවේ නැහැ. මම පොල් ගසක් පිටුපස සැඟවී, කුසගින්නේ සිටියා.","ළමයෙක්ට ලැජ්ජාව විශාල දෙයක්. “මට පිඟානක් නැහැ” කියන වචනය ඔහුට පර්වතයක් වගේ දැනෙයි.","කෙනෙකුගෙන් ඉල්ලීම, අවශ්‍යතාවය පෙන්වීම, තමන් අඩු තැනක සිටින බව පිළිගැනීම — මේවා මට අමාරු වුණා. ඒ නිසා මම කුසගින්නේ සිටීම තෝරාගත්තා.","කුඩා තීරණයක්. නමුත් එහි ඇතුළේ මගේ ජීවිතයේ දිගු රටාවක් තිබුණා.","පසුව සිරගෙදරදී මගේ සහෝදරයා මට දුන් පාඩම — ඔහුට ඕන ඔයාගේ හඬ අහන්න විතරයි — මම වසර තිස් හතරක් ඉගෙන ගැනීම ප්‍රතික්ෂේප කළ පාඩම වුණා. ඔළුවිල් පිඟාන වෙනුවට වෙනත් පිඟානක් ලැබෙන්න තිබුණා.","කෑම තිබුණා. ලැජ්ජාව කුඩායි.","නමුත් පිරිමි ළමයාට ඉල්ලන්න බැරි වුණා. ඒ නිසා පිරිමි ළමයා කුසගින්නේ සිටියා.","ඔහු පසුව මිනිසෙක් වුණා. ඒ පාඩම විශාල විශාල රූපවලින් නැවත කළා.","ඉල්ලන්නේ නැතිව. කතා නොකර.","අවශ්‍යතාවය සඟවා. තුවාලය සඟවා.","මෝල්ටාවේ සිරකුටියක් අවසානයේ ඒ රටාවට බාධා කළා. එතැන මට තේරුණා, කුඩා පිඟානේ මතකය තවමත් මගේ ඇතුළේ ජීවත් වූ බව.","මේ නිසා මේ වගේ පොතක කුඩා මතක වැදගත්. ඔළුවිල් වෙරළේ පොල් ගසක් පිටුපස සැඟවුණු පිරිමි ළමයා, දශක ගණනාවකට පසුව සිරකුටියක වාඩි වූ මිනිසාමයි.","මොකද ඔහු ජීවිතය පුරා ඉල්ලීම වෙනුවට සැඟවීම තෝරාගෙන තිබුණා. රටා මුලින්ම තබන්නේ ඉතා කුඩා තැන්වල.","බලා සිටින්නා ඒ දවසේ සිටම බලාගෙන සිටියා. පිඟාන අතුරුදන් වූ විටත්.","කුසගින්න ඇතුළේ තබාගත් විටත්. පොල් ගස පිටුපස හිටගෙන සිටි විටත්.","බලා සිටින්නා සටහන් කරමින් සිටියා. ඔබ කියවන මේ පොත, එදා සිට වසර තිස් හතරක් නිහඬව සටහන් කළ දේ, අවසානයේ හඬින් කියන බලා සිටින්නායි.","තුන්වන කොටස — වහලය"]},{"number":16,"title":"අක්කන්","paragraphs":["අක්කන්. ඒ වචනය මගේ ගෙදර වචනයක්. එය අක්කා කියන සාමාන්‍ය වචනයක් පමණක් නොවෙයි.","එය මගේ ශරීරයේ මතකයක්. ගෙදර ඉදිරි කාමරයේ සිසිල් බිම. නළල මත තැබූ අත.","ආදරයෙන් බනින හඬ. බඩගිනි වූ විට කෑම. බිය වූ විට ආරක්ෂාව.","මම කුඩා කාලයේ අමතක කළ බොහෝ සත්‍යයන්ට ඇය නිහඬ සාක්ෂියක්. මම බොහෝ දේ ඇයට කියන්න අමතක කළා. ඔළුවිල් ගමන කොහොමද කියලා ඇය ඇසූ විට, මම හොඳයි කිව්වා.","ඇත්තේ, මගේ පිඟාන නැතිව, පොල් ගසක් පිටුපස කුසගින්නේ සිටි මමයි. මම එය කිව්වේ නැහැ. මම දැවුණු බෝට්ටුව ගැනත් සම්පූර්ණයෙන් කිව්වේ නැහැ.","මෝල්ටා ගුවන් තොටුපොළ මා වටා වැසී ගිය විටත්, දින ගණනාවක් ඇයට කතා කිරීමට ධෛර්යයක් නොතිබුණා. මම වැදගත් දේවල් සඟවා තබාගත්තේ, එය ආරක්ෂාවක් කියලා සිතමින්. නමුත් එය ආරක්ෂාව නොවෙයි.","එය නැවත නැවත ඇයට දුන් තුවාලයක්. ඇය ඒවා අවශෝෂණය කළා. යාච්ඤා කළා.","කෑම දුන්නා. ආදරය නවත්තලා නැහැ. මම වචන නොදුන් තැන්වලත්, ඇය තමන්ගේ පැවැත්ම දුන්නා.","අක්කන්ගේ ආදරය මට පසුකාලයේ වෙනත් ආකාරයකින් තේරුණා. එය විශාල දේශනවලින් නොවෙයි.","දිනපතා ක්‍රියාවලින්. බඩගිනිද කියලා අහනවා. නළලට අත තබනවා.","හඬින් කෝප වුණත්, ඇතුළෙන් බියෙන් යාච්ඤා කරනවා. පවුලේ කාන්තාවන්ගේ ආදරය බොහෝ විට එහෙමයි. එය රැකවරණය ලෙස පැමිණෙයි.","සමහර විට බැනීමක් ලෙස. සමහර විට කෑමක් ලෙස. නමුත් එහි මධ්‍යයේ බයත් ආදරයත් එකටයි.","මම මේ පොතේ, අනාරාධිතයන් ඉදිරියේ, ඇයට අවසානයේ කියන්න කැමතියි. මම ඔබට ආදරෙයි. මට සමාවෙන්න.","ඉදිරි කාමරයේ සිසිල් බිම තවම මගේ ඇතුළේ. නළල මත අත තවම මගේ ඇතුළේ. අක්කන් කියන වචනය තවම මගේ ඇතුළේ.","මේ පොතේ සෑම වචනයක්ම, කිසියම් ආකාරයකින්, ඔබ වෙනුවෙන්ද වචනයක්. මේ පොත, මම වසර ගණනාවකට පෙර ඔබට ලිය යුතු වූ දිගු ලිපියයි. එදා මම ඉතා කුඩා, ඉතා අහංකාර, ඉතා සැඟවුණු කෙනෙක්.","ලියන්න බැරි වුණා. දැන් මෙන්න එය. හෙමින් කියවන්න.","ඔබේ කාලය ගන්න. ඔබේ පුතාට අවසානයේ කියන්න දෙයක් තියෙනවා."]},{"number":17,"title":"කතාරය තමයි පළමු පිටවීම","paragraphs":["ඩුබායිට පෙර කතාරය තිබුණා. එය වැදගත්, මොකද ඩුබායි මගේ පළමු පිටවීම නොවෙයි. මගේ පළමු පිටවීම 2016 දී සිදුවුණා. මගේම නම තිබූ පාස්පෝට් එක අතේ තබාගෙන මම ශ්‍රී ලංකාවෙන් පිටවී, යමක් වීමට උත්සාහ කරන මිනිසෙකු ලෙස ලෝකයට ඇතුල් වුණා. එය මගේ ජීවිතයේ විශාල දෙයක්. පළමු වරට මම කවුද කියන සාක්ෂියක් අතේ තබාගෙන ගියා. රුපියල් අනූවක් අතේ තබාගෙන පරණ මාර්කට් එකට ඇවිද ගිය පිරිමි ළමයා, දැන් දේශසීමා හරහා යන්න ඉඩ දෙන කුඩා පොතක් අතේ තබාගෙන ජාත්‍යන්තර ගුවන් තොටුපොළක් හරහා ඇවිදිනවා. මගේ තාත්තා — මොහොමඩ් ජාබිර් — මට පෙරම ගල්ෆ් රටේ බර දරාගෙන සිටියා. අප ජීවත් විය යුතු නිසා ඔහු සෞදි අරාබියේ වසර ගණනාවක් අපෙන් දුර වැඩ කළා. මම කතාරයට ගිය විට ඔහු බිය කෙලින්ම කියා නොව, තමන්ගේ ජීවිතයම වෙනස් කරමින් මට ළඟින් සිටීමට කතාරයට මාරු වුණා. ඔහු වැඩට බය මිනිසෙක් නොවෙයි; විදේශ රටක පුතා තනිව සිටීම ගැන බය වූ පියෙක්. ඔහු ආදරය කළේ එසේයි — ආරක්ෂා කරන්න උත්සාහ කළ මිනිසුන් වටේ තමන්ගේ ජීවිතයේ සිතියම නැවත සකස් කරමින්.","• • •","මුලින් මම මාව පිළිගත්, කෑම දුන්, ජීවත් වීමට තැනක් දුන් මිතුරෙකු සමඟ රැඳී සිටියා. ඔහුගේ නවාතැන් දෝහා නගරයෙන් දුරයි, නමුත් මම පැමිණිලි කළේ නැහැ. මම තරුණයි, පළමු වරට විදේශයකයි, තවමත් බලන්න ඉගෙන ගනිමින් සිටියා. මම සීවී එක අරගෙන දොරට තට්ටු කරමින් යා යුතු වෙලාවේ, කාමරයේ සිට ඔන්ලයින් අයදුම් කරමින්, වටේ ලෝකය නිරීක්ෂණය කළා. කතාරයේ පූසන් මට මතකයි. වීදිවල, ගොඩනැගිලි අසල, සෝෆා වටේ, සෙවණ යට සිටි ඒ සතුන් පවා ලෝකය මගේ සිත සිතා තිබූ තරමට වඩා විශාල බව කියා දෙනවා වගේ. දෝහා නගරයට බස් එකෙන් යන දවස්වල ලෝහ ආසන, ලෝහ පාරවල්, බස්වල ලෝහ පැති මත හිරු තදින් වැටුණා. බලා සිටීමම පරීක්ෂණයක්. කන්වල පැය පහක හින්දි ගීත. සමහර විට චායි. බොහෝ විට ඒ චායිම මගේ කෑම. මම මටම බඩගිනි නැහැ කිව්වත්, ශරීරය සත්‍යය දැන සිටියා.","• • •","තාත්තාත් තමන්ගේ ආකාරයෙන් පොරබදමින් සිටියා. අතින් කරන ප්‍රායෝගික ඉංජිනේරු වැඩවලින් ආ ඔහුගේ ලෝකයට ඊමේල්, පරිගණක, යතුරුපුවරු ඇතුල් වෙමින් තිබුණා. ඇඟිලි බොත්තම්වලට වැඩියි, අත් එවැනි වැඩ සඳහා නොවෙයි කියලා ඔහු කී කලකිරීම මට මතකයි. ඒ පැමිණිල්ල කුඩා වගේ ඇසුණත්, මට එය දශක ගණනාවක් සැබෑ ශාරීරික වැඩ කළ මිනිසෙකු තිරයක් හරහා ජීවත් වීමට ඉල්ලා සිටින රූපයක්. මම ඔහුට කිව්වා: සන්සුන් වෙන්න තාත්තා, ඊමේල් දෙන්න, මම පිළිතුරු දීමට උදව් කරන්නම්; ඔබ සැබෑ වැඩ දන්නවා, තාක්ෂණිකයන්ට මග පෙන්වන්න. පුතෙකුට තම පියාට පාලමක් විය හැකි බව, ඉහළින් නොව, වෙනුවට නොව, එක් ලෝකයක් තවත් ලෝකයකට පරිවර්තනය කරමින්, මම මුලින්ම තේරුම් ගත්තේ එතැන.","• • •","ඒ මාසවලදී මම අම්මාවත් වෙනස් ලෙස තේරුම් ගත්තා. ගෙදර මුදල් පීඩනය ආ විට ඇය තාත්තගෙන් නැවත මුදල් ඉල්ලනවා; තාත්තා කලකිරීමෙන් මුදල් ගස්වලින් එනවාද කියා අහනවා. දරුවෙකු ලෙස මට ඒ වාක්‍යය තේරුණේ නැහැ. කතාරයේදී එක් වැටුපක් බිරිඳ, දරුවන් අට දෙනා, කෑම, පාසල, ගෙදර, ගැටලු සහ හදිසි අවශ්‍යතා හරහා දිගු විය යුතු ආකාරය දැක්කා. අමතර මුදලක් ආවේ නම් එය ණය, ලැජ්ජාව, වෙනත් මිනිසෙකුගේ කරුණාව දරාගෙන ඇති විය හැකියි. එතැන මම තාත්තාගේ විදේශ ජීවිතයේ මිලත්, අම්මාගේ ගෙදර ජීවිතයේ මිලත් දැනගන්න පටන් ගත්තා. වසර විසි හයක් දෙදෙනාම ගෙව්වා. ඔහු නොපැමිණීමෙන්. ඇය පැමිණ සිටීමෙන්.","• • •","අවසානයේ මට කතාරයේ අඩු වැටුපක වැඩ ලැබුණා. කැමරා දරාගෙන, නැගී, සවි කරමින්, අතින් තාක්ෂණික වැඩ කළා. ඉන්දියානු මිතුරන්, ෆිලිපීනෝ සගයෙක්, මට අල්ලාගත නොහැකි නව භාෂා හමු වුණා. පළමු වරට ෆිලිපීනෝ භාෂාව ඇසූ විට මම හිනා වුණේ කතා කළ කෙනාට නොව, ඒ ශබ්ද හඳුනාගන්න බැරි වූ මගේම මනසට. පසුව මෝල්ටාවේ සිරකුටියක ෆිලිපීනෝ සහෝදරයෙක් මගේ මනස වෙනස් කරන පොතක් දෙන බව මම එදා දැන සිටියේ නැහැ. ලෝකය එවැනි දේ සකස් කරයි. අපි ඒවා සකස් කරන්නේ නැහැ. අවසානයේ ඒවා පැමිණෙන විට අපි එතැන සිටීම පමණයි.","පළමු කොටස — දූතයා"]},{"number":18,"title":"ඩුබායි මගේ ශරීරයට ආහාර දුන්නා","paragraphs":["ඩුබායි ආරම්භ වුණේ මම ඇයි එහි ගියේද කියලා සම්පූර්ණයෙන් තේරුම් ගැනීමට පෙරයි. කතාරයෙන් පසුව මගේ ශරීරයට නැවත ගල්ෆ් රටක් අවශ්‍ය නැහැ. එය උණුසුම, බලා සිටීම, අඩු වැටුප, සීමා සහ විදේශයක සිටියත් නිදහස් නොවන ඒ අමුතු හැඟීම දැන සිටියා. ශරීරය නැහැ කියමින් සිටියා. මනස ඩුබායි තුළ අවස්ථාව, පද්ධතිය, වර්ධනය දැක්කා. එදා ඒකට මට භාෂාව තිබුණේ නැහැ. දැන් තියෙනවා. ශරීරය සහ මනස එකිනෙකා හොඳින් නොදන්නා වසරවල, පාලනයේ සිටියේ ශරීරයයි; ඇදගෙන යනු ලැබුවේ මනසයි. මිනිසා වැඩ කළ යුතු ආකාරයේ විරුද්ධ පැත්ත. එය තේරුම් ගැනීමට මට තවත් වසර ගණනාවක් ජීවත් විය යුතු වුණා.","• • •","ඩුබායි මට පද්ධතියක් දුන්නා. අබුඩාබියේ වෝනර් බ්‍රදර්ස් වර්ල්ඩ් තේමා උද්‍යානයේ ලෝකයට මම ඇතුල් වුණා. එතැන හැම දෙයක්ම සතුට වටා ඉදි කර තිබුණා. අමුත්තන් තම ප්‍රශ්න අමතක කිරීමට එනවා. සේවකයන් සිනහව, මග පෙන්වීම, සහාය, වාතාවරණය ජීවමාන තබාගැනීම අපේක්ෂා කරනවා. තාක්ෂණිකයෙකු ලෙස පසුබිමේ නොපෙනී, කේබල් අතේ තබාගෙන සිටියත්, මම ඒ නොපෙනෙන සතුටේ කොටසක්. ආලෝක, ශබ්ද, සංගීත, වීඩියෝ, කැමරා, මැජික් එක වැඩ කරන බව පෙන්වන කුඩා තාක්ෂණික විස්තර අපි බලාගත්තා. නවාතැන්, කෑම, ප්‍රවාහනය, ජිම් — සියල්ල සකස්. ජීවත්වීම ගැන බිය ඉවත් වූ විට, ශරීරය චලනය, විනය, දිනචරියාව වෙත යොමු වුණා.","• • •","උදෑසන රාජකාරි දවසක හතරහමාරට පමණ අවදි වුණා. සාමාන්‍ය ඇඳුම්, කුඩා බෑගය, දුරකථනය, චාජර්, කන්ෆෝන්, හැඳුනුම්පත, කෑම කාඩ්. හයයි පහළොවට පමණ බස් එක අපව උද්‍යානයේ පාලනය කළ ලෝකයට ගෙන යනවා. එතැන දවස ආරම්භ වීම පවා පද්ධතියක්. යුනිෆෝම්, රේඩියෝ, උපකරණ, පරීක්ෂණ, ආලෝක, ශබ්ද, තිර. ශරීරය මේකට කැමතියි. නිශ්චිත වේලාවක්, නිශ්චිත කෑම, නිශ්චිත වැඩ, නිශ්චිත වෙහෙස. 2018 දී මගේ පළමු නේම් ටැග් එකේ තිබුණේ ජාබිර්. පාස්පෝට් වැරදීම යුනිෆෝම් එකටත් මා සමඟ ආවා. මාස හයක් බලා, ඩිරාම් විසිපහක් ගෙවා, එය අක්මල් බවට මාරු කළා. මගේ සීයා දුන් නම. මගේ පපුව මත මම මම වීමට ගෙවූ කුඩා මුදල.","• • •","ඩුබායි දුක පමණක් නොවුණා. වෙහෙස තිබුණා, නමුත් ක්‍රීඩා, මිතුරන්, ජිම්, කෑම, වෙරළේ ඇවිදීම, සම්බන්ධතා, සම්පූර්ණ ජීවිතයක් තිබුණා. එය නගරයක් තුළ නගරයක්. වසර හතරක් එය මගේ ශරීරය පුහුණු කළා. ජීවත්වීම ගැන බිය නොකර විනය දුන්නා. සේවය, තාක්ෂණික නිරීක්ෂණය, පැමිණ සිටීමේ පුරුද්ද ඉගැන්නුවා. නමුත් එය මගේ මනස සම්පූර්ණයෙන් පෝෂණය කළේ නැහැ. මනස තවම බලා සිටියා. ඩුබායි මගේ ශරීරයට ආහාර දුන්නා; එය පසුව මෝල්ටාවේදී විවෘත වීමට තිබූ මනස සූදානම් කළේ නොදැනම.","• • •","එදා නොපෙනී බලා සිටි තවත් රූපයක් තිබුණා. ඩුබායිදී ගත් ෆෝල්කන් පින්තූරයක් — හිස ආවරණය කළ පක්ෂියා, ලෙදර් අත්වැසුමක් මත සන්සුන්ව. ඕනෑම තැනකට පියාසර කළ හැකි පක්ෂියා, නිදහස් කරන තුරු නිශ්චලව සිටීමට පුහුණු කර තිබුණා. එය මගේම අනාගතයේ කුඩා චිත්‍රයක් බව මට එදා දැනුණේ නැහැ. කාර්ය සාධනය සඳහා පුහුණු කළ ශරීරය. ආවරණය වූ ඇස්. බලා සිටීම. පසුව මෝල්ටාවේදී ආවරණය ඉවත් වුණා. එවිට දැකූ අහස මම තෝරාගත් අහසක් නොවෙයි; උස සිරකවුළුවකින් පෙනුණු කුඩා ආලෝක පටියක්. නමුත් පක්ෂියා අවසානයේ තම ඇස් කුමක් සඳහාද කියලා ඉගෙන ගත්තා. ඩුබායිහි දවසේ කුඩා විස්තර පවා ශරීරය පුහුණු කළා. බස් එකේ එකම වේලාව, ආරක්ෂක ගේට්ටුව, සේවක පෝළිම, යුනිෆෝම් මාරු කිරීම, රේඩියෝවෙන් කෙටි පණිවුඩ, යන්ත්‍රයක් වැඩ නොකළ විට පසුබිමේ දුවන තාක්ෂණිකයන්, අමුත්තන්ට නොපෙනෙන කාමරවලින් සතුටේ වේදිකාව පාලනය කිරීම. සතුට කියන දෙය එතැන හුදෙක් හැඟීමක් නොවෙයි; එය කේබල්, විදුලි, කාලසටහන්, පිරිසිදු ඇඳුම්, කෑම කාඩ්, බස් වේලාව, නිවැරදිව ආරම්භ වන ශබ්ද පද්ධතිය, සහ නිවැරදි මොහොතේ දල්වන ආලෝකවලින් සෑදුණු පද්ධතියක්. මගේ ශරීරය ඒ පද්ධතියට ගැළපුණා. එය මාව ශක්තිමත් කළා. නමුත් පද්ධතියක් ඔබව දරාගෙන යන විට, ඔබේ ඇතුළේ නිහඬව බලා සිටින මනසට කතා කිරීමට අවශ්‍ය වේදිකාව නිතර නොලැබේ. ඒ නිසා ඩුබායි මට ආහාර, වැඩ, විනය, නම නැවත තෝරාගැනීම, සහ ශරීරයේ විශ්වාසය දුන්නත්, මගේ සම්පූර්ණ අවදිවීම එතැන සිදු නොවුණා. එය පසුවට තබා තිබුණා.  තවද, එතැන මම සේවය කියන වචනයේ තාක්ෂණික පැත්ත දැනගත්තා. අමුත්තන් සිනාසෙන විට, ඔවුන් පිටුපස ඇති කේබල්, සර්වර්, කැමරා, ශබ්ද පද්ධති, ආලෝක පාලන, සියල්ල නිවැරදිව ක්‍රියා කළ යුතුයි. සතුට පෙනෙන්නේ මෘදු දෙයක් වගේ, නමුත් එය පවත්වාගෙන යාමට දැඩි විනයක් අවශ්‍යයි. ඩුබායි මට ඒ විනය ශරීරයට දුන්නා.","පළමු කොටස — දූතයා"]},{"number":19,"title":"බන්ක් ඇඳ සහ දියඇල්ල","paragraphs":["මිතුරෙකුගෙන් මෝල්ටාව ගැන අසා මම ඔන්ලයින් අයදුම් කර පිරිනැමීමක් ලැබුවා. වැටුප විශාල නැහැ, රට කුඩායි, භාෂාව අලුත්යි. නමුත් ඩුබායිට පසුව යුරෝපය කියන වචනයම ප්‍රගතියක් වගේ ඇසුණා. මෝල්ටාවේ නව ජීවිතය ආරම්භ කර දින විස්සක් ඇතුළත මාව සේවයෙන් ඉවත් කළා. ගිවිසුම සරලව අවසන් වුණා. උත්සවයක් නැහැ, පැහැදිලි කිරීමක් නැහැ, අනතුරු ඇඟවීමක් නැහැ. ගල්ෆ් බිය ශාරීරික පහරක් වගේ මට වැදුණා. විදේශ රටක රැකියාවක් නැති මිනිසෙක්, වීසා ලෝකයේ රටක් නැති මිනිසෙක්. මනසට පෙර ශරීරය එය දැනගන්නවා. හදවත වෙනස්, උරහිස් තද, දවස් සහ මුදල් ගණන් කිරීම නැවත ආරම්භ.","• • •","මෝල්ටාව කාල යන්ත්‍රයක් ආපස්සට යනවා වගේ ආවා. ඩුබායි අනාගතයට වසර විස්සක් වගේ; මෝල්ටාව ශ්‍රී ලංකාවටත් වසර විස්සක් පසුපසින් වගේ. පටු වීදි, පැරණි වාහන, උණුසුම් පාන් පැහැති ගල් ගොඩනැගිලි, ඉක්මන් නොවන මිනිසුන්. රෝහලේ කුඩා සහතිකයකට පැය තුනක් පෝලිමේ සිටීම, ඉණිමඟ දරාගෙන යාම, වෙලාවට නොඑන බස් එක බලා සිටීම, ඇප් එකක් වෙනුවට කටින් කතා කිරීම. ඩුබායි පහසුවෙන් පුහුණු වූ ශරීරය මේ සියල්ලට විරුද්ධ වුණා. එය ස්වයංක්‍රීයතාවය, නොමිලේ කෑම, පද්ධතියකින් දරාගෙන යාම ඉල්ලුවා. මෝල්ටාව එය ප්‍රතික්ෂේප කළා. මෝල්ටාව ශරීරය මන්දගාමී කළා.","• • •","පසුව මම ක්‍රොඒෂියාවට ගියා. එතැන යමක් වෙනස් වුණා. කතාරය ජීවත්වීම සඳහා. ඩුබායි ආදායම සඳහා. මෝල්ටාව නැවත ජීවත්වීම සඳහා. ක්‍රොඒෂියාව පළමු වරට සරලව පවතින්න ගත් ගමනක්. උපයන්න නොවෙයි, පලා යන්න නොවෙයි, කෙනෙකු හෝ රැකියාවක් පසුපස නොවෙයි. ඇවිදින්න. තෙත් මැටි සහ පයින් සුවඳ ඇති ගැඹුරු වනාන්තර, මුහුණට වතුර බිඳු වැටුණු දියඇලි, සෙමින් නිහඬ වන මනස. එය නිවාඩුවක් පමණක් නොවෙයි. මගේ මනසට පවතින්න ඉඩ ලැබුණු පළමු අවස්ථාවක්.","• • •","මෝල්ටාවට ආපසු පැමිණි විට ජීවත්වීමේ බර දොර අසල බලා සිටියා. දියඇල්ලේ හැඟීම දවස් කිහිපයක් පමණයි. පසුව බිල්, වීසා, කාමරය, රැකියාව. රම් අලාම් මට ජීව රේඛාවක් දැම්මා: ඩුබායිට ආපසු යන්න එපා, මගේ කාමරයට එන්න, ඉන්දියානු තිදෙනෙකු සමඟ ජීවත් වෙනවා, බන්ක් ඇඳක් ගන්න, මාසයකට යුරෝ දෙසිය පනහක් ගෙවන්න, අපි බලමු. මම එකඟ වුණා. එම එකඟ වීමෙන් මම ශබ්ද ඇති, ශරීර ඇති, පුද්ගලික නිහඬතාවය අඩු තවත් කුඩා කාමරයකට ඇතුල් වුණා.","• • •","බන්ක් ඇඳ මට නවාතැන් දුන්නා, නමුත් මාව අවදි කළේ නැහැ. ජිම් අඩු වුණා. කියවීම අඩු වුණා. විනය, බිත්තියකින් තීන්ත කැබලි වැටෙන ආකාරයට, කුඩා පුරුද්දෙන් කුඩා පුරුද්දට ගැලවුණා. ජීවිතය අභියෝගයක් දෙනවා. මුහුණ දුන්නොත් ඔබ මාර්ගයේ ඊළඟ කොටසට යනවා. මගහැරියොත් ඔබ කැටි වෙනවා. මම කැටි වුණා. බන්ක් ඇඳේදී මම අසන්න කැමති නොවූ නිසා, මට වඩා නිහඬ තැනකට යවනු ලැබිය යුතු වුණා. එක ඇඳක්, එක මිනිසෙක්, එක කවුළුවක්, සුළඟේ එක දිශාවක්. එතැන බලා සිටින්නාගේ හඬ නොසලකා හැරිය නොහැකි වුණා. මෝල්ටාවේ බන්ක් ඇඳ මට අමුතු පාඩමක් දුන්නා. මිනිසෙකුට ඇඳක් තිබිය හැකියි, කාමරයක් තිබිය හැකියි, මිතුරන් තිබිය හැකියි, කුලිය ගෙවීමට තාවකාලික ක්‍රමයක් තිබිය හැකියි, නමුත් ඔහු ඇතුළේ තවමත් කඩා වැටෙමින් සිටිය හැකියි. දියඇල්ල ඉදිරියේ නිහඬ වූ මනස, කාමරයේ ශබ්දයට නැවත අතුරුදන් වුණා. මම මටම කියාගත්තේ මෙය තාවකාලිකයි, මම නැවත ගොඩනැඟෙයි කියලා. නමුත් සත්‍යය නම්, මම බොහෝ විට තාවකාලික දේවල් තුළ සදාකාලිකව නිදාගන්න පුරුදු වී තිබුණා. බන්ක් ඇඳේ උඩ හෝ පහළ නිදාගන්නා ශරීරයට සෙල් දහතුනේ තනි ඇඳ තවම පෙනුණේ නැහැ. නමුත් ඒ තනි ඇඳ, මාව අවදි කිරීමට සූදානම් වෙමින් තිබුණා.","පළමු කොටස — දූතයා"]},{"number":20,"title":"අශ්වයා සහ සවාරිකරු","paragraphs":["සිරකුටියට පෙර, නිහඬතාවයට පෙර, මම මගේම සමේ ගොඩනැගිල්ල විසින් පාලනය වූ මිනිසෙක්. දැන් මම එය ශරීර ආදරය කියලා හඳුන්වනවා. උදේ ජිම් එකේ පොම්පය, දහවල ශාරීරික වැඩේ උණුසුම, කෑම රස, සවස සම්බන්ධතාවයක ඇදීම, රාත්‍රී නින්දේ නිදහස් වීම. මගේ ජීවිතය ශරීරය පසුපස හඹා ගිය සංවේදන මාලාවක්. මම එයට ජීවිතය කියා තිබුණා. මම බලවත් අශ්වයෙකු පදවන මිනිසෙකු වගේ සිතුවත්, සත්‍යය නම් මම සවාරිකරු නොවෙයි. මම අශ්වයාම. ස්වභාවය, ආශාව, ශරීරය ඊළඟට කැමති දෙය විසින් පාලනය වූ අශ්වයා. පාලම් අල්ලාගත යුතු මනස බොහෝ දුර පසුපසින් සිටියා.","• • •","කඩා වැටීම ආරම්භ වුණේ 2024 මාර්තු දහසය වැනිදා, දහවල් දෙකයි තිහට. මම සිටි සම්බන්ධතාවයේ යමක් වැරදි බව සැක කරමින් සිටියා. ශරීරය සති ගණනක් සලකුණු නොසලකා හැර තිබුණා, මොකද ශරීරයට දැනගන්න අවශ්‍ය නැහැ. එදා මම සත්‍යය සෙවීමට ගියා. මෝස්ටාහි MCAST රථගාලේ ඇය වෙනත් මිනිසෙකු සමඟ සිටිනවා මම දැක්කා. ඔහුව J ලෙස හඳුන්වන්නම්. මේ අධ්‍යායයේ තේරුම ඔහු නොවෙයි. මම ඔවුන් දැක්කාම මගේ ඇතුළේ සිදුවූ දෙයයි. හදවත, හුස්ම, ඇස් — දෙමළේ යෙක්කම් කියන, ලාලසාව, දුක, ශරීරයට නවත්වන්න බැරි ඉල්ලීම — සියල්ල එකවර ඇය වෙත මාව තල්ලු කළා.","• • •","මට ඉවතට ඇවිද යාමට සන්සුන්කම තිබුණේ නැහැ. මාව නවත්වන්න තරම් බලා සිටින්නා ශක්තිමත් නොවුණා. මම මගේ කැඩුණු සත්ව-ස්වයං සමඟ ඇය වෙත ගියා. එම මොහොතෙන් පසුව ශරීරය මගේම සතුරා වුණා. එය තවමත් ඇදගෙන ගියා, පැහැදිලි කිරීමක් ඉල්ලුවා, ආදරය කියා තමා හඳුන්වූ දෙය අල්ලාගෙන සිටියා. නමුත් මනස සෙමින් දැනගන්න පටන් ගත්තා: මේ අශ්වයා තමන්ම පදවාගෙන යනවා. එය මාව ආරක්ෂිත තැනකට ගෙන යන්නේ නැහැ.","• • •","මාර්තු දහනව වැනිදා මම රුමේනියාවට ගුවන් ටිකට් එකක් වෙන් කළා. මටම කිව්වේ අමතක කිරීමට යනවා කියලා. සත්‍යය නම් මම පලා යමින් සිටියා. සීතල වාතය, ගල් දේවස්ථාන, මට අල්ලාගත නොහැකි භාෂාවක් කතා කළ මිනිසුන්. මම නගරවල ඇවිද්දා, කාෆේවල නිහඬව වාඩිවුණා, සිතීම නවත්වන්න උත්සාහ කළා. රටක් වෙනස් කළ පමණින් ශරීරය තම වේදනාව අතහැර දමන්නේ නැහැ. මෝල්ටාවට ආපසු එන මාර්ගය නැවත මාව එම ජීවිතයට ගෙන යමින් තිබුණා.","• • •","මැයි හය වැනි උදෑසන උණුසුම සහ සම්බන්ධතා කැඩීමක කලබලයක්. මගේ ඩුබායි සිම් එක අවසන් වී ලෝකයෙන් මාව කපා දැමුවා. බර සූට්කේස් දෙකක් පාරට ඇදගෙන ගොස්, ටැක්සි සොයා, නොලැබී, Wi-Fi සඳහා මුහම්මද් ඉන්ෂාගේ නිවසට නැවත ඇදගෙන ගියා. කමිසය දහඩියෙන් තෙත්. ශරීරය දැනටමත් කඩා වැටෙමින්. පසුව ගුවන් යානය, රෝමය, බැසීම, මෝල්ටාවේ ආලෝක පියාපත යටින් පෙනීම, රෝද පතිත වීම. කුඩා මෝල්ටා ගුවන් තොටුපොළේ කොරිඩෝරයක මගේ නම තිබූ කඩදාසියක් අතේ තබාගෙන මිනිසුන් දෙදෙනෙක් දැනටමත් සිටියා. සියල්ල සකස් කර තිබුණා. අශ්වයා තමන් උදෙසා උපන් අස්හලට දුවමින් සිටියා; සවාරිකරු තවම නිදාගෙන සිටියා. රුමේනියාව, ගුවන් ගමන්, බෑග්, සිම් නැතිවීම, සම්බන්ධතාවය බිඳීම, සත්‍යය සොයා ගොස් තමන්ම කැඩී යාම — මේ සියල්ල බාහිර සිදුවීම් වගේ පෙනුණත්, ඇතුළේ ඒවා ශරීරය සහ මනස අතර අවසාන ගැටුමේ කොටස්. ශරීරය තවමත් පලා යාමෙන් සුවය ලැබෙයි කියලා විශ්වාස කළා. මනස දැනටමත්, කිසිම රටක්, කිසිම ගුවන් ටිකට් එකක්, කිසිම සම්බන්ධතාවක්, කිසිම ජිම් පුරුද්දක් මෙම කැඩීමේ මූලය සුව නොකරන බව දැනගන්න පටන් ගෙන තිබුණා. මෝල්ටාවට බැසීම සාමාන්‍ය ගොඩබැසීමක් නොවුණා. එය අශ්වයාගේ අවසාන දුවීම. මගේ ශරීරය තවමත් තමන්ට පාලනය ඇතැයි සිතුවා. නමුත් දොර අසල සිටි මිනිසුන් දෙදෙනා, මට වඩා කලින්, මගේ ජීවිතයේ ඊළඟ අධ්‍යායය අතේ තබාගෙන සිටියා.  මම එදා තේරුම් නොගත් තවත් දෙයක් තිබුණා. සම්බන්ධතාවය කැඩීම මට හුදෙක් ආදර වේදනාවක් නොවෙයි; එය මගේ ශරීරය පාලනය කළ ලෝකය කඩා වැටීම. ශරීරය සතුට, ආශාව, සම්බන්ධතාවය, සැනසීම, නින්ද, ආහාර, ජිම්, යාම-ඒම යන සියල්ල එකට බැඳගෙන තිබුණා. ඒ බැඳීම කැඩුණු විට, මනසට පළමු වරට අශ්වයාගේ වේගය බියකරු ලෙස පෙනුණා.","දෙවන කොටස — කූඩුව"]},{"number":21,"title":"ඔයා අක්මල්ද?","paragraphs":["බිඳීම අධිකරණයකින් ආරම්භ වුණේ නැහැ. එය මෝල්ටා ගුවන් තොටුපොළේ, සාමාන්‍ය මධ්‍යම රාත්‍රියක, එක් ජීවිතයක් සහ ඊළඟ ජීවිතය අතර තිබූ අමුතු හිස් අවකාශයක ආරම්භ වුණා. ගුවන් යානය වෙනදා වගේම බැස්සා — රෝද බිමට වැදෙන කම්පනය, පසුව සෙමින් ගමන් කිරීම, කැබින් ආලෝක දැල්වීම, වටේ සිටි මිනිසුන් තම බෑග් ගන්න නැගිටීම. මම මහන්සිව සිටියා. ටැක්සි ගැන සිතුවා. යුරෝ පහළොවක් අතේ තබාගෙන මාව බලා සිටින සරස්වතී ගැන සිතුවා. ගෙදර ගොස් නාගෙන, පිරිසිදු වී, නිදාගැනීම ගැන සිතුවා. ශරීරයට අවශ්‍ය වුණේ ඉතා සරල දේවල්. ශරීරය තවම දැන සිටියේ නැහැ.","• • •","ඉමිග්‍රේෂන් වෙත යන කොරිඩෝරය හරහා මම ඇවිද ගියා. ගුවන් තොටුපොළේ හුරුපුරුදු සුවඳ තිබුණා — සිසිල් වාතය, පිරිසිදු කළ බිමේ සුවඳ, දිගු ගුවන් ගමන්වලින් එන මඳ බර සුවඳ, කෝපි යන්ත්‍රවල ලෝහමය උණුසුම. මගේ පියවර ප්‍රතිධ්වනි දුන්නා. පසුපස කොහේ හෝ දරුවෙකු අඬන හඬක්. ඉදිරියෙන් භාෂා කිහිපයකින් යන නිවේදනයක්. ලෝකය හුදෙක් ලෝකය ලෙසම පවතිමින් තිබුණා. ඒ සාමාන්‍ය ඇවිදීමේ මැද, සාමාන්‍ය ඇඳුම් ඇඳි මිනිසුන් දෙදෙනෙක් මා වෙතට ආවා. යුනිෆෝම් නැහැ. බැජ් පෙනෙන්නේ නැහැ. ඔවුන් මගේ නම ඇහුවා. ඔයා අක්මල්ද? ඒක පළමු වාක්‍යය. වචන දෙකක් සහ මගේ නම. මනස තීරණය කිරීමට පෙර ශරීරය පිළිතුරු දුන්නා. ඔව්.","• • •","ඔවුන් කඩදාසි ගෙන ආවා. මුල් පිටපත් නේපාලි භාෂාවෙන් තිබුණා, මගේ මුහුණ ඉක්මනින් බලලා මම නේපාලයෙන් කියා සිතූ නිසා. මම සන්සුන්ව මම ශ්‍රී ලංකාවෙන් බව කියා, ඉංග්‍රීසි පිටපත ඉල්ලුවා. එම මොහොතේ පවා — පාද යට බිම දැනටමත් අතුරුදන් වෙන්න පටන් ගෙන තිබුණත් — මගේ මනසේ කොටසක් තවමත් සාමාන්‍ය ලෙස හැසිරීමට උත්සාහ කළා. හොඳින් කියවන්න. සන්සුන්ව ඉන්න. ගෞරවයෙන් කතා කරන්න. මෙය වැරදීමක් විය යුතුයි. මිනිත්තු කිහිපයකින් පැහැදිලි වෙයි. ඔවුන් මට පාස්පෝට් එක ආපසු දී, මම පිටතට ගොස් සරස්වතී හමු වී, ටැක්සි ගෙවා, ගෙදර යයි. එහෙම තමයි මනස තවමත් තමන්ව රැකගන්න උත්සාහ කළේ.","ඔවුන් ඉංග්‍රීසි පිටපත මගේ අතට දුන්නා. මම කියවන්න පටන් ගත්තා. ඒ සමඟම මගේ ඇතුළේ යමක් අතුරුදන් වුණා. අදත් මට ඒකට හරි නමක් දාන්න බැහැ. ආත්මයද? අහංකාරයද? අහිංසකකමද? අනන්‍යතාවයද? ඒ වචන කිසිවක් සම්පූර්ණයෙන් ගැළපෙන්නේ නැහැ. මට දන්නේ එකයි: ඩුබායිහි ගුවන් යානයට නැඟුණු මගේ අනුවාදය, ඒ කඩදාසිය කියවීමෙන් පසු මගේ ශරීරය තුළ දිගටම ජීවත් වුණේ නැහැ. ඔහු තත්පර කිහිපයකින් මගේ ශරීරයෙන් වැටී ගියා, වැරදි ස්ථානයක දුම්රියෙන් බැස යන මගියෙකු වගේ. ඔහු ගියා. වෙනත් කෙනෙක් ඔහුගේ සපත්තු තුළ සිටගෙන, තමන් ගැන තමන් හඳුනා නොගත් වචන කියවමින් සිටියා.","මම මෙහි චෝදනාවේ වචන ලියන්නේ නැහැ. ඒවා මේ පොතේ අරමුණ නොවෙයි. ඒවා වෙනත් කතාබහකට, නීතිඥයා සමඟ වෙනත් කාමරයකට අයත් දේවල්. නමුත් මම මෙය කියන්න ඕන: ගුවන් තොටුපොළක, සිසිල් පොලිස් ලේඛනයක, ඔබ ගැන බරපතළ දෙයක් කියවන විට, ලෝකය ඔබ ගැන ඔබට ප්‍රවේශයක් නොතිබූ වාර්තා තබා ඇති බව ඔබ පළමු වරට තේරුම් ගන්නවා. ඔබ සිතූ ඔබට අමතරව, වෙනත් කෙනෙකුගේ ලියවිල්ලක ඔබේ තවත් අනුවාදයක් ජීවත් වෙනවා. ඒ කඩදාසි-අනුවාදය ඔබේ ජීවිතයට ඇවිත්, ඔබ සිතූ මිනිසාව වෙනුවට ඉඳගන්න පුළුවන්.","මගේ පාස්පෝට් එක ගත්තා. දුරකථනය ගත්තා. මගේ බඩුබාහිරාදිය ගත්තා. ශරීරය පරීක්ෂා කළා. මිනිත්තු පහකට පෙර මම ඇවිදිමින් සිටි ලෝකය, දැන් වසා ගිය දොරක අනෙක් පැත්තේ තිබුණා. එතෙක් මට ලෝකය විවෘත කළ පාස්පෝට් එක, එදා රාත්‍රියේ පද්ධතියක් තුළ මගේ නම තහවුරු කරන ලේඛනයක් බවට පත් වුණා. මගේ බෑග් තවදුරටත් ගමන් බඩු නොවුණා. ඒවා මගෙන් ඉවත් කරන ලද පරණ ජීවිතයේ කොටස් වගේ දැනුණා.","• • •","පසුව අනුපිළිවෙල සරලයි: ගුවන් තොටුපොළ පරීක්ෂාව. කියවීම. කඩදාසි. මම දුන් ඔව්. බෑග් ඉවත් කිරීම. වාහනය. ෆ්ලෝරියානා. බංකු. තීරණයක් බලා සිටීම. ඒ බංකුව සුවපහසුවට සාදා තිබුණේ නැහැ. එය බලා සිටීමටම සාදා තිබුණා. රෝමයේදී මාරු කරගත් යුරෝ හාරසිය තිහක් පමණ මගේ අතේ තිබුණා. ටැක්සි සහ පළමු සතියේ කෑම සඳහා සිතූ මුදල්, එකවර නීතිමය බිය ඉදිරියේ කුඩා ආරක්ෂාවක් බවට පත් වුණා. නීතිඥයෙකුගෙන් මිනිත්තු කිහිපයක් මිලදී ගැනීමට තමන්ම තමන්ට දෙන තාවකාලික ණයක් වගේ.","එදා බිය චෝදනාවේ කම්පනය පමණක් නොවෙයි. එය පැවැත්මේ බිය. සූදානම් නැති බවේ බිය. මගේ මනස මගේ ශරීරයට කියනවා වගේ දැනුණා: ඔයා මට කවදාවත් කාලය දුන්නේ නැහැ. ඔයා ශරීරය පෝෂණය කළා. ජිම් ගියා. වැටුප් උපයා ගත්තා. රටවල් හරහා ගියා. සම්බන්ධතා, ආහාර, නිදාගැනීම, යාම-ඒම, බඩුබාහිරාදිය — මේ සියල්ලට කාලය දුන්නා. නමුත් මාව පුහුණු කළේ නැහැ. දැන් මාව අවශ්‍ය වෙලා තියෙනවා, නමුත් මම තවම පුහුණු නොවූ මනසක්.","• • •","පසුව දෙවන වාහනය. මෝල්ටාවේ කුඩා රාත්‍රී වීදි. වසා තිබූ කඩ. කහ ගල් බිත්ති. පාවෝලා. වාහනයේ කවුළුවෙන් නගරය නිහඬව ගමන් කළා. නගරය නිහඬයි. ශබ්දය තිබුණේ මගේ ඇතුළේ පමණයි. පාවෝලා සිරගෙදර ලෝහ දොර සෙමින් විවෘත වීමට පටන් ගත්තා. එය සාමාන්‍ය දොරක් නොවෙයි. මගේ පරණ අනන්‍යතාවය සහ නව කූඩුව අතර දොරක්. “ඔයා අක්මල්ද?” කියන වාක්‍යය මගේ නම අහන ප්‍රශ්නයක් පමණක් නොවුණා. එය දොරක් වුණා. මම ඔව් කිව්වේ නමට. නමුත් ඒ ඔව් සමඟ, මම නොදැන, කඩදාසි, වාහන, බංකු, නීතිඥයන්, අංක, සහ පාවෝලා දොරට ඇතුල් වුණා. මිනිසෙකුගේ ජීවිතය සමහර විට දිගු කතාවකින් නොව, තම නමට දෙන කෙටි පිළිතුරකින් දෙකට බෙදී යනවා.","කාලය එහිදී මට හරියට මතක නැහැ. සමහර මොහොතක් දිගු වුණා. සමහරක් කෙටි වුණා. කඩදාසි කියවීමේදී වචන පැහැදිලිව පෙනුණත්, ඒවායේ අර්ථය ශරීරයට සෙමින් වැටුණා. මම තවමත් මෙය වැරදීමක් විය යුතුයි කියන සිතුවිල්ල අල්ලාගෙන සිටියා. මිනිසා තම ජීවිතය බිඳෙන මොහොතේ පවා සාමාන්‍ය ක්‍රම සොයනවා — පිටපත ඉල්ලීම, සන්සුන්ව කතා කිරීම, ගෞරවයෙන් හැසිරීම, තමන් නිවැරදි බව පෙන්වීම. ඒ සියල්ල මගේ පරණ පුහුණුව. නමුත් පද්ධතියට මගේ සන්සුන්කමෙන් වැඩක් නැහැ. එයට කඩදාසි, නම, අත්සන, ක්‍රියාවලිය අවශ්‍යයි.","ෆ්ලෝරියානා බංකුවේදී මම තේරුම් ගත්තා, බලා සිටීමත් දඬුවමක් විය හැකි බව. කිසිවෙක් ඔබට පහර නොදෙයි. කිසිවෙක් කෑගහන්නේ නැහැ. නමුත් ඔබේ ජීවිතය ගැන තීරණය කරන මිනිසුන් ඔබට වඩා ඉදිරියෙන් දේවල් දන්නවා. ඔබ පසුපසින්, බංකුවක, ඔබේම නම අල්ලාගෙන වාඩිවී සිටිනවා. එතැනින් කූඩුව ආරම්භ වුණා. දොර වසා දැමීමට පෙරම.","දෙවන කොටස — කූඩුව"]},{"number":22,"title":"සිරගෙදර පළමුව ඉවත් කළ දේ","paragraphs":["ඔවුන් මාව පාවෝලා සිරගෙදරට ගෙන ගියා. පාවෝලා නවීන ආයතනයක් වගේ දැනුණේ නැහැ. එය පැරණි වගේ දැනුණා. නවීන ගොඩනැගිලි පැරණි වීමට නොදන්නා ආකාරයකින් එහි ගල් පැරණි වුණා. බිත්තිවලින්, බිමෙන්, වාතයෙන්ම දශක ගණනාවක දුක් වේදනා හැම දිශාවකින්ම තද කරමින් තිබෙනවා වගේ. සමහර ගොඩනැගිලි තමන් තුළ සිදුවූ දේ තබාගන්නවා. පාවෝලා එවැනි තැනක්. පිටත කහ මෝල්ටා ගල් අමුත්තන්ට හා සංචාරකයන්ට පෙනුම මෘදු කළත්, ඇතුළ මෘදු වුණේ නැහැ.","• • •","ඇතුල් කිරීමේ ක්‍රියාවලිය ඔබව ඔබගෙන් කෑල්ලෙන් කෑල්ල ඉවත් කිරීමට සැලසුම් කර තිබෙනවා. නිලධාරීන් එය එහෙම දකිනවා කියලා මම හිතන්නේ නැහැ. ඔවුන්ට එය ක්‍රමවේදයක්, ලැයිස්තුවක්, දෛන
