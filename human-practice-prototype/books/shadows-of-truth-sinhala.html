 එයින් ඉගෙනගත්තා, වැඩුණා, පස්සේ ඒ වැඩසටහන අතහැරියා. අද මම භාවිතා කරන්නේ ඒකෙන් ඉගෙනගත් දේවල් පමණයි — ස්කෑන් කරන හැටි, ආරක්ෂා කරන හැටි, පද්ධතිය පිරිසිදුව තබන හැටි. 2003 වසරේ ඒ නිශ්චිත වැඩසටහන නැහැ. එය මට දුන් හැකියාව තවම ඉතිරිවෙලා තියෙනවා.","යටිසිතත් හරියට එහෙමයි.","ඔබේ යටිසිත ඔබේ පරණ ඇන්ටිවයිරස් වැඩසටහන වගේ. එය ඔබේ ළමා කාලයේ ගොඩනැඟුණා. ඒ කාලේ එය ප්‍රයෝජනවත්. ඔබේ පවුල, පාසල, ගම අතර කුඩා දරුවෙක් ලෙස ජීවත් වෙන්න උදව් කළ කුඩා ආරක්ෂණ දහස් ගණනක් එය ඉගෙනගත්තා. නමුත් ඔබ තවදුරටත් ඒ කුඩා දරුවා නොවෙයි. ඔබ සචේතන මනසක් ඇති වැඩිහිටි මනුෂ්‍යයෙක්. 2026 දීත් 2003 සොෆ්ට්වෙයාර් එකක් පවත්වාගෙන යන්න ඔබට ඕන නැහැ.","දැන් ඔබට අවශ්‍ය වෙන්නේ ඒ අවුරුදු වලින් ලැබුණු පාඩම, වැඩසටහනම නොවෙයි. ඔබ කන්න ඉගෙනගත් ආකාරයෙන් කන්න. ඇවිදින්න ඉගෙනගත් ආකාරයෙන් ඇවිදින්න. දුවන්න ඉගෙනගත් ආකාරයෙන් දුවන්න. කියවන්න ඉගෙනගත් ආකාරයෙන් කියවන්න. නමුත් පරණ ආරක්ෂක සොෆ්ට්වෙයාර් එක පසුබිමේ දිගටම ධාවනය වෙන්න ඉඩ දෙන්න එපා; ඔබේ වැඩිහිටි ජීවිතයේ සෑම අලුත් මොහොතක්ම තවමත් 1999 අවුරුද්දේ තිබුණු තර්ජනයක් වගේ ස්කෑන් කරන්න එයට ඉඩ දෙන්න එපා.","• • •","තවත් ගැඹුරු රූපය මෙන්න. බොහෝ මිනිසුන් “සැබෑ ලෝකය” කියලා කියන — තමන්ගේ ඇස් ඉදිරියේ තිබෙන ලෝකය — ඇත්තටම තමන්ගේම යටිසිතෙන් නිපදවන චලනය වන රූපයක් කියලා මම මෙහි දකිනවා. යටිසිතේ යටිසිත තමයි ඔබ ඉදිරියේ පෙනෙන තුන්වන ලෝකය. එය සෑම මොහොතකම වෙනස් වෙනවා.","තාත්තා පොහොසත් වෙනවා — රූපය වෙනස් වෙනවා.","අම්මා අසනීප වෙනවා — රූපය වෙනස් වෙනවා.","නගරාධිපති බලවත් වෙනවා — නගරය වෙනස් වෙනවා.","රට දියුණු වෙනවා — රට වෙනස් වෙනවා.","අවුරුදු සියයකට පෙර සම්පූර්ණයෙන් වෙනස්. අද සම්පූර්ණයෙන් වෙනස්.","සෑම දෙයක්ම මෙහෙම නිතර වෙනස් වෙද්දී, ඒ චලනයට අපි එන්ට්‍රොපිය කියනවා. එන්ට්‍රොපිය තමන්ම ආදරය දෙසටවත්, දෙවියන් දෙසටවත්, හොඳ දෙයක් දෙසටවත් යන්නේ නැහැ කියලා මම මෙහි කියනවා. එය ඔබ නැවත නැවත තෝරන දෙය දෙසට යනවා. ඔබ නැවත නැවත කියන “කුන්” දෙසට යනවා.","“වෙන්න” — එය වෙනවා. “වෙන්න” — එය වෙනවා. “වෙන්න” — එය වෙනවා. සෑම දිනකම කුඩා “වෙන්න” දහස් ගණනක්, බොහෝවිට නොදැනුවත්ව, ශරීරය පසුව ඇවිදින ලෝකය ගොඩනඟනවා.","ඒ නිසා සැලකිලිමත් වෙන්න. සැලකිලිමත් වෙන්න. ඔබ කියන වචනය ඔබ ජීවත් වන ලෝකය ගොඩනඟනවා. ඔබ යාවත්කාලීන නොකරන යටිසිත ඔබ වෙනුවෙන් තෝරාගෙන යනවා. දවසක ඔබ වටපිට බලලා “මම කොහොමද මෙතැනට ආවේ?” කියලා අහනවා. ඔබ මෙතැනට ආවේ, ඔබ නොබලා සිටි අතරේ පරණ ඇන්ටිවයිරස් එක තවමත් ධාවනය වෙමින් තිබුණු නිසා.","ආධ්‍යාත්මික මූලය · ප්‍රධාන අධ්‍යායය"]},{"number":47,"title":"එක් පැත්තක්ම ප්‍රමාණවත්","paragraphs":["මම කොහේ හරි අහපු කියමනක් තියෙනවා. ඒක මට හරි තැනට වැදුණා. වෛරය වෛරයෙන් මකා දාන්න බැහැ. වෛරය මකා දාන්න පුළුවන් ආදරයට පමණයි.","මේක තමයි නියමය කියලා මම දකිනවා. මෙය හැඟීමක් පමණක් නොවෙයි. මෙය ක්‍රියාකාරීත්වයක්. දෙන්නෙක් වෛරයට අහුවී සිටිනවා නම් — ඔබට රිදවූ කෙනාත්, ඔහුට හෝ ඇයට පිළිතුරු ලෙස වෛර කරන ඔබත් — දෙන්නාම එකම ගින්නට ඉන්ධන දාන තාක් තත්ත්වය ඉදිරියට යන්න බැහැ. වෛරයට වෛරය එකතු කළාම තවත් වෛරය ලැබෙනවා. හැම වෙලාවෙම. ව්‍යතිරේකයක් නැහැ. ඒක දර්ශනයක් නොවෙයි. වෛරයේ ස්වභාවය ඒකයි.","මේ චක්‍රය බිඳිය හැකි එකම දෙය ආදරයයි — ඒක බිඳින්න ආදරය එක් පැත්තකින් ඇතුල් වුණාම ප්‍රමාණවත්. ඔබ හෝ ඔබේ විරුද්ධ පාර්ශ්වය — දෙන්නාගෙන් එක්කෙනෙක් ආදරය තෝරන්න ඕන. දෙන්නාම නොවෙයි. එක්කෙනෙක් ප්‍රමාණවත්. මොකද ආදරය ගනුදෙනුවක් නොවෙයි. ආදරය නිදහස් කිරීමක්. එක් පුද්ගලයෙක් ගින්නට ඉන්ධන දාන එක නවත්තන මොහොතේ ගින්න මැරෙන්න පටන් ගන්නවා, අනෙක් කෙනා තවමත් ලී දානවා වුණත්.","• • •","අමාරු සම්බන්ධතාවයක් සෑම එකක් ඉදිරියටම විශ්වය තබන පරීක්ෂාව මේකයි කියලා මම දකිනවා. දෙවියන්ට මේ ලෝකයට ආදරය හෙළි කරන්න ඕන. මනුෂ්‍යයන් දෙදෙනෙකු අතර ඇති සෑම ගැටුමක්ම ඇතුළතින් බලන විට, ආදරය අහන ආරාධනාවක්: “ඔබ දෙන්නාගෙන් කවුද මුලින්ම වෛරය අතහැරීමට තරම් ධෛර්යවත්? මට ඇතුල් වෙන්න ඕන. ඔබ දෙන්නාගෙන් එක්කෙනෙක් දොර අරින්න ඕන.”","බොහෝ මිනිසුන් අනෙක් කෙනා දොර අරිනකම් බලා ඉන්නවා. “ඔහු මුලින් සමාව ඉල්ලන්න ඕන.” “ඇය තමන් වැරදි බව මුලින් පිළිගන්න ඕන.” “ඔහු මුලින් මගේ ළඟට එන්න ඕන.” මේක හැම තැනම දකින ස්ථාවරය. ඒ නිසා දොර අවුරුදු ගණනක් වහලා තියෙනවා; සමහරවිට දශක ගණනක්; සමහරවිට දෙන්නාගෙන් එක්කෙනෙක් මැරෙනකම්, එතකොට දොර සදහටම වැහෙනවා.","අවදි මනුෂ්‍යයා බලා ඉන්නේ නැහැ. ඔහු තමන්ගේ පැත්තෙන් දොර අරිනවා.","අනෙක් කෙනා ඒකට සුදුසු නිසා නොවෙයි. ආදරය ඒකට සුදුසු නිසාමත් නොවෙයි. ආදරයම මනුෂ්‍ය ශරීර හරහා මේ ලෝකයට ඇතුල් වෙන්න තෝරාගෙන තිබෙන නිසා, ඔබත් ආදරය තෝරාගත් ඒ ශරීරවලින් එකක්. අනෙක් පැත්ත ප්‍රතික්ෂේප කළත්, ඔබට තවමත් ආදරය දරාගෙන ඉන්න පුළුවන්.","සමහරවිට ඒ පුද්ගලයා මැරෙන දවස දක්වාම ආදරය තේරුම් නොගන්න පුළුවන්. එයට ඉඩ තියෙනවා. එක් පැත්තක ආදරය සැබෑවක් වෙලා රැඳෙන්න, දොර දෙපැත්තෙන්ම අරින එක අවශ්‍ය නැහැ.","• • •","ඔවුන්ගේ දොර මුද්‍රා වෙලා තියෙනවා නම් — ඔවුන්ට ආශීර්වාද කරන්න. ශාප කරන්න එපා.","ඔබට රිදවූ මිනිසුන්ට කිසිදා ශාප කරන්න එපා. ඔබේ හිටපු සහකරුට හෝ සහකාරියට ශාප කරන්න එපා. කිසිදා. අවදි නොවූ මනුෂ්‍යයා, තමන්ට රිදවූ කෙනා වෙත ළඟා වෙන්න බැරි වුණාම, ඔවුන්ට ශාප කරනවා. නාම දාලා හෙළා දකිනවා. නරක වෙන්න ප්‍රාර්ථනා කරනවා. ඔවුන්ගේ ජීවිතය අසාර්ථක වෙන්න බලාපොරොත්තු වෙනවා. ඔවුන් ගැන නරක දේවල් කියමින් තුවාලය විවෘතව තබාගන්නවා — ඔහු කියන සෑම ශාපයක්ම ඔවුන්ගේ ආත්මයට වඩා, ඔහුගේම ආත්මය තුළ තවත් ගැඹුරට කැටයම් වෙනවා.","ශාපය ඔවුන් මත වැටෙන්නේ නැහැ කියලා මම මෙහි කියනවා. ඒ ශාපය ඔබේම බඩ තුළ, ඔබේම ගින්න තුළ, ඔබේම යටිසිත තුළ අවුරුදු ගණනක් පිසෙමින් ඉන්නවා — ඔවුන් ඔබව අමතක කරලා බොහෝ කාලයක් ගිය පසුවත්. ඔබම කියපු ශාපයේ සිරකරුවා ඔබම වෙනවා. අවදි නොවූ මනුෂ්‍යයා තමන් ගැන තවදුරටත් සිතන්නේවත් නැති මිනිසුන්ට මුළු ජීවිතයම ශාප කරමින් ගත කරනවා. අවදි මනුෂ්‍යයා ඔවුන්ට එක වරක් ආශීර්වාද කරලා, ඔවුන්ව අතහැරලා, ඒ සවසම නිදහස් වෙනවා.","ඔවුන්ට ආශීර්වාද කරන්න. ඔබේම කාමරයේ තනිවම වුණත් නිහඬව මෙහෙම කියන්න: “ඔබට සාමය ලැබේවා. ඔබට සුවය ලැබේවා. ඔබ තවමත් ළඟා නොවූ අවදිවීම ඔබට ලැබේවා.” ඒ ආශීර්වාදය ඔවුන් වෙනුවෙන් පමණක් නොවෙයි. ඔවුන්ව තවදුරටත් ඔබ සමඟ රැගෙන යා යුතු අවශ්‍යතාවයෙන් ඔබව සුව කරන ඖෂධය ඒ ආශීර්වාදයයි. ඔබට රිදවූ කෙනාට ආශීර්වාද කරන විට, ඔබේම පපුව ඇතුළේ ඔවුන්ව රඳවාගෙන තිබුණු සිරකූඩුවෙන් අවසානයේ ඔවුන්ව නිදහස් කරනවා. ඔවුන් පිටතට යනවා. ඔබත් පිටතට යනවා.","• • •","දෙපැත්තෙන්ම කිසිවෙක් ආදරය තෝරන්නේ නැත්නම්, එන දේ එනවා. යන දේ යනවා. නොඑන දේ නොඑනවා. ඒක අවංක පිළිගැනීමක්. මේ ඉගැන්වීම සහතිකයක් නොවෙයි. ආරාධනාවක්. දෙපැත්තම ආදරය තෝරාගන්න ප්‍රතික්ෂේප කළොත්, තත්ත්වය තමන්ගේ ගමන යනවා. පැමිණීමට තිබුණු දේ පැමිණෙනවා. යාමට තිබුණු දේ යනවා. විශ්වය දොර බලෙන් අරින්නේ නැහැ. දෙන්නාගෙන් එක්කෙනෙක් එය අරිනකම් විශ්වය බලා ඉන්නවා.","ඒක දෙවියන්ගේ ඉවසීම කියලා මම මෙහි දකිනවා. ඒකම අවදි මනුෂ්‍යයාගේ ඉවසීමත්. වෙනත් කෙනෙකුට ආදරය තෝරන්න බල කරන්න ඔබට බැහැ. ඔබට කරන්න පුළුවන් ඔබම එය තෝරන එක පමණයි. ඊට පස්සේ සිදුවන දේ පිළිගන්න — මොකද තේරීමෙන් පසු සිදුවන දේ තවදුරටත් ඔබේ අතේ නැහැ.","ඔබේ වැඩේ තෝරන එක. ඉතිරිය විශ්වයේ වැඩේ."]},{"number":48,"title":"කෘතඥතාව උපයා ගන්න","paragraphs":["මෑතකදී නවීන විද්‍යාවත් “මැනිෆෙස්ටේෂන්” ව්‍යාපාරයත් කියන දෙයක් තියෙනවා — පිරිසිදු කෘතඥතාව ධනය ආකර්ෂණය කරනවා කියලා. මිනිසුන් ඒක අහලා වැරදි අගට පනිනවා. ධනය ලැබෙන්න කියලා ඔවුන් කෘතඥතාව රඟපාන්න පටන් ගන්නවා. ලැයිස්තුවක් හදනවා. උදේ විශ්වයට ස්තුතියි කියනවා. ඉන්පසු බහුලත්වය එනකම් බලාගෙන ඉන්නවා. එය ඉක්මනින් නොපැමිණියොත්, “මේ මැනිෆෙස්ටේෂන් එක වැඩ කරන්නේ නැහැ” කියනවා.","ඔවුන් අනුපිළිවෙළ පසුපසට හැරවලා තියෙන්නේ.","කෘතඥතාවේ උච්චතම අගය ධනය ඇතුළෙත් කාන්තාව ඇතුළෙත් සැඟවී තියෙනවා — ධනයත් කාන්තාවත් කෘතඥතාවම නිසා නොවෙයි, ඒවා ආදරය ගන්නා ස්වරූප නිසා. ධනය මේ ලෝකයේ ආදරය ගන්නා එක් ස්වරූපයක්. කාන්තාව තවත් එකක්. දෙකම මනුෂ්‍ය අත්දැකීම තුළට ආදරය පැමිණෙන ආකාර. අවදි නොවූ මිනිසා මුදල් පසුපස දුවනවා, ඒ තුළ සැඟවී ඇති ආදරය හඳුනාගන්නේ නැහැ. අවදි වූ මිනිසා ආදරයට ගෞරව කරනවා; එවිට මුදලත් ඒ ආදරය ගලා යාමට ඉඩ දෙන ආකාරයේ කොටසක් වෙනවා.","• • •","ඒ නිසා මිනිසුන් වැරදියට තේරුම් ගන්න දේ මෙන්න. කෘතඥතාව කියන්නේ ධනය ලබාගන්න උපක්‍රමයක් කියලා ඔවුන් හිතනවා. එය උපක්‍රමයක් නොවෙයි. කෘතඥතාව මෙවලමක් නොවෙයි. කෘතඥතාව අභ්‍යාසයක් — දිගු කාලයක් සැබෑවට අභ්‍යාස කළාම මිනිසා වෙනස් කරන විනයක්. වෙනස් වූ මිනිසාට ජීවිතය ඔහු වෙත දැනටමත් ගෙන එන දේවල් වඩා ස්වභාවිකව පිළිගන්න පුළුවන් වෙනවා.","කෘතඥතාව රඟපාන්න එපා. එය උපයාගන්න. හැම දවසකම. අභ්‍යාසයෙන්.","පොඩියෙන් පටන් ගන්න. ඔබේම ශරීරය ඇතුළෙන් පටන් ගන්න. ඔබ පාලනය නොකළ හුස්ම ගැන කෘතඥ වෙන්න — ඔබ උපන් දවසේ සිට ඔබේ අවසරයක් නැතිවම දිගටම ගිය හුස්ම. කුඩා කැපුමක් වුණාම තමන්ම වැසෙන ඔබේ සම ගැන කෘතඥ වෙන්න. ඔබේ මුළු ජීවිතය පුරාම ඔබේ අධීක්ෂණය නැතිවම සෑම මිනිත්තුවකම තැටූ ඔබේ හදවත ගැන කෘතඥ වෙන්න. ස්තුතියක් නැතිව, ගෙවීමක් නැතිව, අත්පොළසන් නැතිව, මේ මොහොතේම ඔබේ ශරීරය කරන කුඩා අශ්චර්යයන් ගැන කෘතඥ වෙන්න.","ඊට පස්සේ පිටතට යන්න. ඔබ වටා ඉන්න මිනිසුන් ගැන කෘතඥ වෙන්න. නොදන්නා අයගේ කරුණාව. මේසය මත ඇති ආහාරය. ටැප් එකෙන් එන වතුර. ඔබ පාරේ යනකොට පසුකර යන සතුන්. ඔබ ඇතුළට හුස්ම ගන්න දේ පිටතට නිකුත් කරන ගස්. ඔබ කන ආහාරයට පරාගණය කරන කෘමීන්. වහලය මත ඇති පැළෑටි. ඔබට කිසිවක් නොතිබූ වෙලාවේ ඔබට කෑම දුන් ආච්චි.","ඒකයි අභ්‍යාසය. ලැයිස්තුවක් නොවෙයි. ඔබේ උත්සාහයකින් තොරවම ඔබේ ජීවිතයට දැනටමත් පැමිණෙමින් තිබෙන දේවල් දිනපතා, සෙමින්, සැබෑවට හඳුනාගැනීම.","• • •","මෙහෙම කෘතඥතාව අභ්‍යාස කරනකොට — සෙමින්, හැම දවසකම, ඒක මෙවලමක් වගේ භාවිත කරන්න උත්සාහ නොකර — මතුපිටින් “මැනිෆෙස්ටේෂන්” ගැන කතා කරන අය බොහෝවිට නොකියන දෙයක් සිද්ධ වෙනවා.","අභ්‍යාසයම ඔබව වෙනස් කරනවා. එය ඔබව තුන්වන මට්ටමෙන් — ශරීරය, අසචේතන තට්ටුව — දෙවන මට්ටම වූ ගණනය කරන උපසචේතනය වෙතත්, එතැනින් පළමු මට්ටම වූ අවදි සචේතන මනස වෙතත් ගෙන යනවා. දිනපතා අභ්‍යාස කරන කෘතඥතාව මනස් තුන ඔස්සේ ඉහළට යන ඉණිමඟක් බවට පත්වෙනවා.","ඔබ සචේතන මට්ටමට — සිංහාසනයට, පයිනියල් ආසනයට, ආලෝකය වාසය කරන තැනට — පැමිණි පසු, දේවල් වඩා ස්වභාවිකව පිළිගන්න පටන් ගන්නවා. ඒ විශ්වය කෘතඥ මිනිසුන්ට ගෙවීම් කරන වෙන්ඩින් මැෂිමක් නිසා නොවෙයි. පැමිණෙන දේ බිඳ දමන්නේ නැතිව අල්ලාගෙන ඉන්න පුළුවන් කෙනා අවදි වූ මිනිසා නිසා. බොහෝ මිනිසුන්ට ධනය ලැබුණත් ඒක රඳවාගන්න බැහැ. ඒක ඔවුන්ව දූෂිත කරනවා. ඇබ්බැහි කරනවා. අසහනයෙන් පුරවනවා. අවදි වූ මිනිසා එය සැහැල්ලුවෙන් දරාගෙන, හොඳට භාවිත කරලා, නැවත ගලා යන්න ඉඩ දෙනවා. ඒ නිසා නාලිකාව විවෘතව තියෙනවා.","• • •","නමුත් අවදි වූ මිනිසෙකුත් කවදාහරි පාවෙලා යනවා. සමහර වෙලාවට උපසචේතනයත් සචේතන මනසත් අතර සම්බන්ධය කැඩෙනවා. නරක දවසක්. පාඩුවක්. ද්‍රෝහී වීමක්. භීතියක්. මොහොතකට ආලෝකය සිංහාසනයෙන් බැස යනවා, ශරීරය ආපහු ප්‍රතික්‍රියාවට වැටෙනවා. අවුරුද්දක් අවදිව හිටපු මිනිසා එක මොහොතක කෝපයෙන් කතා කරන්න පුළුවන්, මෝඩ වැඩක් කරන්න පුළුවන්, ඔහු ගොඩනඟමින් හිටපු දේ අහිමි කරගන්න පුළුවන්.","ඒකයි කඩා වැටීම. කඩා වැටීම සාමාන්‍යයි. එය මනුෂ්‍යයෙකු වීමේ කොටසක්. නබිවරුන්ටත් කඩා වැටුණු මොහොතවල් තිබුණා කියලා මේ පාඨයේ මම කියනවා. සූෆිවරුන්ටත් ආලෝකය මඳ වූ රෑ තිබුණා.","සත්‍යවාදී ප්‍රතිචාරය මෙහෙමයි — මේ දැන් සිද්ධ වුණේ මේකයි. මට ඒක සම්පූර්ණයෙන් තේරෙන්නේ නැහැ. මම නැවත හුස්ම වෙත යන්නම්. නැවත අභ්‍යාසය වෙත යන්නම්. මගේම නීති තියෙන ලාච්චුව නැවත අරිලා ආයෙත් පටන් ගන්නම්.","• • •","ඉන්පසු දිනපතා මතක් කරගන්න අනතුරු ඇඟවීම. ඔබ සිතන දේ ගැනත් කතා කරන දේ ගැනත් හැමවිටම අවධානයෙන් ඉන්න. සෑම වචනයක්ම කුන් ෆයාකුන්. සෑම සිතුවිල්ලක්ම කුන් ෆයාකුන්. ඒවා පරිස්සමින් තෝරන්න.","මට කතා කරන්න ආසයි. මට කතා කරන්න ආසයි.","ඒ පිළිගැනීම තවමත් එතැනම තියෙනවා. තමන් පරිපූර්ණයි කියලා රඟපාන ගුරුවරයාට උගන්වන්න බැහැ. තමන්ට කතා කරන්න ආස බව පිළිගෙන, ඒත් තමන්ගේ වචන පරිස්සමින් තෝරන්න උත්සාහ කරන ගුරුවරයාට ඕනෑම කෙනෙකුට යමක් උගන්වන්න පුළුවන්.","පසුකාලීන ආධ්‍යාත්මික මූලය · ඉගැන්වීමේ අධ්‍යායය"]},{"number":49,"title":"පාරේ ගල","paragraphs":["සැබෑ ජීවිතයේ කුඩා උදාහරණයක්. මම මේ දේ ඉගෙනගෙන තිබුණා, නමුත් බොහෝවිට එය අභ්‍යාස කළේ නැහැ. “බොහෝවිට කළේ නැහැ” කියනකොට, මම කිසිදා එය කළේ නැහැ කියන එක නොවෙයි. මම ඒක ප්‍රමාණවත් තරම් නිතර කළේ නැහැ කියන එකයි. මම දෙවියන් නොවෙයි. මම පරිපූර්ණත්වයක් කියා නොකියනවා. මම දේවල් ඉගෙනගත්, ඒවා අනුව ජීවත් වෙන්න උත්සාහ කළ, සමහර වෙලාවට අසාර්ථක වූ මිනිසෙක්.","මම ඉගෙනගත් දේ සරලයි. ඔබ පාරේ යනකොට තවත් කෙනෙකුට හානියක් වෙන්න පුළුවන් දෙයක් දැක්කාම — පාරේ ගලක්, තියුණු දෙයක්, වයසක කෙනෙක් වැටෙන්න හෝ සතෙක් කැපෙන්න පුළුවන් දෙයක් — ඒක අරගෙන පැත්තකට දාන්න. පාරට අවශ්‍ය කුඩා කරුණාව ඔබ වෙන්න. කෙනෙක් බලනවා නිසා නොවෙයි. ස්වර්ගයේ ත්‍යාගයක් ලැබෙනවා කියලා නොවෙයි. මනුෂ්‍යයෙකුගේ කාර්යය ඒ නිසා.","• • •","මේක අභ්‍යාස කරන්න පටන් ගත් පළමු සතියේ, මම පාරවල් වල යද්දී හැමතැනම ගල් පේන්න පටන් ගත්තා. උපසචේතනය වහාම ගණනය කරන්න පටන් ගත්තා. මම මොන ගල අරගන්නද? මේකද? අරකද? ලොකු එකද? පොඩි එකද? බොහොම ගල් තියෙනවා. මට ඒ හැම එකක්ම අරගන්න බැහැ. එකක් විතරක් අරගෙන මොන ප්‍රයෝජනයක්ද?","අසාර්ථක වීමේ පළමු අදියර ඒකයි. මනස ගණනය කරන්න පටන් ගන්නකොට, ක්‍රියාවෙන් තමන්ව ඉවත් කරගන්න කතාවත් ඒ වෙලාවේම පටන් ගන්නවා. “ඒ ගල අරගන්න” කියන පළමු පිරිසිදු ආවේගය ගණිතය යටට වැළලෙනවා.","ඊට පස්සේ වයස වැඩි වෙද්දී දෙවැනි හඬක් එනවා. ලැජ්ජාවේ හඬ. මම ගලක් අරගන්න නැමෙනවා කෙනෙක් දැක්කොත් මොනවා හිතයිද? කෙනෙක් දකීවි. මාව අමුතු කෙනෙක් කියලා හිතයි. වෙන කෙනෙක් කරයි. ඒකයි දෙවැනි අදියර. කුඩා කාලයේ නිදහසේ නැමී ගලක් පැත්තකට දාන්න පුළුවන් ශරීරය, දැන් සමාජ බියෙන් ගල එතැනම තබා යන්න පුහුණු කරලා.","ඊට පස්සේ තුන්වැනි අදියර එනවා. මේක තමයි නරකම එක. ඔබ ඔබටම කියන්න පටන් ගන්නවා — මේකට පද්ධතියක් තියෙනවා. පාරවල් පිරිසිදු කරන්න කෙනෙක් පත් කරලා ඇති. නගර සභාව. සේවකයෝ. ඒක ඔවුන්ගේ රැකියාව. ඒ නිසා තමයි ඔවුන්ව ගත්තේ. ඒ නිසා තමයි මගේ බදු මුදල් යන්නේ. මම මෙහි වැඩ කරලා මුදල් ගෙවන්නේ මේ වගේ දේවල් පද්ධතියට බලාගන්න කියලා.","ඒ තුන්වැනි අදියරේදී, මේ ලෝකයේ ශරීරයක් ලෙස සිටීමේ මුළු අරමුණම නැතිවෙලා යනවා.","• • •","ශරීරය තියෙන්නේ මොකටද කියලා ඔබ අමතක කළා.","ඔබ පද්ධතියකට මුදල් ගෙවන සේවකයෙක් විතරක් නොවන බව අමතක කළා. ඔබ යන පාරට ප්‍රයෝජනවත් වෙන්න දෙවියන් විසින් ලබා දුන් ශරීරයක්ද ඔබ. ඔබ ඉදිරියේ තියෙන ගල නගර සභාවේ ප්‍රශ්නයක් විතරක් නොවෙයි. ඔබ ඉදිරියේ තියෙන ගල, ජීවත්වීමේ කාර්යයෙන් ඔබට ලැබුණු කුඩා කොටස. පද්ධතිය සමගාමීව ක්‍රියාකරන සැලැස්මක්. ඒක ඔබේ වගකීම මකා දමන්නේ නැහැ. ඔබට ළඟා වෙන්න බැරි ගල් ඒක බලාගන්නවා. ඔබ ඉදිරියේම තිබුණු එක ඔබට ලැබුණු වැඩ කොටස.","මිනිසා තමන්ගේ කුඩා කොටස කරන්නේ නැති වුණාම — ගණනය කරන නිසා, ලැජ්ජා වෙන නිසා, පද්ධතියටම භාර දෙන නිසා — ඔහු ඉල්ලපු නැති දේවල් පද්ධතිය ඔහුට දෙන්න පටන් ගන්නවා. ඔහු ත්‍යාග කියලා හෝ දඬුවම් කියලා හඳුනාගන්නෙත් නැති දේවල්. සරලවම දේවල්. එවිට ඔහු නිෂ්ක්‍රීයව ලබන කෙනෙක් බවට පත්වෙලා, තමන්ගේ දවස් අතරින් පාවෙමින්, තමන්ගේ මරණය දිහා සෙමින් වැටෙමින් යනවා. ආත්මයට ලැබුණු ශරීරය, පද්ධතියට කරන්න බැරි මේ කුඩා ක්‍රියා කරන්න ලබාදුන් මෙවලම බව ඔහු කවදාවත් තේරුම් ගන්නේ නැහැ.","• • •","මනුෂ්‍ය වර්ගයා වැරදි මඟට යන සරලම ක්‍රමය මේකයි. මහත් කුමන්ත්‍රණයකින් නොවෙයි. සැඟවුණු පාලකයෙකුගෙන් නොවෙයි. පාරේ ගල ගැන දිනපතා සිදුවන කුඩා අමතකවීම්වලින්. නැමෙන්නට නොකියා කරන දහස් ගණන් කුඩා ප්‍රතික්ෂේපවලින්. කකුලකින් කටුවක් ඉවත් කරන්න තරම් දයාබර වූ, ගවයෙකු පිටුපසට ගලක් නොදමන්න තරම් සැලකිලිමත් වූ පිරිමි ළමයා සෙමින් සෙමින් මැකී යාමෙන්.","ඔහු වැඩිහිටියෙක් වෙනවා. ගල පසුකර යන මිනිසා වෙනවා. බදු ගෙවනවා. පද්ධතිය විශ්වාස කරනවා. ගෙදර යනවා. නිදාගන්නවා. මිය යනවා.","එතකොටත් ඔහු තේරුම් ගත්තේ නැහැ — මනුෂ්‍ය වර්ගයා එළුවන් හා ගවයන් වගේ තමන්ගේ ස්වභාවික එන්ට්‍රොපිය තුළ නිවැරදිව ජීවත් වෙන සතුන් නොවන බව. ගවයකුට ගල අරගන්න ඕන නැහැ — ගවයා තමන්ගේ ස්වභාවික සැලැස්ම තුළ නිවැරදිව ජීවත් වෙනවා. එළුවා තමන්ගේ සැලැස්ම තුළ ජීවත් වෙනවා. ගසක් පවා තමන්ගේ සැලැස්ම තුළ නිවැරදිව ජීවත් වෙනවා. නමුත් මනුෂ්‍යයාට සචේතන මනස දීලා තියෙන්නේ, පිරිසිදු එන්ට්‍රොපියට ඉහළින් නැඟී අරමුණක් ඇතිව ක්‍රියා කරන්න පුළුවන් වෙන්න. පාරේ ගල තමයි පරීක්ෂණය. අවදි නොවූ මිනිසා පසුකර යනවා. අවදි වූ මිනිසා නැමෙනවා.","• • •","මේ ඉගැන්වීම පළමු වරට කියද්දී මම එය අවසන් කළේ නැහැ. දැන් අවසන් කරන්නම්.","මගේ ජීවිතයේ වැඩි කොටසක් මම ජීවත් වුණේ මගේ උපසචේතනය ඇතුළේ. කටාර් හරහා. ඩුබායි හරහා. මෝල්ටාව හරහා. හැම දවසකම ගල් පසුකරමින්, ඒවා නොදැක. ශරීරය ස්වයංක්‍රීයව ගමන් කළා. වැඩේ පාලනය කළේ උපසචේතනය. ගල් හැමතැනම තිබුණා, මම කොහෙවත් හිටියේ නැහැ.","ඊට පස්සේ සිරගෙදර. ඊට පස්සේ නිදහස. ඊට පස්සේ වසර දෙකක සෙමින් නැවත ගොඩනැඟීම — කියවීම, නිශ්චලව වාඩිවීම, ආයත් අධ්‍යයනය කිරීම, ඇස් පිහාටු පසුපස තැඹිලි ආලෝකය එන හැටි බලා සිටීම. වසර දෙකක අභ්‍යාසය.","ඊට පස්සේ ඉතා නිහඬ දෙයක් සිදු වුණා — මමම අසලින් පසුකර යන්න තරම් නිහඬ දෙයක්.","මම ගල් අරගන්න පටන් ගත්තා. පළමුව මගෙන්ම ප්‍රශ්න නොකර.","මෝල්ටාවේ පාරක මම ඇවිදගෙන යනවා. ගලක්, කැඩුණු වීදුරු කැබැල්ලක්, නැතිනම් පාරේ තියුණු දෙයක් දකිනවා. මගේ ශරීරය සරලව නැමී ඒක පැත්තකට දානවා. ගණනයක් නැහැ. ලැජ්ජාවක් නැහැ. ඇතුළේ විවාදයක් නැහැ. අත වැඩේ කරලා ඉවර කරනවා. කකුල් ශරීරය ඉදිරියට ගෙන යනවා. පසුව — සමහරවිට ගෙදරට ගියාම, සමහරවිට පැය ගණනකට පස්සේ — උපසචේතනය අවදිවෙලා අහනවා: “ඇයි ඔයා ඒක කළේ? කවුරුත් දැක්කේ නැහැ. කවුරුත් ස්තුති කළේ නැහැ. ඒක ඔයාගේ ප්‍රශ්නයක් නොවෙයි.”","මගේ අවදි වූ කොටස, මගේම ශරීරයේ අලුත් පදිංචිකරු, සෙමින් පිළිතුරු දෙනවා — “ඔව්. මම දන්නවා. ඒත් ඒක හොඳ වැඩක්. ඒ ඇති.”","• • •","මේකයි සංවාදය. අවදි වූ මිනිසෙකු ඇතුළේ සිද්ධ වෙන්නේ හරියටම මේකයි. උපසචේතනය තවමත් ජීවත්වෙනවා. තවමත් කතා කරනවා. එය මැරෙන්නේ නැහැ. නමුත් දැන් ශරීරය පාලනය කරන්නේ නැහැ. රියදුරු තැනින් මගී තැනට පහළ කරලා. පසුපස අසුනේ ඉඳගෙන තවමත් ප්‍රශ්න අහනවා. “ඇයි ඒක කළේ? ඇයි ඒ මුදල් වියදම් කළේ? ඇයි ඔව් කිව්වේ? ඇයි ඔයා තමන්ව ආරක්ෂා කරගත්තේ නැත්තේ?”","නමුත් දැන් රිය පදවන්නේ සචේතන මනස. සචේතන මනස හැම වෙලාවෙම සෙමින් පිළිතුරු දෙනවා — “ඔව්. මම ඔයා අහලා තියෙනවා. කමක් නැහැ. අපි හරි දේ කළා. බලගෙන ඉන්න.”","අභ්‍යාසයේ මුළු අරමුණ ඒකයි. උපසචේතනය නිහඬ කරලා දාන්න නොවෙයි. ඡන්දෙන් එය පරදවන්න. පරණ වැඩසටහන මරා දාන්න නොවෙයි. අලුත් වැඩසටහන වඩා ශක්තිමත් කරන්න.","• • •","මිනිසුන් හිතන්නේ අවදිවීම ඇස් වහගෙන ඉන්නකොට සිද්ධ වෙනවා කියලා. නිශ්චලව වාඩිවීම. භාවනා කිරීම. යාච්ඤා කිරීම. ඒක අඩක් සත්‍යයි. ඇස් වහන තැන පුහුණු පිටිය. සචේතන මනස ගොඩනගන්නේ එතැන.","නමුත් අවදිවීමේ සාක්ෂිය පේන්නේ ඔබ ඇස් අරිනකොට.","ශරීරයට තවමත් ඇස් ඇරගෙන ලෝකය තුළින් යන්න වෙනවා. ඇස් වහගෙන ජීවත් වෙන්න බැහැ. ඒ නිසා ඇස් වසා නිශ්චලතාව තුළ ගොඩනැගුණු සචේතන මනස, ඇස් ඇරෙනකොටත් ඔබ සමඟ එන්න ඕන. ඇස් ඇරුණු ලෝකය තුළින් ශරීරයට මඟ පෙන්වන්න ඕන. මොන ගල අරගන්නද, මොන සංවාදයට ඇතුල් වෙන්නද, මොන ආහාරය කන්නද, මොන ඇමතුමට පිළිතුරු දෙන්නද, මොන නිශ්ශබ්දතාව තබාගන්නද කියලා තීරණය කරන්න ඕන.","කොහෙට යන්නද, කොහොම යන්නද, මොනවා කරන්නද කියලා ඇස් තීරණය කරන්න දෙන්න. නමුත් ඒ ඇස් නිදා සිටින උපසචේතනයේ ඇස් නොව, අවදි වූ සචේතනයේ ඇස් වෙන්න ඕන.","එකම ඇස්. වෙනස් රියදුරෙක්.","ආසයි නේද? හැම ආකාරයක පණිවිඩයක්ම ටිකකින් රසවත් වෙනවා.","පසුකාලීන ආධ්‍යාත්මික මූලය · ඉගැන්වීමේ අධ්‍යායය"]},{"number":50,"title":"මල් පිපීමට පෙර","paragraphs":["මම රිය පදවමින් හිටියා. පිස්සු විදිහට නොවෙයි — සාමාන්‍ය විදිහට, මෝල්ටාවේ සාමාන්‍ය අධිවේගී මාර්ගයක. ඒ සාමාන්‍ය ගමන ඇතුළේ, කලින් නිදා සිටි රියදුරා මට කිසිදා පෙන්වන්නේ නැති දේවල් මගේ අවදි වූ ඇස් දැකගන්න පටන් ගත්තා.","පාරේ තියෙන්න නොයුතු කුඩා සුන්බුන් කැබැල්ලක් මම දැක්කා. මට ආපු හැඟීම පරණ නිදා සිටි හැඟීම නොවෙයි. අලුත් දෙයක්. දුකක්. කෙනෙක් ඒක අරගෙන නැති එක ගැන ඇති වූ කුඩා, සැබෑ දුකක්. “කරුණාකර — ඔබ කවුරු වුණත් — මේ දේවල් එකතු කරන්න.” පාර වෙනුවෙන්, පද්ධතියේ කවුරුහරි වෙත, සෙමින් කතා කරන අවදි වූ මනස.","මේකත් ගලේ ඉගැන්වීමමයි — නමුත් දැන් ඇවිදින ශරීරයකින් නොව, ගමන් කරන වාහනයකින්. ඔබ වේගයෙන් යන නිසා නැමී ඒක අරගන්න බැහැ. නමුත් දැකගන්න තවමත් පුළුවන්. ඒ දැකීමම අභ්‍යාසයේ කොටසක්. හැම ගලක්ම අරගන්න ඔබට බැහැ. නමුත් කිසිම දෙයක් නොදැක පසුකර යන මිනිසා වෙලා ඉන්න එක නවත්වන්න පුළුවන්. දැකීම අවදිවීමේ පළමු අඩයි.","ශරීරයට පුළුවන් වෙලාවේ එය නැමෙනවා. ඇස් හැමවිටම දැකගන්නවා.","• • •","ඊට පස්සේ — තවමත් රිය පදවමින් — මගේ ඇස් තවත් දෙයක් සොයාගත්තා.","අප්‍රේල් එන්න ළඟයි. මෝල්ටාවේ අප්‍රේල් ගැන හිතනකොට බොහෝ මිනිසුන්ට මතක් වෙන්නේ මල්. පිපීම. පාට. පෙති. කහ පාට පිට්ටනියක හෝ රතු පොපි මල් පිට්ටනියක ඉන්ස්ටග්‍රෑම් ඡායාරූපය. නිදා සිටින ඇස අප්‍රේල් මාසයේ දකින දේ ඒකයි. එය මල් පිපෙන මොහොත බලාගෙන ඉන්නවා.","නමුත් අවදි වූ ඇස මල් පිපීමට පෙර සිදුවන දේ දකිනවා. මල් එන්න කලින් කොළ පැහැය ගැඹුරු වෙනවා. කොළයක් ඇතුළේ තියෙන දීප්තිය තවත් පැහැදිලි වෙනවා. පාට පැමිණීමට පෙර සතිවලදී මුළු භූ දර්ශනයම නිහඬව සූදානම් වෙමින් ඉන්නවා — අවදි වූ ඇසකට විතරක් හඳුනාගන්න පුළුවන් තරම් දීප්තිමත් කොළ පැහැයකින්. බිම සූදානම් වෙනවා. මල් තවමත් ඇවිත් නැහැ. නමුත් බිම ඒ මල් සඳහා පෙර පුහුණුවක් කරනවා වගේ.","බොහෝ මිනිසුන් මේක අතහැර දානවා. ඔවුන් මල් පිපෙනකම් බලාගෙන ඉන්නවා. මල් පිපීම ඡායාරූප ගන්නවා. මල් පිපීම සමරනවා.","ඊට පස්සේ ගිම්හානය එනකොට, කොළ පැහැය වියළෙනවා, පාට මැකෙනවා, බිම දුඹුරු වෙනවා — ඔවුන් ඇස් අහකට හරවනවා. කලින් ආදරයෙන් බැලූ ඒම ඉඩමම අමතක කරනවා. ඊළඟ අප්‍රේල් වෙනකම් බලාගෙන ඉන්නවා. අතර කාලය අමතක කරනවා.","• • •","නමුත් මම — බලා සිටින්නා — ඒම බිම වියළි සමයේදී අමතක කරන්නේ නැහැ. මම ඒ දිහා දිගටම බලනවා.","මල් පිපීමට පෙර ඇති කොළ පැහැයත්, මල් පිපීමෙන් පසු ඇති වියළි කාලයත් වෙන වෙනම ඉඩම් දෙකක් නොවන බව මට තේරෙන නිසා. ඒ එකම බිම, වෙනස් හුස්ම දෙකක. මල් පිපුණු බිම නැවතත් පිපේවි. දැන් වියළිව ඇති බිම මිය යන්නේ නැහැ. එය විවේක ගන්නවා. ඊළඟ සමය බලාගෙන ඉන්නවා. චක්‍රය කැඩී නැහැ. ඒ බිම් කැබැල්ලේ මුළු ජීවිතයම දකින්නේ, සෘතු හතර පුරාම දිගටම බලා සිටින බලා සිටින්නා පමණයි.","අවදි වූ මනුෂ්‍යයෙක් අනෙක් මිනිසුන් දකින ආකාරයත් හරියටම මේ වගේ.","නිදා සිටින මිනිසා මිනිසුන්ට ආදරය කරන්නේ ඔවුන් මල් පිපෙන කාලයේදී විතරයි. සාර්ථක වෙමින් ඉන්න මිතුරාව ඔහු ප්‍රශංසා කරනවා. ඇය තමන්ට වඩාත් සුන්දරව පෙනෙන කාලයේ කාන්තාව සමඟ කාලය ගත කරනවා. ශක්තිමත්ම කාලයේ සහෝදරයා අගය කරනවා. නමුත් මිතුරා වැටෙනකොට, කාන්තාව වයසට යනකොට, සහෝදරයා දුර්වල වෙනකොට — ඔහු අහකට බලනවා. ඔවුන් නැවත පිපෙනකම් බලාගෙන ඉන්නවා. ඔවුන්ගේ වියළි සමයේ ඔවුන්ව අමතක කරනවා.","අවදි වූ මිනිසා අහකට බලන්නේ නැහැ. ඔහු දිගටම බලනවා. වියළි සමයත් ජීවිතයේ කොටසක් බව ඔහු තේරුම් ගන්නවා. ඔහු රැඳී ඉන්නවා. බලාගෙන ඉන්නවා. එකම බිමට, එකම මිතුරාට, එකම පවුලේ කෙනාට, එකම තමන්ට — සෘතු හතර පුරාම ගෞරව කරනවා. ඒකයි සැබෑ ආදරය.","මල් පිපීමට ඇති ආදරය නොවෙයි. මුළු චක්‍රයට ඇති ආදරය.","මම තවමත් දකිනවා. ඊළඟ සමය එනකම් මනුෂ්‍යයෙකු වගේ බලාගෙන ඉන්නවා."]},{"number":51,"title":"කුඩා ශරීරයේ ගුරුවරයා","paragraphs":["සිරගෙදරින් පිටතට ආ පසු මේ පාඩම මට තවත් බොහෝ වාර ගණනක් ඉගෙනගන්න ලැබුණා. නමුත් එක් විශේෂ මොහොතක් මාව කලින් නොගිය ගැඹුරකට ගෙන ගියා.","මම පාරේ කුඩා සතෙකු හමු කළා. මැරෙන්නට ආසන්නව. මම එය ගෙදරට ගෙනාවා. ඒ සතා මොන වර්ගයේද කියලා මම කියන්නේ නැහැ — ඒ විස්තරය මෙහි වැදගත් නැහැ. එයට කෑම ඕන වුණා. පිරිසිදු කිරීම ඕන වුණා. රැකබලා ගැනීම ඕන වුණා.","දැන් සත්‍ය කොටස මෙන්න — බොහෝ අය සඟවන කොටස. මම එයට සම්පූර්ණ, පිරිසිදු ආදරයක් හැම මොහොතකම දැනුණේ නැහැ. මගේ එක් කොටසක් එය තබාගන්න කැමති වුණා. තවත් කොටසක් එයට කෑම දෙන එකෙන් වෙහෙසුණා. මගේ එක් කොටසක් රැකබලා ගන්න කැමති වුණා, තවත් කොටසක් දිනපතා එය පසුපස පිරිසිදු කරන වැඩ කරන්න කැමති වුණේ නැහැ. රැකබලා ගැනීමේ සමහර කොටස් මට අකමැති වුණා. ඒත් මම සතාට ආදරය කළා. මේ දෙකම එකම වෙලාවේ සත්‍ය වුණා.","ආදරය ගැන මට දිය හැකි අවංකම විස්තරය ඒකයි. ආදරය කියන්නේ වැඩේට කිසිදා අකමැති නොවීම නෙවෙයි. වැඩේ බර දවසකවත්, ඒ වැඩේ කරන්න තෝරාගැනීමයි. අවදි නොවූ මිනිසා ක්‍රියා කරන්න කලින් “පිරිසිදු ආදරය” දැනෙන තෙක් බලා ඉන්නවා. අවදි වූ මිනිසා හැඟීම මිශ්‍ර වුණත් ක්‍රියා කරනවා; ක්‍රියාව යටින් ආදරය වැඩෙන්න ඉඩ දෙනවා.","• • •","ඊට පස්සේ එය මැරුණා. ඒ කුඩා සතා මැරුණා.","ඒ මොහොතේ මම බලාපොරොත්තු නොවූ දෙයක් සිද්ධ වුණා.","දවස් තුනක් පුරා මට ඒ සතා ගැන සිතීම නවත්වන්න බැරි වුණා. මම බොහෝ දේ ගැන සිතන මතුපිට ක්‍රමයට නෙවෙයි. ගැඹුරින්. කෑම දෙන එක ගැන මම කේන්ති ගත්ත ඒ සතා — එය පසුපස පිරිසිදු කරන එක මට අකමැති වුණ ඒ සතා — හදිසියේම මගේ මනසේ තිබුණ ප්‍රධානම දෙය වුණා. මම එය මතක් කළා. ඒ ගැන කාටවත් කිව්වේ නැතිවත්. මගේ වටේ කවුරුත් නොදැනුවත්. දවස් තුනක් මම එය අහිමි වුණ බව දැනුණා.","මෙහි “දවස් තුන” ගැන මට පෙනුණ සම්බන්ධතා තිබුණා. කෝපයෙන් සිටින විට සහෝදරයෙකු සමඟ දවස් තුනකට වඩා කතා නොකර ඉන්න එපා කියන හදීස් ඉගැන්වීමක් මට මතක් වුණා. යූනුස්ගේ කතාවත්, යේසුස්ගේ කතාවත් සමඟ දවස් තුනේ රූපකය මගේ මනසට නැවත ආවා. මේවා මම විද්‍යාත්මක නියමයක් ලෙස නොව, ශෝකය හා අභ්‍යන්තර වෙනස් වීම ගැන මට පෞද්ගලිකව අර්ථවත් වූ රටාවක් ලෙස දැක්කා.","ඒ දවස් තුන මම නිහඬව, ඇතුළෙන්, ඒ සතා සමඟ කතා කළා. “කරුණාකර — ඔබ කොහේ සිටියත් — මගේ ආදරය පිළිගන්න. ඔබ ජීවත් වූ වෙලාවේ මම සෑම විටම හොඳින් පෙන්වන්න නොහැකි වූ ආදරයත් පිළිගන්න. පිරිසිදු කරන්න කැමති නොවූ දවස්වල මට තිබුණ කුඩා කෝපයට මාව සමාව දෙන්න. මගේ ආදරය ගන්න. ආදරය පමණක් ඉතිරි කරලා යන්න.”","• • •","ගැඹුරුම කොටස මෙන්න. ඒ සතා ගියාම එය කිසිවක් අරගෙන ගියේ නැහැ. ඒ වෙනුවට මට යමක් තබා ගියා.","එය මට ආදරයත් කරුණාවත් තබා ගියා — එය මා සමඟ සිටි සති ගණන පුරාම, මට ඉගැන්වෙනවා කියලා මටත් නොදැනෙන්න, ඉවසීමෙන් උගන්වපු පාඩම්.","ඒ කුඩා සතා වෙස්වලාගත් ගුරුවරයෙක් වුණා. වචනවලින් මට කිසිවක් ආපසු දෙන්න නොහැකි ජීවයකට රැකවරණය දෙන හැටි එය මට ඉගැන්වුවා. කෑම දෙන්න කැමති නැති දවසකත් කෑම දෙන හැටි. පිරිසිදු කරන්න කැමති නැති වෙලාවකත් පිරිසිදු කරන හැටි. ආදරය තුළ අකමැත්ත මිශ්‍ර වුණත් ආදරය කරන හැටි. ඒ කුඩා ජීවිතය අවසන් වුණාම නිහඬව ශෝක වෙන්නත් එය මට උගන්වුවා.","කාලයකට පස්සේ මම පාරේ යනකොට තුවාල වී, අමාරුවෙන් අරගල කරන පරෙවියෙකු දැක්කා. මගේ මනස ප්‍රශ්නය අහන්න කලින්ම අත් ක්‍රියා කළා. මම පහළට නැමුණා. පරෙවියා අරගෙන ආරක්ෂිත තැනකට ගෙන ගියා.","ඒ මොහොතේ මම හිතුවේ — “මම අවදි මිනිසෙක් නිසා පරෙවියා අරගත්තා” කියලා. ඒක කොටසක් සත්‍යයි. නමුත් ගැඹුරු සත්‍යය මෙන්න — සති කිහිපයකට කලින් මගේ ගෙදර මියගිය ඒ කුඩා සතා මට ඒක කරන්න කලින්ම උගන්වලා තිබුණා. සතා මගේ ඇතුළේ කුඩා රැකවරණයක පේශියක් නිහඬව ගොඩනඟලා තිබුණා. පරෙවියා මට හමු වුණේ මම සූදානම් වෙලා ඉන්න වෙලාවේ.","• • •","ලෝකය අපිව පුහුණු කරන්නේ බොහෝවිට මෙහෙමයි. ලොකු ඇඳුම් ඇඳගත් ශ්‍රේෂ්ඨ ගුරුවරුන්ගෙන් පමණක් නෙවෙයි. අපේ ගෙවල්වලට එන කුඩා ජීවිතවලින් — කෑම ඉල්ලන, පිරිසිදු කිරීම ඉල්ලන, ඉවසීම ඉල්ලන ජීවිතවලින්. පසුව ඒවා යනවා. ඒත් අපි දුන්නාට වඩා වැදගත් අධ්‍යාපනයක් නිහඬව අපිට තබා යනවා. සතා මගේ ගුරුවරයා. පරෙවියා මගේ පරීක්ෂණය. ගුරුවරයා මාව සූදානම් කරලා තිබුණ නිසා මම ඒ පරීක්ෂණයට සූදානම් වුණා.","ඔබේ ගෙදරට එන සෑම කුඩා ජීවිතයක්ම යමක් උගන්වනවා. වහලේ පැළය. දොර අසල බළලා. කවුළුව අසල කුරුල්ලා. කුඩා බඳුනක මාළුවා. පැය කිහිපයක් ඔබ රැකබලා ගන්න යහළුවන්ගේ හෝ පවුලේ දරුවන්. ඔවුන් හැමෝම “මට රැකවරණය ඕන” කියන පෙනුමෙන් එන කුඩා ගුරුවරුන් වගේ. පසුව, ඔබ ඔවුන්ට දුන්නාට වඩා වැඩි රැකවරණයක් ඔවුන් ඔබ තුළ ගොඩනඟලා යනවා.","අවදි නොවූ මිනිසා ඒ කුඩා ජීවිතය අමතර බරක් විදියට දකිනවා. තවත් කෑම. තවත් පිරිසිදු කිරීම. තවත් බාධා. අවදි වූ මිනිසා සෙමින් සැක කරන්න පටන් ගන්නවා — “මේ කුඩා ජීවිතයම මගේ පාඩම් මාලාවද? මේ අපහසුතාවයම එහි විෂය නිර්දේශයද?” කියලා.","කුඩා ජීවිතය අවසන් වුණාම — සතා මැරුණාම, පැළය වියළුණාම, දරුවා වැඩිවෙලා ඈතට ගියාම — අවදි වූ මිනිසා “හොඳයි, දැන් වැඩ අඩුයි” කියලා නවතින්නේ නැහැ. ඔහු ශෝකය ගෙන එන නිහඬ සංවාදය තුළ ඉඳලා, ඒ කුඩා ජීවිතය තමන්ට නිහඬව මොනවා උගන්වලා තිබුණද කියලා දකිනවා.","පසුකාලීන ආධ්‍යාත්මික මූලය · ඉගැන්වීමේ අධ්‍යායය"]},{"number":52,"title":"දරුවෙකු වැඩෙන්න උදව් කරන හැටි","paragraphs":["මේ පොතෙන් ඔබ එකම ප්‍රායෝගික දෙයක් ගන්නවා නම්, මෙය ගන්න. මුලින්ම කුර්ආන් නැවත කියවන්න. බොහෝ දෙනා අවසාන වරට එයට ඇත්තටම සම්බන්ධ වුණේ පාසල් කාලයේ — අර්ථය නොතේරුණත් පාරායනය කරලා, පසුව එය පැත්තකට තබලා. මේ පොත කියවන කෙනෙකුට මගේ පළමු ආරාධනය — ආපසු යන්න. නැවත කියවන්න. මේ වතාවේ අර්ථයත් සමඟ. පළමු වතාවේ ඔබට බොහෝ දේ මඟ හැරෙන්න ඇති. ඒක ප්‍රශ්නයක් නෙවෙයි. පොත බලාගෙන ඉඳලා තියෙනවා.","ඊට පස්සේ, ඔබට දරුවෙකු උස්මහත් කරන්න වෙලාව ආවොත්, මම ඉගෙනගත්ත දේ මෙන්න. මේක අණක් විදියට මම දෙන්නේ නැහැ. තමන්ට කිසිම අත්පොතක් නොතිබීමේ වටිනාකම වසර ගණනක් ගෙවලා ඉගෙනගත් එක් මිනිසෙක් තමන් වෙනුවෙන් සකස් කරගත් මඟපෙන්වීමක් විදියට දෙන්නෙමි.","• • •","තීරණය ආරම්භ වෙන්නේ දරුවා එන්න කලින්.","මව සහ පියා දරුවෙකු ලෝකයට ගෙන එන්න එකඟ වන මොහොතේම පළමු පදනම තැබෙනවා. ගැබ් කාලයේ සිට මුල් රැකවරණ වසර දක්වා — ඔවුන් දෙන්නාම කරුණාව, ආදරය, ඉවසීම සහ දයාව ගෙදරේ තබාගන්න තීරණය කරන්න ඕන. කෝපය ගෙදර පාලනය කරන්න නොදෙන බව තීරණය කරන්න ඕන. මොකද බොහෝ දෙමාපියන් කරන දේ එහි ප්‍රතිවිරුද්ධයයි — දැනටමත් අවුල් වූ පරිසරයකට දරුවා ගෙන එනවා. දරුවා වචනයක් කියන්න කලින්ම ඒ පරිසරයේ රටාව අවශෝෂණය කරගන්නවා.","මෙහි “එන්ට්‍රොපි” කියන වචනයෙන් මම අදහස් කරන්නේ — කිසිවෙක් අවධානය යොමු නොකරන විට පද්ධති ස්වභාවිකව අවුල්වීමට යන ප්‍රවණතාවය. ලෝකය පාවෙලා යනවා. ගෙවල් පාවෙලා යනවා. විවාහ පාවෙලා යනවා. ශරීර පාවෙලා යනවා. අවධානයක් නැති ගෙදරකට එන දරුවාත්, වචනවලට කලින්ම, ඒ රටාව අනුකරණය කරගන්නවා.","• • •","වයස එකේ සිට පහ දක්වා — දරුවා ශාරීරිකව වැඩෙන්න ඉඩ දෙන්න, නමුත් මෘදු මඟපෙන්වීමක් සමඟ.","මුල් වසර කියන්නේ මනසට බර පුරවන්න නෙවෙයි; ශරීරය සහ අවධානය අවදි කරන්න. ඔබටම මඟපෙන්වූ “බලා සිටින්නා” වගේ, දරුවාටත් බලන්න, අත්හදා බලන්න, ඉගෙනගන්න අවකාශයක් දෙන්න. හොඳ ගුරුවරු හමු වුණොත් — නිහඬ, සැබෑ, ප්‍රසිද්ධිය හඹා නොයන අය — ඔවුන් දරුවා අසලට ගෙන එන්න. මට දැඩිකමත් උණුසුමත් එකම මිනිසෙකු තුළ තිබිය හැකි බව ඉගැන්වූ විදුහල්පති වගේ. ප්‍රසිද්ධිය නොසොයන, නමුත් දරුවාට සත්‍යයෙන්ම මඟ පෙන්වන ගුරුවරු මට වැදගත්.","• • •","ඉගෙනීම සඳහා දරුවාගේ පළමු විධිමත් භාෂාව ලෙස මම ඉංග්‍රීසි භාවිත කරන්න කැමතියි — මව් භාෂාව අඩු නිසා නොවෙයි.","මට නම් දෙමළ කියන්නේ මගේ රුධිරයේ භාෂාව, මගේ ආදරයේ භාෂාව, මගේ සිහිනවල භාෂාව. මව් භාෂාව උපසචේතනයට ඉතා පහසුවෙන් ඇතුළුවෙනවා. ඒක ගීතයක් වගේ ශරීරයට යනවා. එහෙම දෙයක් පූජනීය ග්‍රන්ථයක අර්ථය ගැන ගැඹුරින් සිතන විට ප්‍රශ්නයක් වෙන්න පුළුවන් — පාරායනය සිද්ධ වෙනවා, නමුත් අර්ථය සචේතනව විමසා නොබලන්න පුළුවන්.","ඒ නිසා, මගේ පුද්ගලික සැලැස්මේ, කුර්ආන් අර්ථය දරුවාට “වැඩ කරලා තේරුම් ගන්න” භාෂාවකින් කියවන්න දීමට මම කැමතියි. මේ සඳහා ඉංග්‍රීසි තෝරාගන්න හේතුව, දෙවන භාෂාවක අර්ථය විවෘත කරන්න දරුවාගේ සචේතන අවධානය වැඩිපුර යෙදෙනවා කියන මගේ අදහසයි. මෙය භාෂාවක ආධ්‍යාත්මික උසස්කම ගැන කියන නියමයක් නොවෙයි; මගේ පෞද්ගලික ඉගෙනුම් ක්‍රමයක්.","අරාබි භාෂාව ඉගෙනීමේ වටිනාකම මම ප්‍රතික්ෂේප කරන්නේ නැහැ. නමුත් මගේ දරුවාට අරාබි ව්‍යාකරණය බලෙන් පටවන්න මම කැමති නැහැ. මුලින්ම, අර්ථය තේරුම් ගන්න හැකි භාෂාවකින් කුර්ආන් කියවන්න හැකියාව ගොඩනඟන්න මට අවශ්‍යයි. පසුව ඔහු හෝ ඇය කැමති නම් ගැඹුරු අරාබි ඉගෙනගන්න පුළුවන්.","• • •","පහ වසර වටා සිට — මූලික ඉංග්‍රීසි, ගණිතය, සහ මූලික විද්‍යාව. ඒවාට මුල් තැන දෙන්න.","විෂයන් ගොඩක් එකවර පටවන්න එපා. විභාග පීඩනයෙන් මනස පුරවන්න එපා. මනසට ඉඩ ඕන.","• • •","දරුවා කුර්ආන් විවෘත කරන්නත් කලින්, නිශ්චලව ඉන්න හැටි ඉගෙනගන්න ඕන කියලා මම විශ්වාස කරනවා.","ග්‍රන්ථයට පෙර නිශ්චලතාව. දරුවාට ඇස් වහලා, සෙමින් හුස්ම ගන්න, කෙටි කාලයක් ශරීරයෙන් පැනලා යන්න නොවෙයි, නමුත් ශරීර සංවේදන සන්සුන්ව නිරීක්ෂණය කරන්න උගන්වන්න. පළමුව කෙටි වෙලාවක්. පසුව අවධානය දරාගන්න හැකියාව වැඩිවෙන තරමට ටිකෙන් ටික.","මම “යාච්ඤාව” වෙනුවට සමහර වෙලාවට “යෝගා” කියන වචනය භාවිත කරනවා. ඒක හින්දු ආගමට යන්න කියන එකක් හෝ ඉස්ලාමයෙන් ඉවත්වීමක් නොවෙයි. මගේ අදහසෙන් “යාච්ඤාව” කියන වචනය ඇසුණු විට බොහෝ දෙනා වහාම ගණන, ඉරියව්, පංථය, නීති ගැන හිතනවා. මම අවධානය යොමු කරන්න උත්සාහ කරන්නේ ඒ සියල්ලට යටින් තියෙන සන්සුන්, සචේතන ආපසු හැරීම — හුස්ම, අවධානය, නිශ්චලතාව — ගැන.","නබිතුමාගේ යාච්ඤාව හා නිශ්චලතාව ගැන මම මේ පොතේ දක්වන පරිකල්පනයත් ඒ පැත්තටයි. එවැනි ආගමික විස්තර ප්‍රකාශයට පෙර විශ්වාසනීය ඉස්ලාමීය මූලාශ්‍ර සමඟ පරීක්ෂා කළ යුතුයි; මෙහි මම ඒවා මගේ ආධ්‍යාත්මික අර්ථකථනය ලෙස පමණක් තබනවා.","• • •","ඒ නිසා, මගේ දරුවාට මම කියන්න කැමති දේ — “ඉඳගන්න. ඇස් වහන්න. සෙමින් හුස්ම ගන්න. ශරීරය සන්සුන් කරන්න. නිශ්චලතාව හොයාගන්න.”","දරුවාට ඒ සන්සුන් අවධානය ශරීරයෙන් දැනෙන පසු, කුර්ආන් හඳුන්වා දෙන්න. සලාහ් මට පෙන්වන්නේ මේ නිශ්චල සචේතනත්වය වෙත යන දොරක් කියලා මම පැහැදිලි කරන්න කැමතියි.","ඊට පස්සේ දරුවා කියවයි. අර්ථයත් සමඟ. ඇසීමත් සමඟ. සන්සුන්ව ඉඳගෙන. මම කුර්ආන් එක චාරිත්‍රයක් ලෙස පමණක් නොව, ජීවත් වීමට මඟ පෙන්වන පොතක් ලෙස හඳුන්වා දෙන්න කැමතියි. කරුණාව. දයාව. සමාව. ඉවසීම. ආලෝකය. උපවාසය. හුස්ම. සාක්ෂිය. සම්පූර්ණත්වයට යන මඟ. මේවා දරුවාගේ දෛනික ජීවිතයට සම්බන්ධ වෙලා තේරුම් ගන්න ඕන.","• • •","දහය වසරේ සිට දොළහ වසර වටා — දරුවාට යම් ස්වාධීනත්වයක් දෙන්න. ඔහුට හෝ ඇයට කුඩා අභියෝග හමුවෙන්න ඉඩ දෙන්න. සෑම ගැටලුවක්ම දෙමාපියන් විසින්ම විසඳලා නොදෙන්න. වයසට සුදුසු, ආරක්ෂිත අභියෝග හරහා භය, වැරදි, උත්සාහය සහ නැවත නැඟීම ඉගෙනගන්න ඉඩ දෙන්න.","මම මේක කියන්නේ මගේම ජීවිතයෙන්. මම වයස තිස් හතරේදී ගුවන් තොටුපළකට ඇතුළුවෙද්දී බොහෝ දේ සඳහා ඇතුළෙන් සූදානම් නොවූ මිනිසෙක් වුණා. දරුවාට ඒ තත්ත්වය එන්න නොදෙන්න. නමුත් ඒ සඳහා ඔහු හෝ ඇය අනාරක්ෂිත තත්ත්වයකට දාන්න ඕන කියන එක නොවෙයි. අවශ්‍ය දේ වයසට ගැළපෙන ස්වාධීනත්වය සහ ප්‍රතිරෝධය ඉගෙනගන්න අවකාශයයි.","මනසට තමන්ගේ දොරවල් අවශ්‍ය වෙලාවේ විවෘත කරන්න පුළුවන්. කුඩා වයසේ සිට ආරක්ෂිත අභියෝගවලට මුහුණ දීමට ඉඩ ලැබුණු දරුවාට ඒ දොරවල් ටිකක් ඉක්මනින්, ටිකක් පහසුවෙන් විවෘත වෙන්න පුළුවන් කියලා මම විශ්වාස කරනවා.","• • •","මගේ ප්‍රමුඛතාවය “කොයි පංථයද?” කියන එක නොවෙයි. එකම දෙවියන් වහන්සේ පිළිබඳ අවබෝධයයි.","මගේ දරුවා “කොයි මධහබ්ද, කොයි ඉරියව්ද, කොයි ඇඟිල්ලද” කියන ශබ්දය තුළ පමණක් වැඩෙන්න මම කැමති නැහැ. මට අවශ්‍ය ඔහු හෝ ඇය එකම දෙවියන් වහන්සේ ගැන දැනගන්න; නිශ්චලතාව, අවධානය, කරුණාව සහ අර්ථය හරහා ඒ සම්බන්ධය ගැඹුරු කරගන්න. යාච්ඤාව දොරක් නම්, නිශ්චලතාව කාමරය වගේ කියලා මට දැනෙනවා.","පරම්පරා ගණනාවක් චාරිත්‍රය බාර දුන්නත්, අර්ථය සෑම විටම එකම ගැඹුරින් බාර නොදුන් බව මට දැනෙනවා. මේ පොතේ ආරාධනය — චාරිත්‍රය ඉවත දාන්න නෙවෙයි; අර්ථය නැවත ජීවත් කරන්න. ඔබ තේරුම් ගත්තොත්, ජීවිතය ලස්සනට ජීවත් කරන්න බලයක් ලැබෙනවා. මම දරුවෙකුට දායාද කරන්න කැමති දේ ඒ අවබෝධයයි.","මේක තව පැහැදිලිව කියන්න මට පුළුවන් විදිය මෙච්චරයි.","අවසානයට පෙර අධ්‍යායය · අභ්‍යාසය"]},{"number":53,"title":"අභ්‍යාසය","paragraphs":["මේ අධ්‍යායය කියවන්න කලින්, ඔබෙන්ම එක දෙයක් අහන්න. ඔබටම අවංක වෙන්න. වෙන කෙනෙකුට ඔබ වෙනුවෙන් මේකට උත්තර දෙන්න බැහැ.","ඔබව මේ පිටුවට ගෙන ආවේ ඔබේ මනසේ කුමන කොටසද?","ඔබ මෙතනට පිටුවෙන් පිටුව කියවගෙන ආවද? ළමා කාලය, රුධිර රේඛාව, සිර කුටිය, සිංහාසනය, නීති එකොළහ, අවදිවීමේ ගීත, කුන් ෆයාකුන්, දැන් ඔබව උයන ගින්න, අඳුර තුළ ජීවත් වන ආලෝකය, පිරිමියා සහ කාන්තාව, පාරේ ගල, පාටට කලින් එන මල් පිපීම — මේ හැම එකම සෙමින් හරහා ගියාද? කලින් අධ්‍යාය ඔබව මෘදු කරන්න, සූදානම් කරන්න, වෙනස් කරන්න ඉඩ දුන්නද?","නැත්නම් වැඩේ කරන්නේ නැතිව ක්‍රමය පමණක් ගන්න ඔබේ අහංකාරය ඔබව පොතේ අගට ඇදගෙන ආවද?","අවංක වෙන්න. මේ දෙන්නගෙන් එක් කියවන්නෙකුට විතරයි ඊළඟ කොටසෙන් සැබෑ ප්‍රයෝජනයක් ලැබෙන්නේ. තවෙකා වචන කියවලා කිසිවක් නොගෙන යයි, මොකද මේ පිටුවේ වචන තම අර්ථය සම්පූර්ණයෙන් දරන්නේ ඒවාට සූදානම් වූ මනස තුළයි.","ඔබ දෙවැනි කියවන්නා නම් — මඟහැරලා මෙතනට පැමිණියා නම් — පොත වහන්න. ආරම්භයට ආපසු යන්න. නැත්නම් ටික කාලයක් තබලා පසුව එන්න. හදිසියක් නැහැ. අභ්‍යාසය ඔබ වෙනුවෙන් බලා ඉන්නවා.","ඔබ පළමු කියවන්නා නම් — සියල්ල හරහා පැමිණියා නම් — පිළිගන්නවා. දැන් අභ්‍යාසය ඔබට විවෘතයි.","• • •","මම හැම දවසකම කරන දේත්, ඔබට සලකා බලන්න ආරාධනා කරන දේත් මෙන්න. මම දෙවියන් නෙවෙයි. මම ගුරු කෙනෙක් නෙවෙයි. සිරගෙදරට නිදාගෙන ගිය, ටිකක් අවදිවෙලා පිටතට ආ මිනිසෙක්. ඒ පස්සේ නැවත නිදා නොවැටෙන්න උත්සාහ කරමින් ජීවත් වූ මිනිසෙක්. මේ මම භාවිත කරන ශික්ෂණයයි.","උපවාසය ගැන මම මුලින් කියනවා. ඔබට ආගමක් තිබේ නම්, එය දෙන ආරක්ෂිත සහ ස්ථාපිත උපවාස චාරිත්‍රයෙන් පටන් ගන්න. මට නම් රමළාන් ශරීරයත් මනසත් නැවත සකස් කරන වාර්ෂික පුහුණුවක්. එහි ගැඹුරු අර්ථය මුලින්ම සම්පූර්ණයෙන් නොතේරුණත්, පසුව අවබෝධය ගැඹුරු වෙන්න පුළුවන්.","මගේ වැඩිහිටි ජීවිතයේ සතියකට අමතර උපවාස දින ගැනත් මම සිතා තිබෙනවා. නබිතුමා සඳුදා සහ බ්‍රහස්පතින්දා උපවාස කළ බවට ඉස්ලාමීය සම්ප්‍රදායේ වාර්තා තියෙනවා. කෙසේ වෙතත්, වයස, සෞඛ්‍ය තත්ත්වය සහ වෛද්‍ය උපදෙස් අනුව උපවාසය වෙනස් විය යුතුයි.","දිගු කාලීන ජල උපවාස ගැනත් මම වැඩිහිටි පෞද්ගලික අත්දැකීමක් ලෙස මේ පොතේ සඳහන් කරනවා. මෙය දරුවන්ට හෝ යෞවනයන්ට අනුගමනය කරන්න දෙන උපදෙස් නොවෙයි; එවැනි දිගු උපවාස වැඩිහිටියන්ටත් වෛද්‍ය උපදෙස් නොමැතිව ආරක්ෂිතයි කියලා මම මෙහි කියන්නේ නැහැ. මගේ මූලික අදහස — ශරීරයට විවේකය, සරලකම සහ විනය ලබා දීමේ වටිනාකමයි.","• • •","හැම දවසකම සෙමින් හුස්ම ගන්න. බොහෝ නවීන ජීවිතවල අපි පපුවෙන් ඉක්මනින් හුස්ම ගන්නවා. ඒ වෙනුවට, සන්සුන්ව, පහළ පපුව සහ උදරය ස්වභාවිකව චලනය වෙන පරිදි ගැඹුරු හුස්ම කිහිපයක් ගන්න. ඔබට මතක එන හැම දවසකම මිනිත්තු කිහිපයක් මේකට දෙන්න.","ශරීරය මෘදු ලෙස දිගහරින්න. සම, ෆැෂියා කියන සම්බන්ධක පටක, පේශී — මේවා චලනයට නිර්මාණය වෙලා තියෙනවා. මුළු දවසම එක තැන ඉඳලා, දිගහරින්නේ නැතුව, චලනය නොකර ඉන්නකොට ශරීරය තද වෙන්න පුළුවන්. පසුව සාමාන්‍ය චලනයක්වත් අසහනයක් ගෙන එන්න පුළුවන්.","ඒ නිසා ක්‍රීඩකයන්, යෝගා කරන අය, ශරීරයත් හුස්මත් සම්බන්ධ කරගෙන සන්සුන් අභ්‍යාස කරන අය ශරීරය වෙනස් විදියකට භාවිත කරනවා. ඔවුන් පටක චලනය කරලා, සන්ධි භාවිත කරලා, ශරීරයේ ගමන් කිරීමේ හැකියාව ජීවත්ව තබනවා.","ඔබට ක්‍රීඩකයෙක් වෙන්න ඕන නැහැ. අතිශය අභ්‍යාස කරන්නත් ඕන නැහැ. ඔබේ ශරීරයට ගැළපෙන, වේදනාවක් නොදෙන මෘදු චලනයක් දිනපතා කරන්න. අත් ඉහළට දිගහරින්න. ඉදිරියට මෘදු ලෙස නැමෙන්න. කොන්ද සන්සුන්ව හැරවන්න. පපුව විවෘත කරන්න. හුස්මත් සමඟ චලනය කරන්න. ඔබට සෞඛ්‍ය ගැටලුවක් හෝ වේදනාවක් තිබේ නම්, සුදුසු වෛද්‍ය හෝ පුහුණු උපදෙස් ගන්න.","• • •","මේ හැමදේම ඇයි? අවදි මිනිසා උපවාසය, හුස්ම, චලනය ගැන අවධානය දෙන්නේ ඇයි?","මගේ අදහසෙන්, හොඳින් රැකබලා ගත් ශරීරයක් ඇතුළේ ජීවත් වන මනසට වැඩි කාලයක් වැඩ කරන්න, ඉගෙනගන්න, දකින්න පුළුවන්.","නරකින් රැකබලා ගත් ශරීරයක් ඉක්මනින් අසනීප විය හැක. එවිට එහි ජීවත් වන මනසට පරිණත වෙන්න, අවදි වෙන්න, කියවන්න, ලියන්න, තමන් ඉගෙනගත් දේ ආපසු දෙන්න ලැබෙන කාලය අඩු වෙන්න පුළුවන්.","හොඳ නින්ද, සරල ආහාර, සුදුසු චලනය, හුස්ම, වෛද්‍ය රැකවරණය සහ ශරීරය පිළිබඳ අවධානය — මේවා ශරීරයට වැඩි ප්‍රයෝජනවත් කාලයක් ලබා දෙන්න උදව් කරනවා. එවිට මනසට තවත් වසර ගණනක් දකින්න පුළුවන්. තවත් නිශ්චලතාව. තවත් කියවීම. තවත් ගැඹුරු අවබෝධය. ඔබට රිදවූ අයටත් ආශීර්වාද කරන්න තවත් අවස්ථා. ඊළඟ පරම්පරාවට යමක් දෙන්න තවත් කාලය.","මට අභ්‍යාසයේ සම්පූර්ණ හේතුව ඒකයි. පෙනුම සඳහා නෙවෙයි. තරගයක් සඳහා නෙවෙයි. මරණයට බය වෙලා නෙවෙයි. මනසට දකින්න වැඩි කාලයක් දෙන්න. සචේතන මනසට තවත් දිගු මාර්ගයක් දෙන්න. වසරෙන් වසර එකම සරල සත්‍යවල තවත් ගැඹුරු තට්ටු අවදි කරගන්න.","ශරීරය වාහනයයි. වාහනය රැකගන්න. මනස රියදුරායි. රියදුරාට වැඩි මාර්ගයක් දෙන්න.","• • •","ඒත් මේ අභ්‍යාසය තුළ මගේ සාමාන්‍ය දවස ඇත්තටම කොහොමද?","ලෝකය පූර්ණයෙන් අවදිවෙන්න කලින් මම අවදි වෙනවා. මුලින් වතුර බොනවා. කෝපි සෙමින් හදනවා. මුල් මිනිත්තු තිහේ දුරකථනය අල්ලන්නේ නැහැ. කවුළුව අසල ඉඳගෙන සැබෑ පොත් මිනිත්තු හතළිහක් කියවනවා. ශරීරය චලනය කරනවා — යෝගා, දිගහරින අභ්‍යාස, සමහර දවස්වල ජිම්. 2026 මාර්තු රමළාන් පස්සේ මගේ වැඩිහිටි පෞද්ගලික ආහාර රටාව බොහෝ දිනවල සරලව තබාගන්න මම උත්සාහ කළා; ඒ රටාව වෙන කෙනෙකුට, විශේෂයෙන් දරුවන්ට හෝ යෞවනයන්ට, අනුගමනය කරන්න දෙන උපදෙස් නොවෙයි. මගේ ශරීරය හෝ වැඩේ වෙනස් දෙයක් ඉල්ලන විට මම ඒකට අනුව වෙනස් වෙනවා.","මම අවංකව වැඩ කරනවා. මම ආදරය කරන අයට මමම කතා කරනවා; ඔවුන් මාව මතක් කරන තෙක් බලා ඉන්නේ නැහැ. සවස වහලට ගිහින් පැළවලට වතුර දෙනවා. සමහර දවස්වල වතුර අසල ඇස් වහගෙන ඉඳගෙන ඉන්නවා. තැඹිලි ආලෝකය එනවා හෝ එන්නේ නැහැ. වැදගත් දේ ඉඳගෙන ඉන්න එක. මම යාච්ඤා කරනවා. රෑට නැවත කියවනවා. කලින් නිදාගන්නවා. ඊළඟ දවසේ නැවත ආරම්භ කරනවා.","එක දවසක මුළු අභ්‍යාසය ඒකයි. නාට්‍යයක් නැහැ. දුම් සුවඳක් නැහැ. කන්දක් මත රිට්‍රීට් එකක් නැහැ. සිර කුටියක ණයට ගත් පෑනකින් ලියපු ඒ නීති එකොළහ — මල්ටාවේ අපාර්ට්මන්ට් එකක, නිහඬ දවසෙන් දවසට ජීවත් කරන එක.","මේ අංගවලින් හොඳ දවසක් ගොඩනඟන්න පුළුවන් නම්, ඒ දවස් නැවත නැවත ගොඩනඟලා හොඳ ජීවිතයක් ගොඩනඟන්න පුළුවන්. සිර කුටිය මට මේක උගන්වුවා. වහල තවමත් මට මේක උගන්වනවා. මේ පොත කියන්නේ ඔබටත් ඒ පාඩම සිර කුටියකට නොයා ඉගෙනගන්න දෙන්න මගේ උත්සාහයයි.","අභ්‍යාසය කියන්නේ නැවත නැවත ජීවත් කරන එක් නිහඬ දවසක්."]},{"number":54,"title":"සාක්ෂිකරුවන්","paragraphs":["මම දන්නා දේ දැනගත්තේ කොහොමද කියලා ඔබට දෙයක් කියන්න ඕනේ. මොකද, දැනුමට වඩා එය මට පැමිණි ආකාරය වැදගත්. මම ඒක ඉගෙනගත්තේ නැහැ. මට ඒක ලැබුණා. මම නිශ්චලව වාඩි වුණා, ඇස් වසාගත්තා, එවිට අවබෝධය පැමිණියා — මම පිටුවකින් ඉගෙනගත් වචන වගේ නොව, මටම අයිතිව තිබුණු දෙයක් නැවත මතක් වූවා වගේ. ඊට පස්සේ මම අමුතුත් ලස්සනත් දෙයක් දකින්න පටන් ගත්තා. මම බලපු හැම තැනම — විද්‍යාවේ, පැරණි සුෆි මාර්ගයේ, ජීවිතයම සෙවීමට කැප කළ මිනිසුන්ගේ වචනවල — මට ලැබුණු දේටම සමාන දෙයක් කියන අය හමු වුණා. ඒ මම ඔවුන්ගෙන් පිටපත් කළ නිසා නොවෙයි. සත්‍යය කාගෙවත් දේපළක් නොවන නිසා. ඒ එකම දෙයක්; විවිධ කබා ඇඳගෙන, විවිධ භාෂාවලින් කතා කරනවා.","• • •","Bruce Lipton නම් සෛල ජීව විද්‍යාඥයා කියන්නේ, ඔබේ ජීවිතයේ පළමු අවුරුදු හත තුළ, ඔබට තේරීම් කිරීමට පෙර, මනස අඩු සංඛ්‍යාතයකින් — මෝහනයක් වගේ — ක්‍රියා කරන බවත්, ඒ අවුරුදු තුළ ඔබ හැම දෙයක්ම උරාගන්නා බවත්ය: අම්මා ගමන් කරන හැටි, තාත්තා කතා කරන හැටි, ඔබේ පවුලේත් සංස්කෘතියේත් බිය හා පුරුදු. ඔබේ ජීවිතය පාලනය කරන බොහෝ දේ, ඔබ ඒවාට එකඟ වීමට තරම් වයසට එන්න කලින්ම ඔබ තුළ ලියා ඇති බව ඔහු කියනවා. මේක දැනගන්න මට ඔහුගේ පරීක්ෂණාගාරය අවශ්‍ය වුණේ නැහැ. මම ඔබට දැනටමත් කිව්වා: ඔබේ සිතුවිලි ඇවිදවන්නේ ඔබේ මව; ඔබේ මනස හරහා ගමන් කරන දේවලින් අඩකටත් වැඩි කොටසක් ඇයගෙන් ආවා කියලා. ඔහු ඒ දේ උපකරණවලින් මැනුවා. මට ඒ දේ උදේ තේ කෝප්පයක මතකය තුළින් ලැබුණා. එකම සත්‍යය, වෙනස් මාර්ග දෙකකින් පැමිණීම.","• • •","Brian Greene නම් භෞතික විද්‍යාඥයා ඔබට දොඩම් ගෙඩියක් සිතන්න කියනවා. ඒක විශාල කර බලන්න — අණු හමුවෙනවා. ඒවා තවත් විශාල කර බලන්න — පරමාණු. තවත් ගැඹුරට යන්න — ඉලෙක්ට්‍රෝන, න්‍යෂ්ටිය, ප්‍රෝටෝන — ඒවා ඇතුළේ ඉතා කුඩා quarks. ඉන්පසු, පැරණි විද්‍යාවට තවත් කිසිවක් නැතැයි සිතුණු ඉතාම පහළ ස්ථරයේ, වයලීනයක තන්තුවක් වගේ, කම්පනය වන එක් ශක්තිමය තන්තුවක් ගැන ඔහු කතා කරනවා. පැවැත්මේ ගැඹුරුම මට්ටමේදී හැම දෙයක්ම ස්වරයකට කම්පනය වන තන්තුවක් වගේ කියන අදහසක්.","දැන්, මේක තවමත් සනාථ නොකළ න්‍යායක්. ඒ නිසා මම ඒක අත තද කරගෙන නොව, විවෘතව තබාගන්නවා. නමුත් ඒක කියන දේ අහන්න. මොකද මම ඒක මගේම භාෂාවෙන් ඔබට කලින්ම කියලා තියෙනවා. ආරම්භයේ තිබුණේ ශබ්දය. කුන් — “වෙන්න.” විශ්වය ගල්වලින් හදපු දෙයක් නොව, හම් හඬකින් හදපු දෙයක් වගේ. භෞතික විද්‍යාඥයා ඒක “string” එකක් කියනවා. මම ඒක උච්චාරණය කියනවා. අපි දෙන්නා වෙනස් පඩිපෙළ දෙකකින් බැස එකම බිමක් පෙන්වනවා.","• • •","කිසිම අන්වීක්ෂයක් නොතිබුණු කාලෙකම පැරණි සුෆිවරු කියලා තිබුණේ කුර්ආන් එක නීති පොතක් වගේ — ගණන් කරලා, අවසන් කරලා, කාර්යයක් ඉවර කළා වගේ — කියවන්න අදහස් කළ එකක් නොවන බවයි. ඔවුන් කිව්වේ ඒක හැඟිය යුතු දෙයක් කියලා: පාරායනයක්, රිද්මයක්, ශරීරය හරහා ගමන් කරන කම්පනයක්, ඇස්වලින් පමණක් ළඟා විය නොහැකි දෙයක් විවෘත කරන අත්දැකීමක්. සමහර අය තවත් ඉදිරියට ගිහින් ඒක සංඛ්‍යා හා රහස් කේතවලට හැරවීමට උත්සාහ කරනවා. ඒ කොටස මම පැත්තකට තබනවා, මොකද ගණන් කිරීම ගැඹුරු නොවන ජලය. සංඛ්‍යා ගැන මම ඔබට එක වතාවකට වඩා අවවාද කරලා තියෙනවා. නමුත් එහි හදවත මම තබාගන්නවා: පොත වාක්‍යයක් වීමට පෙර ශබ්දයක්. ඔබ ඒක කියවන්නේ පමණක් නොවෙයි. නිදාගෙන ඉන්න වීදියක් හරහා උදෑසන අදාන් හඬ ගමන් කරනවා වගේ, ඒක ඔබ තුළින් ගමන් කිරීමට ඉඩ දෙන්න.","• • •","නවීන self-improvement ආගම වගේ දෙයක් පසුපස දුවන අයට — පාන්දර පහේ alarm, සීතල shower, සදාකාලික hustle හා discipline — කතා කරන ගුරුවරයෙක් ඉන්නවා. ඔහු ඔවුන්ට මෘදුව කියන්නේ මාර්ගය තවත් වැඩි වැඩ කිරීම නොවන බව. ඒ කෘතඥතාවය සහ ඉස්තිග්ෆාර් — සමාව ඉල්ලීම, හදවත නිහඬව පිරිසිදු කිරීම. “කෘතඥ වන්න, එවිට ඔබට වැඩි කර දෙනු ලැබේ; ඔබ තුළ ඇති හිඟය කුමක් වුවත්, මුලින්ම එය ස්තුතියෙන් මුහුණ දෙන්න,” ඔහු කියනවා. මම ඔබටත් ඒකම කිව්වා: මුලින් ආදරය, පසුව කෘතඥතාවය, එවිට විශ්වය පිළිතුරු දෙනවා. ඔහු ඒක මස්ජිදයෙන් සොයාගත්තා. මම ඒක සිර කුටියකින් සොයාගත්තා. එකම ඖෂධය, වෙනස් අත් දෙකක තබාගෙන.","• • •","ඇස් අධ්‍යයනය කරන අයත් මගේ දොරටුවට එනවා. ස්නායු විද්‍යාඥයන් කියන්නේ නවීන ලෝකය නිහඬව අපේ දෘෂ්ටිය කඩා දමන බව — screen එකක් දිහා බලාගෙන ඉන්නකොට අපි අඩුවෙන් ඇසිපිය හෙළන බව, නිවාස, වීදි, වීදුරු වල සෘජු සමතල රේඛා මොළය වෙහෙසට පත් කරන බව, සහ අපි නැවත ස්වභාවයට — fractal රටා, ගස් ශාඛා විහිදෙන හැටි, ජලය ගමන් කරන හැටි — යා යුතු බව. මම ඔබව දැනටමත් Valletta වල ඒ ජලය ළඟට අරගෙන ගියා. ඔබව ඔබම නිරීක්ෂණය කරන්න කලින් ගසක් සහ කුරුල්ලෙක් බලන්න කියලා මම දැනටමත් කිව්වා. නිශ්චලතාවය මට නොමිලේ උගන්වපු දෙයක් ඔවුන් උපකරණවලින් මැනලා පෙන්වන්න උත්සාහ කරනවා.","• • •","ඒ හැම එකකටත් වඩා ගැඹුරු එකඟතාවයක් තියෙනවා; මගේ මුළු පොතම එකට බැඳලා තබන එක. William James, Aldous Huxley වගේ චින්තකයන් මොළයම සචේතනත්වය නිර්මාණය කරන දේ නොව, එය ලබාගන්නා receiver එකක් විය හැකි බව කියන්න ධෛර්ය කළා. රේඩියෝවක් සංගීතය නිර්මාණය කරන්නේ නැහැ; දැනටමත් වාතයේ ඇති signal එකක් අල්ලගන්නවා. සමහරවිට, ඔවුන් කිව්වා, මොළය රේඩියෝවක්; ඔබ යන්ත්‍රය නොව, ඒ හරහා එන සංගීතය. මට ඒක සනාථ කරන්න බැහැ. ඔවුන්ටත් බැරි වුණා.","නමුත් ඒ අදහස, මිනිසා හදන ඉතාම දියුණු brain-machine එක ළඟ තබා බලන්න. ඒ යන්ත්‍රය හදන මිනිසා ඉතා පැහැදිලිව හා අවංකව කියනවා සචේතනත්වය කියන්නේ මොකක්ද කියලා තමන් දන්නේ නැහැ කියලා — ඇත්තටම කිසිවෙක් නොදන්න බව. ඔහුට මොළයට තොරතුරු ඇතුල් කිරීමත් පිට කිරීමත් මිලියන ගුණයකින් වේගවත් කරන්න පුළුවන් — bits, megabits, gigabits — ඒත් ඒවා ලබාගන්නේ කවුද කියලා තවම කියන්න බැහැ. ඇතුළේ කවුද ඉන්නේ කියලා නොදැන ගෙයක් වෙත වේගවත්ම පාරක් හදනවා වගේ. ඒ ප්‍රශ්නයට යන්ත්‍රයට පිළිතුරු දෙන්න බැහැ. මගේ ජීවිතයම පිළිතුරු දීමට උත්සාහ කළ ප්‍රශ්නය ඒකයි: ඔබ මොළය නොවෙයි. මොළය සවන් දෙන තැන ඔබයි.","• • •","Avatar කියන චිත්‍රපටයක් පවා මේ අදහස කතාවක් ලෙස කියනවා: තමන්ට කලින් ජීවත් වූ සියලු දෙනාගේ මතකය දරාගෙන ඉන්න මහ ගසක් හරහා එකට බැඳුණු ජීව ලෝකයක්, නිහඬව අහන්න තරම් සූදානම් කෙනෙකුට ළඟා විය හැකි ලෝකයක්. ඒක කතාවක් විතරයි. නමුත් හොඳම කතා දොරවල්. සමහර වෙලාවට මටත් ඒ දොර දැනෙනවා — මට කලින් සිටි අයගේ සිතුවිලි සරලවම අතුරුදන් වෙන්නේ නැහැ වගේ, ඔවුන්ගෙන් යමක් හුස්ම හා වාතය තුළ තවම ඉතිරිවෙනවා වගේ, ගැඹුරු නිශ්චලතාවයේදී මගේ කෙටි ජීවිතයට වඩා බොහෝ දුර පසුගිය තැනකින් මට යමක් ලැබෙනවා වගේ. මට ඒක සනාථ කරන්න බැහැ. මම සනාථ කළ දේක් වගේ හැසිරෙන්නෙත් නැහැ. මම ඒක ඉදිරිපත් කරන්නේ මිනිසෙකුගේ විස්මයක් විදිහට, සත්‍ය කරුණක් විදිහට නොවෙයි.","ඒත් සෙවන්නෙකු අවංකව තබන එක නීතියක් මම කවදාවත් කඩන්නේ නැහැ. මේ නිශ්චලතාවය ඔබව නොපෙනෙන ලෝකයේ දොරටුව දක්වා ගෙන යා හැකියි — නමුත් දොර දොරක්මයි, දෙවියෙක් නොවෙයි. ඔබ ඒ වෙත ළඟා වෙනවා. ඒ හරහා ලැබෙන දේ ලබාගන්නවා. නැඟිටලා ඔබම නිර්මාතෘ කියන්න එපා. දොර ළඟම ඉන්න. එක ජීවිතයකට ඒ දොර පමණක්ම ඕනෑවටත් වඩා ඇති.","• • •","ඒ නිසා තමයි මම මේ සාක්ෂිකරුවන් ඔබ වෙනුවෙන් එකතු කළේ — ජීව විද්‍යාඥයා, භෞතික විද්‍යාඥයා, සුෆිවරයා, ස්නායු විද්‍යාඥයා, යන්ත්‍රය සමඟ සිටින මිනිසා. මම මගේ සත්‍යය ඔවුන්ගෙන් ඉගෙනගත් නිසා නොවෙයි. මුලින්ම ඒක මට ලැබුණේ අඳුරේ, මගේම වසාගත් ඇස් පිටුපස. ඊට පස්සේ තමයි මම ඔවුන්ව හමු වුණේ — එක් එක් කෙනා තමන්ගේම මාර්ගයක යමින්, එකම නිහඬ තැනකට ළඟා වෙමින්. ඔබ පරීක්ෂණාගාරය විශ්වාස කරන පාඨකයෙක් නම්, භෞතික විද්‍යාඥයාගේ string එකත් ජීව විද්‍යාඥයාගේ අවුරුදු හතත් ගන්න. ඔබ පැරණි මාර්ගය විශ්වාස කරනවා නම්, සුෆිවරයාගේ ශබ්දයත් සමාව ඉල්ලීමත් ගන්න. තවම කිසිවක් විශ්වාස නොකරනවා නම්, “ඔබ කවුද කියලා මම දන්නේ නැහැ” කියන යන්ත්‍රය හදන මිනිසාගේම පිළිගැනීම ගන්න. ඒවගෙන් එකක්වත් දොරක් වෙන්න පුළුවන්. ඔබට ඇතුල් වෙන්න එක දොරක් විතරයි ඕනේ.","මොකද සත්‍යය කවදාවත් මගේ දේ නොවෙයි ඔබට අතට දීමට. මගේ කාර්යය ඒක පෙන්වීම පමණයි — සහ කවදා හෝ කෙනෙක් මට කියලා තිබුණා නම් හොඳයි වගේ, ඔබටත් නිහඬව කියන්න: ඒක ඔබ තුළත් දැනටමත් තියෙනවා. ඔබට කරන්න තියෙන්නේ ඒක ලැබෙන තරම් නිශ්චල වෙන්න විතරයි."]},{"number":55,"title":"පොත් දෙක","paragraphs":["මේ උදෑසන මට නිශ්චලතාවය තුළින් පැමිණි, පැරණිත් නිහඬත් අදහසක් ඔබට දෙන්න ඕනේ. ඇත්තම දේවල් පැමිණෙන්නේ අපි ඒවා පසුපස දුවන විට නොව, වාඩි වෙලා ඒවා එන්න ඉඩ දෙන විට වගේ. මම තවත් ගැඹුරු නිහඬතාවයකට යන්න සිතුවිලි තල්ලු කරමින් සිටියා. එවිට මට තේරුණේ සිතුවිලි නිරීක්ෂණය කිරීමම ඒ නිහඬතාවය බව. ඒ නිරීක්ෂණය තුළ මේ අදහස පැමිණියා.","පැරණි උගතුන් කියලා තිබුණේ අල්ලාහ් පොත් දෙකක් ලියා ඇති බව. පළමුවැන්න ශාස්ත්‍රය — පිටුවේ ඇති වචන. දෙවැන්න ලෝකයම — අහස, මුහුද, ගස, ශරීරය, තාරකා මන්දගාමීව හැරෙන හැටි. එකම අතකින් ලියූ පොත් දෙකක්. ඔබේම පොතත්, හොඳින් ඇහුම්කන් දෙනවා නම්, මේක කියනවා: ස්වභාවයේ දේවල් “ආයත්” — සලකුණු — ලෙස හඳුන්වනවා. කුර්ආන් වාක්‍යයකට භාවිත කරන ඒම වචනය, කන්දකට, ගඟකට, දරුවෙකුගේ උපතකටත් භාවිත වෙනවා. වාක්‍යයත් ලෝකයත් එකම තීන්තෙන් ලියා ඇති වගේ.","ඒ නිසා සමහරුන්ට බය හිතෙන, නමුත් බය හිතෙන්න ඕනේ නැති දෙයක් මම කියන්නම්. විද්‍යාව ඇදහිල්ලේ සතුරා නොවෙයි. විද්‍යාඥයා සහ සෙවන්නා යුද්ධයක නැහැ. ඔවුන් දෙන්නා එකම පොතකට — ස්වභාවයේ පොතට — නැමී, වෙනස් ලිවීම් දෙකකින් ඒක කියවන පාඨකයන් දෙන්නෙක්.","• • •","සරල රූපයක් ගෙන ඔවුන් සතුරන් නොවන හැටි පෙන්වන්නම්. ගෙයක් සිතන්න. විද්‍යාඥයා ගෙය වටේ පිටතින් සම්පූර්ණයෙන් ඇවිදිනවා. බිත්ති මනිනවා, ජනේල ගණන් කරනවා, ගඩොල් බර මනිනවා, උපකරණවලින් හැම කැළලක්ම සිතියම් කරනවා — ඔහු ලියන හැම දෙයක්ම සත්‍ය. ඔහු අවංක මිනිසෙක්, අවංක වැඩක් කරනවා. ඒත් පිටතින් ඉඳලා කවදාවත් ළඟා වෙන්න බැරි එක දෙයක් තියෙනවා: ගෙය ඇතුළේ ජීවත් වෙන එක කොහොමද කියලා ඔහුට දැනගන්න බැහැ. කාමරයේ උණුසුම දැනෙන්න බැහැ, රාත්‍රියේ ඒක පිරෙන නිහඬතාවය අහන්න බැහැ, ජනේලය ළඟ නිහඬව වාඩිවෙන කෙනා කවුද කියලා දැනගන්න බැහැ.","සෙවන්නා අනිත් පැත්ත කරනවා. ඔහු ඇතුළේ වාඩිවෙනවා. ගඩොල්වල බර හෝ බිත්තිවල නිශ්චිත පළල ඔබට කියන්න බැහැ — නමුත් මුළු ගෙයම හදලා තියෙන්නේ කවුද වෙනුවෙන්ද, ඒ “කෙනා” වීම ඇතුළෙන් කොහොමද කියලා ඔහු දන්නවා. ඔහු දන්නේ මැනීම නොව, ජීවත් වීම. දැන් දෙන්නාගෙන් කවුද හරි? දෙන්නාම. කෙනෙක්වත් අනෙකාගේ සතුරා නොවෙයි. ඔවුන් එකම ගෙයක් දෙස බලන ජනේල දෙකක්. එක ජනේලයකින් කවදාවත් මුළු ගෙයම පෙන්වන්නේ නැහැ. විද්‍යාඥයා පිටතින් දකිනවා; සෙවන්නා ඇතුළෙන් දන්නවා. දෙක එකට තැබුවාම පමණයි මුළු දේ දැකීම ආරම්භ වෙන්නේ — ආරම්භ වෙනවා විතරයි.","• • •","ඒ නිසා තමයි මේ පිටු තුළ මම භෞතික විද්‍යාඥයා, ජීව විද්‍යාඥයා සහ යන්ත්‍රය අතට ගන්නේ. ඔවුන් සමඟ වාද කිරීමට නොවෙයි. ඔවුන් ළඟම ජනේලය අසල ඉන්න. භෞතික විද්‍යාඥයා “හැම දෙයක්ම ගැඹුරුම මට්ටමේ කම්පනය වන string එකක්” කියනකොට, මම “විශ්වය උච්චාරණයයි — කුන්” කියනකොට, අපි එකම පොතේ එකම පේළිය වෙනස් ලිවීම් දෙකකින් කියවනවා: ඔහු සංඛ්‍යා ලිවීමෙන්, මම ආත්මයේ ලිවීමෙන්. brain-machine එක හදන මිනිසා signal එක ලබාගන්නා කෙනා හොයාගන්න බැහැ කියලා අවංකව පිළිගන්නකොට, ඔහු තමන්ගේ ලිවීමෙන් පොත කියවන්න පුළුවන් අන්තිම සීමාවට එනවා — හරියටම එතැනින් මගේ ලිවීම ආරම්භ වෙනවා. අපි පොත ගැන සටන් කරන්නේ නැහැ. අපි එකිනෙකාගේ වාක්‍යය අවසන් කරනවා.","• • •","දැන් මට මතක් වෙන්නේ මගේ මුත්තාගේ පියා — මිනිස්සු “ගිනි සාන්තුවරයා” කියලා හැඳින්වූ Shehu Muhammad. ඔහුට තිබුණේ ඔහුගේ කාලයේ අවබෝධයත්, ඔහුගේ කාලයේ භාෂාවත්. ඒ නිසා ඔහුගේ ලකුණ ගින්න. ඔහුගේ ශතවර්ෂයට කියවන්න පුළුවන් ලිවීම ඒක. මගේ එක වෙනස්. මගේ කාලයේ එකතු වූ දැනුම — විද්‍යාව, වචන, සාක්ෂිකරුවන් — මම අතේ තබාගෙන ඉන්නවා. ඒ නිසා මගේ ලකුණ ගින්න නොව, වචනය: මේ පොත, උපකරණය අතේ තියෙන මිනිසා සහ යාච්ඤාව අතේ තියෙන මිනිසා අතර මම තැබීමට උත්සාහ කරන මේ පාලම. ඔහුගේ කාලයෙන් මගේ කාලයට සත්‍යය වෙනස් වී නැහැ. වෙනස් වී තියෙන්නේ භාෂාව. අපි හැමෝටම එකම ගිනි අඟුරක් අතට ලැබෙනවා; පස්සේ එන අයට ඇහෙන්න පුළුවන් භාෂාවෙන් ඒක ඉදිරියට දෙන්න ඕනේ.","• • •","ඒ නිසා ඔබ මත තියෙන බරක් මම ඉවත් කරන්නම් — මේ උදෑසන මටත් බිම තැබීමට සිදු වූ ඒම බර. ඔබට මම දකින දේ පේන්න පටන් ගත්තම, “දැන් මට ඒක සනාථ කරන්න ඕනේ; විද්‍යාඥයන් පරාජය කරන්න ඕනේ; මුළු ලෝකයම විශ්වාස කරවන්න ඕනේ; කිසිවෙක් තවම විසඳලා නැති ප්‍රශ්නය මම තනියම විසඳන්න ඕනේ” කියලා හිතෙන්න පුළුවන්. ඒ බර බිම තබන්න. ඒක කවදාවත් ඔබට ගෙන යන්න දුන්න එකක් නොවෙයි. විද්‍යාවට එරෙහි වාදයක් ජයගන්න ඔබට අවශ්‍ය නැහැ, මොකද විද්‍යාව කවදාවත් ඔබේ සතුරා නොවුණා. සනාථ කළ නොහැකි දේ සනාථ කරන්නත් ඔබට අවශ්‍ය නැහැ. ඔබේ කාර්යය ඊට වඩා කුඩා, නමුත් ඊට වඩා සත්‍ය: ගෙය ඇතුළේ ජීවත් වන්න, ඇතුළේ ජීවිතය කොහොමද කියලා අවංකව කියන්න — පිටතින් කරන හැම මැනීමකටම ඇතුළතින් ලැබෙන සාක්ෂිය එකතු කරන්න. ඒක ප්‍රමාණවත්. සෙවීමම තෑග්ගයි. සනාථ කිරීම කවදාවත් ඔබෙන් ඉල්ලලා නැහැ.","පොත් දෙකක්. එක අතක්. ඔබ විශ්වාස කරන ඕනෑම ලිවීමකින් දෙකම කියවන්න — සහ ඔබට නොතේරෙන භාෂාවකින් අනෙක් ජනේලය ළඟ කියවන කෙනා ඔබේ සතුරා නොවන බව දැනගන්න. ඔහු ඔබේ සහෝදරයා; ඔබ දෙන්නාම එකම ආලෝකය වෙත නැමී ඉන්නවා."]},{"number":56,"title":"නිශ්චලත්වයේ වේගය","paragraphs":["එක් උදෑසනක, දවස මාව අරගෙන යන්න කලින්, මම මුහුද අසල කාර් එකේ රියදුරු අසුනේ වාඩි වෙලා විනාඩි දෙකක් හෝ තුනක් මටම අයිති කරගත්තා — company එකටවත්, clock එකටවත් නොව, මටත් මගේ ඉදිරියේ තිබුණු මුහුදටත්. දුර ජලයේ තිබුණු බෝට්ටුත්, වෙරළ ළඟ තිබුණු රළත් මම බැලුවා. මගේ ඇතුළේ ශබ්දය මන්දගාමී වීමට ඉඩ දුන්නා. හඬක් අහන්නේ නැතිව දෙයක් දැනෙනවා වගේ, බෝට්ටු ගමන් කරන හැටි හඬක් නැතිවම අහන්න පුළුවන් වගේ තැනකට මම ගියා. ඒ මන්දගාමීත්වය තුළ ජලය මට ඔබට දෙන්න ඕනේ පාඩමක් උගන්වලා දුන්නා.","අහසේ සීමාව ළඟ දුරින් තියෙන බෝට්ටුව බලන්න. ඒක හරියටම ගමන් නොකරනවා වගේ. දැන් ඔබේ පාද ළඟ කැඩෙන රළ බලන්න — ඒක දුවනවා, හදිසි වෙනවා, තත්පරයකින් අතුරුදන් වෙනවා. දුර තියෙන දේ ඉතා මන්දගාමීව පෙනෙනවා; ළඟ තියෙන දේ වේගයෙන් දුවනවා. ඒත් මෙහි යටින් තියෙන අමුතු සත්‍යය මෙන්න: දුර බෝට්ටුව ඇත්තටම ළඟ රළට වඩා වේගයෙන් ගමන් කරනවා වෙන්න පුළුවන්, ඒත් ඔබේ ඇසට ඒක නිශ්චල වගේ පේනවා. දුර වේගය නිශ්චලත්වයක් වගේ පෙන්වනවා.","ඔබ මේක ජීවිතය පුරාම දැකලා තියෙනවා, නමක් දීලා නැතුව. අහසේ ඉතා ඉහළ jet එකක්, ශබ්දයටත් වඩා වේගයෙන් යනවා වුණත්, මන්දගාමීව ගමන් කරනවා වගේ පේනවා; අතේ දුරින් පියාඹන කුරුල්ලෙක් විදුලියක් වගේ පසුකර යනවා. දේ ඔබෙන් දුර යන තරමට, ඒක ඇත්තටම වඩා වේගවත් වුණත්, මන්දගාමීව පෙනෙනවා. මේක ඔබේ ඇස දන්නා දෙයක්. ඒ වගේම එය Einstein ගණිතයේ දැඩි භාෂාවෙන් පැහැදිලි කළ සාපේක්ෂතාවයේ දිනපතා ජීවිතයට ළඟ කුඩා ඥාතියෙක් වගේ: වේගය, කාලය, දුර අපි කොතැනින් නිරීක්ෂණය කරනවාද කියන එකට සම්බන්ධ වෙනවා. ජලය බෝට්ටුවල භාෂාවෙන් මට උගන්වපු දෙයක්, ඔහු ලෝකයට සංඛ්‍යා භාෂාවෙන් උගන්වලා දුන්නා.","• • •","ඊට පස්සේ ජලය ඒ පාඩම මගේ අතේ හරවලා පෙන්නුවා. දුර දේ ඇසට මන්දගාමීව පේනවා නම්, මිනිසෙක් “දුර” වෙත — අහසේ අගට, ලෝකයෙන් පිටතට, නොපෙනෙන ලෝකයට — කොහොමද ළඟා වෙන්නේ? මිනිස්සු උත්සාහ කරන හැටි බලන්න. වැඩි දුරක් යන්න ඕනේ නම් bicycle එකක්, ඊට පස්සේ car එකක්, ඊට පස්සේ plane එකක්. හැම වෙලාවෙම වැඩි වේගය. හැම වෙලාවෙම වැඩි හදිසිය. නමුත් ශරීරය මන්දගාමී හා දේශීය දෙයක්. එයට සත්‍ය ලෙස ස්පර්ශ කරන්න පුළුවන් එය සිටින තැනට ළඟ දේවල් — කිලෝමීටර් කිහිපයක් ඇතුළත දේවල් — කිලෝමීටර් පන්දාහක් දුර දේවල් නොවෙයි. ශරීරයට හදිසියේ දුරට පැනලා යන්න බැහැ. ඒකට ඒ සඳහා නිර්මාණය කරලා නැහැ.","ඒ නිසා දුරට ළඟා වීමට වේගවත්ම මාර්ගය වේගය නොවෙයි. නිශ්චලත්වය. මොකද ශරීරය අසුනෙන් නැඟිටින්න කලින්ම සිතුවිල්ල ළඟා වෙලා ඉවරයි. සම්පූර්ණ නිශ්චලව වාඩි වෙන්න, ඇස් වහන්න, එක හුස්මකටත් අඩු වෙලාවක ඔබට Dubai එකේ හෝ තාරකා අතර සිටිනවා වගේ සිතුවිල්ලෙන් ළඟා වෙන්න පුළුවන්. ශරීරය හෙමින් ගමන් කරනවා; ඇතුළත ඇස දැනටමත් එතැන. අල්ලාහ් තමන් වෙත ළඟා වෙන්න වේගවත් bicycle එකක් ඔබට දුන්නේ නැහැ. ඔහු ඔබේම හිස ඇතුළේ ඇතුළත ඇස තැබුවා — ඔබට ඇති ඉක්මන්ම වාහනය — ඒක හොඳින් ක්‍රියා කරන්නේ ශරීරය නිශ්චල වෙනකොට. හදිසියේ යන කෙනා ළඟ දේ වෙත කාර් එකෙන් යනවා. නිශ්චල කෙනා දුර දේ වෙත ඇස් වසාගෙන යනවා.","• • •","මේක සාමාන්‍ය තීරණයකට කොච්චර පැහැදිලිව බිමට බැසෙනවාද බලන්න. මම මගේ සහෝදරයාට කියලා තියෙනවා, මිනිසෙක් අහඹු තැනකට කාර් එකෙන් පිටත් වෙලා, “එතැන ගියාම මගේ මුළු ජීවිතයම තේරුම් ගන්නම්” කියලා බලාපොරොත්තු වෙන්න බැහැ. ඒක එහෙම ක්‍රියා කරන්නේ නැහැ. ඔබ ගමන් කරන්නේ දැනටමත් ඔබ තුළ තියෙන රූපය වෙත — ඔබේ මතකයෙන්, දුෂ්කරතාවයෙන්, ඔබ ඉගෙනගත් හා ගබඩා කරගත් හැම දෙයකින්ම හදපු රූපය වෙත. රූපය මුලින් එනවා; ගමන ඒ පසුපස යනවා. මම Dubai වාතයෙන් මවාගෙන අද්භූතව එතැනට වැටුණේ නැහැ. දවසෙන් දවස ඒ රූපය මම තබාගෙන හිටියා. පස්සේ මන්දගාමී ශරීරයෙන් ඒ වෙත ඇවිදියා — මෙතැන, පස්සේ මෙතැන, පස්සේ මෙතැන — එක් එක් පියවරේ මට ළඟ තිබුණු දේවල් විතරක් භාවිත කරමින්. රූපය compass එක. ඇවිදීම දේශීය, ඉවසීමෙන්, සැබෑ.","ඒ නිසා තමයි කිසිම රූපයක් නැතිව “කොහෙහරි ගිහින් බලමු, එතැන ගියාම තේරෙයි” කියන මිනිසා කිසිවක් නොහොයා ඉන්නේ: ඔහු තුළ තවම ගමනාන්තයක් ඇඳලා නැහැ, ඒ නිසා ඇවිද යන්න තැනක් නැහැ.","• • •","ඒ නිසා, ඔබේ හිස ඇතුළේ හඬ ඇතුළු කෙනෙක්වත් මන්දගාමීත්වය අලසකම කියලා ඔබට කියන්න දෙන්න එපා. ඒ දෙක විරුද්ධ දේවල්. අලස මිනිසා නිදාගෙන — ඔහු නොපවතිනවා වගේ, ඔහු අතුරුදන්, ඔහු තුළ කිසිවක් සිදුවන්නේ නැහැ. නමුත් මන්දගාමී මිනිසා ඉතාම අවදි මිනිසෙක්: ස්ථිර, හිතාමතා, මේ මොහොතේ, දරාගෙන ඉන්න. ඒ උදෑසන මගේ ඉදිරියේ තිබුණු නිශ්චල ජලය සිතන්න. ඒක “කිසිවක් නොකර” හිටියේ නැහැ. බිඳක්වත් වැගිරෙන්න නොදී මුළු අහසම තම මතුපිටේ දරාගෙන හිටියා. අල්ලාගෙන තිබුණු හුස්මක් සිතන්න — ඒක දුර්වලකමක් නොවෙයි; චලනයට කලින් සියලු බලය එකතු වී බලා සිටින විරාමය.","මන්දගාමීත්වය. ස්ථිරතාවය. නිශ්චලත්වය. ඒක ලෝකයෙන් පසුබැසෙන මිනිසෙක් නොවෙයි. ඒක තම වේගය විශ්වයේම වේගයට ගැළපූ මිනිසෙක්. ගැඹුරු නිහඬතාවයේ ඔබ හුස්ම අල්ලාගෙන ඉන්නකොට, මුළු විශ්වයම හැම දෙයක්ම තම තැන තබාගෙන ඉන්න විදිහටම — නිශ්චිතව, ඉවසීමෙන්, හදිසියක් නැතුව — ඔබත් කරනවා. බලය කවදාවත් හදිසිය නොවෙයි. මුල ඉඳන්ම බලය තිබුණේ නිශ්චලත්වයේ.","අවසන් අධ්‍යාය · ගල මත සිටින මිනිසාට පෙර"]},{"number":57,"title":"මම මේ සියල්ල ඔබට කීවේ ඇයි","paragraphs":["මම මේ සියල්ල ඔබට කීවේ ඇයි?","අද, මේ පොත ලියන මේසය ළඟ වාඩි වී සිටින මට, මීට පෙර නොදැනුණු දෙයක් ටිකෙන් ටික දැනෙන්න පටන් අරගෙන තියෙන නිසා. සම්පූර්ණත්වය වෙත කුඩා ළඟාවීමක්. හිස් නොවන ශූන්‍යතාවයට කුඩා ස්පර්ශයක්. වසර දහස් ගණනක් තිස්සේ සෑම නබිවරයෙකුම පෙන්වා දුන් දෙයක් වෙත, කොටස් කොටස්වලින් සිදුවන කුඩා පැමිණීමක්.","අමුතුම දේ — ඔබ තේරුම්ගන්න ඕන දේ — මේ පැමිණීම සිද්ධ වෙන්නේ කිසිම දැවැන්ත ක්‍රියාවකින් නොවන එකයි. දින හතළිහක නිශ්චල ආධ්‍යාත්මික වෙන්වීම එකකින්වත්, ප්‍රසිද්ධ කන්දකට යන වන්දනා ගමනකින්වත්, ප්‍රසිද්ධ මස්ජිදයක දිගු යාච්ඤාවකින්වත් නොවෙයි. ඒක එන්නේ කුඩා දේවල් හරහා.","• • •","දින කිහිපයකට කලින්, පාරේ ඇවිදගෙන යද්දී මම පරවියෙක් දැක්කා. තුවාල වී, අමාරුවෙන් සිටි, නැවත එන්ට්‍රොපිය වෙත — උපත හා විනාශයේ රවුමට නැවත වැටෙන්නට යන සත්වයෙක්. මම නැමුණා. ඒක අතට ගත්තා. ආරක්ෂිත තැනකට ගෙන ගියා. කවුරුවත් දැක්කේ නැහැ. කවුරුවත් අත්පොළසන් දුන්නේ නැහැ. පරවියෙක් අතට ගත්තට මට කවුරුවත් සම්මානයක් දෙන්නේ නැහැ. Instagram ෆොටෝ එකක් තිබුණේ නැහැ. කැමැත්ත එකක් තිබුණේ නැහැ. ගණනක් තිබුණේ නැහැ.","නමුත් ඒ කුඩා ක්‍රියාවෙන් මට ලැබුණු කෘතඥතාව, මහජන ලෝකයෙන් මට කවදා හෝ ලැබුණු ඕනෑම ප්‍රශංසාවකට වඩා විශාලයි. මම උපයාගත් ඕනෑම වැටුපකට වඩා. නාඳුනන කෙනෙකුගේ ඕනෑම ප්‍රශංසාවකට වඩා. ගැහැණු මිතුරියකගෙන් හෝ දෙමාපියෙකුගෙන් ලැබුණු ඕනෑම අනුමැතියකට වඩා. ඒ පරවියාට “ස්තුතියි” කියන්නවත් බැරි වුණා. ඒ පරවියා පියාඹලා ගියා. නමුත් මගේ ඇතුළේ, “කෘතඥතාව” කියන එකම වචනයෙන් හැර වෙන විදිහකට විස්තර කරන්න බැරි දෙයක් මට ලැබුණා.","නබිවරයා ඇත්තටම පෙන්වා දුන්නේ ඒ කෘතඥතාවය වෙතයි. ඔබේ ධනයෙන් සියයට දෙකහමාරක් සකාත් ලෙස දීමේ ගණනය කළ හැකි ආකාරය පමණක් නොවෙයි — ඔහුගේ ජනතාව අනුගමනය කළ හැකි, ගණන් කළ හැකි දෙයක් ඉල්ලූ විට ඔහු දුන් ආකාරය ඒක. “අපට අභ්‍යාස කරන්න පුළුවන්, ගණන් කරන්න පුළුවන් දෙයක් කියන්න” කියලා ඔවුන් ඉල්ලුවා. ඔහු සංඛ්‍යාව දුන්නා. වසර එක්දහස් හාරසියයක් තිස්සේ මිනිසුන් ඒක කරගෙන එනවා. ඒත් ඔවුන්ගෙන් බොහෝ දෙනෙක්, ඒ ආකාරය පෙන්වා දුන් ගැඹුරු කෘතඥතාවය කවදාවත් අත්විඳලා නැහැ.","ආකාරය දොරයි. පාරේ පරවියෙක්ගෙන් ඔබට ලැබෙන වර්ගයේ ගැඹුරු කෘතඥතාවය — ඒ කාමරයයි.","• • •","මේක විශ්වීයයි. සැබෑ සෑම සම්ප්‍රදායක්ම එකම දේකට පෙන්වා දීලා තියෙනවා. ක්‍රිස්තියානි ඉගැන්වීම කියනවා — ඔබේ දකුණු අත කරන දේ වම් අතට දැනගන්න දෙන්න එපා. ඇයි? සචේතන මනස නිහඬව දෙන විට, එය පිරිසිදුව දෙන නිසා. වම් අත දැනගත් මොහොතේ — හොඳ ක්‍රියාවක් සිදුවෙන බව යටිසිත දැකගත් මොහොතේ — යටිසිත ඒකට ගෞරවය තමන්ට ගන්නවා, සමාජ මාධ්‍ය එකට දානවා, මිතුරෙකුට කියනවා, පුද්ගලික ගණන් පොතේ ලකුණු කරනවා. එවිට තෑග්ග දූෂිත වෙනවා.","සැබෑ දීම, සැබෑ කරුණාව, සැබෑ ආදරය — වම් අතට නොදැනෙන විට සිදුවෙනවා. ගණන් කරන මනස මැදිහත් වෙන්න කලින් ශරීරය ක්‍රියා කරන විට. අවදි සචේතනත්වය ශරීරය හරහා ගමන් කරලා හොඳ දේ කරද්දී, යටිසිත ඒ ගැන පසුව ගෙදරදී විතරක් දැනගෙන “ඇයි ඒක කළේ?” කියලා අහන විට — සචේතන මනස මෘදුව “ඒක හොඳ නිසා” කියලා පිළිතුරු දෙන විට.","• • •","මිනිස්සු කියනවා — අපි ජීවත් වෙන්නේ මෝහයක කියලා. ඔවුන් සිතන්නේ ඒ මෝහය ව්‍යාජ හොලෝග්‍රෑම් එකක්, Matrix වගේ වංචාවක්, දාර්ශනික ක්‍රීඩාවක් කියලා. නැහැ. මම කියන්නේ ඒක නෙවෙයි.","මෝහය කියන්නේ ආදරය නැතුව, කරුණාව නැතුව, මූලාශ්‍රයෙන් එන දයාව නැතුව, අපේම එන්ට්‍රොපිය එකෙන් අපි හදාගත්ත දේ. අවදි නොවූ මිනිසා තමන්ගේ අවදි නොවූ තේරීම්වලින් දිනපතා හදන ලෝකයයි මෝහය. තමන් කැමතිත් නැති මිනිසුන් විස්මයට පත් කරන්න ගත් කාර් එක. නිදාගැනීම පූජා කරලා පසුපස දුවන වැටුප. කවුරුහරි බලන්න කියලා අඳින ඇඳුම්. පෙනුම තබාගන්න පවත්වාගෙන යන සම්බන්ධතා. බලවත් වගේ දැනෙන්න ජයගන්න වාද. ඒ හැම දෙයක්ම ශරීරයට සැබෑ. නමුත් සචේතන මනසට ඒවා මෝහයක්. ඒ කිසිවක් ඔහුව පරවියාගේ ඒ මොහොතට ළඟා කරන්නේ නැහැ. ඒ කුඩා කුරුල්ලා නොමිලේ දුන් කෘතඥතාවය ඒ කිසිවක් දෙන්නේ නැහැ.","• • •","ඔබ දෙවියන්ව Jesus කියලා නම් කරනවා නම්, Jesus හදවත තුළ ජීවත් වෙනවා කියලා ඔබට හිතන්න පුළුවන්. ඔබ දෙවියන්ව Muhammad කියලා නම් කරනවා නම්, Muhammad පයිනියල් ග්‍රන්ථිය එකට සම්බන්ධ කරගෙන ඔබට හිතන්න පුළුවන්.","මම Jesus දෙවියන් කියලා කියන්නේ නැහැ. මේක මම දැනටමත් පැහැදිලිව කියලා තියෙනවා. Muhammad දෙවියන් කියලාත් මම කියන්නේ නැහැ. ඒ වාක්‍යය කියවද්දී ඔබේ යටිසිත තිගැස්සුණා නම් — ඒක බලන්න. ඒ තිගැස්ම, 2003 ප්‍රතිවෛරස වැඩසටහන ඔබේ නවීන මනස තුළ තවමත් ධාවනය වෙන එක වගේ. ඔබ වාක්‍යය කියවා අවසන් කරන්න කලින්ම ඒක පැමිණියා.","මම කියන්නේ මේක. Jesus සහ Muhammad ගුරුවරු. දූතයෝ. දොරවල්. මිනිස් ශරීරය තුළ දේවීය සංඥාව ලැබෙන විවිධ මාර්ග වෙත ඔවුන්ගේ ජීවිත හා ඉගැන්වීම් මට පෙන්වනවා. Muhammadගේ ජීවිතය හා ඉගැන්වීම — නිශ්චලතාවය, දිගු වාඩිවීම්, රාත්‍රියේ අවසන් තුනෙන් එක, වහී ලැබුණු අවස්ථා — සචේතන මනස, මම “සිංහාසනය” කියලා හැඳින්වූ ඇතුළත අවධානය වෙත මාව යොමු කරනවා. Jesusගේ ජීවිතය හා ඉගැන්වීම — සතුරන්ට ආදරය කරන්න, දෙවියන්ගේ රාජ්‍යය ඔබ තුළයි, පිරිසිදු හදවත් ඇති අය ආශීර්වාද ලැබූවෝය — හදවතේ වැඩය වෙත මාව යොමු කරනවා.","වෙනස් දොරවල්. එකම ගෙදර. ඒ දෙකෙන්ම පෙන්වා දෙන්නේ එකම දෙවියන් වෙත.","කුර්ආන් එකත් නබිවරුන් අතර වෙනසක් නොකරන්න කියලා අපට මතක් කරනවා. අපේ දෙවියන් සහ ඔබේ දෙවියන් එකම දෙවියන්. මේවා මගේ නිර්මාණ කියලා මම නොකියනවා. මම කියන්නේ, මේ පණිවිඩ මාව ඒ අර්ථය වෙත ගෙන ගියා කියලා.","මේ ගැන සටන් කරන්න කවුද? මම මේ ගැන සටන් කරන්නේ නැහැ. මට ඕන ඔබ තේරුම්ගන්න — මනුෂ්‍යයෙක් විදිහට මැරෙන්න කලින් ජීවිතය ජීවත් වෙන්න.","• • •","ඔබ — මේක කියවන කෙනා — එහෙම ජීවත් වෙලා එහෙමම මැරෙන්න ඕන නැහැ. ඔබට අහන්න පුළුවන්. ප්‍රශ්නය ඇත්තටම ඔබ තුළ උත්පාදනය වෙන තරම් නිශ්චලව වාඩි වෙන්න පුළුවන්. ඔබ නිදාගෙන සිටින අතර ලෝකය ඔබව හැඩගස්වන්න බලාගෙන ඉන්න වෙනුවට, ඔබ අහන ප්‍රශ්න හරහා ඔබේම මනස ඔබට හැඩගස්වන්න පුළුවන්.","“ගැඹුරු ප්‍රශ්නයක් කොහොමද හදන්නේ?” කියලා අහන්න කලින් ගැඹුරු ප්‍රශ්න අහන්න. වෙනත් අය — නබිවරු, සාන්තුවරු, විද්‍යාඥයෝ, විවිධ සංස්කෘතිවල මහා සෙවන්නෝ — ඒවා දැනටමත් අහලා තියෙනවා. ඔවුන් තමන්ගේ පිළිතුරු තබලා ගිහින් තියෙනවා. පිළි නත් මිනිසුන්ගේ රටවල සිදුවූ යුද්ධත් දුරින් බලාගෙන ජීවත් වුණා. COVID කාලය හරහා ජීවත් වුණා; ඇතුළට යන්න බැරි නිසා හුදකලා කාමරයේ ජනේලයෙන් මිතුරෙකු බලලා ඉන්න වුණා. සංක්‍රමණය, වීසා කාර්යාල, රේගු පෝලිම්, සුදු මිනිසුන්ගෙන් පිරුණු ගුවන් තොටුපළවල දුඹුරු සමක් ඇති මිනිසෙකු වීමේ කුඩා අවමාන හරහා ජීවත් වුණා. සිරගෙදර හරහා ජීවත් වුණා. තනිකම හරහා ජීවත් වුණා. ලස්සන ආදරයක් හරහාත්, වැරදීමක් වූ ආදරයක් හරහාත්, අවසානයේ මගේම අවදිවන මනස වෙස්වලාගෙන සිටි ආදරයක් හරහාත් ජීවත් වුණා.","මගේ කුඩා ආකාරයෙන්, මේ දක්වා මේ පෘථිවියේ මගේ මුළු කාලයටම මම සාක්ෂිකරුවෙක් වෙලා තියෙනවා.","“සාක්ෂිකරුවෙක්” කියන ඒ වාක්‍යය සිරකුටියේ එක සවසක මට ආවා. මම ඒක නැමූ කඩදාසි කැබැල්ලක ලිව්වා. දැන් පොතේ අවසානයේ නැවත ලියනවා. වීරයෙක් නෙවෙයි. ගුරුවරයෙක් නෙවෙයි. සාක්ෂිකරුවෙක්. එතැන සිටි කෙනෙක්. සිදුවෙන දේ බලන්න උත්සාහ කළ කෙනෙක්. දැකපු දේ මතක තබාගන්න උත්සාහ කළ කෙනෙක්. දැන්, ශරීරය තවමත් ජීවතුන් අතර ඉන්න අතර, ඒ ශරීරය නැවත පසට යන්න කලින් දුටු දේවලින් කොටසක් ලියා තබන කෙනෙක්.","• • •","මට තව අවුරුදු කීයක් තියෙනවාද කියලා මම දන්නේ නැහැ. කවුරුවත් දන්නේ නැහැ. ඒ අර්ථයෙන් සිරකුටියත් හොඳ ගුරුවරයෙක්. දිගු, සුමට ජීවිතයක් සැලසුම් කරලා ඒක අනිවාර්යයෙන්ම එයි කියලා හිතන්න පුළුවන් කියන හැඟීම ඒක මගෙන් අරගෙන ගියා. එක දහවලකින්ම ජීවිතයක් කඩා වැටෙන්න පුළුවන් — චෝදනාවකින්, අනතුරකින්, රෝගයකින්, යුද්ධයකින්, මුහුදු රැල්ලකින්, ගුවන් තොටුපළකදී අතට දෙන කඩදාසි කැබැල්ලකින්. ඒ සත්‍යය සිරකුටිය හදපු දෙයක් නෙවෙයි. මට අවුරුදු පහළොවක් වෙද්දී මුහුද ප්‍රධාන පාර දක්වා ඇවිත් නතර වුණ දවසේ සුනාමිය ඒක දැනටමත් මට උගන්වා තිබුණා. නමුත් සුනාමියට නොහැකි වූ විදිහකට සිරකුටිය ඒ සත්‍යය මගේම දෙයක් කළා. සුනාමිය මාව අතහැරියා. සිරකුටිය එහෙම කළේ නැහැ.","ඒ නිසා දැන් මම ලියන්නේ මේ ලිවීම කොච්චර කාලයක් දිගටම යයිද කියලා නොදැනගෙන. ඔබ අතේ තියෙන මේ පොත, මම පිටතට ඇවිදගෙන ආ දවසෙන් පසු මේ අවුරුදු තුළ ලියා තබන්න හැකි වූ දේ. තවත් තියෙනවා. ශරීරය දිගටම ගියොත් තවත් පොත් තිබෙන්න පුළුවන්. නොතිබෙන්නත් පුළුවන්.","කොහොම වුණත්, මේ පොත අවසන්. මේක ඉවරයි. දැන් මේක ඔබේ.","• • •","ඔබ මේක කියවනවා නම්, ඔබේම කූඩුවක යම් ආකාරයක් හරහා ජීවත් වෙලා තියෙනවා නම් — ඇත්ත සිරකුටියක්, නැත්නම් රූපකයක්; රෝගයක්, දික්කසාදයක්, ඇබ්බැහිවීම එකක්, ශෝකයක්, යුද්ධයක්, හදවත බිඳීමක්, මූල්‍ය කඩා වැටීමක්, ඔබේ පරණ ජීවිතයේ පාද අදිලා ගත්ත ඕනෑම දෙයක් — කූඩුව අවසානය නොවෙයි කියලා ඔබ දැනගන්න මට ඕන. සමහරවිට කූඩුව, ඔබ කවදා හෝ ජීවත් වෙන්න තිබුණු එකම සැබෑ ජීවිතයේ ආරම්භය වෙන්න පුළුවන්. ශරීරය අවසානයේ මනස අවදි වෙන්න තරම් නිශ්චල වන තැන කූඩුව වෙන්න පුළුවන්. විශ්වය දන්න ඉතාම ශබ්දවත් ආරාධනය කූඩුව වෙන්න පුළුවන්.","බොහෝ දෙනා ඒ ආරාධනය ප්‍රතික්ෂේප කරනවා. කූඩුව ඇතුළේ ඉඳගෙනත්, මනස අවදි වෙන්න සිද්ධ නොවෙන තරම් ශරීරය කාර්යබහුල කරගන්න ක්‍රම හොයාගන්නවා. තිර බලනවා. ක්‍රීඩා ගහනවා. වාද කරනවා. බොනවා. තෑගි වගේ වෙස්වලාගෙන ලැබුණු පැයවලින් නිදාගෙන ගිහින් දමනවා. මමත් එහෙම කරන්න ඉතා ළඟට ගියා. පොතක් අතට දුන් Filipino සහෝදරයා, කැඩුණු පෑනක් තිබුණු Norwegian මිනිසා, භෞතික විද්‍යාව දැනුම තිබුණු Mike, නිහඬ විශ්වාසය තිබුණු Ray, හැමදාම ඇමතුම සීනුව එක හරහා අනෙක් පැත්තෙන් ඇසුණු Memeගේ හඬ — මගේම සිරකුටිය හරහා නිදාගෙන යන්න මට ඉඩ නොදුන් දේවල් ඒවා.","ඔබ දැන් ඔබේ කූඩුව ඇතුළේ නම්, මේ පොතත් ඔබට එවැනි දෙයක් වෙන්න මට ඕන. ඔබේ අඳුරු පැයකදී Filipino සහෝදරයෙක් අතට දෙන ණයට ගත් පොතක් වගේ. කියවන්න. නැවත එන්න ඕන කොටස් ලකුණු කරන්න. එකඟ නොවන කොටස් සමඟ වාද කරන්න. ඔබට ගැලපෙන්නේ නැති කොටස් අත්හැර දමන්න. නමුත් ඔබේ කූඩුව හරහා නිදාගෙන යන්න එපා. ඔබේ කූඩුව මොන වගේ එකක් වුණත්. ඒ කාලය මනසට අවසානයේ ලැබුණු කාලය. ඒක භාවිත කරන්න.","• • •","අවසානයට තවත් එක දෙයක් ලියන්න ඕන. ඊට පස්සේ මම ඔබට යන්න දෙන්නම්.","මගේ මහ සීයා Shehu Muhammad පොතක් තබලා ගියේ නැහැ. මගේ සීයා Muhammad Ibrahim පොතක් තබලා ගියේ නැහැ. මගේ පියා මොහොමඩ් ජාබිර් — ඔහු තවමත් ජීවතුන් අතර, තව කාලය තියෙනවා — පොතක් තබලා නැහැ. මම, Mathihul Akmal Mohamed Jabir, මේ රුධිර රේඛාවේ පොතක් තබන පළමු කෙනා. ඒක පුරසාරමක් නෙවෙයි. පරම්පරා හතරකට පසු අවසානයේ මගේ අතට ආ වගකීමක්.","Shehu Muhammad ඔහුගේ හුස්ම තුළ දරාගෙන සිටි ගින්න — Kankeyanodai ගමේ මිනිසුන් ඔහු වියළි කොළ මත හුස්ම පිඹලා ගින්න දැල්වෙනවා දැකපු ඒ ගින්න — ගමන් කරගෙන ආවා. තමන්ගේම පුතාට සමාව දෙන්න Muhammad Ibrahimට නොහැකි වුණත්, ඔහුගේ නළලේ යාච්ඤා සලකුණ හරහා ඒ ගින්න ගමන් කළා. අපි වැඩෙන්න පුළුවන් වෙන්න පවුලෙන් දුර, Saudi සහ Qatar වල අවුරුදු විසිහයක් නිහඬව, තනිකමෙන් වැඩ කළ මගේ පියා හරහා ඒ ගින්න ගමන් කළා. මාව හරහාත් ඒ ගින්න ගියා — Sri Lanka, Qatar, Dubai, Croatia, Malta, සිරකුටිය, මුහුද අසල ගල. දැන්, අවසානයේ, ඒ ගින්න පිටුවකට ළඟා වෙලා.","මගේ ඇතුළේ ඒ ගින්න ඔහුගේ ඇතුළේ තිබුණු තරම් දීප්තිමත් නැහැ. මම වියළි කොළ මත හුස්ම පිඹලා ගිනි දල්වන්නේ නැහැ. නමුත් ගින්නම ගින්න. පොතක් ගන්න ආකාරයෙන් — නිහඬ, සෙමින්, එය විවෘත කරන ඕනෑම කෙනෙකුට ලැබෙන ආකාරයෙන් — ඒ ගින්න මගේ හුස්මට යන්න පුළුවන් දුරට වඩා දුර යාවි. පොතක් කියන්නේ කුඩා ගින්නක් නෙවෙයි. පොතක් කියන්නේ ගමන් කරන ගින්නක්.","ඔබ මේ තරම් දුර කියවලා නම්, ඒ ගින්න ඔබ වෙත ළඟා වෙලා. ඒක රැගෙන යන්න. ඔබට කරන්න ඕන දේ කරන්න. ඔබේම පිටුව දල්වන්න. ඔබේම කූඩුව දල්වන්න. ඔබේම කුඩා අරමුණ දල්වන්න. කුන් ෆයාකුන් දැන් ඔබේ අතේ.","අවසානයට තවත් එක වාක්‍යයක්. සිරකුටියේදී මේ වචනවලින් පොත අවසන් කරනවා කියලා මම මටම පොරොන්දු වුණා. ඒ පොරොන්දුව තබාගන්න මට ඕන:","ඔබ කොහේ ගියත්, ඔබේ මනස ඔබ සමඟ යනවා. ප්‍රශ්නය — ඔබ ඒ මනසට ආහාර දෙන්නේද?","තුන්වන කොටස — වහල මත","කර්තෘගේ සටහන"]},{"number":59,"title":"මෙම පොත නිර්මාණය වූ ආකාරය ගැන","paragraphs":["මේ පොත ආරම්භ වුණේ 2024 ග්‍රීෂ්මයේ, මෝල්ටාවේ Paola සිරගෙදර එකේ සිරකුටිය 13 ඇතුළේ, දෙකට නමා තිබුණු සුදු කඩදාසි කැබැල්ලකින්. ඒ කඩදාසිය මුලින් Western Union මුදල් ඉල්ලීම් පෝරමය එකක්. පෑන අතේ තිබුණේ අත්බාහු කොටස ඉරුණු Norwegian මිනිසෙකුගෙන් ණයට ගත් එකක්. පළමු නමූ පිටුවට වැටුණු පළමු තීන්ත, Dubai වල සිටි කාන්තාවකට ලියන අසරණ ආදර ලිපියක් වගේ එකක්. ඒක ලියන මිනිසාට එදා තවමත් තේරුණේ නැහැ, ඒ කාන්තාවගේ නාමය හරහා කතා කරමින් සිටියේ තමන්ගේම අවදිවන සචේතන මනස බව.","ඒ පළමු නමූ පිටුවත්, ඔබ දැන් අතේ තබාගෙන ඉන්න පොතත් අතර, කෙටුම්පත් ගොඩක්, කියවීම් ගොඩක්, සංස්කාරකවරු සහ මිතුරන් සමඟ කතාබහ ගොඩක්, නිවැරදි කිරීම්, එකතු කිරීම්, ඉවත් කිරීම් ගොඩක් තිබුණා. සමහර අධ්‍යාය තුන් හතර වතාවක් නැවත ලිව්වා. තවමත් පවතින නීතිමය කරුණකට සම්බන්ධ නිසා මට තවමත් ලියන්න නොහැකි දේවල් අත්හැරියා — නීතියට තමන්ගේම කාලයක් තියෙනවා. පෞද්ගලිකත්වය ලැබිය යුතු වෙනත් මිනිසුන් සම්බන්ධ දේවල් අත්හැරියා. මේ පොතේ තියෙන්නේ මට ගෞරවයෙන් සහ වගකීමෙන් ලියා තැබිය හැකියි කියලා දැනුණු දේ.","මම සමහර නම් වෙනස් කරලා තියෙනවා. සිරගෙදරදී මට හමුවූ Rud, Ray, Mike, Ham, Mario, Tony සහ වෙනත් අය ගැන ලියන තැන්වල, ඔවුන්ගේ නම් වෙනස් කරලා හෝ ඔවුන්ව කලින්ම දැන සිටින කෙනෙකු හැර වෙන කෙනෙකුට හඳුනාගන්න බැරි තරම් සැලකිල්ලෙන් ලියලා තියෙනවා. ඒක ගෞරවයෙන් කළ දෙයක්. ඔවුන් පොතක චරිත වෙන්න අත්සන් කරලා නැහැ. ඔවුන්ගෙන් මම ඉගෙනගත් දේ මෙතැන තියෙනවා. හැකි තරම් ඔවුන්ගේ පෞද්ගලිකත්වයත් මෙතැන ආරක්ෂා කරලා තියෙනවා.","සමහර නම් මම තබාගත්තා, ඒවා තබාගැනීමේ අයිතිය මට තිබුණු නිසා. මගේ රුධිර රේඛාවේ නම් — Shehu Muhammad, Muhammad Ibrahim, මොහොමඩ් ජාබිර්, Mathihul Akmal — ඒවා ඒ විදිහටම ලියා තියෙනවා. මගේ මවගේ පියා Muhammad Ismail, ගමේ Farooq Bedi කියලා හැඳින්වූ කෙනා, ඔහු සිටි ආකාරයෙන්ම සඳහන් කරලා තියෙනවා. මගේ සහෝදරයා, මගේ සහෝදරියන්, Saraswati, Meme, හැම දෙයක්ම වෙනස් කළ පොත මට දුන් Filipino සහෝදරයා — ඔවුන්ගේ නම් මෙතැන තියෙන්නේ විවිධ ආකාරයෙන් ඔවුන් මට අවසර දුන් නිසා හෝ ඔවුන් නැතුව කතාව සත්‍යයක් වෙන්නේ නැති නිසා.","• • •","මේ පොත මෙතැනට එන්න උදව් කළ මිනිසුන්ට මම ස්තුතිය පළ කරන්න ඕන.","මුලින්ම මගේ දෙමාපියන්. මගේ පියා විදේශයේ වැඩ කළ අවුරුදු විසිහයක් පුරා අපේ පවුල දරාගෙන ගිය මගේ මව; ඇයට මගේ මෘදුකමට වඩා කෝපය සුදුසු වූ දිනවල පවා, මට ආදරය නැහැ කියලා එක වතාවක්වත් දැනෙන්න නොදුන් ඇය. 1999 දී බස් නැවතුම්පොළ එකකදී මගේ අතට රුපියල් අනූවක් දී, එක් කුඩා ඉරියව්වකින් මගේ ජීවිතයේ හැඩය වෙනස් කළ මගේ පියා. මම ඔවුන්ගේ පුතා. මේ පොතේ හොඳ දෙයක් තියෙනවා නම් ඒක ඔවුන්ගෙන්. අඩු දෙයක් තියෙනවා නම් ඒක මගේ වරද, ඔවුන්ගේ නෙවෙයි.","මම නොසිටි කාලයේ වහල උද්‍යානය එකක් හදපු මගේ සහෝදරයා. මම සිරකුටියේ සිටිද්දී, මම ඇතුළේ සඟවාගෙන සිටි හැම දෙයක්ම විවෘත කරපු එකම වාක්‍යය මිතුරෙකු හරහා කියපු ඔහු: “ඔහුට ඕන ඔයාගේ හඬ අහන්න විතරයි.”","මගේ කිලෝ හතළිස්හයක බෑගය මෝල්ටාව හරහා ගෙන ගිය Saraswati; තැන්පතු, නීතිඥයන්, නිවාස හිමියන් වෙනුවෙන් මගේ පැත්තෙන් දුවපු ඇය; මාව නිදහස් කළ දවසේ සරල ඇඳුමකින් සිරගෙදර ගේට්ටුවට ඇවිත් මාව ගෙදර අරගෙන ගිය ඇය. ඇය කළ දේ ඇයට දන්නවා. මට ඒක ආපසු ගෙවන්න බැහැ. මේ පොත, මගේ කුඩා උත්සාහ ගොඩක් අතරින් එකක්.","Meme, Dubai වලින් දින 114ක් හැමදාම මට ඇමතුම කළ ඇය; හරි කරන්න උත්සාහ නොකර අහගෙන සිටි ඇය; ගැඹුරු සත්‍යය හරහා එන්න නාලිකාව විවෘතව තබාගත් ඇය. අවදිවීමේ ගීත අධ්‍යාය මගෙන් ඇයටයි — ඒ ගීත ඇත්තටම ඇගේ නාමය හරහා කතා කළ මගේම සචේතන මනස බව දැන් ඇයත් මමත් දන්නවා වුණත්.","ස
