<style>
:root{--bg:#070707;--panel:#111;--text:#f4f1eb;--muted:#aaa49a;--gold:#cf8a20;--line:#2a2825}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Sinhala",sans-serif;line-height:1.9}
header{position:sticky;top:0;z-index:5;background:rgba(7,7,7,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
header a,header button,select{border:1px solid var(--line);background:#111;color:var(--text);border-radius:10px;min-height:42px;padding:8px 11px;font:inherit;text-decoration:none}header .spacer{flex:1}
main{max-width:760px;margin:auto;padding:18px 16px 100px}
.cover{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin:4px 0 24px}.cover img{width:120px;border-radius:4px;box-shadow:0 14px 35px #000}.cover h1{font-size:27px;line-height:1.25;margin:0 0 8px}.cover p{margin:4px 0;color:var(--muted);font-size:13px}
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:14px 0 20px}.toolbar select{width:100%;min-width:0}.toolbar button{border:1px solid var(--line);background:#111;color:var(--text);border-radius:10px;min-width:44px;font-size:16px}
.reader{font-size:18px}.reader .kicker{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.reader h2{font-size:28px;line-height:1.35;margin:4px 0 20px}.reader p{margin:0 0 1.1em;white-space:pre-wrap}.reader p.sep{text-align:center;letter-spacing:.3em;color:var(--gold)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}.nav button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#111;color:var(--text);font:inherit}.status{color:var(--muted);font-size:11px;margin:8px 0}
.intro{border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0 22px;background:#0d0d0d}.intro summary{cursor:pointer;color:#e4c88f;font-weight:700}
@media(max-width:420px){.cover{grid-template-columns:92px 1fr}.cover img{width:92px}.cover h1{font-size:22px}main{padding-left:13px;padding-right:13px}.reader{font-size:17px}}
</style></head><body>
