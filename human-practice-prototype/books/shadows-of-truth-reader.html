<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>Shadows of Truth · HeartClear Reader</title>
<style>
:root{color-scheme:dark;--bg:#0c0d10;--card:#16181c;--ink:#f4f4f1;--muted:#aaaeb3;--line:#42454b;--size:18px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Tamil","Nirmala UI","Latha",sans-serif}
body[data-theme="paper"]{color-scheme:light;--bg:#eeeae1;--card:#fffdf8;--ink:#242424;--muted:#696561;--line:#c7c1b8}
button,select,a.action{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
button:disabled{opacity:.3}
button,select{cursor:pointer}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:auto;padding:9px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.top strong{font-size:13px;line-height:1.3;flex:1;text-align:center}
.tools{display:flex;gap:5px;align-items:center}.tools button{font-size:13px;padding:8px}
.toolbar{max-width:760px;margin:auto;padding:0 12px 9px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.toolbar label{font-size:12px;color:var(--muted)}
.toolbar select{min-width:0;max-width:65vw;font-size:12px}
main{max-width:760px;margin:auto;padding:30px 17px 105px}
h1{font-size:clamp(21px,6vw,32px);line-height:1.5;margin:0 0 10px}
.subtitle,.status{font-size:12px;line-height:1.6;color:var(--muted)}
.page{margin-top:22px;padding:clamp(17px,5vw,35px);border:1px solid var(--line);border-radius:14px;min-height:50vh;background:var(--card);}
#content{font-family:"Noto Sans Tamil","Nirmala UI","Latha",Georgia,serif;font-size:var(--size);line-height:1.95;white-space:pre-wrap;overflow-wrap:break-word}
body[data-lang="en"] #content{font-family:Georgia,"Times New Roman",serif;line-height:1.8}
.bottom{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--bg);display:flex;justify-content:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bottom button{min-width:130px;flex:1;max-width:330px}
footer{margin-top:20px;text-align:center}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body>
<header><div class="top"><a class="action" href="../" aria-label="Return to HeartClear">‹ HC</a><strong id="readerHeading">Shadows of Truth</strong><div class="tools"><button id="minus" aria-label="Smaller text">A−</button><button id="plus" aria-label="Larger text">A+</button><button id="theme" aria-label="Switch reading theme">◐</button></div></div>
<div class="toolbar"><label for="jump">Reading position</label><select id="jump" aria-label="Select reading page"></select><span id="number" class="status">—</span></div></header>
<main><h1 id="bookTitle">Shadows of Truth</h1><div id="bookMeta" class="subtitle">A Memoir of Mind vs Body</div><article class="page"><div id="content" role="document" aria-live="polite">Opening the book…</div></article><footer class="status" id="footerNote">Your reading position is saved on this device.</footer></main>
<nav class="bottom" aria-label="Reading navigation"><button id="prev" type="button">‹ Previous</button><button id="next" type="button">Next ›</button></nav>
<script>
(function(){
"use strict";
const lang=new URLSearchParams(location.search).get('lang')==='ta'?'ta':'en';
document.body.dataset.lang=lang;document.documentElement.lang=lang;
const source=lang==='ta'?'./shadows-of-truth-tamil-pages.js':'./shadows-of-truth-english-pages.js';
const key='heartclear_shadows_full_reader_'+lang+'_v1',els=id=>document.getElementById(id);
let state={page:0,size:18,theme:'dark'};
try{const s=JSON.parse(localStorage.getItem(key)||'{}');if(Number.isInteger(s.page))state.page=s.page;if(Number.isFinite(s.size))state.size=Math.max(15,Math.min(27,s.size));if(s.theme==='paper')state.theme='paper'}catch(e){}
els('readerHeading').textContent=lang==='ta'?'உண்மையின் நிழல்கள் · தமிழ்':'Shadows of Truth · English';
els('bookTitle').textContent=lang==='ta'?'உண்மையின் நிழல்கள்':'Shadows of Truth';
els('bookMeta').textContent=lang==='ta'?'மனம் vs உடல் · முழு தமிழ் வாசிப்புப் பதிப்பு · 60 அத்தியாயங்கள்':'A Memoir of Mind vs Body · Full English reading text';
const script=document.createElement('script');script.src=source;
script.onload=()=>{
 const pages=lang==='ta'?window.HeartClearShadowsTamil:window.HeartClearShadowsEnglish;
 if(!Array.isArray(pages)||pages.length<200){els('content').textContent='The book text is unavailable.';return}
 state.page=Math.max(0,Math.min(state.page,pages.length-1));
 const jump=els('jump'),span=document.createDocumentFragment();
 for(let i=0;i<pages.length;i++){const o=document.createElement('option');o.value=i;o.textContent=(lang==='ta'?'பக்கம் ':'Page ')+(i+1);span.append(o)}
 jump.append(span);
 function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
 function show(scroll){document.body.dataset.theme=state.theme;document.documentElement.style.setProperty('--size',state.size+'px');els('content').textContent=pages[state.page]||'';els('jump').value=String(state.page);els('number').textContent=(state.page+1)+' / '+pages.length;els('prev').disabled=state.page===0;els('next').disabled=state.page===pages.length-1;save();if(scroll)window.scrollTo(0,0)}
 els('jump').addEventListener('change',()=>{state.page=Number(jump.value);show(true)});
 els('prev').addEventListener('click',()=>{state.page=Math.max(0,state.page-1);show(true)});
 els('next').addEventListener('click',()=>{state.page=Math.min(pages.length-1,state.page+1);show(true)});
 els('minus').addEventListener('click',()=>{state.size=Math.max(15,state.size-1);show(false)});
 els('plus').addEventListener('click',()=>{state.size=Math.min(27,state.size+1);show(false)});
 els('theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'paper':'dark';show(false)});
 show(false);
};
script.onerror=()=>{els('content').textContent='Could not load this edition. Open HeartClear while connected to the internet and try again.'};
document.head.append(script);
})();
</script>
</body></html>
